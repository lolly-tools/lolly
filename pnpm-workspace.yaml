packages:
  - packages/core
  - packages/node-shell
  - packages/docs-render
  - packages/audio-dock
  - engine
  - shells/web
  - shells/cli
  - shells/tui
  - services/ca
  - services/mcp

# Keep the module layout used by the renderer, native sidecar and packaging scripts.
nodeLinker: hoisted
engineStrict: true
linkWorkspacePackages: true
enablePrePostScripts: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  fsevents: true
  core-js: false
  protobufjs: false
overrides:
  'adm-zip': '^0.6.0'
  'shell-quote': '^1.9.0'
  'ip-address': '^10.3.1'
  'nanoid': '^3.3.17'
  '@huggingface/transformers>sharp': '$sharp'
  '@huggingface/transformers>onnxruntime-node': '$onnxruntime-node'
