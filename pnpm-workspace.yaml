packages:
  - packages/core
  - packages/node-shell
  - packages/docs-render
  - packages/audio-dock
  - engine
  - shells/web
  - shells/cli
  - shells/tui
  - services/ca
  - services/mcp

# Keep the module layout used by the renderer, native sidecar and packaging scripts.
nodeLinker: hoisted
engineStrict: true
linkWorkspacePackages: true
enablePrePostScripts: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  fsevents: true
  core-js: false
  protobufjs: false
  # The inspector's postinstall (scripts/install-clients.mjs) cascades `npm install`
  # into its own clients/* directories, which only exist in a from-source checkout of
  # that repo. As a dependency it is a guaranteed no-op twice over: it exits early when
  # its own path contains node_modules, and the published tarball ships each client's
  # build output without a package.json for the loop to find. So there is nothing to
  # run, and denying it keeps a postinstall that shells out to npm from ever being
  # authorised here if a later release loses one of those guards.
  '@modelcontextprotocol/inspector': false
overrides:
  'adm-zip': '^0.6.0'
  'shell-quote': '^1.9.0'
  'ip-address': '^10.3.1'
  'nanoid': '^3.3.17'
  # One React for the whole repo. `nodeLinker: hoisted` hoists a single copy of a package
  # to the root and nests every other version, and React breaks with "Invalid hook call" the
  # moment a renderer and the components it renders resolve two different copies. The TUI is
  # on React 19 (ink 7 needs it); the only other React in the tree is the dev-only MCP
  # inspector, which asks for react ^19 as well. Pinning one version keeps that agreement
  # from resting on what each range happens to allow, and `ink-testing-library`, which the
  # TUI tests render through, declares no react dependency at all: it takes whichever copy
  # sits at the root, so a second React anywhere in the tree renders every frame empty.
  'react': '^19.2.8'
  'react-dom': '^19.2.8'
  '@huggingface/transformers>sharp': '$sharp'
  '@huggingface/transformers>onnxruntime-node': '$onnxruntime-node'
  # One Chromium revision for the whole repo. `playwright` pins its own
  # `playwright-core` to an exact version, and each release expects a different
  # `chromium-<revision>` directory. The browser is downloaded by the CLI installer
  # through playwright-core (shells/cli/src/install-browser.ts), while the browser-tier
  # tests and the capture scripts launch it through the full `playwright`. Let those two
  # drift a minor apart and the installer writes chromium-1234 while the tests look for
  # chromium-1243, so every one of them skips with "no Chromium" on a machine that has
  # one. Pinning core to whatever `playwright` asks for keeps the download and the
  # lookup on the same revision, including for the workspace packages that ask for a
  # much older floor (shells/cli, shells/tui, packages/node-shell, services/mcp).
  'playwright-core': '$playwright'
