[package]
name = "lolly-isolated-capture-check"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
headless_chrome = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
url = "2"
