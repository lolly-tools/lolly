[package]
name = "lolly-isolated-capture-check"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
headless_chrome = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
