# GNOME Shell search provider registration - tells the shell that typing in the
# overview may query our app over D-Bus (org.gnome.Shell.SearchProvider2 served by
# the desktop binary on the bus name below; matcher runs over the embedded catalog
# index, see plans/174-linux-desktop-home.md item 8).
# Installed to <datadir>/gnome-shell/search-providers/.
[Shell Search Provider]
DesktopId=tools.lolly.Desktop.desktop
BusName=tools.lolly.Desktop.SearchProvider
ObjectPath=/tools/lolly/Desktop/SearchProvider
Version=2
