# GNOME Shell search provider registration - the RPM/DEB variant.
#
# Two copies of this file exist on purpose. GNOME Shell validates that DesktopId
# names a desktop entry that actually exists, and the two install channels
# disagree about that name: the flatpak exports tools.lolly.Desktop.desktop (the
# app id, freedesktop-style), while tauri's rpm/deb bundler derives the entry
# from productName and ships Lolly.desktop. The sibling
# tools.lolly.Desktop.search-provider.ini serves the flatpak; THIS file serves
# the native packages (tauri.conf bundle.linux.{rpm,deb}.files installs it under
# the same target name). Found live on Fedora 45: the shell logged "Ignoring
# search provider ...: missing DesktopId" until the id matched (2026-08-30).
[Shell Search Provider]
DesktopId=Lolly.desktop
BusName=tools.lolly.Desktop.SearchProvider
ObjectPath=/tools/lolly/Desktop/SearchProvider
Version=2
