<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <!-- Canonical-origin guard. Runs before the deferred module scripts, so it
       fires while the head parses. The lolly.* domain family funnels to the
       canonical host (lolly.tools on this SUSE build) via Vercel redirects, but
       the root document "/" on the www.* primary domains (www.lolly.to,
       www.lolly.tools) is served from a sticky edge cache as a 200 shell rather
       than redirecting. Its relative /assets/*.js module scripts then 308
       cross-origin with a text/plain body, which browsers refuse to load as ES
       modules ("disallowed MIME type text/plain"). Bounce off the alternate to
       the canonical before those scripts are even fetched. Scoped to the lolly
       public domain family, so Vercel preview URLs (*.vercel.app) and localhost
       are never touched; brandChrome() (vite.config.js) rewrites CANON per
       profile (lolly-start also canonicalises to lolly.tools) and blanks it
       (guard off) for any brand with no canonical host. -->
  <script>
    (() => {
      var CANON = 'lolly.tools';
      var h = location.hostname;
      if (CANON && h !== CANON && /(^|\.)lolly\.[a-z]{2,}$/.test(h)) {
        location.replace('https://' + CANON + location.pathname + location.search + location.hash);
      }
    })();
  </script>
  <!-- Page pinch-zoom is enabled (WCAG 1.4.4 - never lock it). The mobile
       controls sheet is position:fixed and would otherwise strand off-screen
       while zoomed; a VisualViewport shim (main.js) re-pins it to the visible
       area via the --vv-top/--vv-left CSS vars. The canvas preview also keeps
       its own pinch/pan (setupStagePinchZoom). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lolly Tools</title>
  <meta name="description" content="Lolly generates production-ready assets - QR codes, charts, graphics, PDFs and more - from simple inputs. Constraint-first, template-driven, works offline." />
  <link rel="canonical" href="https://lolly.tools/" />
  <meta name="theme-color" content="#0c322c" />

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lolly" />
  <meta property="og:title" content="Lolly - assets that stay the same so everything else can change" />
  <meta property="og:description" content="Generate production-ready assets - QR codes, charts, graphics, PDFs - from simple inputs. Works offline." />
  <meta property="og:url" content="https://lolly.tools/" />
  <meta property="og:image" content="https://lolly.tools/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lolly - assets that stay the same so everything else can change" />
  <meta name="twitter:description" content="Generate production-ready assets from simple inputs. Works offline." />
  <meta name="twitter:image" content="https://lolly.tools/og.png" />

  <!-- Brand-SERP structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Lolly",
    "url": "https://lolly.tools/",
    "applicationCategory": "DesignApplication",
    "operatingSystem": "Web, Windows, macOS, Linux, iOS, Android",
    "description": "Generate production-ready assets - QR codes, charts, graphics, PDFs and more - from simple inputs.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- The signed source mark first (crisp at any size, provenance intact); .ico + png are
       the fallbacks for browsers that don't take an SVG favicon. theme.ts flips this href
       to /icon-reverse.svg on dark/brand themes live - following the IN-APP toggle, which a
       `media` query can't see (it only tracks the OS scheme, and needed a reload). -->
  <link rel="icon" id="favicon-svg" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <!-- Preload the UI faces so they aren't discovered only after
       app.css → @import fonts.css resolves (which causes a visible swap).
       SUSE is the shell-served platform default on every profile, so these
       cover every brand pack - before 2026-08-10 this was Outfit plus a
       catalog-served SUSE that 404'd on any pack but brands/suse. Mono is
       preloaded too: 34.5 KB of chrome type (code/number runs) that was
       previously discovered only after the CSS parsed. crossorigin is
       required for fonts.

       Write the hrefs with LITERAL brackets - the way the files on disk and
       fonts.css spell them. A preload only matches the request @font-face
       makes if the two URL STRINGS are equal, and vite normalises its two
       pipelines in OPPOSITE directions: the CSS pipeline puts a public-file
       url() through `encodeURI`, so the BUILT css asks for
       `/fonts/SUSE%5Bwght%5D.woff2`, while the HTML pipeline decodes an
       attribute href and re-emits it with only `%` escaped, so the built HTML
       carries the literal `[wght]` no matter what is written here. That is why
       the first attempt at this fix (2026-08-25, hrefs hand-written as
       `%5Bwght%5D`) changed nothing in dist/index.html and the 83 KB upright
       face kept downloading twice. The dev server rewrites neither side, so
       the literal form below is already correct in dev; fontPreloadUrls() in
       vite.config.js re-applies vite's own `encodeURI` to these hrefs at build
       time so the built HTML and the built CSS name one identical string.
       The real cure is bracket-free filenames (plans/155 task 1.3) - see the
       blocker note on fontPreloadUrls().
       Keep these two lines adjacent - brandChrome() in vite.config.js strips
       the whole run for non-SUSE brands by matching `/fonts/SUSE`. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/SUSE[wght].woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/SUSEMono[wght].woff2" />
  <!-- The two CONDITIONAL catalog indexes - /catalog/tools/index.json and
       /catalog/assets/index.json - are deliberately NOT preloaded. Task 3.1 added
       a hint for the asset index and it was a pure loss both ways, traced in full
       in catalog/sync.ts's conditionalFetch note: markup cannot set request
       headers, so the hint is unconditional by construction and spends exactly the
       40.3 KB gz the visitor's If-None-Match was about to save; and the response is
       never adopted by the app's own fetch either, because `as="fetch"` without
       crossorigin makes a mode "no-cors" / credentials "include" request while a
       bare fetch() defaults to "cors" / "same-origin" (the preload key differs), and
       instanceFetch's x-lolly-client header would keep it from matching even with
       crossorigin. Result: the index downloaded twice on every load. The late start
       those hints were aimed at is fixed by the slim index below, not by a hint that
       cannot speak this protocol.

       The TOOLS index IS preloaded in its slim form (task 3.8), because that one url
       is fetched unconditionally - no validator, so no 304 for the hint to defeat -
       and served must-revalidate, so the warmed cache entry turns the boot fetch into
       a 304 instead of an 18.9 KB gz download. Only for the visitors who will read it:
       a repeat visitor paints from their cached copy and main.ts never fetches slim, so
       a static preload would download a file they never use and log "preload not used"
       for it. `in` rather than getItem: it answers from the key list without
       materialising the half-megabyte value. (The one url this can still waste is the
       first load after a switch to a remote instance - setInstanceBase clears
       sbt-tool-index, and the base lives in IndexedDB where this script cannot read it,
       so the hint fetches THIS origin's copy while the app fetches the instance's.) -->
  <script>
    (() => {
      try {
        if ('sbt-tool-index' in localStorage) return;   // cached index → main.ts never fetches slim
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'fetch'; l.href = '/catalog/tools/index.slim.json';
        document.head.appendChild(l);
      } catch (e) { /* storage blocked - the fetch just starts at boot instead */ }
    })();
  </script>
  <link rel="stylesheet" href="/src/styles/app.css" />
  <!-- Apply saved theme before CSS paints to prevent flash of wrong theme.
       With no saved preference, seed from the OS colour scheme (mirrors
       initTheme in theme.js) so a dark-OS visitor gets no light flash. -->
  <script>
    (() => {
      var t = localStorage.getItem('theme');
      if (t === 'suse') t = 'brand'; // retired name - theme.ts migrates the store on apply
      if (!t && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
      if (t === 'dark' || t === 'brand') {
        document.documentElement.dataset.theme = t;
        var fi = document.getElementById('favicon-svg'); if (fi) fi.href = '/icon-reverse.svg';
      }
      // Restore the brand font stacks the same way (written by applyChromeBrandVars
      // in brand-vars.ts) so a branded profile doesn't flash the platform default
      // every load. setProperty is CSSOM - the cached value can't inject markup.
      try {
        var f = JSON.parse(localStorage.getItem('brand-fonts') || 'null');
        if (f) for (var k in f) {
          if (k === '--font-brand' || k === '--font-mono' || k === '--font-display' || k === '--font-italic') document.documentElement.style.setProperty(k, f[k]);
        }
      } catch (e) { /* corrupt cache - boot JS rewrites it */ }
      // Same trick for a customised corner radius (unlocked brands only -
      // applyBrandRadius never writes this key for a locked catalog).
      try {
        var r = localStorage.getItem('brand-radius');
        if (r) document.documentElement.style.setProperty('--radius', r);
      } catch (e) { /* corrupt cache - boot JS rewrites it */ }
      // And the base spacing rhythm. The generated --sp-* scale reads this
      // one value, so it too must land before the first paint.
      try {
        var s = localStorage.getItem('brand-space');
        if (s) document.documentElement.style.setProperty('--space', s);
      } catch (e) { /* corrupt cache - boot JS rewrites it */ }
      // Accessibility prefs (lib/a11y-prefs.ts is canonical; this is its FOUC
      // mirror): set the gating attributes before CSS paints so large text /
      // high contrast don't flash the regular look for a beat.
      try {
        var ax = JSON.parse(localStorage.getItem('lolly-a11y') || 'null');
        if (ax) {
          if (ax.reduceMotion) document.documentElement.dataset.a11yMotion = 'reduce';
          if (ax.highContrast) document.documentElement.dataset.a11yContrast = 'high';
          if (ax.largeText) document.documentElement.dataset.a11yText = 'large';
          if (ax.hidePreviews) document.documentElement.dataset.a11yPreviews = 'hidden';
        }
      } catch (e) { /* corrupt cache - boot JS rewrites it */ }
      // Performance UI (feature-flags.ts perf-ui, its FOUC mirror): reflect the flag from
      // the feature-flag mirror before paint so a lower-powered device never flashes the
      // full-effect chrome for a beat. Absent/false ⇒ no attribute ⇒ full chrome (default).
      try {
        var ff = JSON.parse(localStorage.getItem('lolly:featureFlags') || 'null');
        if (ff && ff['perf-ui']) document.documentElement.setAttribute('data-perf-ui', '');
      } catch (e) { /* corrupt cache - boot JS rewrites it */ }
      // Apply the saved language's <html lang> before paint (glyph fallback/Han
      // unification depends on it) - the FOUC-mirror half of i18n.ts's canonical
      // profile.lang store. A hand-inlined alias map + LANG_META.htmlLang mirror
      // (kept tiny - this script can't import engine/src/lang.ts). The i18n
      // catalog itself loads async in main.ts's boot(); this only sets the attr.
      try {
        var lg = localStorage.getItem('lang');
        if (lg) {
          lg = String(lg).trim().toLowerCase();
          var LANG_ALIASES = {
            cn: 'zh', 'zh-cn': 'zh', 'zh-hans': 'zh', jp: 'ja',
            br: 'pt', 'pt-br': 'pt', pt_br: 'pt',
            tw: 'zh-hant', hk: 'zh-hant', 'zh-tw': 'zh-hant', 'zh-hk': 'zh-hant', 'zh-hant-tw': 'zh-hant', hant: 'zh-hant',
            my: 'ms', fil: 'tl',
            'ar-sa': 'ar', 'ar-eg': 'ar', 'ar-ae': 'ar',
            'hi-in': 'hi', 'bn-bd': 'bn', 'bn-in': 'bn',
            'ur-pk': 'ur', 'ur-in': 'ur',
            'in': 'id', 'in-id': 'id', 'id-id': 'id',
            'tr-tr': 'tr', 'tr-cy': 'tr',
            'uk-ua': 'uk', ua: 'uk', 'pl-pl': 'pl',
            nb: 'no', nn: 'no', kr: 'ko',
          };
          lg = LANG_ALIASES[lg] || lg;
          var HTML_LANG = {
            en: 'en', es: 'es', de: 'de', fr: 'fr', zh: 'zh-Hans', ja: 'ja', vi: 'vi',
            pt: 'pt-BR', 'zh-hant': 'zh-Hant', cs: 'cs', nl: 'nl', tl: 'tl', sv: 'sv', ms: 'ms',
            ro: 'ro', hi: 'hi', bn: 'bn', ur: 'ur', id: 'id', ar: 'ar', it: 'it', no: 'no', ko: 'ko', bg: 'bg', tr: 'tr',
            uk: 'uk', pl: 'pl',
          };
          if (HTML_LANG[lg]) {
            document.documentElement.lang = HTML_LANG[lg];
            // RTL mirror of LANG_META.dir - Arabic and Urdu flip the document
            // before paint so the first frame isn't a wrong-direction flash.
            document.documentElement.dir = (lg === 'ar' || lg === 'ur') ? 'rtl' : 'ltr';
          }
        }
      } catch (e) { /* corrupt cache - boot JS re-derives it */ }
    })();
  </script>

  <!-- No-JavaScript welcome. Lolly renders entirely client-side, so with scripting
       off the app can never boot. Rather than strand visitors on a permanent
       "Loading…", this styles a self-contained welcome (revealed by the <noscript>
       in <body>) and hides the two now-misleading shell affordances. Kept in
       <noscript> so it only applies - and only downloads meaning - when JS is off;
       its own colours + dark-mode make it stand alone even if the app CSS never loads. -->
  <noscript>
    <style>
      .loading { display: none !important; }   /* never resolves without JS */
      .skip-link { display: none !important; }  /* nothing to skip past here */

      .nojs {
        --ink: #0c322c; --ink-soft: #3f5a52; --line: #d7e7e0;
        --card: #ffffff; --page1: #ffffff; --page2: #e7f3ee;
        --pine: #159f66; --pine-strong: #128a58; --pine-ink: #ffffff; --glow: 21 159 102;
        position: relative; overflow: hidden; box-sizing: border-box;
        min-height: 100vh; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        padding: 40px 20px;
        background: linear-gradient(160deg, var(--page1), var(--page2));
        color: var(--ink);
        font-family: 'SUSE', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      }
      .nojs::before, .nojs::after {
        content: ''; position: absolute; width: 62vmax; height: 62vmax;
        border-radius: 50%; pointer-events: none; z-index: 0;
      }
      .nojs::before { top: -24vmax; left: -20vmax;
        background: radial-gradient(closest-side, rgba(var(--glow), .20), transparent 70%); }
      .nojs::after { bottom: -28vmax; right: -22vmax;
        background: radial-gradient(closest-side, rgba(12, 50, 44, .12), transparent 70%); }

      .nojs-card {
        position: relative; z-index: 1; width: 100%; max-width: 540px;
        background: var(--card); border: 1px solid var(--line); border-radius: 22px;
        padding: 40px 36px 32px; text-align: center;
        box-shadow: 0 1px 2px rgba(12,50,44,.05), 0 26px 60px -30px rgba(12,50,44,.32);
        animation: nojs-rise .6s cubic-bezier(.2,.7,.2,1) both;
      }
      @keyframes nojs-rise { from { opacity: 0; transform: translateY(14px); } }

      .nojs-mark {
        width: 76px; height: 76px; border-radius: 20px; display: block; margin: 0 auto 22px;
        box-shadow: 0 12px 28px -14px rgba(12,50,44,.55);
      }
      .nojs-title { margin: 0; font-size: clamp(30px, 6vw, 40px); font-weight: 800;
        letter-spacing: -.02em; line-height: 1; }
      .nojs-badge { display: inline-flex; align-items: center; gap: 8px; margin: 16px auto 0;
        padding: 8px 15px; border-radius: 999px; border: 1px solid var(--pine);
        background: rgba(var(--glow), .12); color: var(--pine);
        font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
      .nojs-badge svg { width: 17px; height: 17px; }
      .nojs-lead { margin: 18px auto 0; max-width: 42ch; font-size: 16px; line-height: 1.65;
        color: var(--ink-soft); }
      .nojs-lead strong { color: var(--ink); font-weight: 700; }

      .nojs-formats-label { margin: 24px 0 0; font-size: 11.5px; font-weight: 700;
        letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); opacity: .7; }
      .nojs-formats { list-style: none; margin: 11px 0 0; padding: 0;
        display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
      .nojs-formats li { font-size: 11px; font-weight: 600; color: var(--ink-soft);
        padding: 3px 9px; border: 1px solid var(--line); border-radius: 7px;
        background: rgba(var(--glow), .05); white-space: nowrap; }

      .nojs-actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px;
        justify-content: center; }
      .nojs-btn { display: inline-flex; align-items: center; gap: 8px; font: inherit;
        font-size: 15px; font-weight: 700; text-decoration: none; padding: 12px 22px;
        border-radius: 12px; border: 1px solid var(--line); color: var(--ink);
        background: transparent; transition: transform .15s ease, background .15s ease, border-color .15s ease; }
      .nojs-btn:hover { transform: translateY(-1px); background: rgba(var(--glow), .08);
        border-color: var(--pine); }
      .nojs-btn--primary { background: var(--pine); color: var(--pine-ink); border-color: var(--pine); }
      .nojs-btn--primary:hover { background: var(--pine-strong); }
      .nojs-btn svg { width: 16px; height: 16px; }

      .nojs-note { margin: 26px auto 0; max-width: 40ch; font-size: 13px; line-height: 1.55;
        color: var(--ink-soft); opacity: .9; }
      .nojs-note strong { color: var(--ink); font-weight: 700; }

      @media (max-width: 480px) {
        .nojs-card { padding: 32px 22px 26px; border-radius: 18px; }
        .nojs-btn { flex: 1 1 auto; justify-content: center; }
      }
      @media (prefers-color-scheme: dark) {
        .nojs {
          --ink: #eaf5f0; --ink-soft: #a7c8bc; --line: rgba(160,210,195,.18);
          --card: #0f2723; --page1: #0a1f1b; --page2: #061310;
          --pine: #37c684; --pine-strong: #2ea774; --pine-ink: #06231b; --glow: 48 186 120;
        }
        .nojs-card { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 30px 70px -30px rgba(0,0,0,.72); }
      }
      @media (prefers-reduced-motion: reduce) {
        .nojs-card { animation: none; }
        .nojs-btn { transition: none; }
      }
    </style>
  </noscript>
</head>
<body>
