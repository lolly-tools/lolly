  <style>

.lolly-outer{
transform-origin: 50% 50%;
  transform-box: fill-box;
  animation: lolly-spin 3s linear infinite;
}


.lolly-mid{
transform-origin: 50% 50%;
  transform-box: fill-box;
  animation: lolly-spin 6s linear infinite;
}

.lolly-inner{
transform-origin: 50% 50%;
  transform-box: fill-box;
  animation: lolly-spin 9s linear infinite;
}

@keyframes lolly-spin{

  100%{transform:rotate(360deg)}

}

.lolly-icon{animation:go 3s ease infinite}
@keyframes go{
   0%{filter:hue-rotate(15deg)}
  50%{filter:hue-rotate(-15deg)}
   100%{filter:hue-rotate(15deg)}
}
