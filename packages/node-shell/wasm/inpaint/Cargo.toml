[package]
name = "lolly-inpaint"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]
members = [".", "vendor/lightcraft-inpaint"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lightcraft-inpaint = { path = "vendor/lightcraft-inpaint" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
