[package]
name = "vectorcraft-trace"
version = "0.19.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft Image Trace: raster to vector tracing (quantize, boundary follow, polygon, Bezier fit)"

[dependencies]
vectorcraft-geom = { path = "../vectorcraft-geom" }
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
