[package]
name = "vectorcraft-geom"
version = "0.19.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft geom"

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
