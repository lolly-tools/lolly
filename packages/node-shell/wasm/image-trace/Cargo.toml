[package]
name = "lolly-image-trace"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]
members = [".", "vendor/vectorcraft-geom", "vendor/vectorcraft-trace"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vectorcraft-trace = { path = "vendor/vectorcraft-trace" }
vectorcraft-geom = { path = "vendor/vectorcraft-geom" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
