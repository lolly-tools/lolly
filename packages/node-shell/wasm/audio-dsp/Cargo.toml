[package]
name = "lolly-audio-dsp"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]
members = [".", "vendor/filmcraft-audio-dsp"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
filmcraft-audio-dsp = { path = "vendor/filmcraft-audio-dsp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
