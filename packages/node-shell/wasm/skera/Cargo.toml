[package]
name = "lolly-font-subset"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
skera = "=0.7.0"
write-fonts = { version = "=0.54.0", default-features = false, features = ["read"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
