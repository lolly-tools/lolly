[package]
name = "lolly-layout-kernel"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
