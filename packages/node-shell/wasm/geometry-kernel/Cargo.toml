[package]
name = "lolly-geometry-kernel"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[features]
fitting = []
portable-math = ["fitting"]
clipping = []
host-norm = []

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
