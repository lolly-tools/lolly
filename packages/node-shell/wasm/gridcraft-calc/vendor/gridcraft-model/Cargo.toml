[package]
name = "gridcraft-model"
version = "0.14.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false
description = "GridCraft document model"

[dependencies]
gridcraft-core = { path = "../../../xlsx-numfmt/vendor/gridcraft-core" }
gridcraft-formula = { path = "../gridcraft-formula" }
sha2 = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
