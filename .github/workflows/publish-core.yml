# Publish @lolly-tools/core to npm - the tool-author SDK, so a drive-by tool
# author can `npm i -D @lolly-tools/core` instead of cloning the ~1 GB umbrella
# repo. scripts/pack-core.ts builds the publishable artifact (compiled ESM +
# .d.ts + schema JSON) and smoke-tests the tarball from a bare consumer; this
# workflow just runs it and pushes the result.
#
# The checked-in packages/core/package.json is NOT what ships - its exports point
# at ./src/*.ts for the workspace's no-build dev loop. dist/core-pack/pkg carries
# the generated, publishable package.json. Publish from THAT directory.
#
# AUTH: npm Trusted Publishing (OIDC), no long-lived token. 1.0.0 was published
# by hand on 2026-08-30 (scope `@lolly-tools` owned by the lolly-tools org); the
# package's npmjs.com Settings -> Trusted Publisher must name this repo
# (lolly-tools/lolly) and this workflow file (publish-core.yml). With that in
# place `npm publish --provenance` exchanges the job's id-token for a short-lived
# publish credential and signs provenance itself. No NPM_TOKEN secret is read:
# an empty token in .npmrc would shadow the OIDC exchange. If a token route is
# ever needed instead, add `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` back to
# the publish step's env and mint a granular token with bypass-2FA.
#
# Trigger: push a tag `core-v<semver>` matching packages/core/package.json's
# version, or run manually (dispatch packs + smoke-tests without publishing).
name: publish-core

on:
  push:
    tags: ['core-v*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # workspaces need every package.json to install
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Compiles, packs, then installs the tarball into a scratch project and
      # asserts it both runs and type-checks. Fails the job if it doesn't.
      - name: Pack + smoke-test
        run: node scripts/pack-core.ts
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: core-pack
          path: |
            dist/core-pack/*.tgz
            dist/core-pack/manifest.json
      - name: Publish to npm (trusted publishing via the job's OIDC id-token)
        if: startsWith(github.ref, 'refs/tags/core-v')
        run: npm publish --provenance --access public
        working-directory: dist/core-pack/pkg
