# SPDX-License-Identifier: MPL-2.0
name: Windows package smoke

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run containing lolly-windows-x64
        required: true
        type: string
      browser_args:
        description: Optional WebView2 arguments for diagnosing runner behaviour
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        installer: [msi, nsis]
    env:
      LOLLY_CLI_TIMEOUT: '180'
      WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: ${{ inputs.browser_args }}
    steps:
      - name: Download the built installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'Invalid build run ID' }
          gh run download $env:BUILD_RUN_ID --name lolly-windows-x64 --dir package
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
      - name: Install the package
        env:
          INSTALLER_KIND: ${{ matrix.installer }}
        run: |
          New-Item -ItemType Directory evidence | Out-Null
          if ($env:INSTALLER_KIND -eq 'msi') {
            $package = (Get-ChildItem package -Recurse -Filter *.msi | Select-Object -First 1).FullName
            $args = "/i `"$package`" /qn /norestart INSTALLDIR=C:\lolly-smoke /l*v `"$PWD\evidence\install.log`""
            $process = Start-Process msiexec.exe -ArgumentList $args -Wait -PassThru
          } else {
            $package = (Get-ChildItem package -Recurse -Filter '*-setup.exe' | Select-Object -First 1).FullName
            $process = Start-Process $package -ArgumentList '/S /D=C:\lolly-smoke' -Wait -PassThru
          }
          if ($process.ExitCode -notin @(0, 3010)) { throw "Installer exited $($process.ExitCode)" }
          $app = Get-ChildItem C:\lolly-smoke -Recurse -Filter lolly-desktop.exe | Select-Object -First 1
          if (-not $app) { throw 'Installed application is missing' }
          $version = $app.VersionInfo.ProductVersion
          # The installer names its release (Lolly_<version>_x64...), so the check follows each version bump.
          $expected = [regex]::Match((Split-Path $package -Leaf), '^Lolly_(\d+\.\d+\.\d+)_x64').Groups[1].Value
          if (-not $expected) { throw "Cannot read the release version from $package" }
          if ($version -notmatch "^$([regex]::Escape($expected))(\.|$)") { throw "Unexpected application version: $version (installer is $expected)" }
          $bytes = [System.IO.File]::ReadAllBytes($app.FullName)
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) { throw 'Application is not x64' }
          @{ version = $version; architecture = 'x64'; bytes = $app.Length; installer = $env:INSTALLER_KIND } | ConvertTo-Json | Set-Content evidence/package.json
          "LOLLY_SMOKE_APP=$($app.FullName)" >> $env:GITHUB_ENV
      - name: Run the bundled CLI and native WebView exports
        run: |
          if ($env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS) {
            # Hosted runners are elevated; WebView2 ignores environment overrides there.
            $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
            New-Item $policy -Force | Out-Null
            New-ItemProperty $policy -Name 'lolly-desktop.exe' -Value $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -PropertyType String -Force | Out-Null
          }
          @'
          const fs = require('node:fs');
          const events = [];
          const pending = new Map();
          let serial = 0;
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function inspect() {
            let target;
            for (let i = 0; i < 40; i++) {
              try { target = (await (await fetch('http://127.0.0.1:9222/json/list')).json()).find(x => x.type === 'page'); } catch {}
              if (target) break;
              await delay(500);
            }
            if (!target) throw Error('No WebView debug target');
            const ws = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject; });
            ws.onmessage = event => {
              const message = JSON.parse(event.data);
              if (message.id) { pending.get(message.id)?.(message); pending.delete(message.id); }
              else events.push(message);
            };
            const call = (method, params = {}) => new Promise(resolve => {
              const id = ++serial; pending.set(id, resolve); ws.send(JSON.stringify({id, method, params}));
            });
            await call('Runtime.enable');
            await call('Network.enable');
            await call('Runtime.evaluate', {expression: 'window.__renderProbe=0;requestAnimationFrame(function tick(){window.__renderProbe++;requestAnimationFrame(tick)})'});
            for (let i = 0; i < 10; i++) {
              await delay(3000);
              const snapshot = await call('Runtime.evaluate', {returnByValue:true, expression: `JSON.stringify({url:location.href,visibility:document.visibilityState,ready:document.readyState,fonts:document.fonts.status,frames:window.__renderProbe,html:document.documentElement.outerHTML.slice(0,3000),serviceWorker:navigator.serviceWorker?.controller?.scriptURL,text:document.body.innerText.slice(-5000),images:[...document.images].map(x=>({src:x.src.slice(0,160),complete:x.complete,width:x.naturalWidth})),iframes:[...document.querySelectorAll('iframe')].map(x=>({src:x.src,html:x.contentDocument?.body?.innerHTML.slice(0,500)})),resources:performance.getEntriesByType('resource').slice(-25).map(x=>({name:x.name,duration:x.duration}))})`});
              events.push({snapshot});
              fs.writeFileSync('evidence/webview-debug.json', JSON.stringify(events,null,2));
              if (i === 1) {
                const state = JSON.parse(snapshot.result.result.value);
                if (!state.text || state.url.startsWith('chrome-error:')) {
                  const bypass = await call('Network.setBypassServiceWorker', {bypass:true});
                  events.push({bypass});
                  const recovery = await call('Page.navigate', {url:'http://tauri.localhost/index.html#/tool/qr-code?url=https%3A%2F%2Flolly.tools&format=png&export=1'});
                  events.push({recovery});
                  fs.writeFileSync('evidence/webview-debug.json', JSON.stringify(events,null,2));
                }
              }
            }
            ws.close();
          }
          inspect().catch(error => { events.push({error:String(error)}); fs.writeFileSync('evidence/webview-debug.json',JSON.stringify(events,null,2)); process.exitCode=1; });
          '@ | Set-Content "$env:RUNNER_TEMP/lolly-inspect.cjs"
          function Run-Lolly($Arguments, $Name) {
            Write-Host "Starting $Name"
            $process = Start-Process $env:LOLLY_SMOKE_APP -ArgumentList $Arguments -PassThru -RedirectStandardOutput "evidence/$Name.stdout" -RedirectStandardError "evidence/$Name.stderr"
            if ($Name -eq 'png' -and $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -and $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS.Contains('--remote-debugging-port=9222')) {
              node "$env:RUNNER_TEMP/lolly-inspect.cjs"
            }
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { Get-Content "evidence/$Name.stderr"; throw "$Name exited $($process.ExitCode)" }
            Write-Host "Finished $Name"
          }
          Run-Lolly 'list --json' 'tools'
          $tools = Get-Content evidence/tools.stdout -Raw | ConvertFrom-Json
          if (-not $tools) { throw 'Bundled CLI returned no catalog' }
          foreach ($check in @('svg', 'png', 'pdf', 'png-repeat')) {
            $format = $check.Split('-')[0]
            $output = "$PWD/evidence/qr-$check.$format"
            Run-Lolly "qr-code --url=https://lolly.tools --format=$format --output=`"$output`"" $check
            if (-not (Test-Path $output) -or (Get-Item $output).Length -lt 100) { throw "$check export is empty" }
          }
          if ((Get-Content evidence/qr-svg.svg -Raw) -notmatch '<svg') { throw 'SVG export is invalid' }
          foreach ($name in @('qr-png.png', 'qr-png-repeat.png')) {
            $png = [System.IO.File]::ReadAllBytes("$PWD/evidence/$name")
            if ([BitConverter]::ToString($png[0..7]) -ne '89-50-4E-47-0D-0A-1A-0A') { throw 'PNG signature is invalid' }
          }
          $pdf = [System.IO.File]::ReadAllBytes("$PWD/evidence/qr-pdf.pdf")
          if ([System.Text.Encoding]::ASCII.GetString($pdf[0..4]) -ne '%PDF-') { throw 'PDF signature is invalid' }
          $publishing = "$PWD/evidence/field-notes.png"
          Run-Lolly "design --template=publishing-field-notes --format=png --width=960 --height=1280 --c2pa=0 --imprint=0 --output=`"$publishing`"" 'publishing'
          Add-Type -AssemblyName System.Drawing
          $bitmap = [System.Drawing.Bitmap]::new($publishing)
          try {
            if ($bitmap.Width -ne 960 -or $bitmap.Height -ne 1280) { throw 'Publishing page has incorrect dimensions' }
            foreach ($left in @(72, 500)) {
              $ink = 0
              for ($y = 580; $y -lt 1100; $y += 4) {
                for ($x = $left; $x -lt ($left + 390); $x += 4) {
                  $pixel = $bitmap.GetPixel($x, $y)
                  if ($pixel.R -lt 70 -and $pixel.A -gt 200) { $ink++ }
                }
              }
              if ($ink -lt 300) { throw 'Publishing column is missing its text' }
            }
          } finally { $bitmap.Dispose() }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: windows-${{ matrix.installer }}-render-evidence
          path: evidence/
          if-no-files-found: error
