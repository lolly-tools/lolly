# Compile without release credentials, then sign only the verified archive.
# The protected job requires an approved App Store profile and distribution identity.
name: iOS App Store release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed artifact to App Store Connect
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  frontend:
    uses: ./.github/workflows/release-frontend.yml
    with:
      target: tauri-mobile
      platform: ios
      public_key_jwk: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
      connector_origins: ${{ vars.VITE_CONNECTOR_ORIGINS }}
      ca_enrollment_trust_json: ${{ vars.VITE_CA_ENROLLMENT_TRUST_JSON }}
    secrets:
      LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}

  build:
    needs: frontend
    if: ${{ always() && !cancelled() && needs.frontend.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 75
    outputs:
      archive_id: ${{ steps.archive.outputs.artifact-id }}
      receipt_sha: ${{ steps.receipt.outputs.receipt_sha }}
      developer_dir: ${{ steps.xcode.outputs.developer_dir }}
    env:
      LOLLY_RELEASE_FRONTEND_PHASE: verified-artifact
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
      LOLLY_PROFILE: lolly-start
      LOLLY_EMBED_CATALOG: profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Select a released Xcode with the required device SDK
        id: xcode
        run: |
          set -euo pipefail
          XC=$(for APP in /Applications/Xcode_26*.app /Applications/Xcode.app; do if [ -d "$APP" ]; then echo "$APP"; fi; done | sort -V | tail -1)
          [[ "$XC" =~ ^/Applications/Xcode[A-Za-z0-9_.]*\.app$ ]]
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | sed -n 's/.*iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)
          [ "${SDK:-0}" -ge 26 ]
          echo "developer_dir=$XC/Contents/Developer" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Rust toolchain and device target
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-apple-ios

      - name: Install compiler dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C shells/tauri-mobile install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Download signed source catalog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-source-catalog-tauri-mobile
          path: brands/lolly-start/catalog/tools

      - name: Download signed frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-frontend-tauri-mobile
          path: shells/tauri-mobile/dist

      - name: Verify the independently signed frontend
        run: node scripts/release-frontend-receipt.ts --verify tauri-mobile shells/tauri-mobile/dist

      - name: Compile an unsigned device archive
        working-directory: shells/tauri-mobile
        run: pnpm run tauri ios build --target aarch64 --no-sign --archive-only --ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Bind the unsigned archive to this run and signed frontend
        id: receipt
        run: |
          /usr/bin/python3 -I scripts/ios-release-artifact.py prepare \
            --archive shells/tauri-mobile/src-tauri/gen/apple/build/lolly-mobile_iOS.xcarchive \
            --frontend shells/tauri-mobile/dist --output "$RUNNER_TEMP/ios-unsigned" \
            --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload the unsigned archive
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-unsigned
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [frontend, build]
    if: ${{ always() && !cancelled() && needs.frontend.result == 'success' && needs.build.result == 'success' }}
    environment: release-native-signing
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
      LOLLY_PROFILE: lolly-start
      DEVELOPER_DIR: ${{ needs.build.outputs.developer_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Select the compiler's Xcode
        run: |
          set -euo pipefail
          [[ "$DEVELOPER_DIR" =~ ^/Applications/Xcode[A-Za-z0-9_.]*\.app/Contents/Developer$ ]]
          sudo xcode-select -s "$DEVELOPER_DIR"

      - name: Download the immutable archive artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.archive_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ios-unsigned

      - name: Download the independently signed frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-frontend-tauri-mobile
          path: ${{ runner.temp }}/ios-frontend

      - name: Verify the source, frontend and unsigned archive before credential access
        env:
          RECEIPT_SHA: ${{ needs.build.outputs.receipt_sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          node scripts/release-frontend-receipt.ts --verify tauri-mobile "$RUNNER_TEMP/ios-frontend"
          /usr/bin/python3 -I scripts/ios-release-artifact.py verify \
            --input "$RUNNER_TEMP/ios-unsigned" --frontend "$RUNNER_TEMP/ios-frontend" \
            --output "$RUNNER_TEMP/ios-prepared" --receipt-sha "$RECEIPT_SHA" \
            --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Sign and export only the prepared archive
        env:
          RECEIPT_SHA: ${{ needs.build.outputs.receipt_sha }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_STORE_PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE }}
        run: |
          /usr/bin/python3 -I scripts/ios-release-artifact.py sign \
            --input "$RUNNER_TEMP/ios-prepared" --output "$RUNNER_TEMP/ios-signed" \
            --receipt-sha "$RECEIPT_SHA" --source "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload the signed IPA after credential cleanup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Lolly-ios-ipa
          path: |
            ${{ runner.temp }}/ios-signed/Lolly.ipa
            ${{ runner.temp }}/ios-signed/release.json
          if-no-files-found: error

      - name: Upload the finished IPA to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: /usr/bin/python3 -I scripts/ios-release-artifact.py upload --input "$RUNNER_TEMP/ios-signed"
