# SPDX-License-Identifier: MPL-2.0
name: Native WebGPU qualification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed main commit (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: webgpu-native-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  native:
    name: Default runtime (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: webview2-windows-vm
            runner: windows-2025
          - runtime: webkitgtk-ubuntu-vm
            runner: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      LOLLY_WEBGPU_SOURCE_SHA: ${{ inputs.source_sha }}
      LOLLY_WEBGPU_NATIVE_OUTPUT: artifacts/native-webgpu
      # No signing credentials, release action, runtime flags or feature overrides.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - name: Refuse an ambiguous source identity
        run: |
          [[ "$LOLLY_WEBGPU_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed main ancestor
        run: git merge-base --is-ancestor "$LOLLY_WEBGPU_SOURCE_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux runtime and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev build-essential \
            xvfb xauth dbus-x11 pciutils vulkan-tools mesa-vulkan-drivers x11-utils
      - name: Qualify actual WebView2 with default runtime preferences
        if: runner.os == 'Windows'
        run: node scripts/verify-webgpu-native.ts
      - name: Qualify actual WebKitGTK with default runtime preferences
        if: runner.os == 'Linux'
        # Xvfb is a recorded virtual display; this does not attest a physical GPU.
        run: xvfb-run -a dbus-run-session -- node scripts/verify-webgpu-native.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: native-webgpu-${{ matrix.runtime }}-${{ inputs.source_sha }}
          path: |
            artifacts/native-webgpu/environment.json
            artifacts/native-webgpu/conformance.json
            artifacts/native-webgpu/*.log
            artifacts/native-webgpu/WEBGPU-QUALIFICATION-BUILD-NOT-FOR-RELEASE.txt
          retention-days: 7
          if-no-files-found: error
