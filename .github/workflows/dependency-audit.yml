# SPDX-License-Identifier: MPL-2.0
# Dependency advisories: the npm, pnpm and RustSec advisory lookup for every
# dependency root in security/dependency-roots.json (scripts/audit-all.ts).
#
# CI (ci.yml, job "npm audit (high+critical)") runs the same lookup on every
# main push and on a pull request whose trusted scope changes a manifest,
# lockfile, resolver setting or the audit policy. A pull request that changes
# none of those skips the lookup, so an advisory published upstream no longer
# turns unrelated pull requests red. This workflow covers the time between
# those runs: every night, on every release tag and on demand. A failure here
# is a release blocker (the release checklist requires `pnpm run audit:all`);
# fix it, or record a reviewed exception in security/dependency-roots.json,
# before tagging. A release workflow can also call this one (workflow_call)
# and need its job.
name: Dependency advisories

on:
  schedule:
    - cron: '41 3 * * *'
  push:
    tags: ['v*', 'cli-v*', 'core-v*', 'engine-v*']
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

# Same reason as ci.yml: onnxruntime-node's postinstall tries a CUDA download on
# linux runners, and no job here needs CUDA.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  advisories:
    name: dependency advisories (high+critical)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive   # only brands/suse, and `update = none` skips it on a public runner
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (workspaces)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # Same pinned release binary and check as ci.yml. Verify the archive
      # before executing anything from it.
      - name: Install pinned cargo-audit
        timeout-minutes: 5
        env:
          CARGO_AUDIT_VERSION: '0.22.2'
          CARGO_AUDIT_LINUX_X64_SHA256: '7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          bindir="$RUNNER_TEMP/cargo-audit-bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz"
          echo "$CARGO_AUDIT_LINUX_X64_SHA256  $archive" | sha256sum --check
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir" --strip-components=1 \
            "cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit"
          PATH="$bindir:$PATH" cargo audit --version
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Audit every npm and Cargo dependency root against current advisories
        run: pnpm run audit:all
