# SPDX-License-Identifier: MPL-2.0
name: macOS Intel package

on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: Optional previous lolly-macos-x64 artifact to reuse its CPU runtime
        required: false
        default: ''
        type: string
      runtime_sha256:
        description: Required SHA-256 of the reused libonnxruntime.dylib
        required: false
        default: ''
        type: string
      webgpu_qualification:
        description: WebGPU qualification build (plan 295 P0b) - skips the release gate, unsigned, marked not for release
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  frontend:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification) }}
    uses: ./.github/workflows/release-frontend.yml
    with:
      target: tauri-desktop
      public_key_jwk: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
      ca_enrollment_trust_json: ${{ vars.VITE_CA_ENROLLMENT_TRUST_JSON }}
    secrets:
      LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}

  build:
    needs: frontend
    if: ${{ always() && !cancelled() && (needs.frontend.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification)) }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      LOLLY_RELEASE_FRONTEND_PHASE: verified-artifact
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
      LOLLY_PROFILE: lolly-start
      LOLLY_EMBED_CATALOG: profile
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NODE_OPTIONS: --max-old-space-size=6144
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      # A WebGPU qualification build (plan 295 P0b) only on a manual dispatch that asks for
      # one: scripts/build-release-web.ts then skips the release gate, signs nothing and
      # marks the frontend, and the step before upload marks the packages not for release.
      LOLLY_WEBGPU_QUALIFICATION_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install the pinned package manager
        run: |
          npm install --global --prefix "$RUNNER_TEMP/lolly-pnpm" pnpm@11.26.0
          echo "$RUNNER_TEMP/lolly-pnpm/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Check out ONNX Runtime 1.28.0
        if: inputs.runtime_run_id == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/onnxruntime
          ref: da9b5e364c465de65c49d91e696cd6485270757f
          path: upstream-ort
          submodules: recursive
      - name: Build the Intel CPU runtime
        if: inputs.runtime_run_id == ''
        working-directory: upstream-ort
        run: |
          ./build.sh --config Release --build_shared_lib --parallel 4 \
            --skip_tests --compile_no_warning_as_error --skip_submodule_sync \
            --build_dir "$RUNNER_TEMP/lolly-ort-build" \
            --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64 \
              onnxruntime_BUILD_UNIT_TESTS=OFF onnxruntime_USE_TELEMETRY=OFF
      - name: Prepare the compiled runtime
        if: inputs.runtime_run_id == ''
        run: |
          mkdir -p "$RUNNER_TEMP/lolly-ort"
          dylib=$(find "$RUNNER_TEMP/lolly-ort-build" -type f -name 'libonnxruntime.1.28.0.dylib' -print -quit)
          test -n "$dylib"
          cp "$dylib" "$RUNNER_TEMP/lolly-ort/libonnxruntime.dylib"
          install_name_tool -id '@rpath/libonnxruntime.dylib' "$RUNNER_TEMP/lolly-ort/libonnxruntime.dylib"
      - name: Reuse the verified CPU runtime
        if: inputs.runtime_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
        run: |
          [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RUNTIME_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh run download "$RUNTIME_RUN_ID" --name lolly-macos-x64 --dir "$RUNNER_TEMP/lolly-runtime-package"
          ditto -x -k "$RUNNER_TEMP/lolly-runtime-package/Lolly-macos-x64.app.zip" "$RUNNER_TEMP/lolly-runtime-package/unpacked"
          mkdir -p "$RUNNER_TEMP/lolly-ort"
          cp "$RUNNER_TEMP/lolly-runtime-package/unpacked/Lolly.app/Contents/Frameworks/libonnxruntime.dylib" "$RUNNER_TEMP/lolly-ort/"
          printf '%s  %s\n' "$RUNTIME_SHA256" "$RUNNER_TEMP/lolly-ort/libonnxruntime.dylib" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/lolly-runtime-package"
      - name: Verify and configure the runtime
        run: |
          file "$RUNNER_TEMP/lolly-ort/libonnxruntime.dylib" | grep x86_64
          echo "ORT_LIB_PATH=$RUNNER_TEMP/lolly-ort" >> "$GITHUB_ENV"
          echo 'ORT_PREFER_DYNAMIC_LINK=1' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,@executable_path/../Frameworks' >> "$GITHUB_ENV"
          python3 - <<'PY'
          import ctypes, os
          lib = ctypes.CDLL(os.environ['RUNNER_TEMP'] + '/lolly-ort/libonnxruntime.dylib')
          class ApiBase(ctypes.Structure):
              _fields_ = [('get_api', ctypes.CFUNCTYPE(ctypes.c_void_p, ctypes.c_uint32)),
                          ('version', ctypes.CFUNCTYPE(ctypes.c_char_p))]
          lib.OrtGetApiBase.restype = ctypes.POINTER(ApiBase)
          api = lib.OrtGetApiBase().contents
          assert api.get_api(28) and api.version() == b'1.28.0'
          print('ONNX Runtime 1.28.0 provides API 28')
          PY
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/lolly-intel.json", JSON.stringify({bundle:{macOS:{minimumSystemVersion:"13.5",entitlements:"../macos/IntelEntitlements.plist",frameworks:[process.env.RUNNER_TEMP+"/lolly-ort/libonnxruntime.dylib"]}}}))'
          rm -rf "$RUNNER_TEMP/lolly-ort-build" upstream-ort
      - name: Install application dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C shells/tauri-desktop install --frozen-lockfile
      - name: Download signed source catalog
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-source-catalog-tauri-desktop
          path: brands/lolly-start/catalog/tools

      - name: Download signed frontend
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-frontend-tauri-desktop
          path: shells/tauri-desktop/dist

      - name: Build the application
        env:
          VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
        run: pnpm -C shells/tauri-desktop run tauri build --bundles app,dmg --config "$RUNNER_TEMP/lolly-intel.json"
      - name: Verify the bundle and preserve permissions
        run: |
          app=shells/tauri-desktop/src-tauri/target/release/bundle/macos/Lolly.app
          "$app/Contents/MacOS/lolly-desktop" --version
          "$app/Contents/MacOS/lolly-desktop" list --json > intel-tools.json
          otool -L "$app/Contents/MacOS/lolly-desktop" | grep '@rpath/libonnxruntime.dylib'
          test -f "$app/Contents/Frameworks/libonnxruntime.dylib"
          ditto -c -k --keepParent "$app" Lolly-macos-x64.app.zip
      - name: Mark a WebGPU qualification build as not for release
        if: env.LOLLY_WEBGPU_QUALIFICATION_BUILD == '1'
        run: node scripts/webgpu-qualification.ts mark .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lolly-macos-x64
          path: |
            shells/tauri-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            Lolly-macos-x64.app.zip
            intel-tools.json
            WEBGPU-QUALIFICATION-BUILD-NOT-FOR-RELEASE.txt
          if-no-files-found: error
