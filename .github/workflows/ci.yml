# Quality gate - runs on every push to main and every PR.
# Independent gates run in parallel (plans/archive/qa-audit-2026-06-28.md #1):
#   test            - full repo suite (engine contract tests + core/web/mcp)
#   typecheck       - tsc -p across every project, INCLUDING both Tauri shells'
#                     bridge-overrides (this job installs those two shells,
#                     which are not npm workspaces, so the gate is real here -
#                     the --strict step fails if the install is ever dropped)
#   validate        - catalog manifests/index drift + asset checksums
#   smoke           - render every catalog tool at manifest defaults (headless,
#                     browser-free); a hooks.js regression that renders blank
#                     fails here instead of shipping green
#   build + budget  - production web build (hard gate), then the boot-path
#                     bundle budget (scripts/check-bundle-budget.ts) and the
#                     /info dist-size budget (scripts/check-docs-size-budget.ts),
#                     both deliberately NOT part of build:web, so CI runs them after.
#   api-bundles     - regenerate the committed api/ function bundles and fail
#                     on drift (they are generated esbuild output, like
#                     catalog/tools/index.json).
#   audit           - npm audit (blocks on HIGH/CRITICAL; moderate/low surfaced,
#                     non-blocking) + SBOM freshness (regenerate sbom.cdx.json, fail
#                     on drift) + third-party notices (build:licenses exits 1 on a
#                     coverage gap; drift in the generated files fails the diff) +
#                     cargo license-map coverage (cargo-licenses.json needs a Rust
#                     toolchain to regenerate, which CI lacks, so it is checked for
#                     coverage of every Cargo.lock crate instead of by diff).
#                     Ongoing supply-chain watch for the security audit;
#                     false alarms pinned via package.json overrides.
# All gates (test / typecheck / validate / smoke / build+budget / api-bundles / audit)
# exit non-zero on failure and BLOCK. The bundle-budget step is a hard gate again as of the boot
# diet (2026-07-08): boot JS is ~66 KB gz vs the 115 KB budget, after the engine
# barrel was pulled off the boot path (it had dragged c2pa-trust/design-map/
# pdf-map/pptx/emf/… onto first paint). See plans/fable-advice.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel an in-flight run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# onnxruntime-node's postinstall attempts a CUDA EP download on linux runners and
# dies on an unhandled rejection (macOS never takes that path). No job here needs
# CUDA; skip it so `npm ci` survives. Node is 24 to match the repo target - and
# npm 11's audit, which resolves override floors the way the lockfile intends.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # tools/catalog/shells/services/docs are submodules; workspaces need every package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      # Conformance binaries - the C2PA/PDF conformance tests (tests/c2pa-c2patool-
      # conformance.test.ts + gated cases in c2pa.test.ts / c2pa-formats.test.ts)
      # skip silently when qpdf/c2patool aren't on PATH. Install both so they run.
      - name: Install qpdf (PDF conformance checks)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf

      - name: Cache c2patool
        id: c2patool-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/c2patool
          key: c2patool-v0.26.70-x86_64-unknown-linux-gnu

      - name: Install c2patool (C2PA conformance checks)
        if: steps.c2patool-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/c2patool.tar.gz \
            "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v0.26.70/c2patool-v0.26.70-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/c2patool.tar.gz -C /tmp
          mkdir -p ~/.cache/c2patool
          install -m 0755 /tmp/c2patool/c2patool ~/.cache/c2patool/c2patool

      - name: Put c2patool on PATH
        run: |
          echo "$HOME/.cache/c2patool" >> "$GITHUB_PATH"
          "$HOME/.cache/c2patool/c2patool" --version

      - name: Full test suite
        # tee so the skip-gate step below can read the summary; pipefail
        # keeps the suite's exit code authoritative through the pipe.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      # Skipped tests GATE (ratchet). On this runner the skip set is a KNOWN,
      # environment-determined quantity - qpdf and c2patool are installed above,
      # so the C2PA/PDF conformance tests all RUN here (zero conformance skips,
      # including the dynamic "this c2patool build cannot read PDFs" case). A
      # skip count above the baseline therefore means something that used to run
      # is silently skipping again - e.g. a conformance-binary install step broke
      # - and that must FAIL, not scroll past in the log.
      #
      # EXPECTED_SKIPS is a RATCHET BASELINE, not a hand-derived invariant: the
      # per-test conditions (fixture presence, loops, dynamic t.skip) make the
      # exact number impractical to derive statically, so it is pinned to the
      # count observed on main (run 30541115113, 2026-07-30; +16 browser-gated
      # golden/emission tests added 2026-07-31; 426->430 on run 33186818905,
      # 2026-08-28 - the ship-tree push added pack/browser-gated tests without
      # raising the pin in the same push). What legitimately skips on
      # this runner, by reason (informational; these lines sum to 217 - one
      # bucket has overcounted by 1 since the 2026-07-30 baseline run, which
      # observed 200 against lines then summing to 201. Reconcile against the
      # next CI run's per-reason output; the baseline number is the observed
      # count, so the GATE is right even while the breakdown is off by one):
      #  122  no browser - Playwright Chromium not installed
      #   31  SUSE brand pack not mounted - brands/suse is `update = none` in CI
      #   31  macOS ColorSync stock profiles absent on ubuntu (icc.test.ts)
      #   28  UXDays keynote .penpot fixture (dev-machine only)
      #   17  SUSE static fonts not in the lolly-start fallback profile
      #   19  real ICC profile fixtures not committed (licensing: see that file)
      #    8  no built /info on disk (docs-site tests)
      #    6  ffprobe/ffmpeg not on PATH (independent EXR/Radiance checks)
      #    5  SUSE variable font absent
      #    4  SUSE-Regular.ttf absent (fallback-chain goldens)
      #    3  ImageMagick not installed (optional external check)
      #    2  perf/timing tests gated behind BENCH=1
      #    2  LOLLY_ICC_TARG / misc fixtures not set
      # Re-counted 2026-08-10 against the collab-era main (308 observed after the
      # variable-font golden repoint made 4 fvar cases run everywhere): the growth
      # since 292 (2026-08-04) is accumulated environment-gated tests that never
      # raised the baseline in their own PRs - the 'SUSE brand pack not mounted'
      # bucket 31->44, 'suse is not mounted' x3, suse tokens brand.json x2,
      # 'skera not installed' x2, the LOLLY_BROWSER_DRILLS private-collab drill
      # gate x1, penpot-start example materials x1.
      # Prior note (2026-08-04, kept for the trail): re-counted against 54c3bdd
      # (292 observed). The growth
      # since the 216 baseline is new environment-gated tests from the upscale,
      # matte, PSD/XCF and docs-site work, not tests that stopped running.
      # Re-counted 2026-08-28 against run 33142057510 (423 observed): the growth
      # since 308 is three weeks of environment-gated additions that never raised
      # the baseline in their own pushes - the 08-26/27 browser-golden waves
      # (AudioBufferSink waveforms, sequence-editor E2E, mesh-gradient looks: the
      # 'no browser - Playwright Chromium' bucket), and the 08-28 pack moves
      # (deck-builder/battlecards/pricing-table gated on the SUSE pack, which CI
      # never mounts: ~60 in the 'SUSE brand pack not mounted' bucket). +3 on top
      # of the observed count: the ask chunks.test drift guard and the two
      # docs-landing-fragment built-site reads now skip (with a reason) instead
      # of failing where public/info was never built.
      # If a PR legitimately adds environment-gated tests, raise the baseline in
      # that same PR; when skips are removed (e.g. browsers installed in CI, or
      # fixtures committed), LOWER it so the ratchet keeps its teeth. Local runs
      # are unaffected - this gate only runs in CI, where the toolchain is known.
      - name: Skipped tests must not exceed the CI baseline
        if: always()
        env:
          EXPECTED_SKIPS: 430
        run: |
          # node:test prints a run summary - "ℹ skipped N" (spec reporter) or
          # "# skipped N" (tap, the non-TTY default on some Node lines). Strip
          # ANSI colour codes first, then surface the counts in the job log.
          sed $'s/\x1b\[[0-9;]*m//g' test-output.log \
            | grep -E '^(#|ℹ) (tests|pass|fail|skipped|todo) [0-9]+' || true
          # Name the failures here at the END of the log: the full TAP stream
          # runs to ~45k lines and the scattered "not ok" lines fall outside
          # what the Actions UI / log APIs surface, which makes a red run
          # undiagnosable from the summary alone. Capped so a catastrophic run
          # can't flood the log.
          echo "--- failing tests (first 50) ---"
          sed $'s/\x1b\[[0-9;]*m//g' test-output.log \
            | grep -E '^(not ok|✖|✗)' | head -50 || true
          skipped=$(sed $'s/\x1b\[[0-9;]*m//g' test-output.log \
            | grep -E '^(#|ℹ) skipped [0-9]+' | tail -1 | grep -oE '[0-9]+' | tail -1 || true)
          if [ -z "$skipped" ]; then
            echo "::error::no node:test skip summary found in test-output.log - cannot verify the skip baseline"
            exit 1
          fi
          echo "skipped: $skipped (baseline: $EXPECTED_SKIPS)"
          if [ "$skipped" -gt "$EXPECTED_SKIPS" ]; then
            echo "::error::$skipped tests skipped, exceeding the expected CI baseline of $EXPECTED_SKIPS. Something that used to run is skipping again (check the qpdf/c2patool install steps and any new '# SKIP' reasons in the log). If new environment-gated tests were added on purpose, raise EXPECTED_SKIPS in ci.yml in this same PR."
            exit 1
          fi
          if [ "$skipped" -lt "$EXPECTED_SKIPS" ]; then
            echo "note: $skipped < $EXPECTED_SKIPS - skips were removed; lower EXPECTED_SKIPS in ci.yml to ratchet the baseline down."
          fi

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      # bridge-overrides/ is the whole application-specific surface of both Tauri
      # shells, and those shells are deliberately NOT npm workspaces, so `npm ci`
      # above does not create their node_modules and the @tauri-apps types their
      # overrides import would not resolve. Install them here - production deps
      # only, since the types are all the typecheck needs and --omit=dev skips the
      # Tauri CLI and Vite. Without this, typecheck:tauri SKIPS (by design, so a
      # plain clone is not punished) and the --strict step below fails loudly
      # rather than letting the gate quietly become a no-op.
      - name: Install (Tauri shells - types only, not npm workspaces)
        run: |
          npm --prefix shells/tauri-desktop ci --omit=dev
          npm --prefix shells/tauri-mobile ci --omit=dev

      - name: Typecheck (tsc -p, every project)
        run: npm run typecheck

      - name: Typecheck must not have skipped the Tauri shells
        run: npm run typecheck:tauri -- --strict

      # engine/README.md's module table is generated from the tree. Regenerating
      # it must be a no-op; drift means a module was added, renamed or had its
      # header comment changed without refreshing the map auditors navigate by.
      - name: Engine module map drift (stale? rerun build:engine-modules)
        run: npm run check:engine-modules

      # The engine must stay free of DOM, storage and network access: that is
      # what lets one tool render unchanged in the browser, Tauri and the CLI.
      # engine/tsconfig.json has to include the DOM lib for the fetch-spec
      # globals, so the compiler cannot enforce this. This step does.
      - name: Engine purity (no DOM/storage/network in engine/src)
        run: npm run check:engine-purity

      # docs/build.ts's `pages` array is hand-maintained and the /info nav derives
      # from it, so a .md could be written and committed while staying unreachable
      # from the site - docs/ios-build.md was exactly that. Every docs/*.md must now
      # be a registered page or a declared exception (see NOT_PAGES in the script).
      - name: Docs nav completeness (no orphaned docs/*.md)
        run: npm run check:docs-nav

      # shells/web/src/README.md opens with per-directory and largest-file stats
      # that a new contributor uses to decide where to look. They were measured by
      # hand and were already drifting; they are generated now, so this fails if
      # the committed tables no longer match the tree.
      - name: Web shell code-map stats drift (stale? rerun build:web-src-readme)
        run: npm run check:web-src-readme

  validate-catalog:
    name: validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Validate catalog (no manifest/index drift, asset checksums)
        run: npm run validate:catalog

  # Catalog-wide render gate - `lolly smoke` renders every tool in the active profile
  # at manifest defaults (sequential, browser-free: first Node-native format, html as
  # the layout fallback) and exits non-zero on any failed render. CI checks out the
  # public submodules only (brands/suse is `update = none`), so postinstall builds the
  # lolly-start fallback profile - the community tools are what gets smoked here; a
  # SUSE-profile smoke is a local/`loldev` concern.
  smoke:
    name: smoke (render every tool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Smoke-render the catalog (headless, no browser)
        run: npm run smoke

  build:
    name: build + bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Production build (info site + OG cards + web shell)
        run: npm run build:web

      - name: Bundle budget (boot-path JS ≤ 115 KB gz, no heavy chunks preloaded)
        run: npm run check:bundle

      - name: Docs size budget (/info ≤ 160 MB gz - every locale ships, chrome must not multiply)
        run: npm run check:docs-size

  # The committed api/ function bundles (api/mcp/[...path].js, api/ca/[...path].js)
  # are GENERATED by esbuild (scripts/build-mcp-fn.ts / build-ca-fn.ts) and checked
  # in only so Vercel sees them at function-detection time. Same discipline as the
  # generated catalog/tools/index.json: regenerate, then fail on any drift.
  api-bundles:
    name: api bundle drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Rebuild the api/ function bundles
        run: npm run build:mcp-fn && npm run build:ca-fn

      - name: No drift (stale bundle? rerun build:mcp-fn / build:ca-fn and commit)
        run: git diff --exit-code -- api/

  # Self-test of the in-tree composite action (action/ - ready to split into
  # lolly-tools/render-action, plans/48-fable-new-potential.md section 5.4). Exercises the
  # real consumer path end-to-end: the action checks out lolly at THIS commit,
  # npm ci builds the lolly-start fallback profile, and qr-code renders to SVG
  # browser-free (Tier A) - so the action stays green before the split.
  render-action:
    name: render-action self-test
    runs-on: ubuntu-latest
    steps:
      # No submodules: this job only needs action/ itself - the action performs
      # its own pinned lolly checkout into a work dir.
      - uses: actions/checkout@v7

      - name: Render qr-code via the composite action (svg, no browser)
        id: render
        uses: ./action
        with:
          tool: qr-code
          args: --url=https://lolly.tools
          format: svg
          lolly-ref: ${{ github.sha }}

      - name: Assert the render landed and the outputs are wired
        env:
          OUT_DIR: ${{ steps.render.outputs.out-dir }}
          FILES: ${{ steps.render.outputs.files }}
        run: |
          test -s "$OUT_DIR/qr-code.svg"
          grep -q '<svg' "$OUT_DIR/qr-code.svg"
          [ "$FILES" = "qr-code.svg" ]
          echo "rendered: $FILES → $OUT_DIR"

  # Dependency vulnerabilities - fail on any HIGH or CRITICAL advisory so a new
  # vulnerable dep can't land silently (readiness for the security audit). Moderate/
  # low are surfaced but don't block. A false alarm can be pinned via package.json
  # `overrides` (as adm-zip is, forced to ^0.6.0 past onnxruntime-node's ^0.5.16).
  #
  # Most advisories clear with `npm update --package-lock-only <pkg>`, because the
  # fixed version already satisfies the range its parent declares - no package.json
  # edit, no `npm audit fix --force`, which is never the answer here. An override is
  # for the other case: the parent's declared range EXCLUDES the fix. Two live now,
  # both scoped as narrowly as the syntax allows:
  #   - ip-address ^10.3.1 / nanoid ^3.3.17 - floors, not pins. Both were already
  #     satisfiable (express-rate-limit wants ^10.2.0, postcss wants ^3.3.16); the
  #     entries stop a future resolve from walking back under the advisory.
  #   - @huggingface/transformers > sharp: "$sharp" - transformers pins sharp
  #     ^0.34.1 and every published version of it still does, including 4.x, so
  #     upgrading transformers does NOT clear GHSA-f88m-g3jw-g9cj. `$sharp` reuses
  #     the root's own sharp spec, which keeps ONE sharp (and one libvips binary)
  #     in the tree instead of two. Verified against transformers' actual sharp
  #     usage: it calls metadata/rotate/raw/toBuffer/affine/resize/extract, none of
  #     the APIs 0.35.0 removed (failOnError, paletteBitDepth, jp2k, sharpen opts).
  #     Revisit when transformers widens its range - then this can just go.
  audit:
    name: npm audit (high+critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Audit - block on high/critical
        run: npm audit --audit-level=high

      - name: Full advisory report (non-blocking, for the log)
        if: always()
        run: npm audit || true

      # The committed CycloneDX SBOM (sbom.cdx.json) is generated from package-lock.json
      # (scripts/build-sbom.ts, deterministic). Regenerate + fail on drift so it can't go
      # stale vs the installed graph - same discipline as the api-bundles drift gate.
      - name: SBOM up to date (regenerate; fail on drift)
        run: |
          npm run build:sbom
          git diff --exit-code -- sbom.cdx.json

      # Third-party notices are generated the same way (scripts/build-licenses.ts).
      # The generator itself EXITS 1 when a distributed direct dependency is missing
      # from its component list, so an attribution gap blocks here - and drift in
      # the committed outputs blocks on the diff, like the SBOM above.
      # (THIRD-PARTY-LICENSES.txt lives in the shells/web submodule, so its drift
      # check has to run inside that repo - a superproject pathspec can't see it.)
      - name: Third-party notices complete + up to date (fail on gap or drift)
        run: |
          npm run build:licenses
          git diff --exit-code -- THIRD-PARTY-NOTICES.md
          git -C shells/web diff --exit-code -- public/THIRD-PARTY-LICENSES.txt

      # Rust crate licenses come from the committed cargo-licenses.json map, which
      # is generated by `cargo metadata` - and CI has no Rust toolchain, so unlike
      # the two gates above this artifact CANNOT be regenerated-and-diffed here.
      # That made it the one licence artifact a `cargo update` could silently
      # invalidate while the job still went green. Check COVERAGE instead: every
      # [[package]] in each shipped Cargo.lock must have a map entry. Needs only
      # the lockfiles (no cargo, no network), and because the hand-reviewed
      # license-file entries are version-pinned, a version bump on one fails here
      # rather than carrying a stale legal verdict forward.
      - name: Cargo license map covers the crate graph (fail on stale map)
        run: npm run check:cargo-licenses

  # Static analysis. Added after the SUSE assessment (2026-08, S4), which found
  # the repo had no SAST gate at all. Two deliberate design choices:
  #
  #   1. DIFF MODE, not full-tree. A full-tree gate fails on ~7,500 pre-existing
  #      findings and gets switched off within a week - the fate the advisory-only
  #      Biome baseline already documents (~3,000 findings, see CLAUDE.md). Only
  #      findings NEW in this PR block.
  #   2. The two rules producing 5,197 of those findings are excluded: this
  #      codebase uses English source strings AS i18n keys by design, and builds
  #      templated HTML with escaping at the boundary. Neither rule models it.
  #
  # The custom rules in .github/opengrep/ are the more valuable half: the one real
  # vulnerability in the assessment (a javascript: href that WAS escaped but not
  # scheme-checked) fired no upstream rule. Those run full-tree, not diff-only -
  # there is no backlog of them to grandfather in.
  sast:
    name: opengrep (custom rules + new findings)
    runs-on: ubuntu-latest
    # Runs on PUSH as well as PR. It was PR-only, which sounds harmless until you
    # notice this repo commits straight to main - so the security gate never saw a
    # single one of the commits it was added to guard (SUSE assessment follow-up,
    # 2026-08-04). The Lolly rules below are full-tree and need no baseline, so
    # they work on either event; only the upstream diff step needs one, and it
    # takes the pushed range on a push.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history so --baseline-commit can reach the merge base.
          fetch-depth: 0

      # Opengrep publishes NO PyPI package - `pipx install opengrep` cannot resolve
      # (verified 2026-08-04: "No matching distribution found"). The release ships a
      # self-contained binary per platform, so fetch that and pin the version.
      - name: Install Opengrep
        env:
          OPENGREP_VERSION: '1.26.0'
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$OPENGREP_VERSION" --repo opengrep/opengrep \
            --pattern opengrep_manylinux_x86 --output /usr/local/bin/opengrep
          chmod +x /usr/local/bin/opengrep
          opengrep --version

      # Lolly's own rules - full-tree, blocking. No pre-existing backlog to absorb.
      #
      # `--no-git-ignore` is REQUIRED, not a preference: opengrep defaults to
      # scanning only files git tracks, and every shell lives in a SUBMODULE, so
      # from the parent repo their files are gitlinks rather than tracked paths.
      # Without it this step scanned 1 file and reported success - a gate that
      # silently does nothing, which is worse than no gate. Verified 2026-08-04:
      # 1 file with the default, ~1000 with this flag.
      #
      # That flag also stops honouring .gitignore, so the excludes below are what
      # keep node_modules/dist/vendored bundles out - and `.claude/worktrees`,
      # which holds throwaway agent copies of the whole shell whose stale source
      # would otherwise fail the build.
      - name: Lolly custom rules (full tree)
        run: |
          opengrep scan --error --no-git-ignore \
            --config .github/opengrep/lolly-rules.yml \
            --exclude node_modules --exclude dist --exclude '.claude' \
            --exclude vendor --exclude '*.min.js' --exclude '*.test.ts' \
            shells/ community/ brands/ engine/ packages/ services/ scripts/

      # Upstream packs are advisory (continue-on-error), NOT a gate. Three reasons,
      # all learned the hard way rather than assumed:
      #   - `--config p/<pack>` resolves over the network against a third-party
      #     registry opengrep is not affiliated with, so a gate would go red on
      #     someone else's outage or silently change meaning when a pack is edited.
      #   - The two rule ids the assessment named as the 5,197-finding noise are
      #     NOT present in these packs under those ids, so excluding them is a
      #     no-op and the real noise level here is unknown until it has run a few
      #     times. Blocking on an unmeasured backlog is how a gate gets deleted.
      #   - `checkout` with fetch-depth: 0 already has full history, so the base
      #     commit needs no extra fetch (the earlier `git fetch --depth=0` here was
      #     a fatal git error - 0 is not a valid depth - which would have failed
      #     the step before opengrep ever ran).
      # The blocking half of this job is the Lolly rules above. Promote this step
      # to blocking once its output has been read on real PRs and the exclusions
      # are grounded in ids that actually exist.
      # On a push the baseline is the previous head of the branch; on a PR it is the
      # merge base. A first push (all-zero `before`) has no baseline, so the step
      # scans nothing rather than the whole tree.
      - name: Upstream rules - new findings in this change (advisory)
        continue-on-error: true
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASELINE" ] || [ "$BASELINE" = "0000000000000000000000000000000000000000" ]; then
            echo "no baseline for this event - skipping the diff scan"; exit 0
          fi
          opengrep scan \
            --config p/typescript --config p/javascript --config p/security-audit \
            --baseline-commit "$BASELINE" \
            --exclude '*.test.ts' --exclude '*.test.js' \
            --exclude node_modules --exclude dist \
            --error . || true
