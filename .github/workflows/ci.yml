# Quality gate - runs on every push to main and every PR.
# Independent gates run in parallel (plans/archive/qa-audit-2026-06-28.md #1):
#   test            - full repo suite (engine contract tests + core/web/mcp)
#   typecheck       - tsc -p across every project, INCLUDING both Tauri shells'
#                     bridge-overrides (this job installs those two shells,
#                     which are not pnpm workspaces, so the gate is real here -
#                     the --strict step fails if the install is ever dropped)
#   validate        - catalog manifests/index drift + asset checksums
#   smoke           - render every catalog tool at manifest defaults (headless,
#                     browser-free); a hooks.js regression that renders blank
#                     fails here instead of shipping green
#   build + budget  - production web build (hard gate), then the boot-path
#                     bundle budget (scripts/check-bundle-budget.ts) and the
#                     /info dist-size budget (scripts/check-docs-size-budget.ts),
#                     both deliberately NOT part of build:web, so CI runs them after.
#   api-bundles     - regenerate the committed api/ function bundles and fail
#                     on drift (they are generated esbuild output, like
#                     catalog/tools/index.json).
#   audit           - every npm/Cargo lock is inventoried on every run. The npm,
#                     pnpm and RustSec advisory lookup blocks known high and
#                     critical vulnerabilities on every main push and on a pull
#                     request whose trusted scope changes a manifest, lockfile or
#                     the audit policy; dependency-audit.yml also runs it nightly
#                     and on release tags. Also checks SBOM freshness
#                     (regenerate sbom.cdx.json, fail on drift - advisory only on
#                     a dependabot[bot] PR, which cannot carry the regenerated
#                     file; sbom-refresh.yml repairs main after the merge)
#                     + third-party notices (build:licenses exits 1 on a
#                     coverage gap; drift in the generated files fails the diff) +
#                     cargo license-map coverage for every Cargo.lock crate.
#   secrets         - Gitleaks scans all parent-repository history with redacted
#                     output and narrow, commit-scoped fixture exceptions.
#                     Ongoing supply-chain watch for the security audit;
#                     false alarms pinned via pnpm-workspace.yaml overrides.
# All gates (test / typecheck / validate / smoke / build+budget / api-bundles / audit)
# exit non-zero on failure and BLOCK. The bundle-budget step is a hard gate again as of the boot
# diet (2026-07-08): boot JS is ~66 KB gz vs the 115 KB budget, after the engine
# barrel was pulled off the boot path (it had dragged c2pa-trust/design-map/
# pdf-map/pptx/emf/… onto first paint). See plans/fable-advice.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its in-flight run. A main push is never
# cancelled once it has started, so every started main run reports a complete
# result for its commit (deployment and release tooling need a successful push
# run for the exact commit). A main run that is still queued is replaced by a
# newer one, which costs no runner time, and the newest main commit always runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# onnxruntime-node's postinstall attempts a CUDA EP download on linux runners and
# dies on an unhandled rejection (macOS never takes that path). No job here needs
# CUDA; skip it so `pnpm install --frozen-lockfile` survives. Node is 24 to match the repo target.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CI_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

# Every job has a time limit. GitHub's default is 6 hours, and stalled apt
# mirrors held runners for up to 4 hours before these limits existed. Each job
# limit is about 2.5 times the 90th percentile of 45 passing runs (October
# 2026), at least 1.4 times the slowest of them, and never under 15 minutes,
# because actions/checkout alone has taken 7 minutes (12 in opengrep). A job
# limit also covers the full limits of its own install steps plus its slowest
# checkout and test time, so a slow install that passes inside its step limit is
# not then stopped by the job limit. Package installs retry a stalled attempt.
jobs:
  # Scope comes from the exact event base. Changes to this workflow or policy
  # require the full suite. The bootstrap PR has no base policy and is full-only.
  # Every consumer of these outputs treats a missing or unknown value as the
  # strict case: the full suite, and an advisory lookup.
  deployment-scope:
    name: deployment scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      public-ready: ${{ steps.scope.outputs.public-ready }}
      lane: ${{ steps.scope.outputs.lane }}
      dependency-change: ${{ steps.scope.outputs.dependency-change }}
      heavy-tier: ${{ steps.shards.outputs.heavy-tier }}
      test-shards: ${{ steps.shards.outputs.test-shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Classify with trusted base policy
        id: scope
        run: |
          mkdir -p artifacts
          if git cat-file -e "$CI_BASE_SHA:scripts/ci-qualification.ts" 2>/dev/null; then
            git show "$CI_BASE_SHA:scripts/ci-qualification.ts" > "$RUNNER_TEMP/ci-qualification.ts"
            node "$RUNNER_TEMP/ci-qualification.ts" scope artifacts/ci-scope.json
          else
            node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, writeFileSync } from 'node:fs';
          const env = process.env;
          const git = ref => execFileSync('git', ['rev-parse', ref], { encoding: 'utf8' }).trim();
          const scope = { version: 1, source: git('HEAD'), tree: git('HEAD^{tree}'),
            base: env.CI_BASE_SHA, headSha: env.CI_HEAD_SHA,
            repository: env.GITHUB_REPOSITORY, repositoryId: Number(env.GITHUB_REPOSITORY_ID),
            headRepository: env.CI_HEAD_REPOSITORY, headBranch: env.CI_HEAD_BRANCH,
            event: env.GITHUB_EVENT_NAME, runId: Number(env.GITHUB_RUN_ID), runAttempt: Number(env.GITHUB_RUN_ATTEMPT),
            policyCommit: env.CI_BASE_SHA, policySha256: null, publicReadyEligible: false,
            lane: 'full', dependencyChange: true,
            changes: [], changedPathsSha256: createHash('sha256').update('[]').digest('hex'),
            reasons: ['Trusted base has no CI policy; full release required'] };
          writeFileSync('artifacts/ci-scope.json', JSON.stringify(scope, null, 2) + '\n', { flag: 'wx' });
          appendFileSync(env.GITHUB_OUTPUT, 'public-ready=false\nlane=full\ndependency-change=true\n');
          NODE
          fi
      # The long test matrix is chosen here from the trusted lane above. Only a
      # pull request in the docs-and-tests lane (every change is documentation
      # content, a test or a reviewed baseline: classifyDocsAndTests in
      # scripts/ci-qualification.ts) leaves out the heavy tier: the eight WebGPU
      # browser partitions and their gate, Tauri, conformance (qpdf and
      # c2patool) and fuzz regression. Every main push, every other pull request
      # and any run whose lane is missing or unknown keeps every shard. This
      # step runs even when classification fails, so the matrix always exists.
      - name: Select the test shards for this scope
        id: shards
        if: always()
        env:
          LANE: ${{ steps.scope.outputs.lane }}
          LIGHT_SHARDS: >-
            [{"shard": "unit:engine", "artifact": "unit-engine", "timeout": 40},
            {"shard": "unit:web", "artifact": "unit-web", "timeout": 30},
            {"shard": "tools", "artifact": "tools", "timeout": 15}]
          HEAVY_SHARDS: >-
            [{"shard": "browser", "artifact": "browser-1", "partition": "1/8", "timeout": 90},
            {"shard": "browser", "artifact": "browser-2", "partition": "2/8", "timeout": 90},
            {"shard": "browser", "artifact": "browser-3", "partition": "3/8", "timeout": 90},
            {"shard": "browser", "artifact": "browser-4", "partition": "4/8", "timeout": 90},
            {"shard": "browser", "artifact": "browser-5", "partition": "5/8", "timeout": 90},
            {"shard": "browser", "artifact": "browser-6", "partition": "6/8", "timeout": 90},
            {"shard": "browser", "artifact": "browser-7", "partition": "7/8", "timeout": 90},
            {"shard": "browser", "artifact": "browser-8", "partition": "8/8", "timeout": 90},
            {"shard": "tauri", "artifact": "tauri", "timeout": 40},
            {"shard": "conformance", "artifact": "conformance", "timeout": 25},
            {"shard": "fuzz:regression", "artifact": "fuzz-regression", "timeout": 15}]
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$LANE" = docs-and-tests ]; then
            heavy=skip
            shards=$(jq -c . <<<"$LIGHT_SHARDS")
          else
            heavy=run
            shards=$(jq -cn --argjson light "$LIGHT_SHARDS" --argjson heavy "$HEAVY_SHARDS" '$light + $heavy')
          fi
          echo "heavy-tier=$heavy" >> "$GITHUB_OUTPUT"
          echo "test-shards=$shards" >> "$GITHUB_OUTPUT"
          echo "Lane '${LANE:-unknown}': heavy tier $heavy; shards $(jq -r 'map(.artifact) | join(", ")' <<<"$shards")"
      # Inputs to later jobs are named by run, not attempt, so "Re-run failed
      # jobs" finds the files that carried-over jobs uploaded in an earlier
      # attempt. A download by name takes the newest upload of that name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-scope-${{ github.run_id }}
          path: artifacts/ci-scope.json
          if-no-files-found: error
          retention-days: 14

  public-ready-ui:
    name: test (public-ready UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
      - name: Install pinned dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Focused UI and canonical token contracts
        env:
          LOLLY_PUBLIC_READY_UI_REPORT: artifacts/public-ready-ui.json
        run: node scripts/run-public-ready-ui.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-ready-ui-${{ github.run_id }}
          path: artifacts/public-ready-ui.json
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      # Pinned to the last verified release: 8.30.1 has a confirmed silent
      # detection regression (gitleaks/gitleaks#2170). Verify the release asset
      # before executing it; upgrades must keep the scanner self-test below.
      - name: Install pinned Gitleaks
        timeout-minutes: 5
        env:
          GITLEAKS_VERSION: '8.29.1'
          GITLEAKS_LINUX_X64_SHA256: 'e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924'
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bindir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_LINUX_X64_SHA256  $archive" | sha256sum --check
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir" gitleaks
          echo "GITLEAKS_BIN=$bindir/gitleaks" >> "$GITHUB_ENV"

      - name: Verify scanner contract
        run: node --test tests/scan-secrets-runner.test.ts

      - name: Verify workflow supply-chain pins
        run: pnpm run check:workflow-pins

      - name: Scan tracked Git history (redacted output)
        run: pnpm run secrets:scan

  # These two checks share all installation, skip and evidence steps with the
  # exhaustive matrix, but expose a dependency that can finish before browsers.
  test-fast:
    name: ${{ format('test ({0})', matrix.shard) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 'contracts', artifact: 'contracts', timeout: 40 }
          - { shard: 'security', artifact: 'security', timeout: 30 }
    steps: &ci-test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive   # only brands/suse, and `update = none` skips it on a public runner

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26' # includes the entryFile field required by the skip reporter
          cache: pnpm

      - name: Install (workspaces)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # Until 2026-09-08 this shard ran with no browser installed, so every
      # *.browser.test.ts and Playwright-gated case skipped ("no Chromium") and the
      # 150-odd browser-tier tests only ever ran on a developer's machine. Install the
      # scoped Chromium into the same `.browsers` the shells' resolver
      # (packages/node-shell/src/browsers.ts) and `playwright`'s executablePath()
      # both read via PLAYWRIGHT_BROWSERS_PATH, so the shard tests what its name says.
      # It only works while `playwright-core` (what the installer drives) and `playwright`
      # (what the gates call executablePath() on) are the same release - they want
      # different chromium-<revision> directories otherwise, and the shard skips its whole
      # tier on a runner that has a browser. pnpm-workspace.yaml holds them together and
      # tests/browser-tier-install.test.ts asserts it; the cache key below is that same
      # resolved version, so a bump re-downloads instead of serving the wrong revision.
      - name: Cache Chromium (browser and security shards)
        if: matrix.shard == 'browser' || matrix.shard == 'security'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}

      # The package installs below retry. Runner apt mirrors stall: `apt-get
      # update` has sat for 4 hours with no output, and a slow mirror has taken
      # 17 minutes to fetch ffmpeg. `timeout` stops a stalled attempt and the
      # loop tries again; apt keeps the packages it already fetched, so a retry
      # only fetches what is still missing. The step limit is the hard stop.
      # Every apt command runs as `sudo timeout`, so the root `timeout` can stop
      # apt-get and its download helpers. A stopped attempt can leave dpkg half
      # configured, so each retry runs `dpkg --configure -a` first.
      - name: Install Chromium (browser and security shards)
        if: matrix.shard == 'browser' || matrix.shard == 'security'
        timeout-minutes: 20
        # The system libraries are installed as root here instead of through
        # `--with-deps`, which would run apt under playwright's own sudo, out of
        # reach of a `timeout` that runs as the runner user. `install-deps
        # chromium` installs the same packages as `install chromium --with-deps`.
        # The first `apt-get update` catches a stalled mirror within 90 seconds;
        # playwright runs it again, which is quick once the lists are fresh.
        run: |
          node_bin="$(command -v node)"
          for attempt in 1 2 3 4; do
            if [ "$attempt" -gt 1 ]; then
              sudo timeout -k 10 120 dpkg --configure -a || true
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' |
                  sudo tee /etc/apt/apt-mirrors.txt > /dev/null
              fi
            fi
            if sudo timeout -k 15 90 apt-get update &&
              sudo timeout -k 15 180 "$node_bin" node_modules/playwright-core/cli.js install-deps chromium &&
              timeout -k 15 180 pnpm run install:browser; then exit 0; fi
            echo "::warning::Chromium install attempt $attempt failed or stalled"
            sleep 10
          done
          exit 1

      # Ubuntu restricts user namespaces for downloaded Chromium. Follow the
      # official exact-executable exception on this disposable runner, retaining
      # Chromium sandboxing and the host's global AppArmor/sysctl protections.
      - name: Permit the locked Chromium sandbox on this runner
        if: matrix.shard == 'browser' || matrix.shard == 'security'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
        run: |
          set -euo pipefail
          node scripts/ci-chromium-userns.ts > "$RUNNER_TEMP/lolly-ci-chromium.profile"
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/lolly-ci-chromium.profile" /etc/apparmor.d/lolly-ci-chromium
          sudo apparmor_parser -r /etc/apparmor.d/lolly-ci-chromium
          mkdir -p artifacts
          cp "$RUNNER_TEMP/lolly-ci-chromium.profile" artifacts/ci-chromium-userns.profile

      # Every browser partition runs the WebGPU check: it also exports the
      # software adapter and the required flag that the later browser steps use.
      # The geometry and drawing conformance runs below do not depend on a
      # partition's test files, so each runs in one partition, not in every one.
      # Their measured time is `partitionDutyMs` in
      # scripts/data/browser-test-durations.json, so the partitions that run
      # them are given fewer test files and all eight finish together.
      - name: Require WebGPU conformance
        if: matrix.shard == 'browser'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
          LOLLY_BROWSER_CHANNEL: chromium
          LOLLY_WEBGPU_TEST_ADAPTER: swiftshader
          LOLLY_WEBGPU_REPORT: artifacts/webgpu-lut-report.json
        run: |
          mkdir -p artifacts
          echo 'LOLLY_WEBGPU_TEST_ADAPTER=swiftshader' >> "$GITHUB_ENV"
          echo 'LOLLY_WEBGPU_REQUIRED=1' >> "$GITHUB_ENV"
          pnpm run test:webgpu

      - name: Require geometry conformance
        if: matrix.shard == 'browser' && matrix.partition == '1/8'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
          LOLLY_BROWSER_CHANNEL: chromium
          LOLLY_GEOMETRY_FIT_REPORT: artifacts/geometry-fit-report.json
          LOLLY_GEOMETRY_PORTABLE_REPORT: artifacts/geometry-portable-report.json
          LOLLY_GEOMETRY_CLIP_REPORT: artifacts/geometry-clip-report.json
          LOLLY_GEOMETRY_SCOPE_REPORT: artifacts/geometry-scope-report.json
          LOLLY_GEOMETRY_HOST_REPORT: artifacts/geometry-host-report.json
        run: pnpm run test:geometry

      # The Firefox and WebKit builds Playwright downloads (about 190 MB) come
      # from this cache, keyed by the exact revisions playwright-core pins, so
      # `playwright install` below downloads them only when Playwright moves.
      - name: Cache Firefox and WebKit (browser 2/8)
        if: matrix.shard == 'browser' && matrix.partition == '2/8'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .browsers/firefox-*
            .browsers/webkit-*
          key: playwright-firefox-webkit-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}

      # WebKit's system libraries are not on the runner image: install-deps adds
      # about 200 packages (93 MB, GStreamer, GTK 4 and libav), so they still come
      # from apt. A healthy run of this step takes 23 to 30 seconds. The image
      # already drops an idle mirror connection after 15 seconds, but on
      # 2026-10-23 the Azure mirror kept trickling data, so one attempt held the
      # step until its 600-second command limit. Each attempt is now bounded at a
      # few minutes, and every retry puts archive.ubuntu.com ahead of the Azure
      # mirror in the image's own failover list (/etc/apt/apt-mirrors.txt, lowest
      # priority first). Packages an earlier attempt finished stay in apt's cache.
      - name: Install Firefox and WebKit for geometry qualification
        if: matrix.shard == 'browser' && matrix.partition == '2/8'
        timeout-minutes: 15
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
        run: |
          node_bin="$(command -v node)"
          for attempt in 1 2 3 4; do
            if [ "$attempt" -gt 1 ]; then
              sudo timeout -k 10 120 dpkg --configure -a || true
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' |
                  sudo tee /etc/apt/apt-mirrors.txt > /dev/null
              fi
            fi
            if sudo timeout -k 15 90 apt-get update &&
              sudo timeout -k 15 180 "$node_bin" node_modules/playwright/cli.js install-deps firefox webkit &&
              timeout -k 15 180 "$node_bin" node_modules/playwright/cli.js install firefox webkit; then exit 0; fi
            echo "::warning::Firefox and WebKit install attempt $attempt failed or stalled"
            sleep 10
          done
          exit 1

      - name: Require one geometry answer in Chromium, Firefox and WebKit
        if: matrix.shard == 'browser' && matrix.partition == '2/8'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
          LOLLY_BROWSER_CHANNEL: chromium
        run: pnpm run test:geometry:engines --output=artifacts/geometry-engines

      # Motion inspection (packages/node-shell/src/motion-inspect.ts) and its
      # tests need ffmpeg and ffprobe with the libvpx VP9, libx264, libopus and AAC
      # encoders, the VP9, H.264 and AV1 decoders, and the blackdetect,
      # freezedetect, ebur128, silencedetect, ashowinfo and drawbox filters. A
      # pinned static build replaces the apt package, whose mirror downloads
      # stalled until the 25-minute step limit. It needs only glibc 2.28 and
      # libgcc_s. BtbN keeps the last build of each month for two years, so the
      # pin is a month-end build. Only these two shards get ffmpeg, as before:
      # unit:engine expects its ffmpeg cases to skip (tests/expected-skips.json).
      - name: Cache ffmpeg (browser and contracts shards)
        if: matrix.shard == 'browser' || matrix.shard == 'contracts'
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ffmpeg
          key: ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269

      - name: Install pinned ffmpeg (browser and contracts shards)
        if: (matrix.shard == 'browser' || matrix.shard == 'contracts') && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          FFMPEG_RELEASE: autobuild-2026-09-30-13-08
          FFMPEG_BUILD: ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0
          FFMPEG_LINUX_X64_SHA256: '68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 15 --max-time 180 --output "$archive" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/${FFMPEG_BUILD}.tar.xz"
          echo "$FFMPEG_LINUX_X64_SHA256  $archive" | sha256sum --check
          mkdir -p ~/.cache/ffmpeg
          tar -xJf "$archive" -C ~/.cache/ffmpeg --strip-components=2 "${FFMPEG_BUILD}/bin/ffmpeg" "${FFMPEG_BUILD}/bin/ffprobe"
          rm -f "$archive"

      # Runs on a cache hit too: the binaries must match the verified release
      # before anything executes them, and must still do what the tests need.
      - name: Check ffmpeg and put it on PATH (browser and contracts shards)
        if: matrix.shard == 'browser' || matrix.shard == 'contracts'
        timeout-minutes: 5
        env:
          FFMPEG_BIN_SHA256: '0d709a0bed1a43f24cd2c420878c63afea4580671b6949ad19ed124572f3bc3d'
          FFPROBE_BIN_SHA256: 'a5bd5e9f8d74ab2c6d7d9e2e2738ff6d67bf9613e7143e143ba8ebe9b06385fb'
        run: |
          set -euo pipefail
          ff="$HOME/.cache/ffmpeg"
          printf '%s  %s\n%s  %s\n' "$FFMPEG_BIN_SHA256" "$ff/ffmpeg" "$FFPROBE_BIN_SHA256" "$ff/ffprobe" | sha256sum --check
          "$ff/ffmpeg" -hide_banner -version | sed -n 1p
          "$ff/ffprobe" -hide_banner -version | sed -n 1p
          listed() { "$ff/ffmpeg" -hide_banner "-$1" 2>/dev/null | awk -v want="$2" '$2 == want { found = 1 } END { exit !found }'; }
          for name in libvpx-vp9 libx264 libopus aac; do listed encoders "$name" || { echo "::error::ffmpeg has no $name encoder"; exit 1; }; done
          for name in vp8 vp9 h264 hevc libdav1d opus aac; do listed decoders "$name" || { echo "::error::ffmpeg has no $name decoder"; exit 1; }; done
          for name in blackdetect freezedetect ebur128 silencedetect ashowinfo drawbox atrim asetpts color anullsrc; do
            listed filters "$name" || { echo "::error::ffmpeg has no $name filter"; exit 1; }
          done
          # Encode what the fixtures encode, then run the inspection filter chain on it.
          work="$RUNNER_TEMP/ffmpeg-check"; mkdir -p "$work"
          inputs=(-f lavfi -i color=red:s=160x120:r=24:d=1 -f lavfi -i anullsrc=r=48000:cl=stereo -t 1)
          "$ff/ffmpeg" -hide_banner -v error -nostdin "${inputs[@]}" -c:v libvpx-vp9 -lossless 1 -c:a libopus -y "$work/check.webm"
          "$ff/ffmpeg" -hide_banner -v error -nostdin "${inputs[@]}" -c:v libx264 -pix_fmt yuv420p -c:a aac -y "$work/check.mp4"
          for file in "$work/check.webm" "$work/check.mp4"; do
            "$ff/ffprobe" -v error -protocol_whitelist file,pipe -show_streams -show_format -of json "$file" > /dev/null
            "$ff/ffmpeg" -hide_banner -nostdin -protocol_whitelist file,pipe -i "$file" \
              -vf 'blackdetect=d=0.5:pix_th=0.03,freezedetect=n=-50dB:d=1' \
              -af 'ashowinfo,ebur128=peak=true,silencedetect=n=-50dB:d=1' -f null - 2> "$work/analysis.log"
            grep -q 'Integrated loudness' "$work/analysis.log" || { echo "::error::ffmpeg printed no loudness summary for $(basename "$file")"; exit 1; }
          done
          rm -rf "$work"
          echo "$ff" >> "$GITHUB_PATH"

      - name: Install reference proxies for actual HTTP checks
        if: matrix.shard == 'unit:engine'
        timeout-minutes: 10
        env:
          CADDY_VERSION: '2.11.7'
          CADDY_LINUX_AMD64_SHA256: 727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lolly-reference-caddy.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$CADDY_LINUX_AMD64_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/lolly-reference-proxies"
          tar -xzf "$archive" -C "$RUNNER_TEMP/lolly-reference-proxies" caddy
          "$RUNNER_TEMP/lolly-reference-proxies/caddy" version
          echo "$RUNNER_TEMP/lolly-reference-proxies" >> "$GITHUB_PATH"
          if ! command -v nginx >/dev/null; then
            for attempt in 1 2 3 4; do
              if [ "$attempt" -gt 1 ]; then
                sudo timeout -k 10 120 dpkg --configure -a || true
                if [ -f /etc/apt/apt-mirrors.txt ]; then
                  printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' |
                    sudo tee /etc/apt/apt-mirrors.txt > /dev/null
                fi
              fi
              if sudo timeout -k 15 90 apt-get update &&
                sudo timeout -k 15 180 apt-get install -y --no-install-recommends nginx; then break; fi
              echo "::warning::nginx install attempt $attempt failed or stalled"
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep 10
            done
          fi
          nginx -v

      - name: Install PDF production inspection tools
        if: matrix.shard == 'unit:engine' || matrix.shard == 'browser'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3 4; do
            if [ "$attempt" -gt 1 ]; then
              sudo timeout -k 10 120 dpkg --configure -a || true
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' |
                  sudo tee /etc/apt/apt-mirrors.txt > /dev/null
              fi
            fi
            if sudo timeout -k 15 90 apt-get update &&
              sudo timeout -k 15 180 apt-get install -y --no-install-recommends poppler-utils; then exit 0; fi
            echo "::warning::Poppler install attempt $attempt failed or stalled"
            sleep 10
          done
          exit 1

      - name: Require drawing fidelity against the Design renderer
        if: matrix.shard == 'browser' && matrix.partition == '3/8'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
          LOLLY_FIDELITY_REPORT: artifacts/drawing-fidelity-report.json
          # The PDF half rasterises with Poppler, installed by the step above.
          LOLLY_FIDELITY_PDF_REQUIRED: '1'
        run: pnpm run test:drawing

      - name: Start public shell for journey regressions
        if: matrix.shard == 'browser'
        run: |
          mkdir -p artifacts
          # Source-level journeys import Vite modules; production render drivers
          # use a separate compiled shell so they do not compile that graph.
          LOLLY_PROFILE=lolly-start pnpm run build:web > artifacts/public-journey-build.log 2>&1
          LOLLY_PROFILE=lolly-start pnpm --dir shells/web dev --host 127.0.0.1 --port 4187 --strictPort > artifacts/public-journey-shell.log 2>&1 &
          LOLLY_PROFILE=lolly-start pnpm --dir shells/web preview --host 127.0.0.1 --port 4188 --strictPort > artifacts/public-render-shell.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4187/src/bridge/index.ts > /dev/null && curl --silent --fail http://127.0.0.1:4188/ > /dev/null; then
              echo 'LOLLY_IMPORT_TEST_URL=http://127.0.0.1:4187' >> "$GITHUB_ENV"
              echo 'LOLLY_EXPORT_TEST_URL=http://127.0.0.1:4187' >> "$GITHUB_ENV"
              # Deep-link journeys import source modules, so they need the dev server.
              echo 'LOLLY_DEEP_LINK_TEST_URL=http://127.0.0.1:4187' >> "$GITHUB_ENV"
              echo 'LOLLY_WEB_BASE=http://127.0.0.1:4188' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat artifacts/public-journey-shell.log
          cat artifacts/public-render-shell.log
          exit 1

      - name: Warm source and production Design shells
        if: matrix.shard == 'browser'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
          LOLLY_BROWSER_CHANNEL: chromium
        run: |
          node --import ./tests/browser-gpu.ts --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, channel: 'chromium' });
          try {
            for (const base of [process.env.LOLLY_EXPORT_TEST_URL, process.env.LOLLY_WEB_BASE]) {
              const context = await browser.newContext({ serviceWorkers: 'block' });
              try {
                const page = await context.newPage();
                await page.goto(base + '/#/tool/design', { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForFunction(() => !!window.lolly?.document && !!document.querySelector('#tool-canvas'), undefined, { timeout: 120000 });
                await page.locator('dialog.view-loading[open]').waitFor({ state: 'hidden', timeout: 120000 });
              } finally { await context.close(); }
            }
          } finally { await browser.close(); }
          JS

      # Entry-point feature tests run first in their assigned required partition.
      # Every runner still warms both shells above and checks its GPU/renderer;
      # the three complete feature files are no longer repeated on all runners.

      - name: Install Rust toolchain (Tauri shard)
        if: matrix.shard == 'tauri'
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-08-04

      - name: Compile the pinned font subset adapter
        if: matrix.shard == 'tauri'
        timeout-minutes: 10
        working-directory: packages/node-shell/wasm/skera
        run: cargo check --locked --target wasm32-unknown-unknown

      - name: Install Tauri system libraries
        if: matrix.shard == 'tauri'
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3 4; do
            if [ "$attempt" -gt 1 ]; then
              sudo timeout -k 10 120 dpkg --configure -a || true
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' |
                  sudo tee /etc/apt/apt-mirrors.txt > /dev/null
              fi
            fi
            if sudo timeout -k 15 90 apt-get update &&
              sudo timeout -k 15 180 apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
                libayatana-appindicator3-dev libssl-dev; then exit 0; fi
            echo "::warning::Tauri system libraries install attempt $attempt failed or stalled"
            sleep 10
          done
          exit 1

      # Conformance binaries - the C2PA/PDF conformance tests (tests/c2pa-c2patool-
      # conformance.test.ts + gated cases in c2pa.test.ts / c2pa-formats.test.ts)
      # skip silently when qpdf/c2patool aren't on PATH. Install both so they run.
      - name: Install qpdf (PDF conformance checks)
        if: matrix.shard == 'conformance'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3 4; do
            if [ "$attempt" -gt 1 ]; then
              sudo timeout -k 10 120 dpkg --configure -a || true
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' |
                  sudo tee /etc/apt/apt-mirrors.txt > /dev/null
              fi
            fi
            if sudo timeout -k 15 90 apt-get update &&
              sudo timeout -k 15 180 apt-get install -y --no-install-recommends qpdf; then exit 0; fi
            echo "::warning::qpdf install attempt $attempt failed or stalled"
            sleep 10
          done
          exit 1

      - name: Cache c2patool
        if: matrix.shard == 'conformance'
        id: c2patool-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/c2patool
          key: c2patool-v0.26.70-x86_64-unknown-linux-gnu-7ad4d0958ca9f930b8048cc36f937f4203ba5335b1e726b0982a6e7f604942aa

      - name: Install c2patool (C2PA conformance checks)
        if: matrix.shard == 'conformance' && steps.c2patool-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          C2PATOOL_LINUX_X64_SHA256: '7ad4d0958ca9f930b8048cc36f937f4203ba5335b1e726b0982a6e7f604942aa'
        run: |
          curl -fsSL -o /tmp/c2patool.tar.gz \
            "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v0.26.70/c2patool-v0.26.70-x86_64-unknown-linux-gnu.tar.gz"
          echo "$C2PATOOL_LINUX_X64_SHA256  /tmp/c2patool.tar.gz" | sha256sum --check
          tar -xzf /tmp/c2patool.tar.gz -C /tmp
          mkdir -p ~/.cache/c2patool
          install -m 0755 /tmp/c2patool/c2patool ~/.cache/c2patool/c2patool

      - name: Put c2patool on PATH
        if: matrix.shard == 'conformance'
        run: |
          echo "$HOME/.cache/c2patool" >> "$GITHUB_PATH"
          "$HOME/.cache/c2patool/c2patool" --version

      - name: Run required test shard
        env:
          LOLLY_SKIP_REPORT: artifacts/test-skips.json
          LOLLY_TEST_COVERAGE_REPORT: ${{ matrix.partition && 'artifacts/browser-coverage.json' || '' }}
          LOLLY_DESIGN_GPU_REPORT: ${{ matrix.shard == 'browser' && 'artifacts/design-gpu-p3f-report.json' || '' }}
          LOLLY_DESIGN_GPU_FILL_REPORT: ${{ matrix.shard == 'browser' && 'artifacts/design-gpu-fills-report.json' || '' }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
          # Software rendering and video/JXL encoding use several threads per file.
          # Keep timed browser workloads serial on this shared CPU/GPU runner.
          LOLLY_TEST_CONCURRENCY: ${{ matrix.shard == 'browser' && '1' || '' }}
          LOLLY_TIER_B_DEBUG: ${{ matrix.shard == 'browser' && '1' || '' }}
          # Use the installed full Chromium for the same file and storage paths as Chrome.
          LOLLY_BROWSER_CHANNEL: ${{ matrix.shard == 'browser' && 'chromium' || '' }}
          LOLLY_WEBGPU_TEST_ADAPTER: ${{ (matrix.shard == 'browser' || matrix.shard == 'security') && 'swiftshader' || '' }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          pnpm run "test:${{ matrix.shard }}" ${{ matrix.partition && format('--partition={0}', matrix.partition) || '' }} 2>&1 | tee test-output.log

      # Every skip is reviewed by file, full parent-chain name, reason,
      # capability and owner. A replacement skip fails even when the count stays
      # unchanged, and a stale expected skip fails so the manifest ratchets down.
      - name: Skipped tests must match exact CI identities
        if: always()
        run: |
          echo "--- failing tests (first 50) ---"
          sed $'s/\x1b\[[0-9;]*m//g' test-output.log \
            | grep -E '^(not ok|✖|✗)' | head -50 || true
          test -f artifacts/test-skips.json
          if [ "${{ matrix.shard }}" = browser ]; then
            node scripts/check-browser-partitions.ts --reports-dir=artifacts --source="$GITHUB_SHA" --partition="${{ matrix.partition }}"
          else
            pnpm run check:skip-identities --report=artifacts/test-skips.json --shard="${{ matrix.shard }}"
          fi

      - name: Upload exact skip report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-skips-${{ matrix.artifact }}-${{ github.run_id }}
          path: |
            artifacts/test-skips.json
            artifacts/browser-coverage.json
            artifacts/public-journey-shell.log
            artifacts/public-render-shell.log
            artifacts/public-journey-build.log
            artifacts/geometry-fit-report.json
            artifacts/geometry-portable-report.json
            artifacts/geometry-clip-report.json
            artifacts/geometry-scope-report.json
            artifacts/geometry-host-report.json
            artifacts/geometry-engines/
            artifacts/drawing-fidelity-report.json
            artifacts/design-gpu-p3f-report.json
            artifacts/design-gpu-fills-report.json
            lolly-tier-b-debug-*.log
            plans/artifacts/browser-journeys/
          if-no-files-found: error

  test:
    name: ${{ matrix.partition && format('test (browser {0})', matrix.partition) || format('test ({0})', matrix.shard) }}
    # Keep these initial fast jobs ahead of the large matrix in the runner queue.
    # Full coverage still runs if a fast check fails.
    needs: [deployment-scope, public-ready-ui]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    # Per shard, in minutes. Passing runs take about 15 (unit:engine) and 11
    # (unit:web) at the 90th percentile. Four browser partitions took 21 to 33
    # each; with eight, the tests in each take about 12.
    # A shard that installs packages adds those step limits: a browser
    # partition allows 20 (Chromium) + 5 + 5 (ffmpeg and its check) + 10
    # (Poppler) for its installs, plus 15 for Firefox and WebKit in partition 2,
    # 23 for its tests and conformance steps and 7 for checkout, with 5 to spare.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # The shard list lives in the deployment-scope job ("Select the test
      # shards for this scope"): the light shards always, plus the heavy tier
      # unless a docs-and-tests pull request leaves it out. Leaving a matrix
      # entry out, rather than skipping a matrix job, keeps every reported job
      # name exact.
      matrix:
        include: ${{ fromJSON(needs.deployment-scope.outputs.test-shards) }}
    steps: *ci-test-steps

  browser-gate:
    name: test (browser)
    needs: [deployment-scope, test]
    # Skipped only when the trusted scope left the browser partitions out.
    if: ${{ !cancelled() && needs.deployment-scope.outputs.heavy-tier != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Every required test partition must succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      # Takes the newest report of each partition in this run, so after "Re-run
      # failed jobs" a re-run partition replaces its failed report and a
      # carried-over partition keeps the report it uploaded earlier.
      - name: Download the newest report of every browser partition in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: test-skips-browser-*-${{ github.run_id }}
          path: artifacts/browser-reports
          merge-multiple: false

      - name: Browser coverage and exact reviewed skips must match
        run: node scripts/check-browser-partitions.ts --reports-dir=artifacts/browser-reports --source="$GITHUB_SHA"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (workspaces)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # bridge-overrides/ is the whole application-specific surface of both Tauri
      # shells, and those shells are deliberately NOT pnpm workspaces, so `pnpm install --frozen-lockfile`
      # above does not create their node_modules and the @tauri-apps types their
      # overrides import would not resolve. Install them here - production deps
      # only, since the types are all the typecheck needs and --prod skips the
      # Tauri CLI and Vite. Without this, typecheck:tauri SKIPS (by design, so a
      # plain clone is not punished) and the --strict step below fails loudly
      # rather than letting the gate quietly become a no-op.
      - name: Install (Tauri shells - types only, not pnpm workspaces)
        timeout-minutes: 10
        run: |
          pnpm -C shells/tauri-desktop install --frozen-lockfile --prod
          pnpm -C shells/tauri-mobile install --frozen-lockfile --prod

      - name: Typecheck (tsc -p, every project)
        run: pnpm run typecheck

      - name: Typecheck must not have skipped the Tauri shells
        run: pnpm run typecheck:tauri --strict

      # engine/README.md's module table is generated from the tree. Every merge
      # moves its line counts, so a pull request no longer regenerates it: drift
      # is a warning here, and generated-readmes.yml regenerates the table after
      # each merge and proposes it as one bot pull request. Missing markers or a
      # failing generator still fail this step.
      - name: Engine module map builds (drift is regenerated after merge)
        run: node scripts/gen-engine-modules.ts --check --allow-drift

      # packages/rondo/generated/ is built from the vendored upstream by esbuild.
      # Rebuilding must be a no-op, so a patch or an upstream bump always lands
      # with the bundles that the web worker, the CLI and MCP actually run.
      - name: Rondocode bundles drift (stale? rerun build:rondo)
        run: pnpm run check:rondo

      # The Rondocode utility's editor (community/rondocode/lib/editor.html) is
      # built from the same patched tree plus Lolly's frame glue.
      - name: Rondocode editor drift (stale? rerun build:rondo-editor)
        run: pnpm run check:rondo-editor

      # The engine must stay free of DOM, storage and network access: that is
      # what lets one tool render unchanged in the browser, Tauri and the CLI.
      # engine/tsconfig.json has to include the DOM lib for the fetch-spec
      # globals, so the compiler cannot enforce this. This step does.
      - name: Engine purity (no DOM/storage/network in engine/src)
        run: pnpm run check:engine-purity

      # docs/build.ts's `pages` array is hand-maintained and the /info nav derives
      # from it, so a .md could be written and committed while staying unreachable
      # from the site - docs/ios-build.md was exactly that. Every docs/*.md must now
      # be a registered page or a declared exception (see NOT_PAGES in the script).
      - name: Docs nav completeness (no orphaned docs/*.md)
        run: pnpm run check:docs-nav

      # shells/web/src/README.md opens with per-directory and largest-file stats
      # that a new contributor uses to decide where to look. They are generated,
      # and every web merge moves them, so committing them in each pull request
      # made every open web pull request conflict with the next merge. Drift is a
      # warning here; generated-readmes.yml regenerates the stats after each merge.
      # Missing markers or a failing generator still fail this step.
      - name: Web shell code-map stats build (drift is regenerated after merge)
        run: node scripts/gen-web-src-readme.ts --check --allow-drift

      # The browser shell legitimately owns far more code than CLI. This gate is
      # about concentration inside individual modules, not cross-shell parity.
      - name: Web shell maintainability no-growth ratchet
        run: pnpm run check:maintainability

      # The shell's CSS house rules: no rail on a rounded element, dashed only for
      # drop areas, durations from the motion tokens, both Reduce motion switches
      # on anything that moves and no custom property that nothing defines. A
      # per-file ratchet: counts only go down.
      - name: CSS house rules ratchet
        run: pnpm run check:house-rules

      - name: No new first-party Biome diagnostics
        run: pnpm run lint:changed --all

      - name: Repository and release inventory closure
        run: pnpm run check:release-checklist && pnpm run check:host-v1-api

      - name: Locale innerHTML markup allowlist
        run: pnpm run check:locale-markup

      - name: Parser inventory fuzz coverage and waiver expiry
        run: pnpm run check:parser-inventory && pnpm run check:parser-assurance

  validate-catalog:
    name: validate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (workspaces)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Validate catalog (no manifest/index drift, asset checksums)
        run: pnpm run validate:catalog

      # The public demo brand (Lolly Demo) is a plain directory too, so a public clone can
      # validate it; the plain step above only sees the lolly-start fallback.
      - name: Validate the lolly-demo catalog
        run: node scripts/validate-catalog.ts --profile=lolly-demo

  # Catalog-wide render gate - `lolly smoke` renders every tool in the active profile
  # at manifest defaults (sequential, browser-free: first Node-native format, html as
  # the layout fallback) and exits non-zero on any failed render. CI checks out the
  # public submodules only (brands/suse is `update = none`), so postinstall builds the
  # lolly-start fallback profile - the community tools are what gets smoked here; a
  # SUSE-profile smoke is a local/`loldev` concern.
  smoke:
    name: smoke (render every tool)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (workspaces)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Smoke-render the catalog (headless, no browser)
        run: pnpm run smoke

  instance-shell:
    name: verified instance shell
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'instance-release')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOLLY_PROFILE: lolly-start
      LOLLY_RELEASE_BUILD: '1'
      VITE_CATALOG_TRUST_MODE: verified
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.LOLLY_RELEASE_PUBLIC_KEY_JWK }}
      VITE_REQUIRE_AI_POLICY: 'true'
      VITE_LIVE_RELAY: https://lolly.ing/live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
      # This job builds the creative web shell in release mode, and that shell
      # requires WebGPU. Its explicit web scope requires published browser
      # qualification; the packaged apps retain the default full matrix hold.
      - name: Check browser qualification for the web-only instance shell
        run: node scripts/webgpu-release-gate.ts --scope web
      - name: Install frozen dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Build and verify the committed signed catalog
        run: |
          pnpm run build:web
          node scripts/verify-release-catalog.ts --root shells/web/dist
          pnpm run check:bundle
          pnpm run check:docs-size
      - name: Package the qualified shell
        run: |
          mkdir -p artifacts/instance-shell
          tar -czf artifacts/instance-shell/shell.tar.gz -C shells/web/dist .
          cd artifacts/instance-shell
          sha256sum shell.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-instance-shell-${{ github.sha }}
          path: artifacts/instance-shell/
          retention-days: 7
          compression-level: 0

  build:
    name: build + bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (workspaces)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Production build (info site + OG cards + web shell)
        run: pnpm run build:web

      - name: Bundle budget (boot-path JS ≤ 115 KB gz, no heavy chunks preloaded)
        run: pnpm run check:bundle

      - name: Docs size budget (/info ≤ 160 MB gz - every locale ships, chrome must not multiply)
        run: pnpm run check:docs-size

  # The committed api/ function bundles (api/mcp/[...path].js, api/ca/[...path].js,
  # api/penpot/[...path].js, api/mcp/_rondo-worker.js) are GENERATED by esbuild
  # (scripts/build-{mcp,ca,penpot}-fn.ts) and checked in so Vercel sees them at
  # function-detection time; vercel.json's buildCommand rebuilds them from source
  # before any deploy. scripts/check-api-bundles.ts compares them with a fresh
  # build. A main push is strict: drift fails this job, so that commit never
  # qualifies and nothing that needs a successful main push run can take it. A
  # pull request fails only when it changes what the bundles are built from;
  # drift left by earlier merges is a warning, and generated-readmes.yml proposes
  # the rebuilt bundles after each merge.
  api-bundles:
    name: api bundle drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          # The merge commit and its base parent, so the check can list the pull request's own changes.
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (workspaces)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Rebuild the api/ function bundles
        run: pnpm run build:mcp-fn && pnpm run build:ca-fn && pnpm run build:penpot-fn

      - name: No drift (strict on main; a pull request answers for its own inputs)
        run: node scripts/check-api-bundles.ts

  # Self-test of the in-tree composite action (action/ - ready to split into
  # lolly-tools/render-action, plans/48-fable-new-potential.md section 5.4). Exercises the
  # real consumer path end-to-end: the action checks out lolly at THIS commit,
  # pnpm install --frozen-lockfile builds the lolly-start fallback profile, and qr-code renders to SVG
  # browser-free (Tier A) - so the action stays green before the split.
  render-action:
    name: render-action self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No submodules: this job only needs action/ itself - the action performs
      # its own pinned lolly checkout into a work dir.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Action input boundary tests
        run: node --test action/test/*.test.mjs

      - name: Render qr-code via the composite action (svg, no browser)
        id: render
        uses: ./action
        with:
          tool: qr-code
          args-json: '["--url=https://lolly.tools"]'
          format: svg
          lolly-ref: ${{ github.sha }}

      - name: Assert the render landed and the outputs are wired
        env:
          OUT_DIR: ${{ steps.render.outputs.out-dir }}
          FILES: ${{ steps.render.outputs.files }}
        run: |
          test -s "$OUT_DIR/qr-code.svg"
          grep -q '<svg' "$OUT_DIR/qr-code.svg"
          [ "$FILES" = "qr-code.svg" ]
          echo "rendered: $FILES → $OUT_DIR"

  # Dependency vulnerabilities - fail on any HIGH or CRITICAL advisory so a new
  # vulnerable dep can't land silently (readiness for the security audit). Moderate/
  # low are surfaced but don't block. A false alarm can be pinned via package.json
  # `overrides` (as adm-zip is, forced to ^0.6.0 past onnxruntime-node's ^0.5.16).
  #
  # Most advisories clear with `npm update --pnpm-lock.yaml-only <pkg>`, because the
  # fixed version already satisfies the range its parent declares - no package.json
  # edit, no `npm audit fix --force`, which is never the answer here. An override is
  # for the other case: the parent's declared range EXCLUDES the fix. Two live now,
  # both scoped as narrowly as the syntax allows:
  #   - ip-address ^10.3.1 / nanoid ^3.3.17 - floors, not pins. Both were already
  #     satisfiable (express-rate-limit wants ^10.2.0, postcss wants ^3.3.16); the
  #     entries stop a future resolve from walking back under the advisory.
  #   - @huggingface/transformers > sharp: "$sharp" - transformers pins sharp
  #     ^0.34.1 and every published version of it still does, including 4.x, so
  #     upgrading transformers does NOT clear GHSA-f88m-g3jw-g9cj. `$sharp` reuses
  #     the root's own sharp spec, which keeps ONE sharp (and one libvips binary)
  #     in the tree instead of two. Verified against transformers' actual sharp
  #     usage: it calls metadata/rotate/raw/toBuffer/affine/resize/extract, none of
  #     the APIs 0.35.0 removed (failOnError, paletteBitDepth, jp2k, sharpen opts).
  #     Revisit when transformers widens its range - then this can just go.
  #
  # Cargo has no override for that case. A RustSec advisory with no published fix
  # is held back only by an approved `advisoryExceptions` entry on its root in
  # security/dependency-roots.json (see SECURITY.md, "Dependency audit
  # exceptions"). audit:all ignores those ids for that lockfile alone and fails,
  # in both steps below, once the lockfile shows the fix has resolved.
  #
  # When the advisory lookup runs: every main push, because release tooling
  # qualifies from the main push run, and every pull request whose trusted scope
  # (read from the base commit, like the test lane) changes a manifest, lockfile,
  # resolver setting or the audit policy. Other pull requests skip only the
  # lookup, so an advisory published upstream does not turn every open pull
  # request red; the inventory, SBOM, notices and licence-map gates below still
  # run on every pull request. dependency-audit.yml runs the same lookup nightly
  # and on every release tag. A missing scope keeps the lookup on.
  audit:
    name: npm audit (high+critical)
    needs: deployment-scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADVISORY_LOOKUP: ${{ github.event_name != 'pull_request' || needs.deployment-scope.outputs.dependency-change != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (workspaces)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # The release binary replaces a from-source `cargo install`, which took
      # minutes on every run. The statically linked musl build does not depend
      # on the runner's glibc. Verify the archive before executing anything.
      - name: Install pinned cargo-audit
        if: env.ADVISORY_LOOKUP == 'true'
        timeout-minutes: 5
        env:
          CARGO_AUDIT_VERSION: '0.22.2'
          CARGO_AUDIT_LINUX_X64_SHA256: '7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          bindir="$RUNNER_TEMP/cargo-audit-bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz"
          echo "$CARGO_AUDIT_LINUX_X64_SHA256  $archive" | sha256sum --check
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir" --strip-components=1 \
            "cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit"
          PATH="$bindir:$PATH" cargo audit --version
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Audit every npm and Cargo dependency root against current advisories
        if: env.ADVISORY_LOOKUP == 'true'
        run: pnpm run audit:all

      - name: Advisory lookup not needed for this pull request
        if: env.ADVISORY_LOOKUP != 'true'
        run: |
          echo "The trusted scope reports no manifest, lockfile or audit policy change, so the"
          echo "advisory lookup runs on the main push after merge, nightly and on release tags."

      - name: Dependency lock inventory stays complete
        if: always()
        run: pnpm run audit:all --check

      # The committed CycloneDX SBOM (sbom.cdx.json) is generated from pnpm-lock.yaml
      # (scripts/build-sbom.ts, deterministic). Regenerate + fail on drift so it can't go
      # stale vs the installed graph - same discipline as the api-bundles drift gate.
      #
      # One exception, and only one: Dependabot's own PRs. A bump changes a lockfile,
      # so the SBOM moves, but Dependabot commits nothing except the lockfile and
      # manifest - it cannot carry a regenerated artifact, and nobody can add one to
      # its branch without taking the PR over by hand. Failing here would park every
      # bump forever (or, worse, train us to merge red). So on a dependabot[bot] PR
      # the drift is reported as a warning and the job carries on; main repairs itself
      # straight after the merge via .github/workflows/sbom-refresh.yml, which
      # regenerates and commits sbom.cdx.json on push.
      #
      # For every other actor this is still a hard failure: a human who touches a
      # lockfile commits the regenerated SBOM alongside it, same as before.
      - name: SBOM up to date (regenerate; fail on drift, warn for Dependabot)
        env:
          SBOM_DRIFT_ADVISORY: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          pnpm run build:sbom
          if git diff --quiet -- sbom.cdx.json; then
            echo "sbom.cdx.json matches the dependency graph."
            exit 0
          fi
          git --no-pager diff --stat -- sbom.cdx.json
          if [ "$SBOM_DRIFT_ADVISORY" = 'true' ]; then
            echo "::warning title=SBOM drift (advisory for Dependabot)::sbom.cdx.json is stale for this bump. sbom-refresh.yml regenerates and commits it on main once this merges."
            exit 0
          fi
          echo "::error title=SBOM drift::sbom.cdx.json is stale. Run pnpm run build:sbom and commit the result."
          exit 1

      # Third-party notices are generated the same way (scripts/build-licenses.ts).
      # The generator itself EXITS 1 when a distributed direct dependency is missing
      # from its component list, so an attribution gap blocks here - and drift in
      # the committed outputs blocks on the diff, like the SBOM above.
      # (Both outputs are tracked by this repository since the fold, so one
      # pathspec covers them.)
      # Same Dependabot exception as the SBOM step above: a bump moves the notices,
      # the bot cannot carry the regenerated files, and sbom-refresh.yml rewrites
      # them on main after the merge. A missing attribution (the generator's own
      # exit 1) still fails for everyone.
      - name: Third-party notices complete + up to date (fail on gap or drift, warn for Dependabot)
        env:
          NOTICES_DRIFT_ADVISORY: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          pnpm run build:licenses
          if git diff --quiet -- THIRD-PARTY-NOTICES.md shells/web/public/THIRD-PARTY-LICENSES.txt; then
            echo "Third-party notices match the dependency graph."
            exit 0
          fi
          git --no-pager diff --stat -- THIRD-PARTY-NOTICES.md shells/web/public/THIRD-PARTY-LICENSES.txt
          if [ "$NOTICES_DRIFT_ADVISORY" = 'true' ]; then
            echo "::warning title=Notices drift (advisory for Dependabot)::the third-party notices are stale for this bump. sbom-refresh.yml regenerates and commits them on main once this merges."
            exit 0
          fi
          echo "::error title=Notices drift::THIRD-PARTY-NOTICES.md or THIRD-PARTY-LICENSES.txt is stale. Run pnpm run build:licenses and commit the result."
          exit 1

      # Rust crate licenses come from the committed security/cargo-licenses.json map, which
      # is generated by `cargo metadata` - and CI has no Rust toolchain, so unlike
      # the two gates above this artifact CANNOT be regenerated-and-diffed here.
      # That made it the one licence artifact a `cargo update` could silently
      # invalidate while the job still went green. Check COVERAGE instead: every
      # [[package]] in each shipped Cargo.lock must have a map entry. Needs only
      # the lockfiles (no cargo, no network), and because the hand-reviewed
      # license-file entries are version-pinned, a version bump on one fails here
      # rather than carrying a stale legal verdict forward.
      - name: Cargo license map covers the crate graph (fail on stale map)
        run: pnpm run check:cargo-licenses

  # Static analysis. Added after the SUSE assessment (2026-08, S4), which found
  # the repo had no SAST gate at all. Two deliberate design choices:
  #
  #   1. DIFF MODE, not full-tree. A full-tree gate fails on ~7,500 pre-existing
  #      findings and gets switched off within a week - the fate the advisory-only
  #      Biome baseline already documents (~3,000 findings, see CLAUDE.md). Only
  #      findings NEW in this PR block.
  #   2. The two rules producing 5,197 of those findings are excluded: this
  #      codebase uses English source strings AS i18n keys by design, and builds
  #      templated HTML with escaping at the boundary. Neither rule models it.
  #
  # The custom rules in .github/opengrep/ are the more valuable half: the one real
  # vulnerability in the assessment (a javascript: href that WAS escaped but not
  # scheme-checked) fired no upstream rule. Those run full-tree, not diff-only -
  # there is no backlog of them to grandfather in.
  sast:
    name: opengrep (custom rules + new findings)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Runs on PUSH as well as PR. It was PR-only, which sounds harmless until you
    # notice this repo commits straight to main - so the security gate never saw a
    # single one of the commits it was added to guard (SUSE assessment follow-up,
    # 2026-08-04). The Lolly rules below are full-tree and need no baseline, so
    # they work on either event; only the upstream diff step needs one, and it
    # takes the pushed range on a push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          # Full history so --baseline-commit can reach the merge base.
          fetch-depth: 0

      # Opengrep publishes NO PyPI package - `pipx install opengrep` cannot resolve
      # (verified 2026-08-04: "No matching distribution found"). The release ships a
      # self-contained binary per platform, so fetch that and pin the version.
      - name: Install Opengrep
        timeout-minutes: 5
        env:
          OPENGREP_VERSION: '1.26.0'
          OPENGREP_MANYLINUX_X86_SHA256: '40c21299eeddabf743b856daa843d24f9d4a027130671cd45b3b21776fd9ab26'
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$OPENGREP_VERSION" --repo opengrep/opengrep \
            --pattern opengrep_manylinux_x86 --output /usr/local/bin/opengrep
          echo "$OPENGREP_MANYLINUX_X86_SHA256  /usr/local/bin/opengrep" | sha256sum --check
          chmod +x /usr/local/bin/opengrep
          opengrep --version

      # Lolly's own rules - full-tree, blocking. No pre-existing backlog to absorb.
      #
      # `--no-git-ignore` is REQUIRED, not a preference: opengrep defaults to
      # scanning only files git tracks, and every shell lives in a SUBMODULE, so
      # from the parent repo their files are gitlinks rather than tracked paths.
      # Without it this step scanned 1 file and reported success - a gate that
      # silently does nothing, which is worse than no gate. Verified 2026-08-04:
      # 1 file with the default, ~1000 with this flag.
      #
      # That flag also stops honouring .gitignore, so the excludes below are what
      # keep node_modules/dist/vendored bundles out - and `.claude/worktrees`,
      # which holds throwaway agent copies of the whole shell whose stale source
      # would otherwise fail the build.
      - name: Lolly custom rules (full tree)
        run: |
          opengrep scan --error --no-git-ignore \
            --config .github/opengrep/lolly-rules.yml \
            --exclude node_modules --exclude dist --exclude '.claude' \
            --exclude vendor --exclude '*.min.js' --exclude '*.test.ts' \
            shells/ community/ brands/ engine/ packages/ services/ scripts/

      # Upstream packs are advisory (continue-on-error), NOT a gate. Three reasons,
      # all learned the hard way rather than assumed:
      #   - `--config p/<pack>` resolves over the network against a third-party
      #     registry opengrep is not affiliated with, so a gate would go red on
      #     someone else's outage or silently change meaning when a pack is edited.
      #   - The two rule ids the assessment named as the 5,197-finding noise are
      #     NOT present in these packs under those ids, so excluding them is a
      #     no-op and the real noise level here is unknown until it has run a few
      #     times. Blocking on an unmeasured backlog is how a gate gets deleted.
      #   - `checkout` with fetch-depth: 0 already has full history, so the base
      #     commit needs no extra fetch (the earlier `git fetch --depth=0` here was
      #     a fatal git error - 0 is not a valid depth - which would have failed
      #     the step before opengrep ever ran).
      # The blocking half of this job is the Lolly rules above. Promote this step
      # to blocking once its output has been read on real PRs and the exclusions
      # are grounded in ids that actually exist.
      # On a push the baseline is the previous head of the branch; on a PR it is the
      # merge base. A first push (all-zero `before`) has no baseline, so the step
      # scans nothing rather than the whole tree.
      - name: Upstream rules - new findings in this change (advisory)
        continue-on-error: true
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASELINE" ] || [ "$BASELINE" = "0000000000000000000000000000000000000000" ]; then
            echo "no baseline for this event - skipping the diff scan"; exit 0
          fi
          opengrep scan \
            --config p/typescript --config p/javascript --config p/security-audit \
            --baseline-commit "$BASELINE" \
            --exclude '*.test.ts' --exclude '*.test.js' \
            --exclude node_modules --exclude dist \
            --error . || true


  # Aggregators. Each one lists every job it requires in `needs:`, so it starts
  # only after those jobs finish and no runner sits polling the test matrix.
  # Each then reads the provider's record of the same run attempt once (with a
  # short retry while the API catches up), refuses any failed, cancelled or
  # unreviewed skipped job, and uploads its receipt. The receipts keep their
  # `<tier>-<runId>-<runAttempt>` names: lolly-work's shell request reads them.
  #
  # public-ready runs for an eligible UI change once the fast checks finish,
  # without waiting for the long test matrix.
  public-ready:
    name: public-ready
    needs: [deployment-scope, public-ready-ui, test-fast, secrets, typecheck, validate-catalog, smoke, build, sast]
    if: ${{ !cancelled() && needs.deployment-scope.result == 'success' && needs.deployment-scope.outputs.public-ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-scope-${{ github.run_id }}
          path: scope
      - name: Qualify exact attempt with trusted base policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git show "$CI_BASE_SHA:scripts/ci-qualification.ts" > "$RUNNER_TEMP/ci-qualification.ts"
          node "$RUNNER_TEMP/ci-qualification.ts" qualify public-ready scope/ci-scope.json artifacts/public-ready
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/public-ready/*.json
          if-no-files-found: error
          retention-days: 14

  # release-ready qualifies the full suite. A docs-and-tests pull request does
  # not run the full suite, so it skips this job and the qualification below
  # accepts that skip only for that lane.
  release-ready:
    name: release-ready
    needs: [deployment-scope, public-ready-ui, secrets, test-fast, test, browser-gate, typecheck, validate-catalog, smoke, instance-shell, build, api-bundles, render-action, audit, sast]
    if: ${{ always() && !cancelled() && needs.deployment-scope.outputs.heavy-tier != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful scope classification
        env:
          SCOPE_RESULT: ${{ needs.deployment-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-scope-${{ github.run_id }}
          path: scope
      - name: Qualify full suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          policy=scripts/ci-qualification.ts
          if git cat-file -e "$CI_BASE_SHA:scripts/ci-qualification.ts" 2>/dev/null; then
            git show "$CI_BASE_SHA:scripts/ci-qualification.ts" > "$RUNNER_TEMP/ci-qualification.ts"
            policy="$RUNNER_TEMP/ci-qualification.ts"
          fi
          node "$policy" qualify release-ready scope/ci-scope.json artifacts/release-ready
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-ready/*.json
          if-no-files-found: error
          retention-days: 14

  # Stable branch-protection check: the only required check on main. It needs
  # every other job, so it fails when any of them failed and never waits on a
  # runner. The tier comes from the trusted scope: release-ready for broad
  # changes and every main push, public-ready for an eligible UI change, and
  # docs-and-tests for a docs-and-tests pull request. In every tier a failed,
  # cancelled or unreviewed skipped job anywhere in the run refuses it. Keep
  # `always()` in its condition: without it a failed job would skip this one,
  # and GitHub counts a skipped required check as passing.
  qualification:
    name: qualification
    needs: [deployment-scope, public-ready-ui, test-fast, secrets, test, browser-gate, typecheck, validate-catalog, smoke, instance-shell, build, api-bundles, render-action, audit, sast, public-ready, release-ready]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful scope classification
        env:
          SCOPE_RESULT: ${{ needs.deployment-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-scope-${{ github.run_id }}
          path: scope
      - name: Require the selected exact-attempt aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          policy=scripts/ci-qualification.ts
          if git cat-file -e "$CI_BASE_SHA:scripts/ci-qualification.ts" 2>/dev/null; then
            git show "$CI_BASE_SHA:scripts/ci-qualification.ts" > "$RUNNER_TEMP/ci-qualification.ts"
            policy="$RUNNER_TEMP/ci-qualification.ts"
          fi
          node "$policy" gate auto scope/ci-scope.json artifacts/qualification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qualification/*.json
          if-no-files-found: error
          retention-days: 14
