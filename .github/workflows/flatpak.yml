# Build a Linux Flatpak of the Lolly desktop app.
#
# Flatpak is Linux-only and Tauri does not cross-compile, so this cannot be built on a
# developer's macOS machine - it runs here on `ubuntu-latest` instead. Packaging jobs:
#
#   1. build-deb  - build the Tauri desktop app into a .deb (needs network + the
#                   webkit2gtk toolchain; a normal runner, NOT the offline Flatpak
#                   sandbox). Uploads the .deb as an artifact.
#   2. flatpak    - inside the GNOME-50 flatpak-builder container, unpack that .deb via
#                   shells/tauri-desktop/flatpak/tools.lolly.Desktop.yml and export a
#                   single-file Lolly.flatpak bundle.
#
# Triggers on version tags (v*) and manual dispatch. A dispatch with the
# webgpu_qualification input builds for plan 295 P0b: unsigned, marked not for release.
# Review the pinned GNOME-50 container with `runtime-version: '50'` in the manifest.
name: Flatpak (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      webgpu_qualification:
        description: WebGPU qualification build (plan 295 P0b) - skips the release gate, unsigned, marked not for release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification) }}
    uses: ./.github/workflows/release-frontend.yml
    with:
      target: tauri-desktop
      platform: linux
      public_key_jwk: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
      connector_origins: ${{ vars.VITE_CONNECTOR_ORIGINS }}
      ca_enrollment_trust_json: ${{ vars.VITE_CA_ENROLLMENT_TRUST_JSON }}
    secrets:
      LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}

  build-deb:
    needs: frontend
    if: ${{ always() && !cancelled() && (needs.frontend.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification)) }}
    name: Build .deb (x86_64)
    runs-on: ubuntu-latest
    env:
      LOLLY_RELEASE_FRONTEND_PHASE: verified-artifact
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
      # A WebGPU qualification build (plan 295 P0b) only on a manual dispatch that asks for
      # one: scripts/build-release-web.ts then skips the release gate, signs nothing and
      # marks the frontend, and the step before upload marks the packages not for release.
      LOLLY_WEBGPU_QUALIFICATION_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive   # only brands/suse, and `update = none` skips it here

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm

      # A version tag is a release, and no release may ship the WebGPU startup
      # requirement before its supported-environment table is published (plan 295
      # P0b). This step refuses a tag early; the build step refuses every run the same
      # way (scripts/build-release-web.ts is the beforeBuildCommand), a manual dispatch
      # included, unless the dispatch asks for a WebGPU qualification build with the
      # webgpu_qualification input. That build is unsigned and marked not for release.
      - name: Refuse a release without the WebGPU supported-environment table
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/webgpu-release-gate.ts --scope linux

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-08-04

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shells/tauri-desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('shells/tauri-desktop/src-tauri/Cargo.lock') }}

      # Tauri v2 Linux system dependencies (Ubuntu 24.04 ships webkit2gtk-4.1).
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev \
            build-essential patchelf file

      # Root workspace deps power the shared web frontend (the desktop Vite build uses
      # shells/web as its root); the desktop package has its OWN lockfile (it is not a
      # root workspace member), so install it separately.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Install desktop shell deps
        working-directory: shells/tauri-desktop
        run: pnpm install --frozen-lockfile

      # Build the frontend, then bundle ONLY the .deb (skips AppImage/RPM tooling).
      # LOLLY_EMBED_CATALOG must be set for the whole STEP, not just the frontend
      # script. `tauri build` re-runs beforeBuildCommand (`pnpm run build:frontend`)
      # itself, so setting it only on an explicit build:frontend:profile call gets
      # silently undone - Tauri rebuilds dist/ in the default neutral mode and embeds
      # that. Neutral drops catalog/previews and og/ (plans/131 WP-A), giving a gallery
      # where every tile renders itself on first load. Every released artifact has been
      # a profile build, so a neutral one is quietly not the same package.
      # lolly-start is the public blank brand and safe to embed; suse is not, and
      # nothing here selects it.
      - name: Download signed source catalog
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-source-catalog-tauri-desktop
          path: brands/lolly-start/catalog/tools

      - name: Download signed frontend
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-frontend-tauri-desktop
          path: shells/tauri-desktop/dist

      - name: Build desktop .deb
        env:
          LOLLY_PROFILE: lolly-start
          LOLLY_EMBED_CATALOG: profile
          VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
        working-directory: shells/tauri-desktop
        run: pnpm run tauri build --bundles deb

      - name: Collect the .deb
        run: |
          set -e
          deb=$(find shells/tauri-desktop/src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          test -n "$deb" || { echo "::error::no .deb produced"; exit 1; }
          echo "Built: $deb"
          mkdir -p out && cp "$deb" out/

      - name: Mark a WebGPU qualification build as not for release
        if: env.LOLLY_WEBGPU_QUALIFICATION_BUILD == '1'
        run: node scripts/webgpu-qualification.ts mark out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lolly-deb
          path: |
            out/*.deb
            out/WEBGPU-QUALIFICATION-BUILD-NOT-FOR-RELEASE.txt
          if-no-files-found: error

      - name: Bundle AppImage from the same executable
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm -C shells/tauri-desktop run tauri bundle --bundles appimage

      - name: Mark a WebGPU qualification build as not for release
        if: env.LOLLY_WEBGPU_QUALIFICATION_BUILD == '1'
        run: node scripts/webgpu-qualification.ts mark shells/tauri-desktop/src-tauri/target/release/bundle/appimage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lolly-appimage
          path: |
            shells/tauri-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            shells/tauri-desktop/src-tauri/target/release/bundle/appimage/WEBGPU-QUALIFICATION-BUILD-NOT-FOR-RELEASE.txt
          if-no-files-found: error

  flatpak:
    name: Build .flatpak (x86_64)
    needs: build-deb
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive   # only brands/suse, and `update = none` skips it here

      # Stage the .deb next to the manifest as the stable name it references.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lolly-deb
          path: shells/tauri-desktop/flatpak
      - name: Stage .deb as lolly.deb
        run: mv shells/tauri-desktop/flatpak/*.deb shells/tauri-desktop/flatpak/lolly.deb

      # The 1.0.6 tag run bundled a 313 KB Flatpak: the artifact download had
      # reported a digest mismatch, the job carried on with a corrupt deb, `ar x`
      # extracted almost nothing, and flatpak-builder committed 2 MB of content
      # without a word. A packaged app is over 80 MB by construction (RELEASING.md),
      # so a small deb here is a broken input, never a small app.
      - name: Refuse a corrupt or truncated .deb
        run: |
          size=$(stat -c%s shells/tauri-desktop/flatpak/lolly.deb)
          echo "lolly.deb: $size bytes"
          test "$size" -gt 80000000 || { echo "::error::lolly.deb is $size bytes - the artifact download was corrupt or truncated; re-run the job"; exit 1; }
          ar t shells/tauri-desktop/flatpak/lolly.deb | grep -q '^data\.tar' || { echo "::error::lolly.deb has no data.tar member"; exit 1; }

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: Lolly.flatpak
          manifest-path: shells/tauri-desktop/flatpak/tools.lolly.Desktop.yml
          cache-key: flatpak-builder-${{ github.sha }}
