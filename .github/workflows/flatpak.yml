# Build a Linux Flatpak of the Lolly desktop app.
#
# Flatpak is Linux-only and Tauri does not cross-compile, so this cannot be built on a
# developer's macOS machine - it runs here on `ubuntu-latest` instead. Two jobs:
#
#   1. build-deb  - build the Tauri desktop app into a .deb (needs network + the
#                   webkit2gtk toolchain; a normal runner, NOT the offline Flatpak
#                   sandbox). Uploads the .deb as an artifact.
#   2. flatpak    - inside the GNOME-50 flatpak-builder container, unpack that .deb via
#                   shells/tauri-desktop/flatpak/tools.lolly.Desktop.yml and export a
#                   single-file Lolly.flatpak bundle.
#
# Triggers on version tags (v*) and manual dispatch. Keep the container tag (gnome-50)
# in lockstep with `runtime-version: '50'` in the manifest.
name: Flatpak (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build .deb (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive   # shells/* + workspace deps live in submodules now

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-08-04

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shells/tauri-desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('shells/tauri-desktop/src-tauri/Cargo.lock') }}

      # Tauri v2 Linux system dependencies (Ubuntu 24.04 ships webkit2gtk-4.1).
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev \
            build-essential patchelf file

      # Root workspace deps power the shared web frontend (the desktop Vite build uses
      # shells/web as its root); the desktop package has its OWN lockfile (it is not a
      # root workspace member), so install it separately.
      - name: Install workspace deps
        run: npm ci
      - name: Install desktop shell deps
        working-directory: shells/tauri-desktop
        run: npm ci

      # Build the frontend, then bundle ONLY the .deb (skips AppImage/RPM tooling).
      # LOLLY_EMBED_CATALOG must be set for the whole STEP, not just the frontend
      # script. `tauri build` re-runs beforeBuildCommand (`npm run build:frontend`)
      # itself, so setting it only on an explicit build:frontend:profile call gets
      # silently undone - Tauri rebuilds dist/ in the default neutral mode and embeds
      # that. Neutral drops catalog/previews and og/ (plans/131 WP-A), giving a gallery
      # where every tile renders itself on first load. Every released artifact has been
      # a profile build, so a neutral one is quietly not the same package.
      # lolly-start is the public blank brand and safe to embed; suse is not, and
      # nothing here selects it.
      - name: Build desktop .deb
        env:
          LOLLY_EMBED_CATALOG: profile
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}
          VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
        working-directory: shells/tauri-desktop
        run: npm run tauri -- build --bundles deb

      - name: Collect the .deb
        run: |
          set -e
          deb=$(find shells/tauri-desktop/src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          test -n "$deb" || { echo "::error::no .deb produced"; exit 1; }
          echo "Built: $deb"
          mkdir -p out && cp "$deb" out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lolly-deb
          path: out/*.deb
          if-no-files-found: error

  flatpak:
    name: Build .flatpak (x86_64)
    needs: build-deb
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive   # shells/* + workspace deps live in submodules now

      # Stage the .deb next to the manifest as the stable name it references.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lolly-deb
          path: shells/tauri-desktop/flatpak
      - name: Stage .deb as lolly.deb
        run: mv shells/tauri-desktop/flatpak/*.deb shells/tauri-desktop/flatpak/lolly.deb

      # The 1.0.6 tag run bundled a 313 KB Flatpak: the artifact download had
      # reported a digest mismatch, the job carried on with a corrupt deb, `ar x`
      # extracted almost nothing, and flatpak-builder committed 2 MB of content
      # without a word. A packaged app is over 80 MB by construction (RELEASING.md),
      # so a small deb here is a broken input, never a small app.
      - name: Refuse a corrupt or truncated .deb
        run: |
          size=$(stat -c%s shells/tauri-desktop/flatpak/lolly.deb)
          echo "lolly.deb: $size bytes"
          test "$size" -gt 80000000 || { echo "::error::lolly.deb is $size bytes - the artifact download was corrupt or truncated; re-run the job"; exit 1; }
          ar t shells/tauri-desktop/flatpak/lolly.deb | grep -q '^data\.tar' || { echo "::error::lolly.deb has no data.tar member"; exit 1; }

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: Lolly.flatpak
          manifest-path: shells/tauri-desktop/flatpak/tools.lolly.Desktop.yml
          cache-key: flatpak-builder-${{ github.sha }}
