# SPDX-License-Identifier: MPL-2.0
name: Signed release frontend

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      # The packaged app this frontend is for (macos, ios, android, linux or windows).
      # Each one needs only its own row of docs/supported-environments.md; a native
      # target without a platform keeps the full WebGPU hold.
      platform:
        required: false
        type: string
        default: ''
      # The release pin. Required for the release environment (it must equal the
      # repository variable LOLLY_RELEASE_PUBLIC_KEY_JWK). Must be empty for the
      # preview environment, whose pin comes only from its own variable.
      public_key_jwk:
        required: false
        type: string
        default: ''
      # Exactly two values are accepted; plan refuses anything else before any
      # job enters an environment. The default is the release environment.
      signing_environment:
        required: false
        type: string
        default: release-catalog-signing
      # An exact 40-hex commit. When set it must be an ancestor of origin/main and
      # every job builds it. Empty keeps the caller's own commit. The preview
      # environment requires it.
      source:
        required: false
        type: string
        default: ''
      # Raise the catalog sequence floor for the final signing (first preview
      # catalog only), through scripts/sign-catalog.ts --min-seq.
      min_seq:
        required: false
        type: string
        default: ''
      ca_enrollment_trust_json:
        required: false
        type: string
        default: ''
      connector_origins:
        required: false
        type: string
        default: ''
      live_relay:
        required: false
        type: string
        default: ''
      # The content profile the frontend is built from. The packaged apps keep the
      # neutral lolly-start pack; lolly.tools passes lolly-demo, from
      # scripts/data/ship-targets.json.
      profile:
        required: false
        type: string
        default: lolly-start
    # The release key is an environment secret of release-catalog-signing and the
    # preview key is an environment secret of preview-catalog-signing. GitHub only
    # hands an environment secret to a called workflow when the caller passes it by
    # name, and an unpassed secret is an empty string with no error (runs 40079348093
    # and 40105124697). So each caller passes, by name, the one key for the
    # environment it signs in: release callers LOLLY_CATALOG_SIGNING_KEY, preview-web.yml
    # LOLLY_PREVIEW_CATALOG_SIGNING_KEY. The signing job that names that environment
    # receives the environment's value. Neither is required, because each caller
    # passes only one; a missing key still stops the run, since sign-catalog.ts
    # refuses to sign without one.
    secrets:
      LOLLY_CATALOG_SIGNING_KEY:
        required: false
      LOLLY_PREVIEW_CATALOG_SIGNING_KEY:
        required: false
    outputs:
      public_key_jwk:
        description: The checked public pin this frontend was built and signed for
        value: ${{ jobs.source-catalog.outputs.pin }}
      source:
        description: The commit every job built
        value: ${{ jobs.plan.outputs.source }}

permissions:
  contents: read

env:
  LOLLY_PROFILE: ${{ inputs.profile }}
  LOLLY_EMBED_CATALOG: profile
  LOLLY_RELEASE_PLATFORM: ${{ inputs.platform }}

jobs:
  # Runs in no environment and holds no key. It is the only place that decides
  # which environment a run may enter and which commit it builds.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.plan.outputs.source }}
    steps:
      - name: Check the environment, commit and sequence inputs
        env:
          SIGNING_ENVIRONMENT: ${{ inputs.signing_environment }}
          SOURCE_INPUT: ${{ inputs.source }}
          PIN_INPUT: ${{ inputs.public_key_jwk }}
          MIN_SEQ: ${{ inputs.min_seq }}
        run: |
          set -euo pipefail
          case "$SIGNING_ENVIRONMENT" in
            release-catalog-signing) ;;
            preview-catalog-signing)
              [[ "$SOURCE_INPUT" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::The preview environment needs an exact 40-hex source commit'; exit 1; }
              test -z "$PIN_INPUT" || { echo '::error::The preview pin comes from its environment variable, never from a caller'; exit 1; }
              test "$GITHUB_REF" = refs/heads/main || { echo '::error::The preview environment signs only from main'; exit 1; }
              ;;
            *) echo '::error::Unknown signing environment'; exit 1 ;;
          esac
          if [ -n "$SOURCE_INPUT" ]; then [[ "$SOURCE_INPUT" =~ ^[a-f0-9]{40}$ ]]; fi
          if [ -n "$MIN_SEQ" ]; then [[ "$MIN_SEQ" =~ ^[1-9][0-9]{0,14}$ ]]; fi
      # Full history for the ancestry check, but no file contents beyond scripts/, the only
      # directory this job reads. A full clone spent 34 s here; a blobless sparse one a few.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Require an ancestor of main, and the release pin for the release environment
        id: plan
        env:
          SIGNING_ENVIRONMENT: ${{ inputs.signing_environment }}
          SOURCE_INPUT: ${{ inputs.source }}
          PIN: ${{ inputs.public_key_jwk }}
          RELEASE_PIN: ${{ vars.LOLLY_RELEASE_PUBLIC_KEY_JWK }}
        run: |
          set -euo pipefail
          source="${SOURCE_INPUT:-$GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "$source"
          if [ -n "$SOURCE_INPUT" ]; then git merge-base --is-ancestor "$source" refs/remotes/origin/main; fi
          # Every native and app build keeps the release pin (the preview pin is checked in its own environment).
          if [ "$SIGNING_ENVIRONMENT" = release-catalog-signing ]; then node scripts/check-signing-scope.ts; fi
          echo "source=$source" >> "$GITHUB_OUTPUT"

  source-catalog:
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ inputs.signing_environment }}
    outputs:
      pin: ${{ steps.scope.outputs.pin }}
    env:
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ inputs.signing_environment == 'preview-catalog-signing' && vars.LOLLY_PREVIEW_PUBLIC_KEY_JWK || inputs.public_key_jwk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Check the signing scope
        id: scope
        env:
          SIGNING_ENVIRONMENT: ${{ inputs.signing_environment }}
          PIN: ${{ env.VITE_CATALOG_PUBLIC_KEY_JWK }}
          RELEASE_PIN: ${{ vars.LOLLY_RELEASE_PUBLIC_KEY_JWK }}
        run: node scripts/check-signing-scope.ts
      - name: Check frontend target and release qualification
        env:
          FRONTEND_TARGET: ${{ inputs.target }}
        run: |
          scope=$(node --input-type=module -e 'import{parseReleaseFrontend,releaseGateScope}from"./scripts/build-release-web.ts";console.log(releaseGateScope(parseReleaseFrontend(process.env.FRONTEND_TARGET)))')
          node scripts/webgpu-release-gate.ts --scope "$scope"
          mkdir -p node_modules/@lolly-tools
          ln -s ../../packages/node-shell node_modules/@lolly-tools/node-shell
      - name: Sign source catalog (release key)
        if: inputs.signing_environment == 'release-catalog-signing'
        env:
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}
        run: node scripts/sign-catalog.ts
      - name: Sign source catalog (preview key)
        if: inputs.signing_environment == 'preview-catalog-signing'
        env:
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_PREVIEW_CATALOG_SIGNING_KEY }}
        run: node scripts/sign-catalog.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source-catalog-${{ inputs.target }}
          path: brands/${{ inputs.profile }}/catalog/tools/index.sig.json
          if-no-files-found: error

  compile:
    needs: [plan, source-catalog]
    runs-on: ubuntu-24.04
    env:
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ needs.source-catalog.outputs.pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
          submodules: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
      - name: Install frontend dependencies
        env:
          FRONTEND_TARGET: ${{ inputs.target }}
        run: |
          pnpm install --frozen-lockfile
          if [ "$FRONTEND_TARGET" != web ]; then pnpm -C "shells/$FRONTEND_TARGET" install --frozen-lockfile; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-source-catalog-${{ inputs.target }}
          path: brands/${{ inputs.profile }}/catalog/tools
      - name: Compile frontend
        env:
          FRONTEND_TARGET: ${{ inputs.target }}
          LOLLY_RELEASE_FRONTEND_PHASE: build
          VITE_LIVE_RELAY: ${{ inputs.live_relay }}
          VITE_CONNECTOR_ORIGINS: ${{ inputs.connector_origins }}
          VITE_CA_ENROLLMENT_TRUST_JSON: ${{ inputs.ca_enrollment_trust_json }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build-release-web.ts "$FRONTEND_TARGET"
      # One zstd tar, uploaded as is, instead of a zip of every file: see scripts/artifact-archive.ts.
      # The tar carries hidden files and modification times; the artifact's name is the file's.
      - name: Pack the compiled frontend
        env:
          FRONTEND_TARGET: ${{ inputs.target }}
        run: node scripts/artifact-archive.ts pack "shells/$FRONTEND_TARGET/dist" "$RUNNER_TEMP/release-frontend-input-$FRONTEND_TARGET.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/release-frontend-input-${{ inputs.target }}.tar.zst
          archive: false
          if-no-files-found: error

  sign-artifact:
    needs: [plan, source-catalog, compile]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.signing_environment }}
    env:
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ inputs.signing_environment == 'preview-catalog-signing' && vars.LOLLY_PREVIEW_PUBLIC_KEY_JWK || inputs.public_key_jwk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Prepare source resolver
        run: |
          mkdir -p node_modules/@lolly-tools
          ln -s ../../packages/node-shell node_modules/@lolly-tools/node-shell
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-frontend-input-${{ inputs.target }}.tar.zst
          path: ${{ runner.temp }}/release-frontend-input
      # The compile job ran third-party build code, so the unpack refuses links, devices and
      # paths outside the tree before it writes anything.
      - name: Unpack the compiled frontend
        env:
          FRONTEND_TARGET: ${{ inputs.target }}
        run: node scripts/artifact-archive.ts unpack "$RUNNER_TEMP/release-frontend-input/release-frontend-input-$FRONTEND_TARGET.tar.zst" release-frontend
      - name: Check the signing scope
        env:
          SIGNING_ENVIRONMENT: ${{ inputs.signing_environment }}
          PIN: ${{ env.VITE_CATALOG_PUBLIC_KEY_JWK }}
          RELEASE_PIN: ${{ vars.LOLLY_RELEASE_PUBLIC_KEY_JWK }}
        run: node scripts/check-signing-scope.ts
      - name: Sign frontend catalog (release key)
        if: inputs.signing_environment == 'release-catalog-signing'
        env:
          MIN_SEQ: ${{ inputs.min_seq }}
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}
        run: node scripts/sign-catalog.ts --tools release-frontend/tools --index release-frontend/catalog/tools/index.json --out release-frontend/catalog/tools/index.sig.json --materialize ${MIN_SEQ:+--min-seq "$MIN_SEQ"}
      - name: Sign frontend catalog (preview key)
        if: inputs.signing_environment == 'preview-catalog-signing'
        env:
          MIN_SEQ: ${{ inputs.min_seq }}
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_PREVIEW_CATALOG_SIGNING_KEY }}
        run: node scripts/sign-catalog.ts --tools release-frontend/tools --index release-frontend/catalog/tools/index.json --out release-frontend/catalog/tools/index.sig.json --materialize ${MIN_SEQ:+--min-seq "$MIN_SEQ"}
      - name: Verify signed catalog
        run: node scripts/verify-release-catalog.ts --root release-frontend
      - name: Prepare web delivery files
        if: inputs.target == 'web'
        run: node scripts/build-delivery.ts --root release-frontend
      - name: Sign frontend receipt (release key)
        if: inputs.signing_environment == 'release-catalog-signing'
        env:
          FRONTEND_TARGET: ${{ inputs.target }}
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}
        run: node scripts/release-frontend-receipt.ts "$FRONTEND_TARGET" release-frontend
      - name: Sign frontend receipt (preview key)
        if: inputs.signing_environment == 'preview-catalog-signing'
        env:
          FRONTEND_TARGET: ${{ inputs.target }}
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_PREVIEW_CATALOG_SIGNING_KEY }}
        run: node scripts/release-frontend-receipt.ts "$FRONTEND_TARGET" release-frontend
      - name: Verify frontend receipt
        env:
          FRONTEND_TARGET: ${{ inputs.target }}
        run: node scripts/release-frontend-receipt.ts --verify "$FRONTEND_TARGET" release-frontend
      # The native callers download this directory as a zip artifact, as before.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target != 'web'
        with:
          name: release-frontend-${{ inputs.target }}
          path: release-frontend
          include-hidden-files: true
          if-no-files-found: error
      # The web frontend is 2.9 GB in about 47,000 files, and its two callers (deployment-suse.yml and
      # preview-web.yml) unpack this one file instead. The tar also keeps the epoch stamp that
      # build-delivery.ts gave each file, which nginx's native validators are built from.
      - name: Pack the signed web frontend
        if: inputs.target == 'web'
        run: node scripts/artifact-archive.ts pack release-frontend "$RUNNER_TEMP/release-frontend-web.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target == 'web'
        with:
          path: ${{ runner.temp }}/release-frontend-web.tar.zst
          archive: false
          if-no-files-found: error
