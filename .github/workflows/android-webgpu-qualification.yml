# SPDX-License-Identifier: MPL-2.0
name: Android WebView WebGPU qualification (emulator only)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed main commit (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-webgpu-qualification
  cancel-in-progress: false

jobs:
  native-webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LOLLY_WEBGPU_SOURCE_SHA: ${{ inputs.source_sha }}
      LOLLY_WEBGPU_ANDROID_OUTPUT: plans/295-validation/android-webview
      LOLLY_WEBGPU_ANDROID_EMULATOR_GPU: swiftshader_indirect
    steps:
      - name: Refuse an ambiguous source identity
        run: '[[ "$LOLLY_WEBGPU_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed main ancestor
        run: git merge-base --is-ancestor "$LOLLY_WEBGPU_SOURCE_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - name: Enable the owned emulator's KVM access
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Run the unchanged required corpus in the actual Android WebView
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
            node scripts/verify-webgpu-android.ts
      - name: Keep the runtime, source, capability and full-corpus evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-webview-virtual-qualification-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            plans/295-validation/android-webview/*.json
            plans/295-validation/android-webview/*.log
            plans/295-validation/android-webview/*.txt
            plans/295-validation/android-webview/*test-only.apk
      - name: State the virtual-device scope
        if: always()
        run: |
          {
            echo 'Actual Android WebView; virtual Android device with software emulator graphics.'
            echo 'Physical Android devices and the installed Lolly/Tauri product remain unqualified.'
            echo 'API or adapter absence and any corpus failure remain verification failures; evidence is retained.'
          } >> "$GITHUB_STEP_SUMMARY"
