# SPDX-License-Identifier: MPL-2.0
name: Public Helm deployment profiles

on:
  push:
    branches: [main]
    paths:
      - deploy/helm/**
      - deploy/docker/**
      - tests/deployment-suse.test.ts
      - .github/workflows/deployment-suse.yml
  pull_request:
    paths:
      - deploy/helm/**
      - deploy/docker/**
      - tests/deployment-suse.test.ts
      - .github/workflows/deployment-suse.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-suse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Public chart render and schema checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      HELM_VERSION: '4.2.3'
      HELM_LINUX_AMD64_SHA256: e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c
      KUBECONFORM_VERSION: '0.8.0'
      KUBECONFORM_LINUX_AMD64_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KUBERNETES_SCHEMA_VERSION: '1.34.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deploy/helm/
            /tests/deployment-suse.test.ts
            /package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install checksum-verified chart tools
        run: |
          bindir="$RUNNER_TEMP/lolly-chart-bin"
          mkdir -p "$bindir"
          helm_archive="$RUNNER_TEMP/lolly-helm.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$helm_archive" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$HELM_LINUX_AMD64_SHA256" "$helm_archive" | sha256sum --check
          tar -xzf "$helm_archive" -C "$bindir" --strip-components=1 linux-amd64/helm
          schema_archive="$RUNNER_TEMP/lolly-kubeconform.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$schema_archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          printf '%s  %s\n' "$KUBECONFORM_LINUX_AMD64_SHA256" "$schema_archive" | sha256sum --check
          tar -xzf "$schema_archive" -C "$bindir" kubeconform
          echo "$bindir" >> "$GITHUB_PATH"
          rm "$helm_archive" "$schema_archive"

      - name: Install pinned YAML parser
        run: |
          # Ubuntu 24.04 supplies Python 3.12; use its verified binary wheel.
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/lolly-chart-python"
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' \
            > "$RUNNER_TEMP/lolly-chart-requirements.txt"
          "$RUNNER_TEMP/lolly-chart-python/bin/python3" -m pip install \
            --disable-pip-version-check --no-cache-dir --only-binary=:all: \
            --require-hashes -r "$RUNNER_TEMP/lolly-chart-requirements.txt"
          echo "$RUNNER_TEMP/lolly-chart-python/bin" >> "$GITHUB_PATH"

      - name: Require test tools and exercise deployment contracts
        run: |
          helm version --short
          kubeconform -v
          python3 -c 'import yaml; assert yaml.__version__ == "6.0.3"'
          node --test tests/deployment-suse.test.ts

      - name: Lint defaults and lean profile
        run: |
          helm lint deploy/helm --strict
          helm lint deploy/helm --strict -f deploy/helm/profiles/lean.yaml \
            --set mcp.enabled=true --set ca.enabled=true --set ca.existingSecret=fixture-ca

      - name: Validate public Kubernetes resources
        run: |
          helm template fixture deploy/helm | kubeconform \
            -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"
          digest='sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          for profile in default lean; do
            profile_flags=()
            if [[ "$profile" == lean ]]; then
              profile_flags=(-f deploy/helm/profiles/lean.yaml)
            fi
            helm template fixture deploy/helm "${profile_flags[@]}" \
              --set mcp.enabled=true --set ca.enabled=true --set ca.existingSecret=fixture-ca \
              --set web.ingress.enabled=true --set mcp.ingress.enabled=true --set ca.ingress.enabled=true \
              --set networkPolicy.enabled=true \
              --set 'imagePullSecrets[0].name=application-registry' \
              --set-string "web.image.digest=$digest" \
              --set-string "mcp.image.digest=$digest" \
              --set-string "ca.image.digest=$digest" \
              | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"
          done
