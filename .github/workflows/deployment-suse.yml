# SPDX-License-Identifier: MPL-2.0
name: Public deployment profiles

on:
  push:
    branches: [main]
    paths:
      - deploy/helm/**
      - deploy/docker/**
      - deploy/models-host/**
      - scripts/model-release.ts
      - tests/deployment-suse.test.ts
      - tests/deployment-sovereign.test.ts
      - tests/deployment-sovereign.integration.ts
      - tests/deployment-public-vm.test.ts
      - tests/deployment-public-vm.integration.ts
      - tests/model-release.test.ts
      - tests/browser-seccomp.test.ts
      - .github/workflows/deployment-suse.yml
  pull_request:
    paths:
      - deploy/helm/**
      - deploy/docker/**
      - deploy/models-host/**
      - scripts/model-release.ts
      - tests/deployment-suse.test.ts
      - tests/deployment-sovereign.test.ts
      - tests/deployment-sovereign.integration.ts
      - tests/deployment-public-vm.test.ts
      - tests/deployment-public-vm.integration.ts
      - tests/model-release.test.ts
      - tests/browser-seccomp.test.ts
      - .github/workflows/deployment-suse.yml
  workflow_dispatch:
    inputs:
      build_images:
        description: Opt in to native candidate image qualification and publishing
        required: false
        type: boolean
        default: false
      release_scope:
        description: Prepare the web image, independent services/docs, or the full existing set
        required: false
        type: choice
        options: [full, web, services-docs]
        default: full
      expected_source:
        description: Exact reviewed 40-character commit; must match the dispatched ref
        required: false
        type: string
      ci_run:
        description: Exact successful normal CI push/main run for expected_source; required for build_images
        required: false
        type: string
      archive_run:
        description: Successful qualification run to export for offline node import
        required: false
        type: string
      public_key_jwk:
        description: Existing published public P-256 JWK; never a replacement or private key
        required: false
        type: string
      paired_web_base:
        description: HTTPS origin of the web shell the deployed MCP will drive (its webBase); compared with the MCP tools, report only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-suse-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  chart:
    name: Public chart render and schema checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      HELM_VERSION: '4.2.3'
      HELM_LINUX_AMD64_SHA256: e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c
      KUBECONFORM_VERSION: '0.8.0'
      KUBECONFORM_LINUX_AMD64_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KUBERNETES_SCHEMA_VERSION: '1.34.0'
      CADDY_VERSION: '2.11.7'
      CADDY_LINUX_AMD64_SHA256: 727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deploy/helm/
            /tests/deployment-suse.test.ts
            /tests/deployment-sovereign.test.ts
            /tests/deployment-sovereign.integration.ts
            /deploy/docker/public.nginx.conf
            /deploy/docker/seccomp/
            /tests/browser-seccomp.test.ts
            /services/mcp/src/http.ts
            /package.json

      - name: Validate the selected preparation scope
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          case "$RELEASE_SCOPE" in
            full|web|services-docs) ;;
            *) echo 'Unsupported preparation scope' >&2; exit 1 ;;
          esac

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install checksum-verified chart tools
        run: |
          bindir="$RUNNER_TEMP/lolly-chart-bin"
          mkdir -p "$bindir"
          helm_archive="$RUNNER_TEMP/lolly-helm.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$helm_archive" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$HELM_LINUX_AMD64_SHA256" "$helm_archive" | sha256sum --check
          tar -xzf "$helm_archive" -C "$bindir" --strip-components=1 linux-amd64/helm
          schema_archive="$RUNNER_TEMP/lolly-kubeconform.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$schema_archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          printf '%s  %s\n' "$KUBECONFORM_LINUX_AMD64_SHA256" "$schema_archive" | sha256sum --check
          tar -xzf "$schema_archive" -C "$bindir" kubeconform
          echo "$bindir" >> "$GITHUB_PATH"
          rm "$helm_archive" "$schema_archive"
          caddy_archive="$RUNNER_TEMP/lolly-chart-caddy.tar.gz"
          curl --fail --silent --show-error --location --output "$caddy_archive" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$CADDY_LINUX_AMD64_SHA256" "$caddy_archive" | sha256sum --check
          tar -xzf "$caddy_archive" -C "$bindir" caddy
          rm "$caddy_archive"

      - name: Install pinned YAML parser
        run: |
          # Ubuntu 24.04 supplies Python 3.12; use its verified binary wheel.
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/lolly-chart-python"
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' \
            > "$RUNNER_TEMP/lolly-chart-requirements.txt"
          "$RUNNER_TEMP/lolly-chart-python/bin/python3" -m pip install \
            --disable-pip-version-check --no-cache-dir --only-binary=:all: \
            --require-hashes -r "$RUNNER_TEMP/lolly-chart-requirements.txt"
          echo "$RUNNER_TEMP/lolly-chart-python/bin" >> "$GITHUB_PATH"

      - name: Require test tools and exercise deployment contracts
        run: |
          helm version --short
          kubeconform -v
          python3 -c 'import yaml; assert yaml.__version__ == "6.0.3"'
          caddy version
          node --test tests/deployment-suse.test.ts tests/deployment-sovereign.test.ts tests/browser-seccomp.test.ts
          node --test tests/deployment-sovereign.integration.ts

      - name: Lint defaults and lean profile
        run: |
          helm lint deploy/helm --strict
          helm lint deploy/helm --strict -f deploy/helm/profiles/lean.yaml \
            --set mcp.enabled=true --set ca.enabled=true --set ca.existingSecret=fixture-ca

      - name: Lint the explicit sovereign profile
        run: |
          helm lint deploy/helm/profiles/sovereign --strict \
            -f deploy/helm/profiles/sovereign/fixture.values.json
          helm lint deploy/helm/profiles/sovereign --strict \
            -f deploy/helm/profiles/sovereign/fixture.values.json \
            -f deploy/helm/profiles/sovereign/browser.values.yaml \
            --set components.mcp.webBase=https://public.example

      - name: Validate public Kubernetes resources
        run: |
          helm template fixture deploy/helm | kubeconform \
            -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"
          digest='sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          for profile in default lean; do
            profile_flags=()
            if [[ "$profile" == lean ]]; then
              profile_flags=(-f deploy/helm/profiles/lean.yaml)
            fi
            helm template fixture deploy/helm "${profile_flags[@]}" \
              --set mcp.enabled=true --set ca.enabled=true --set ca.existingSecret=fixture-ca \
              --set web.ingress.enabled=true --set mcp.ingress.enabled=true --set ca.ingress.enabled=true \
              --set networkPolicy.enabled=true \
              --set 'imagePullSecrets[0].name=application-registry' \
              --set-string "web.image.digest=$digest" \
              --set-string "mcp.image.digest=$digest" \
              --set-string "ca.image.digest=$digest" \
              | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"
          done
          helm template fixture deploy/helm/profiles/sovereign --namespace lolly-public \
            -f deploy/helm/profiles/sovereign/fixture.values.json \
            | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"
          helm template fixture deploy/helm/profiles/sovereign --namespace lolly-public \
            -f deploy/helm/profiles/sovereign/fixture.values.json \
            --set private.servePublicDeploymentGuide=true \
            | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"
          helm template fixture deploy/helm/profiles/sovereign --namespace lolly-public \
            -f deploy/helm/profiles/sovereign/fixture.values.json \
            --set edge.tls.mode=acme --set edge.tls.email=team@example.com \
            --set edge.tls.existingClaim=caddy-data \
            | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"
          helm template fixture deploy/helm/profiles/sovereign --namespace lolly-public \
            -f deploy/helm/profiles/sovereign/fixture.values.json \
            --set edge.tls.mode=bootstrap --set edge.tls.email=team@example.com \
            --set edge.tls.existingClaim=caddy-data \
            | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"
          helm template fixture deploy/helm/profiles/sovereign --namespace lolly-public \
            -f deploy/helm/profiles/sovereign/fixture.values.json \
            -f deploy/helm/profiles/sovereign/browser.values.yaml \
            --set components.mcp.webBase=https://public.example \
            | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"
          helm template fixture deploy/helm/profiles/sovereign --namespace lolly-public \
            -f deploy/helm/profiles/sovereign/fixture.values.json \
            -f deploy/helm/profiles/sovereign/browser.values.yaml \
            --set-string components.mcp.browser.localhostProfile=lolly/public-browser-sandbox-8f01960c1777252f6c70b64e00fdccec95e86b37f7617cb798df3e36fd987a9b.json \
            | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_SCHEMA_VERSION"

  public-vm:
    name: Public VM route and security acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CADDY_VERSION: '2.11.7'
      CADDY_LINUX_AMD64_SHA256: 727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deploy/docker/
            /deploy/models-host/
            /scripts/model-release.ts
            /tests/deployment-public-vm.test.ts
            /tests/deployment-public-vm.integration.ts
            /tests/model-release.test.ts
            /vercel.json
            /package.json
            /pnpm-workspace.yaml
            /packages/core/package.json
            /packages/node-shell/package.json
            /packages/docs-render/package.json
            /packages/audio-dock/package.json
            /packages/rondo/package.json
            /engine/package.json
            /shells/web/package.json
            /shells/cli/package.json
            /shells/tui/package.json
            /services/ca/package.json
            /services/mcp/package.json
            /.github/workflows/deployment-suse.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install checksum-verified Caddy
        run: |
          bindir="$RUNNER_TEMP/lolly-public-bin"
          mkdir -p "$bindir"
          archive="$RUNNER_TEMP/lolly-caddy.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$CADDY_LINUX_AMD64_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$bindir" caddy
          echo "$bindir" >> "$GITHUB_PATH"
          rm "$archive"

      - name: Validate Compose syntax with synthetic configuration
        run: |
          fixture="$RUNNER_TEMP/lolly-public-compose"
          mkdir -p "$fixture/models"
          export LOLLY_PUBLIC_HOST=public.example
          export LOLLY_PUBLIC_PROXY_PEER=192.0.2.10
          export LOLLY_PUBLIC_MODELS_DIR="$fixture/models"
          export LOLLY_PUBLIC_MCP_ENV_FILE="$fixture/mcp.env"
          export LOLLY_PUBLIC_CA_ENV_FILE="$fixture/ca.env"
          digest='sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          for service in WEB MCP CA PENPOT; do
            export "LOLLY_PUBLIC_${service}_IMAGE=registry.example.com/lolly@${digest}"
          done
          printf '%s\n' 'LOLLY_MCP_TOKEN=synthetic-test-value' > "$fixture/mcp.env"
          printf '%s\n' "CA_ROOT_KEY_PEM='synthetic" "multiline'" \
            'CA_SERVICE_SECRET=synthetic-test-value' > "$fixture/ca.env"
          docker compose --env-file /dev/null -f deploy/docker/public.compose.yml config --quiet
          export LOLLY_PUBLIC_BROWSER_SECCOMP_FILE="$GITHUB_WORKSPACE/deploy/docker/seccomp/public-browser-sandbox.json"
          docker compose --env-file /dev/null -f deploy/docker/public.compose.yml \
            -f deploy/docker/public-browser.compose.yml config --quiet
          docker compose --env-file /dev/null -f deploy/docker/public.compose.yml \
            -f deploy/docker/public-browser.compose.yml config --format json > "$fixture/browser.json"
          node --input-type=module - "$fixture/browser.json" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const options = config.services.mcp.security_opt;
          assert.equal(options.length, 2);
          assert.ok(options.some((option) => /^no-new-privileges[=:]true$/.test(option)));
          assert.ok(options.some((option) => option === `seccomp=${process.env.LOLLY_PUBLIC_BROWSER_SECCOMP_FILE}`));
          assert.equal(config.services.mcp.read_only, true);
          assert.deepEqual(config.services.mcp.cap_drop, ['ALL']);
          JS

      - name: Exercise release and public deployment contracts
        run: |
          caddy version
          docker version
          node --test tests/model-release.test.ts tests/deployment-public-vm.test.ts
          # Native Caddy/nginx acceptance is explicit and never silently skipped.
          node --test tests/deployment-public-vm.integration.ts

  source-qualification:
    name: Reviewed main CI source
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
      CI_RUN: ${{ inputs.ci_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Bind the candidate to its completed normal main CI
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          git merge-base --is-ancestor "$EXPECTED_SOURCE" refs/remotes/origin/main
          test -z "$(git status --porcelain)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" > "$RUNNER_TEMP/normal-ci-run.json"
          ci_attempt=$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const {run_attempt:attempt}=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/normal-ci-run.json"));
            if(!Number.isSafeInteger(attempt) || attempt<1) throw Error("Invalid normal CI attempt");
            process.stdout.write(String(attempt));
          ')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/attempts/$ci_attempt/jobs?per_page=100" > "$RUNNER_TEMP/normal-ci-jobs.json"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const root=process.env.RUNNER_TEMP;
          const run=JSON.parse(readFileSync(root+'/normal-ci-run.json'));
          const inventory=JSON.parse(readFileSync(root+'/normal-ci-jobs.json'));
          if(!Number.isSafeInteger(run.id) || run.id<1 || String(run.id)!==process.env.CI_RUN || run.path!=='.github/workflows/ci.yml' || run.event!=='push' || run.head_branch!=='main' || run.head_sha!==process.env.EXPECTED_SOURCE || run.repository?.full_name!==process.env.GITHUB_REPOSITORY || run.head_repository?.full_name!==process.env.GITHUB_REPOSITORY || run.status!=='completed' || run.conclusion!=='success' || !Number.isSafeInteger(run.run_attempt) || run.run_attempt<1) throw Error('Candidate requires its exact successful normal main CI run');
          const jobs=inventory.jobs;
          if(!Array.isArray(jobs) || !jobs.length || jobs.length>100 || inventory.total_count!==jobs.length) throw Error('Incomplete normal CI job inventory');
          const ids=new Set(); let succeeded=0,expectedSkips=0;
          for(const job of jobs) {
            if(!Number.isSafeInteger(job.id) || job.id<1 || ids.has(job.id) || job.run_id!==run.id || typeof job.name!=='string' || !job.name.length || job.name.length>256 || job.status!=='completed' || (job.conclusion!=='success' && !(job.name==='verified instance shell' && job.conclusion==='skipped'))) throw Error('Normal CI job did not complete successfully');
            ids.add(job.id);
            if(job.conclusion==='success') succeeded++; else expectedSkips++;
          }
          if(!succeeded || expectedSkips>1) throw Error('Invalid normal CI success inventory');
          writeFileSync(root+'/normal-ci-source.json',JSON.stringify({version:1,source:run.head_sha,ciRun:run.id,ciAttempt:run.run_attempt,workflow:run.path,jobCount:jobs.length},null,2));
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: normal-main-ci-source-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/normal-ci-source.json
          if-no-files-found: error
          retention-days: 14

  # Plan 295 section 1B (Andy, 2026-10-08): "Gate only the web shell". The web
  # shell requires WebGPU at startup, so its image waits for the published
  # supported-environment table (scripts/webgpu-release-gate.ts). The MCP probe
  # uses software WebGPU through SwiftShader; CA, Penpot and /info need no WebGPU.
  # Their jobs never run the frontend gate or need a job that does, so a refused
  # or skipped web image leaves the images free to build, qualify and publish from main, and the docs
  # free to build. Nothing serves the docs artifact yet (see info-docs).
  web-release-gate:
    name: WebGPU release gate (web shell image only)
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true && (inputs.release_scope == 'full' || inputs.release_scope == 'web')
    needs: [source-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      # A full checkout, not a sparse one: without shells/web/src/main.ts the gate
      # would see no WebGPU requirement and allow the web image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Ask the gate; a refusal withholds the web image and nothing else
        id: gate
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/webgpu-release-gate.txt"
          if node scripts/webgpu-release-gate.ts --scope web > "$report" 2>&1; then
            allowed=true
          else
            allowed=false
            echo '::warning title=Web shell image withheld::The WebGPU release gate refused the web shell image (plan 295 P0b). The MCP, CA and Penpot images and the /info docs build without the web image. The step summary has the reasons.'
          fi
          cat "$report"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          {
            echo "### WebGPU release gate: web shell image allowed=$allowed"
            echo
            sed 's/^/    /' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

  web-image:
    name: Opt-in native public web image (gated on the WebGPU table)
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true && (inputs.release_scope == 'full' || inputs.release_scope == 'web') && needs.web-release-gate.outputs.allowed == 'true'
    needs: [chart, public-vm, source-qualification, web-release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ inputs.public_key_jwk }}
      EXISTING_PUBLIC_KEY_JWK: ${{ vars.LOLLY_RELEASE_PUBLIC_KEY_JWK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Require the reviewed source and existing public pin
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test ! -e brands/suse/tools
          test -z "$(git status --porcelain)"
          docker version
          docker buildx version
          mkdir -p "$RUNNER_TEMP/lolly-image-receipts" "$RUNNER_TEMP/lolly-qualified-web"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { createPublicKey } from "node:crypto";
            const key = JSON.parse(process.env.VITE_CATALOG_PUBLIC_KEY_JWK);
            const existing = JSON.parse(process.env.EXISTING_PUBLIC_KEY_JWK);
            if (key.kty !== "EC" || key.crv !== "P-256" || !key.x || !key.y || key.d !== undefined) throw new Error("Expected existing public P-256 pin");
            if (existing.d !== undefined || ["kty","crv","x","y"].some(field => key[field] !== existing[field])) throw new Error("Public pin differs from the existing repository release pin");
            const pin = {kty:key.kty,crv:key.crv,x:key.x,y:key.y};
            createPublicKey({key:pin,format:"jwk"});
            writeFileSync(process.env.RUNNER_TEMP + "/lolly-image-receipts/public.jwk.json", JSON.stringify(pin));
          '

      # The image build refuses too (deploy/docker/web.Dockerfile runs
      # build:web:release, which is scripts/build-release-web.ts); this step refuses
      # first, on this exact checkout, before any signing material is used.
      - name: Check browser qualification for the web-only image
        run: node scripts/webgpu-release-gate.ts --scope web

      - name: Build the exact public web image on native amd64
        env:
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -n "$LOLLY_CATALOG_SIGNING_KEY"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          builder="lolly-public-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          builder_owned=false
          cache_key=$(sha256sum package.json pnpm-lock.yaml pnpm-workspace.yaml deploy/docker/web.Dockerfile | sha256sum | cut -d ' ' -f 1)
          cache="ghcr.io/$owner/lolly-web-deps-cache:neutral-node26-pnpm11-amd64-$cache_key"
          trap 'if [[ "$builder_owned" == true ]]; then docker buildx rm "$builder" >/dev/null 2>&1 || true; fi; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          builder_owned=true
          # Export only the dependency-fetch target: no source, brand or signing step.
          docker buildx build --builder "$builder" --target deps --platform linux/amd64 \
            --cache-from "type=registry,ref=$cache" \
            --cache-to "type=registry,ref=$cache,mode=max" \
            -f deploy/docker/web.Dockerfile .
          CACHE_REF="$cache" CACHE_KEY="$cache_key" node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            writeFileSync(process.env.RUNNER_TEMP+"/lolly-image-receipts/dependency-cache.json",JSON.stringify({version:1,target:"deps",scope:"public-neutral",platform:"linux/amd64",cacheRef:process.env.CACHE_REF,key:process.env.CACHE_KEY,inputs:["package.json","pnpm-lock.yaml","pnpm-workspace.yaml","deploy/docker/web.Dockerfile"],sourceExported:false,signingExported:false,releaseStageCache:false},null,2));
          '
          docker buildx build --load --no-cache-filter build --platform linux/amd64 \
            --builder "$builder" --cache-from "type=registry,ref=$cache" \
            --label "org.opencontainers.image.revision=$EXPECTED_SOURCE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label org.lolly.profile=lolly-start \
            --build-arg LOLLY_PROFILE=lolly-start \
            --build-arg VITE_LIVE_RELAY=https://lolly.tools/live \
            --secret id=LOLLY_CATALOG_SIGNING_KEY,env=LOLLY_CATALOG_SIGNING_KEY \
            --secret id=VITE_CATALOG_PUBLIC_KEY_JWK,env=VITE_CATALOG_PUBLIC_KEY_JWK \
            -f deploy/docker/web.Dockerfile \
            -t "lolly-candidate-web:$EXPECTED_SOURCE" .

      - name: Verify the actual image catalog against the supplied public pin
        run: |
          set -euo pipefail
          container=$(docker create "lolly-candidate-web:$EXPECTED_SOURCE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/share/nginx/html/." "$RUNNER_TEMP/lolly-qualified-web/"
          node scripts/verify-release-catalog.ts --root "$RUNNER_TEMP/lolly-qualified-web" \
            --public-key "$RUNNER_TEMP/lolly-image-receipts/public.jwk.json" \
            > "$RUNNER_TEMP/lolly-image-receipts/catalog.json"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "lolly-candidate-web:$EXPECTED_SOURCE")" = "$EXPECTED_SOURCE"

      - name: Boot native web under its restricted bounds
        run: |
          set -euo pipefail
          trap 'docker rm -f probe-web >/dev/null 2>&1 || true' EXIT
          docker run -d --name probe-web --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 128m --cpus 0.5 --pids-limit 64 --tmpfs /tmp:size=16m,mode=1777 \
            -p 127.0.0.1:18880:8080 "lolly-candidate-web:$EXPECTED_SOURCE"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { setTimeout as delay } from "node:timers/promises";
            import { writeFileSync } from "node:fs";
            let response;
            for (let attempt = 0; attempt < 100; attempt++) {
              try { response = await fetch("http://127.0.0.1:18880/healthz"); } catch {}
              if (response) break;
              await delay(100);
            }
            assert.equal(response?.status, 200, "web");
            writeFileSync(process.env.RUNNER_TEMP + "/lolly-image-receipts/web-boot.json", JSON.stringify({ serviceBootPassed: true, results: { web: 200 } }, null, 2));
          '

      - name: Publish only the qualified web image digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          remote="ghcr.io/$owner/lolly-web:candidate-$EXPECTED_SOURCE"
          docker tag "lolly-candidate-web:$EXPECTED_SOURCE" "$remote"
          docker push "$remote"
          docker image inspect "$remote" --format '{{json .}}' \
            > "$RUNNER_TEMP/lolly-image-receipts/web.json"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const directory = process.env.RUNNER_TEMP + "/lolly-image-receipts";
            const image = JSON.parse(readFileSync(directory + "/web.json", "utf8"));
            if (image.Config.Labels["org.opencontainers.image.revision"] !== process.env.EXPECTED_SOURCE || image.Os !== "linux" || image.Architecture !== "amd64" || image.RepoDigests.length !== 1) throw new Error("Image/source binding failed");
            const images = { web: { imageId: image.Id, digest: image.RepoDigests[0], platform: "linux/amd64", source: process.env.EXPECTED_SOURCE } };
            writeFileSync(directory + "/web.json", JSON.stringify(images.web, null, 2));
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(runAttempt) || runAttempt < 1) throw new Error("Invalid candidate attempt");
            writeFileSync(directory + "/release.json", JSON.stringify({ source: process.env.EXPECTED_SOURCE, runId: process.env.GITHUB_RUN_ID, runAttempt, neutralProfile: true, images, candidateRuntimeQualified: false }, null, 2));
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-candidate-web-receipts-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lolly-image-receipts/*.json
          if-no-files-found: warn
          retention-days: 14

  # The MCP browser probe drives a web shell for its Tier-B exports. While the web
  # image is gated, that shell is the ordinary unsigned development build of the
  # same source (the build every pull request makes, which the release gate does
  # not cover). It carries no signing key and no public pin, it is never pushed to
  # a registry, and it is kept for one day as the probe's input only.
  probe-web-shell:
    name: Unsigned web shell for the MCP browser probe (never published)
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true && (inputs.release_scope == 'full' || inputs.release_scope == 'services-docs')
    needs: [chart, public-vm, source-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
      LOLLY_PROFILE: lolly-start
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Require the reviewed source
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test ! -e brands/suse/tools

      - name: Install frozen dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Build the ordinary unsigned web shell
        run: pnpm run build:web

      - name: Package the probe shell with its source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lolly-probe-web"
          mkdir -p "$out"
          tar -czf "$out/web-dist.tar.gz" -C shells/web/dist .
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(runAttempt) || runAttempt < 1) throw new Error("Invalid candidate attempt");
            writeFileSync(process.env.RUNNER_TEMP + "/lolly-probe-web/source.json", JSON.stringify({ source: process.env.EXPECTED_SOURCE, runId: process.env.GITHUB_RUN_ID, runAttempt, purpose: "MCP browser probe input", signed: false, release: false }, null, 2));
          '
          (cd "$out" && sha256sum web-dist.tar.gz source.json > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-probe-web-shell-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lolly-probe-web/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # CA and Penpot need neither a web shell nor a browser, so they build, boot and
  # publish on their own. A failed web shell or probe build cannot withhold them.
  service-images:
    name: Opt-in native public service images (CA, Penpot)
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true && (inputs.release_scope == 'full' || inputs.release_scope == 'services-docs')
    needs: [chart, public-vm, source-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Require the reviewed source
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test ! -e brands/suse/tools
          test -z "$(git status --porcelain)"
          docker version
          docker buildx version
          mkdir -p "$RUNNER_TEMP/lolly-image-receipts"

      - name: Build exact CA and Penpot images sequentially on native amd64
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          for service in ca penpot; do
            docker buildx build --load --no-cache --platform linux/amd64 \
              --label "org.opencontainers.image.revision=$EXPECTED_SOURCE" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label org.lolly.profile=lolly-start \
              -f "deploy/docker/${service}.Dockerfile" \
              -t "lolly-candidate-${service}:$EXPECTED_SOURCE" .
          done

      - name: Boot native CA and Penpot under their restricted bounds
        run: |
          set -euo pipefail
          trap 'docker rm -f probe-ca probe-penpot >/dev/null 2>&1 || true' EXIT
          docker run -d --name probe-ca --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 192m --cpus 0.25 --pids-limit 64 --tmpfs /tmp:size=8m,mode=1777 \
            -p 127.0.0.1:18887:8787 "lolly-candidate-ca:$EXPECTED_SOURCE"
          docker run -d --name probe-penpot --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 256m --cpus 0.5 --pids-limit 64 --tmpfs /tmp:size=8m,mode=1777 \
            -p 127.0.0.1:18891:8791 "lolly-candidate-penpot:$EXPECTED_SOURCE"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { setTimeout as delay } from "node:timers/promises";
            import { writeFileSync } from "node:fs";
            const checks = [["unconfiguredCA", "http://127.0.0.1:18887/api/ca/health", 404], ["penpot", "http://127.0.0.1:18891/healthz", 200]];
            const results = {};
            for (const [name, url, status] of checks) {
              let response;
              for (let attempt = 0; attempt < 100; attempt++) {
                try { response = await fetch(url); } catch {}
                if (response) break;
                await delay(100);
              }
              assert.equal(response?.status, status, name);
              results[name] = status;
            }
            writeFileSync(process.env.RUNNER_TEMP + "/lolly-image-receipts/service-boot.json", JSON.stringify({ serviceBootPassed: true, results, actualCAEnrollmentQualified: false }, null, 2));
          '

      - name: Publish only qualified image digests
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          for service in ca penpot; do
            remote="ghcr.io/$owner/lolly-${service}:candidate-$EXPECTED_SOURCE"
            docker tag "lolly-candidate-${service}:$EXPECTED_SOURCE" "$remote"
            docker push "$remote"
            docker image inspect "$remote" --format '{{json .}}' \
              > "$RUNNER_TEMP/lolly-image-receipts/${service}.json"
          done
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const directory = process.env.RUNNER_TEMP + "/lolly-image-receipts";
            const images = {};
            for (const service of ["ca", "penpot"]) {
              const image = JSON.parse(readFileSync(directory + "/" + service + ".json", "utf8"));
              if (image.Config.Labels["org.opencontainers.image.revision"] !== process.env.EXPECTED_SOURCE || image.Os !== "linux" || image.Architecture !== "amd64" || image.RepoDigests.length !== 1) throw new Error("Image/source binding failed");
              images[service] = { imageId: image.Id, digest: image.RepoDigests[0], platform: "linux/amd64", source: process.env.EXPECTED_SOURCE };
              writeFileSync(directory + "/" + service + ".json", JSON.stringify(images[service], null, 2));
            }
            writeFileSync(directory + "/release.json", JSON.stringify({ source: process.env.EXPECTED_SOURCE, runId: process.env.GITHUB_RUN_ID, neutralProfile: true, images, candidateRuntimeQualified: false }, null, 2));
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-candidate-service-receipts
          path: ${{ runner.temp }}/lolly-image-receipts/*.json
          if-no-files-found: warn
          retention-days: 14

  # The MCP browser image drives a web shell for its Tier-B exports, so this job
  # alone waits for the probe shell. It never asks the WebGPU gate and never waits
  # for the web image.
  mcp-browser-image:
    name: Opt-in native public MCP browser image (not gated on WebGPU)
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true && (inputs.release_scope == 'full' || inputs.release_scope == 'services-docs')
    needs: [chart, public-vm, source-qualification, probe-web-shell]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
      PAIRED_WEB_BASE: ${{ inputs.paired_web_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Require the reviewed source
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test ! -e brands/suse/tools
          test -z "$(git status --porcelain)"
          if [[ -n "$PAIRED_WEB_BASE" ]]; then
            [[ "$PAIRED_WEB_BASE" =~ ^https://[a-z0-9.-]+(:[0-9]+)?$ ]]
          fi
          docker version
          docker buildx version
          mkdir -p "$RUNNER_TEMP/lolly-image-receipts" "$RUNNER_TEMP/lolly-probe-web"

      - name: Build the exact MCP browser image on native amd64
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker buildx build --load --no-cache --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$EXPECTED_SOURCE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label org.lolly.profile=lolly-start \
            --build-arg LOLLY_PROFILE=lolly-start \
            -f deploy/docker/mcp-browser.Dockerfile \
            -t "lolly-candidate-mcp-browser:$EXPECTED_SOURCE" .

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-probe-web-shell-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lolly-probe-web-artifact

      - name: Unpack the probe web shell built from this source
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/lolly-probe-web-artifact"
          (cd "$artifact" && sha256sum --check SHA256SUMS)
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const receipt = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/lolly-probe-web-artifact/source.json", "utf8"));
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(attempt) || attempt < 1 || receipt.source !== process.env.EXPECTED_SOURCE || receipt.runId !== process.env.GITHUB_RUN_ID || receipt.runAttempt !== attempt || receipt.release !== false) throw new Error("The probe web shell is not the unsigned build of the reviewed source from this attempt");
          '
          tar -xzf "$artifact/web-dist.tar.gz" -C "$RUNNER_TEMP/lolly-probe-web"

      - name: Require restricted native sandbox and actual public exports
        id: native_probe
        run: |
          set -euo pipefail
          node --test tests/browser-seccomp.test.ts
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --security-opt "seccomp=$GITHUB_WORKSPACE/deploy/docker/seccomp/public-browser-sandbox.json" \
            --memory 2048m --cpus 2 --pids-limit 256 --tmpfs /tmp:size=512m,mode=1777 \
            --env LOLLY_BROWSER_NO_SANDBOX=0 --env LOLLY_MCP_ALLOW_ANONYMOUS=0 \
            --env LOLLY_MCP_PRIVATE_FILES=0 --env LOLLY_ALLOW_IN_MEMORY_RATE_LIMIT=0 \
            --env LOLLY_BROWSER_MAX_CONCURRENCY=1 --env LOLLY_BROWSER_MAX_QUEUE=4 \
            --env LOLLY_BROWSER_QUEUE_TIMEOUT_MS=30000 --env LOLLY_WEB_DIST=/qualification-web \
            --mount "type=bind,src=$RUNNER_TEMP/lolly-probe-web,dst=/qualification-web,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/deploy/docker/public-image-probe.ts,dst=/qualification/probe.ts,readonly" \
            --entrypoint node "lolly-candidate-mcp-browser:$EXPECTED_SOURCE" /qualification/probe.ts \
            > "$RUNNER_TEMP/lolly-image-receipts/native-probe.json"

      # A failed browser probe may need actual target-kernel diagnosis. This is
      # authenticated, short-lived transport, never a qualified registry release.
      - name: Retain bounded unqualified browser diagnosis inputs
        if: failure() && steps.native_probe.outcome == 'failure'
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/lolly-unqualified-diagnosis"
          mkdir -p "$directory"
          docker save "lolly-candidate-mcp-browser:$EXPECTED_SOURCE" | gzip -1 > "$directory/mcp-browser.tar.gz"
          tar -C "$RUNNER_TEMP/lolly-probe-web" -czf "$directory/web-dist.tar.gz" .
          cp deploy/docker/public-image-probe.ts "$directory/probe.ts"
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { createReadStream, statSync, writeFileSync } from "node:fs";
            const directory = process.env.RUNNER_TEMP + "/lolly-unqualified-diagnosis";
            const files = {};
            let totalBytes = 0;
            for (const name of ["mcp-browser.tar.gz", "web-dist.tar.gz", "probe.ts"]) {
              const bytes = statSync(directory + "/" + name).size;
              totalBytes += bytes;
              if (totalBytes > 2 * 1024 ** 3) throw new Error("Diagnostic transport exceeds 2 GiB");
              const hash = createHash("sha256");
              for await (const chunk of createReadStream(directory + "/" + name)) hash.update(chunk);
              files[name] = { bytes, sha256: hash.digest("hex") };
            }
            writeFileSync(directory + "/unqualified.json", JSON.stringify({ source: process.env.EXPECTED_SOURCE, runId: process.env.GITHUB_RUN_ID, qualified: false, promotionAllowed: false, purpose: "candidate-only kernel/sandbox diagnosis", files }, null, 2));
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() && steps.native_probe.outcome == 'failure'
        with:
          name: unqualified-public-browser-diagnosis
          path: ${{ runner.temp }}/lolly-unqualified-diagnosis/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      # The probe above qualifies this image against the shell built from the same
      # source. In production the MCP drives the shell at its webBase instead, which
      # stays on an older release while the web image is gated, so a tool or input
      # that is new here can fail a Tier-B render there. This compares the image's
      # tools with that shell's signed file list and records every difference in
      # web-pairing.json. It reports and never blocks publication.
      - name: Report tool drift from the paired production web shell
        continue-on-error: true
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/lolly-image-receipts/web-pairing.json"
          if [[ -z "$PAIRED_WEB_BASE" ]]; then
            printf '%s\n' '{ "checked": false, "reason": "No paired_web_base was dispatched." }' > "$receipt"
            echo '::notice title=Web pairing not checked::Dispatch with paired_web_base to compare the MCP tools with the web shell the deployed MCP will drive.'
            exit 0
          fi
          container=$(docker create "lolly-candidate-mcp-browser:$EXPECTED_SOURCE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/tools" "$RUNNER_TEMP/lolly-mcp-tools"
          node deploy/docker/web-pairing.ts --tools "$RUNNER_TEMP/lolly-mcp-tools" --web-base "$PAIRED_WEB_BASE" > "$receipt"

      - name: Publish only the qualified MCP browser image digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          remote="ghcr.io/$owner/lolly-mcp-browser:candidate-$EXPECTED_SOURCE"
          docker tag "lolly-candidate-mcp-browser:$EXPECTED_SOURCE" "$remote"
          docker push "$remote"
          docker image inspect "$remote" --format '{{json .}}' \
            > "$RUNNER_TEMP/lolly-image-receipts/mcp-browser.json"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const directory = process.env.RUNNER_TEMP + "/lolly-image-receipts";
            const image = JSON.parse(readFileSync(directory + "/mcp-browser.json", "utf8"));
            if (image.Config.Labels["org.opencontainers.image.revision"] !== process.env.EXPECTED_SOURCE || image.Os !== "linux" || image.Architecture !== "amd64" || image.RepoDigests.length !== 1) throw new Error("Image/source binding failed");
            const images = { "mcp-browser": { imageId: image.Id, digest: image.RepoDigests[0], platform: "linux/amd64", source: process.env.EXPECTED_SOURCE } };
            writeFileSync(directory + "/mcp-browser.json", JSON.stringify(images["mcp-browser"], null, 2));
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(runAttempt) || runAttempt < 1) throw new Error("Invalid candidate attempt");
            writeFileSync(directory + "/release.json", JSON.stringify({ source: process.env.EXPECTED_SOURCE, runId: process.env.GITHUB_RUN_ID, runAttempt, neutralProfile: true, images, candidateRuntimeQualified: false }, null, 2));
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-candidate-mcp-browser-receipts-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lolly-image-receipts/*.json
          if-no-files-found: warn
          retention-days: 14

  # The /info docs site, built from the reviewed source on its own. It does not
  # require WebGPU and does not wait for the web image, so the docs build from
  # main while the web shell image is gated. This job only keeps the artifact:
  # the deployed web image still serves the /info it was built with until a
  # deploy step serves this artifact in its place (plan 295 section 1B follow-up).
  info-docs:
    name: /info docs site (not gated on WebGPU)
    if: github.event_name == 'workflow_dispatch' && inputs.build_images == true && (inputs.release_scope == 'full' || inputs.release_scope == 'services-docs')
    needs: [chart, public-vm, source-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
      LOLLY_PROFILE: lolly-start
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Require the reviewed source
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test ! -e brands/suse/tools

      - name: Install frozen dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Build the /info site and hold it to its size budget
        run: |
          set -euo pipefail
          pnpm run build:info
          pnpm run check:docs-size

      - name: Package the /info site with its source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lolly-info-docs"
          mkdir -p "$out"
          tar -czf "$out/info.tar.gz" -C shells/web/public/info .
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync(process.env.RUNNER_TEMP + "/lolly-info-docs/source.json", JSON.stringify({ source: process.env.EXPECTED_SOURCE, runId: process.env.GITHUB_RUN_ID, profile: process.env.LOLLY_PROFILE, servedAt: "/info/" }, null, 2));
          '
          (cd "$out" && sha256sum info.tar.gz source.json > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-info-docs
          path: ${{ runner.temp }}/lolly-info-docs/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  archive-qualified-images:
    if: github.event_name == 'workflow_dispatch' && inputs.archive_run != ''
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_RUN: ${{ inputs.archive_run }}
      SOURCE_SHA: ${{ inputs.expected_source }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      # Export only successful web/MCP jobs from the exact completed source run.
      # A scope can omit either image; an omitted web gate differs from a gate
      # that ran successfully and withheld the web image. Failed images stay out.
      - name: Require a completed exact-source qualification
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" > "$RUNNER_TEMP/run.json"
          qualification_attempt=$(node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const root=process.env.RUNNER_TEMP;
            const run=JSON.parse(readFileSync(root+"/run.json"));
            if(!Number.isSafeInteger(run.id) || String(run.id)!==process.env.QUALIFICATION_RUN || run.status!=="completed" || run.head_sha!==process.env.SOURCE_SHA || run.path!==".github/workflows/deployment-suse.yml" || run.event!=="workflow_dispatch" || !Number.isSafeInteger(run.run_attempt) || run.run_attempt<1) throw Error("Unqualified source/run attempt");
            writeFileSync(root+"/qualification-run.json",JSON.stringify({runId:String(run.id),source:run.head_sha,attempt:run.run_attempt}));
            process.stdout.write(String(run.run_attempt));
          ')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN/attempts/$qualification_attempt/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const root=process.env.RUNNER_TEMP;
          const run=JSON.parse(readFileSync(root+'/run.json'));
          const qualification=JSON.parse(readFileSync(root+'/qualification-run.json'));
          if(qualification.runId!==process.env.QUALIFICATION_RUN || qualification.source!==process.env.SOURCE_SHA || !Number.isSafeInteger(qualification.attempt) || qualification.attempt<1 || run.run_attempt!==qualification.attempt) throw Error('Unqualified source/run attempt');
          const inventory=JSON.parse(readFileSync(root+'/jobs.json'));
          const jobs=inventory.jobs;
          if(!Array.isArray(jobs) || inventory.total_count!==jobs.length || jobs.length>100) throw Error('Incomplete job inventory');
          const ids=new Set();
          for(const job of jobs){
            if(!Number.isSafeInteger(job.id) || job.id<1 || ids.has(job.id) || String(job.run_id)!==qualification.runId || (job.run_attempt!==undefined && job.run_attempt!==qualification.attempt)) throw Error('Job differs from qualification attempt');
            ids.add(job.id);
          }
          const outcome=(name)=>{
            const found=jobs.filter(job=>job.name===name);
            if(found.length!==1 || found[0].status!=='completed' || typeof found[0].conclusion!=='string') throw Error('Missing, duplicate or unfinished qualification job');
            return found[0].conclusion;
          };
          for(const name of ['Public chart render and schema checks','Public VM route and security acceptance','Reviewed main CI source']) if(outcome(name)!=='success') throw Error('Deployment prerequisites did not qualify');
          const web=outcome('Opt-in native public web image (gated on the WebGPU table)');
          const gate=outcome('WebGPU release gate (web shell image only)');
          const mcp=outcome('Opt-in native public MCP browser image (not gated on WebGPU)');
          const probe=outcome('Unsigned web shell for the MCP browser probe (never published)');
          const selection={qualified:[],withheld:[],notSelected:[],notQualified:{}};
          if(web==='success') {
            if(gate!=='success') throw Error('Web image lacks its passing gate');
            selection.qualified.push('web');
          } else if(web==='skipped' && gate==='success') selection.withheld.push('web');
          else if(web==='skipped' && gate==='skipped') selection.notSelected.push('web');
          else selection.notQualified.web=web;
          if(mcp==='success') {
            if(probe!=='success') throw Error('MCP image lacks its exact-source probe shell');
            selection.qualified.push('mcp-browser');
          } else if(mcp==='skipped' && probe==='skipped') selection.notSelected.push('mcp-browser');
          else selection.notQualified['mcp-browser']=mcp;
          if(!selection.qualified.length) throw Error('No qualified web or MCP image to archive');
          writeFileSync(root+'/image-selection.json',JSON.stringify(selection));
          JS
          for service in $(node --input-type=module -e 'import{readFileSync}from"node:fs";console.log(JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/image-selection.json")).qualified.join(" "))'); do
            case "$service" in
              web) artifact="public-candidate-web-receipts-attempt-$qualification_attempt" ;;
              mcp-browser) artifact="public-candidate-mcp-browser-receipts-attempt-$qualification_attempt" ;;
              *) exit 1 ;;
            esac
            gh run download "$QUALIFICATION_RUN" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/receipts/$service"
          done
      - name: Export the qualified registry content without changing its digest
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          auth="$RUNNER_TEMP/registry-auth.json"
          trap 'rm -f "$auth"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          mkdir "$RUNNER_TEMP/archives"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,mkdirSync,renameSync,createReadStream,statSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const root=process.env.RUNNER_TEMP;
          const qualification=JSON.parse(readFileSync(root+'/qualification-run.json'));
          if(qualification.runId!==process.env.QUALIFICATION_RUN || qualification.source!==process.env.SOURCE_SHA || !Number.isSafeInteger(qualification.attempt) || qualification.attempt<1) throw Error('Invalid qualification attempt');
          const selection=JSON.parse(readFileSync(root+'/image-selection.json'));
          const qualified=selection.qualified;
          if(!Array.isArray(qualified)||!qualified.length||new Set(qualified).size!==qualified.length||qualified.some(service=>!['web','mcp-browser'].includes(service))) throw Error('Invalid archive image selection');
          const releases={};
          for(const service of qualified){
            const release=JSON.parse(readFileSync(root+'/receipts/'+service+'/release.json'));
            if(release.source!==process.env.SOURCE_SHA || release.runId!==process.env.QUALIFICATION_RUN || release.runAttempt!==qualification.attempt || !release.neutralProfile) throw Error('Receipt differs');
            releases[service]=release;
          }
          const evidence={version:1,source:process.env.SOURCE_SHA,qualificationRun:process.env.QUALIFICATION_RUN,qualificationAttempt:qualification.attempt,transportRun:process.env.GITHUB_RUN_ID,withheld:selection.withheld,notSelected:selection.notSelected,notQualified:selection.notQualified,images:{}};
          async function hash(path){const h=createHash('sha256');for await(const c of createReadStream(path))h.update(c);return h.digest('hex');}
          function run(command,args){const r=spawnSync(command,args,{stdio:'inherit'});if(r.status!==0)throw Error(command+' failed');}
          for(const service of qualified){
            const release=releases[service];
            const receipt=release.images[service];
            const prefix='ghcr.io/'+process.env.GITHUB_REPOSITORY_OWNER.toLowerCase()+'/lolly-'+service+'@sha256:';
            if(!receipt.digest.startsWith(prefix) || !/^[a-f0-9]{64}$/.test(receipt.digest.slice(prefix.length)) || receipt.source!==release.source || receipt.platform!=='linux/amd64')throw Error('Invalid image receipt');
            const raw=root+'/'+service+'-raw';mkdirSync(raw);
            run('skopeo',['copy','--preserve-digests','--authfile',root+'/registry-auth.json','docker://'+receipt.digest,'dir:'+raw]);
            const bytes=readFileSync(raw+'/manifest.json');
            const manifest=JSON.parse(bytes);const digest='sha256:'+createHash('sha256').update(bytes).digest('hex');
            if(receipt.digest!==prefix.slice(0,-7)+digest)throw Error('Registry manifest differs');
            const config=JSON.parse(readFileSync(raw+'/'+manifest.config.digest.slice(7)));
            if(config.os!=='linux'||config.architecture!=='amd64'||config.config.Labels['org.opencontainers.image.revision']!==release.source||manifest.config.digest!==receipt.imageId)throw Error('Image/source binding differs');
            const oci=root+'/'+service+'-oci';mkdirSync(oci+'/blobs/sha256',{recursive:true});
            for(const blob of [manifest.config,...manifest.layers]){
              if(!/^sha256:[a-f0-9]{64}$/.test(blob.digest)||statSync(raw+'/'+blob.digest.slice(7)).size!==blob.size||await hash(raw+'/'+blob.digest.slice(7))!==blob.digest.slice(7))throw Error('Blob differs');
              renameSync(raw+'/'+blob.digest.slice(7),oci+'/blobs/sha256/'+blob.digest.slice(7));
            }
            writeFileSync(oci+'/blobs/sha256/'+digest.slice(7),bytes);
            writeFileSync(oci+'/oci-layout',JSON.stringify({imageLayoutVersion:'1.0.0'}));
            writeFileSync(oci+'/index.json',JSON.stringify({schemaVersion:2,manifests:[{mediaType:manifest.mediaType,digest,size:bytes.length,annotations:{'io.containerd.image.name':receipt.digest,'org.opencontainers.image.ref.name':receipt.digest}}]}));
            const archive=root+'/archives/'+service+'.oci.tar';run('tar',['-C',oci,'-cf',archive,'.']);
            evidence.images[service]={...receipt,archive:service+'.oci.tar',archiveSha256:await hash(archive),archiveBytes:statSync(archive).size};
          }
          writeFileSync(root+'/archives/transport.json',JSON.stringify(evidence,null,2));
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-public-image-archives-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archives/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
