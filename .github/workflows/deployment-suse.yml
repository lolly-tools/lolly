            writeFileSync(oci+'/blobs/sha256/'+digest.slice(7),bytes);
            writeFileSync(oci+'/oci-layout',JSON.stringify({imageLayoutVersion:'1.0.0'}));
            writeFileSync(oci+'/index.json',JSON.stringify({schemaVersion:2,manifests:[{mediaType:manifest.mediaType,digest,size:bytes.length,annotations:{'io.containerd.image.name':receipt.digest,'org.opencontainers.image.ref.name':receipt.digest}}]}));
            const archive=root+'/archives/'+service+'.oci.tar';run('tar',['-C',oci,'-cf',archive,'.']);
            evidence.images[service]={...receipt,archive:service+'.oci.tar',archiveSha256:await hash(archive),archiveBytes:statSync(archive).size};
          }
          writeFileSync(root+'/archives/transport.json',JSON.stringify(evidence,null,2));
