# SPDX-License-Identifier: MPL-2.0
name: Linux RPM

on:
  workflow_dispatch:
    inputs:
      webgpu_qualification:
        description: WebGPU qualification build (plan 295 P0b) - skips the release gate, unsigned, marked not for release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-rpm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification) }}
    uses: ./.github/workflows/release-frontend.yml
    with:
      target: tauri-desktop
      public_key_jwk: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
    secrets:
      LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}

  build:
    needs: frontend
    if: ${{ always() && !cancelled() && (needs.frontend.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification)) }}
    name: RPM (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [tumbleweed, leap16]
    env:
      LOLLY_RELEASE_FRONTEND_PHASE: verified-artifact
      VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
      LOLLY_PROFILE: lolly-start
      LOLLY_EMBED_CATALOG: profile
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # A WebGPU qualification build (plan 295 P0b) only on a manual dispatch that asks for
      # one: scripts/build-release-web.ts then skips the release gate, signs nothing and
      # marks the frontend, and the step before upload marks the packages not for release.
      LOLLY_WEBGPU_QUALIFICATION_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm zstd xz-utils
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C shells/tauri-desktop install --frozen-lockfile
      - name: Download signed source catalog
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-source-catalog-tauri-desktop
          path: brands/lolly-start/catalog/tools

      - name: Download signed frontend
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-frontend-tauri-desktop
          path: shells/tauri-desktop/dist

      - name: Build signed frontend and Linux CLI
        env:
          VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
        run: |
          pnpm -C shells/tauri-desktop run build:frontend:release
          pnpm -C shells/tauri-desktop run build:cli-sidecar
      - name: Prepare offline sources
        run: shells/tauri-desktop/rpm/make-sources.sh --skip-frontend
      - name: Build and verify RPM in its distribution container
        run: shells/tauri-desktop/release/build-rpm.sh "${{ matrix.target }}"
      - name: Mark a WebGPU qualification build as not for release
        if: env.LOLLY_WEBGPU_QUALIFICATION_BUILD == '1'
        run: node scripts/webgpu-qualification.ts mark ~/.cache/lolly-release/artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lolly-rpm-${{ matrix.target }}
          path: |
            ~/.cache/lolly-release/artifacts/*.rpm
            ~/.cache/lolly-release/artifacts/WEBGPU-QUALIFICATION-BUILD-NOT-FOR-RELEASE.txt
          if-no-files-found: error
