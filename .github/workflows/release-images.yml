# SPDX-License-Identifier: MPL-2.0
# Promote qualified public candidate images to a release version.
#
# Nothing is built here. Each image is the exact digest that one completed
# deployment-suse.yml run built, booted under restricted bounds and pushed as
# candidate-<source>. This workflow rechecks that run, its job inventory and its
# receipts, then for every requested digest: signs it with a keyless Sigstore
# certificate for this workflow, attests an SPDX SBOM and SLSA provenance, checks
# all three against this workflow's identity and only then tags the same digest
# with the release version. scripts/release-images.ts makes every admission
# decision; this file only fetches what it reads and runs the pinned tools.
#
# Verify a published image (deploy/docker/README.md, "Published images"):
#   cosign verify ghcr.io/lolly-tools/lolly-web@sha256:<digest> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity https://github.com/lolly-tools/lolly/.github/workflows/release-images.yml@refs/heads/main
name: Public image release

on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Completed deployment-suse.yml run that built, qualified and pushed the candidate images
        required: true
        type: string
      expected_source:
        description: Exact 40-hex source commit that run qualified; it must be on main
        required: true
        type: string
      version:
        description: Product version to publish; must equal the version the source declares (tauri.conf.json and both Helm appVersions)
        required: true
        type: string
      images:
        description: Space-separated images to promote, each qualified by that run (web, mcp, mcp-browser, ca, penpot)
        required: true
        type: string
        default: web mcp mcp-browser ca penpot

permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    name: Sign, attest and tag qualified public images
    # Dispatch from main of this repository only, as the candidate builds are.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lolly-tools/lolly'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
      # Keyless signing exchanges this workflow's OIDC identity for a short-lived
      # Sigstore certificate. No signing key exists to store or leak.
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      QUALIFICATION_RUN: ${{ inputs.qualification_run }}
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_IMAGES: ${{ inputs.images }}
      EXISTING_PUBLIC_KEY_JWK: ${{ vars.LOLLY_RELEASE_PUBLIC_KEY_JWK }}
      GH_TOKEN: ${{ github.token }}
      CRANE_VERSION: '0.22.1'
      CRANE_LINUX_X64_SHA256: '0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0'
      SYFT_VERSION: '1.52.0'
      SYFT_LINUX_X64_SHA256: 'caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Require a main source that declares this version
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$EXPECTED_SOURCE" refs/remotes/origin/main
          root="$RUNNER_TEMP/release-images"
          for path in shells/tauri-desktop/src-tauri/tauri.conf.json deploy/helm/Chart.yaml deploy/helm/profiles/sovereign/Chart.yaml; do
            mkdir -p "$root/source/$(dirname "$path")"
            git show "$EXPECTED_SOURCE:$path" > "$root/source/$path"
          done
          node scripts/release-images.ts request

      - name: Recheck the qualification run, its jobs and its receipts
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-images"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" > "$root/run.json"
          attempt=$(node scripts/release-images.ts attempt)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN/attempts/$attempt/jobs?per_page=100" > "$root/jobs.json"
          node scripts/release-images.ts qualify
          while read -r artifact <&3; do
            gh run download "$QUALIFICATION_RUN" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$root/receipts/$artifact"
          done 3< "$root/artifacts.txt"
          node scripts/release-images.ts receipts

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install the pinned registry and SBOM tools
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/release-tools"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_LINUX_X64_SHA256  $RUNNER_TEMP/crane.tar.gz" | sha256sum --check
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "$SYFT_LINUX_X64_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$bin" crane
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$bin" syft
          echo "$bin" >> "$GITHUB_PATH"

      # Every requested digest is admitted, signed, attested and verified before any
      # release tag moves, so a refusal part way through leaves no tag behind.
      - name: Sign and attest each qualified digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          COSIGN_YES: 'true'
          # Packages and their relationships, without a per-file inventory.
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-images"
          identity="$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF"
          issuer=https://token.actions.githubusercontent.com
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          while IFS=$'\t' read -r image repository digest <&3; do
            out="$root/images/$image"
            mkdir -p "$out"
            crane manifest "$repository@$digest" > "$out/manifest.json"
            crane config "$repository@$digest" > "$out/config.json"
            tags=$(crane ls "$repository")
            if grep -Fxq -- "$RELEASE_VERSION" <<< "$tags"; then
              crane digest "$repository:$RELEASE_VERSION" > "$out/existing-tag"
            fi
            node scripts/release-images.ts image "$image"
            syft scan "registry:$repository@$digest" -o "spdx-json=$out/sbom.spdx.json"
            node scripts/release-images.ts provenance "$image"
            cosign sign "$repository@$digest"
            cosign attest --type spdxjson --predicate "$out/sbom.spdx.json" "$repository@$digest"
            cosign attest --type slsaprovenance1 --predicate "$out/provenance.json" "$repository@$digest"
            cosign verify "$repository@$digest" \
              --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > "$out/signature.json"
            for type in spdxjson slsaprovenance1; do
              cosign verify-attestation --type "$type" "$repository@$digest" \
                --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > "$out/attestation-$type.json"
            done
          done 3< "$root/plan.tsv"

      - name: Tag each signed digest with the release version
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-images"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          while IFS=$'\t' read -r _ repository digest <&3; do
            # crane copies the manifest bytes unchanged, so the tag points at the
            # qualified digest itself rather than at a new index that wraps that digest.
            crane tag "$repository@$digest" "$RELEASE_VERSION"
            test "$(crane digest "$repository:$RELEASE_VERSION")" = "$digest"
          done 3< "$root/plan.tsv"
          node scripts/release-images.ts manifest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-images-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-images/images.json
            ${{ runner.temp }}/release-images/request.json
            ${{ runner.temp }}/release-images/plan.json
            ${{ runner.temp }}/release-images/images/
          if-no-files-found: warn
          retention-days: 90
