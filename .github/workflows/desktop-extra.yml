# SPDX-License-Identifier: MPL-2.0
name: Windows installers

on:
  workflow_dispatch:
    inputs:
      webgpu_qualification:
        description: WebGPU qualification build (plan 295 P0b) - skips the release gate, unsigned, marked not for release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            bundles: nsis,msi
    defaults:
      run:
        shell: bash
    env:
      LOLLY_PROFILE: lolly-start
      LOLLY_EMBED_CATALOG: profile
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      NODE_OPTIONS: --max-old-space-size=6144
      # A WebGPU qualification build (plan 295 P0b) only on a manual dispatch that asks for
      # one: scripts/build-release-web.ts then skips the release gate, signs nothing and
      # marks the frontend, and the step before upload marks the packages not for release.
      LOLLY_WEBGPU_QUALIFICATION_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.webgpu_qualification && '1' || '' }}
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install the pinned package manager
        run: |
          npm install --global --prefix "$RUNNER_TEMP/lolly-pnpm" pnpm@11.26.0
          echo "$RUNNER_TEMP/lolly-pnpm/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/lolly-pnpm" >> "$GITHUB_PATH"
      - name: Use Bash for package scripts on Windows
        if: runner.os == 'Windows'
        run: pnpm config set script-shell 'C:\Program Files\Git\bin\bash.exe'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C shells/tauri-desktop install --frozen-lockfile
      - name: Build packages
        env:
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}
          VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
        run: pnpm -C shells/tauri-desktop run tauri build --bundles "$BUILD_BUNDLES"
      - name: Preserve application bundle permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent shells/tauri-desktop/src-tauri/target/release/bundle/macos/Lolly.app Lolly-macos-x64.app.zip
      - name: Mark a WebGPU qualification build as not for release
        if: env.LOLLY_WEBGPU_QUALIFICATION_BUILD == '1'
        run: node scripts/webgpu-qualification.ts mark shells/tauri-desktop/src-tauri/target/release/bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lolly-${{ matrix.target }}
          path: |
            shells/tauri-desktop/src-tauri/target/release/bundle/WEBGPU-QUALIFICATION-BUILD-NOT-FOR-RELEASE.txt
            shells/tauri-desktop/src-tauri/target/release/bundle/**/*.dmg
            shells/tauri-desktop/src-tauri/target/release/bundle/**/*.exe
            shells/tauri-desktop/src-tauri/target/release/bundle/**/*.msi
            Lolly-macos-x64.app.zip
          if-no-files-found: error
