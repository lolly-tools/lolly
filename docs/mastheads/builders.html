<!-- Concept: one master module tile stamps outward across a precise, aligned grid, replicating into
identical structured copies — the Builders thesis made visual: build the tool once, and it reproduces
correctly everywhere, without you back in the loop.
Band contract: .bld is position:absolute;inset:0;overflow:hidden;pointer-events:none, aria-hidden; the
canvas fills the live element size via ResizeObserver; detail concentrates in the upper band; the lower
edge fades into --page. Tokens are read live via getComputedStyle with light/dark fallbacks, repainting
on html.class and prefers-color-scheme changes; reduced motion renders one static settled frame; the
loop self-suspends off-screen and when the tab is hidden.

<div class="bld" aria-hidden="true"><canvas></canvas></div>
<style>
.bld{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bld canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
<script>
(function(){
  var root=document.querySelector('.bld');
  var canvas=root.querySelector('canvas');
  var ctx=canvas.getContext('2d');

  function tok(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}
  function themeIsDark(){return document.documentElement.classList.contains('dark');}
  function clamp01(v){return v<0?0:v>1?1:v;}
  function smoothstep(a,b,x){if(a===b)return x<a?0:1;var t=clamp01((x-a)/(b-a));return t*t*(3-2*t);}
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  var rectW=0, rectH=0, dpr=1, grid=null;
  var running=false, rafId=null, startTs=null, lastPhase=0, period=7200;
  var inView=true, pageVisible=!document.hidden;

  function computeGrid(w,h){
    var cell=Math.max(32,Math.min(56,w/17));
    var cols=Math.ceil(w/cell)+1;
    var rows=Math.ceil(h/cell)+1;
    var mc=Math.round(cols*0.27);
    var mr=Math.min(rows-1,1);
    var maxDist=Math.max(Math.max(mc,cols-1-mc),Math.max(mr,rows-1-mr));
    grid={cell:cell,cols:cols,rows:rows,mc:mc,mr:mr,maxDist:Math.max(1,maxDist)};
  }

  function draw(phase){
    var w=rectW, h=rectH;
    if(!w||!h||!grid) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);

    var dark=themeIsDark();
    var page=tok('--page',dark?'#061816':'#ffffff');
    var pale=tok('--pale',dark?'#0d2419':'#f0fbf5');
    var border=tok('--border',dark?'#1b3d2c':'#d8ede4');
    var muted=tok('--muted',dark?'#7aaa90':'#5a7067');
    var green=tok('--green','#30ba78');
    var blue=tok('--blue','#2453ff');

    ctx.fillStyle=page;
    ctx.fillRect(0,0,w,h);

    var cell=grid.cell, cols=grid.cols, rows=grid.rows, mc=grid.mc, mr=grid.mr, maxDist=grid.maxDist;

    ctx.save();
    ctx.strokeStyle=border;
    ctx.lineWidth=1;
    ctx.globalAlpha=0.5;
    ctx.setLineDash([2,6]);
    var gx=mc*cell+cell/2, gy=mr*cell+cell/2;
    ctx.beginPath(); ctx.moveTo(gx+0.5,0); ctx.lineTo(gx+0.5,h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,gy+0.5); ctx.lineTo(w,gy+0.5); ctx.stroke();
    ctx.restore();

    var front=phase*maxDist;
    var band=1.35;
    var fadeStart=h*0.4, fadeEnd=h*0.98;

    for(var r=0;r<rows;r++){
      var cy=r*cell+cell/2;
      var rowFade=1-smoothstep(fadeStart,fadeEnd,cy);
      if(rowFade<=0.02) continue;
      for(var c=0;c<cols;c++){
        if(c===mc && r===mr) continue;
        var cx=c*cell+cell/2;
        var dist=Math.max(Math.abs(c-mc),Math.abs(r-mr));
        var diff=dist-front;
        var flash=clamp01(1-Math.abs(diff)/band);
        flash=flash*flash*(3-2*flash);
        var settled=dist<=front;
        var size=cell*0.6;
        var x=cx-size/2, y=cy-size/2, rad=size*0.22;

        if(settled){
          ctx.globalAlpha=0.22*rowFade;
          ctx.fillStyle=pale;
          rr(x,y,size,size,rad); ctx.fill();
          ctx.globalAlpha=0.4*rowFade;
          ctx.strokeStyle=green;
          ctx.lineWidth=1;
          ctx.setLineDash([]);
          rr(x,y,size,size,rad); ctx.stroke();
        } else {
          ctx.globalAlpha=0.22*rowFade;
          ctx.strokeStyle=muted;
          ctx.lineWidth=1;
          ctx.setLineDash([1,4]);
          rr(x,y,size,size,rad); ctx.stroke();
        }

        if(flash>0.03){
          var fsize=size*(0.9+0.25*flash);
          var fx=cx-fsize/2, fy=cy-fsize/2, frad=fsize*0.22;
          ctx.globalAlpha=flash*0.85*rowFade;
          ctx.fillStyle=green;
          ctx.setLineDash([]);
          rr(fx,fy,fsize,fsize,frad); ctx.fill();
          ctx.globalAlpha=Math.min(1,flash)*rowFade;
          ctx.strokeStyle=blue;
          ctx.lineWidth=1.25;
          rr(fx,fy,fsize,fsize,frad); ctx.stroke();
        }
      }
    }

    var mcx=mc*cell+cell/2, mcy=mr*cell+cell/2;
    var msize=cell*0.74, mx=mcx-msize/2, my=mcy-msize/2, mrad=msize*0.24;
    ctx.save();
    ctx.globalAlpha=1;
    var grad=ctx.createLinearGradient(mx,my,mx+msize,my+msize);
    grad.addColorStop(0,green);
    grad.addColorStop(1,blue);
    ctx.fillStyle=grad;
    ctx.setLineDash([]);
    rr(mx,my,msize,msize,mrad); ctx.fill();
    ctx.globalAlpha=0.6;
    ctx.lineWidth=1.5;
    ctx.strokeStyle=page;
    rr(mx+3,my+3,msize-6,msize-6,Math.max(2,mrad-3)); ctx.stroke();
    ctx.restore();

    ctx.globalAlpha=1;
  }

  function resize(){
    var rect=root.getBoundingClientRect();
    rectW=Math.max(1,rect.width);
    rectH=Math.max(1,rect.height);
    dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(rectW*dpr);
    canvas.height=Math.round(rectH*dpr);
    computeGrid(rectW,rectH);
    draw(lastPhase);
  }

  function step(ts){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      lastPhase=0.55; draw(lastPhase); rafId=null; running=false; return;
    }
    if(startTs===null) startTs=ts;
    var elapsed=ts-startTs;
    lastPhase=(elapsed%period)/period;
    draw(lastPhase);
    if(running){ rafId=requestAnimationFrame(step); }
  }

  function start(){
    if(rafId!==null) return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      lastPhase=0.55; draw(lastPhase); return;
    }
    running=true; startTs=null;
    rafId=requestAnimationFrame(step);
  }

  function stop(){
    running=false;
    if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; }
  }

  function sync(){
    if(inView && pageVisible){ start(); } else { stop(); }
  }

  function forceRepaint(){
    if(!running){
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ draw(0.55); }
      else { draw(lastPhase); }
    }
  }

  if(typeof ResizeObserver!=='undefined'){
    var ro=new ResizeObserver(function(){ resize(); });
    ro.observe(root);
  } else {
    window.addEventListener('resize', resize);
  }

  var io=new IntersectionObserver(function(entries){
    inView = entries[0] ? entries[0].isIntersecting : true;
    sync();
  }, {threshold:0});
  io.observe(root);

  document.addEventListener('visibilitychange', function(){
    pageVisible=!document.hidden;
    sync();
  });

  var mo=new MutationObserver(function(){ forceRepaint(); });
  mo.observe(document.documentElement, {attributes:true, attributeFilter:['class']});

  var mm=window.matchMedia('(prefers-color-scheme: dark)');
  if(mm.addEventListener){ mm.addEventListener('change', forceRepaint); }
  else if(mm.addListener){ mm.addListener(forceRepaint); }

  resize();
  sync();
})();
</script>
