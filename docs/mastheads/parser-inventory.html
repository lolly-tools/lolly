<!--
  Concept: a ragged storm of muted byte-strokes streams in from the left edge — attacker-controlled input, jittering at every angle and length — and at a thin combed gate each stroke is snapped level, trimmed to a uniform length, recoloured green and shelved into its own faint bounded cell in tidy ledger rows. The gate is the parser boundary, each cell the bounds a module declares, and the settled ledger is the inventory: chaos brought into bounded, verified structure.
  Band contract: full-bleed absolute fragment behind the h1, aria-hidden, sized from the live element rect; detail is held in the upper band and the base melts to --page so the lower-left h1 sits on quiet ground. Reads theme tokens live and repaints on html-class mutation and prefers-color-scheme change; reduced motion renders one static frame; the loop self-suspends off-screen and when the document is hidden.

<div class="pi" aria-hidden="true"><canvas></canvas></div>
<style>
  .pi { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .pi canvas { display: block; width: 100%; height: 100%; }
</style>
<script>
(function(){
  var root = document.querySelector('.pi');
  var canvas = root.querySelector('canvas');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, dpr = 1;
  var isVisible = false, isPlaying = true, rafId = null;
  var time = 4.25; /* static-frame moment: mixed travel/settled states */
  var C = {}, dark = false;
  var G = null, items = [], chaosN = 0;

  function tok(n, f) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return v || f;
  }

  function updateColors() {
    dark = document.documentElement.classList.contains('dark');
    C.page   = tok('--page',   dark ? '#061816' : '#ffffff');
    C.muted  = tok('--muted',  dark ? '#7aaa90' : '#5a7067');
    C.border = tok('--border', dark ? '#1b3d2c' : '#d8ede4');
    C.green  = tok('--green',  '#30ba78');
  }

  function h(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function rgb(c) {
    var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c);
    if (!m) return null;
    var s = m[1];
    if (s.length === 3) s = s.charAt(0)+s.charAt(0)+s.charAt(1)+s.charAt(1)+s.charAt(2)+s.charAt(2);
    return [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
  }
  function rgba(c, a) {
    var v = rgb(c);
    return v ? 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')' : c;
  }
  function mix(c1, c2, f) {
    var a = rgb(c1), b = rgb(c2);
    if (!a || !b) return f < 0.5 ? c1 : c2;
    return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*f) + ',' + Math.round(a[1]+(b[1]-a[1])*f) + ',' + Math.round(a[2]+(b[2]-a[2])*f) + ')';
  }

  function rebuild() {
    var gx = W * 0.52;
    var top = H * 0.08;
    var artH = H * 0.56;
    var rows = Math.max(3, Math.min(8, Math.floor(artH / 26)));
    var rowH = artH / rows;
    var avail = Math.max(40, (W - gx) - 70);
    var cols = Math.max(3, Math.min(14, Math.floor(avail / 44)));
    var colW = avail / cols;
    G = {
      gx: gx, top: top, artH: artH,
      rows: rows, rowH: rowH, cols: cols, colW: colW,
      tickL: Math.min(colW * 0.55, 20)
    };
    items = [];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var s = r * 53 + c * 17 + 7;
        items.push({ r: r, c: c, s: s, ph: h(s * 1.7 + 3), T: 8 + h(s + 11) * 5 });
      }
    }
    chaosN = Math.max(30, Math.min(110, Math.round((gx * artH) / 2600)));
  }

  function seg(x, y, ang, len, w, style, a) {
    var dx = Math.cos(ang) * len / 2, dy = Math.sin(ang) * len / 2;
    ctx.beginPath();
    ctx.moveTo(x - dx, y - dy);
    ctx.lineTo(x + dx, y + dy);
    ctx.lineWidth = w;
    ctx.strokeStyle = style;
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.stroke();
  }

  function cellPath(x, y, w, hh, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.lineTo(x + w - rad, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
    ctx.lineTo(x + w, y + hh - rad);
    ctx.quadraticCurveTo(x + w, y + hh, x + w - rad, y + hh);
    ctx.lineTo(x + rad, y + hh);
    ctx.quadraticCurveTo(x, y + hh, x, y + hh - rad);
    ctx.lineTo(x, y + rad);
    ctx.quadraticCurveTo(x, y, x + rad, y);
    ctx.closePath();
  }

  function draw(t) {
    if (W < 2 || H < 2 || !G) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.page;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';

    var gx = G.gx, top = G.top, artH = G.artH;
    var rows = G.rows, rowH = G.rowH, cols = G.cols, colW = G.colW, tickL = G.tickL;
    var i, x, y;

    /* ledger row rules on the ordered side */
    ctx.strokeStyle = C.border;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.7;
    for (i = 0; i <= rows; i++) {
      y = top + i * rowH;
      ctx.beginPath();
      ctx.moveTo(gx + 18, y);
      ctx.lineTo(W - 20, y);
      ctx.stroke();
    }

    /* ambient raw-byte noise, left of the gate, densest far-left */
    for (i = 0; i < chaosN; i++) {
      var s = i * 7.3 + 1;
      var fx = Math.pow(h(s), 1.25);
      var cw = Math.max(10, gx - 48);
      x = 8 + fx * cw;
      y = top - 6 + h(s + 9) * (artH + 14) + Math.sin(t * (0.6 + h(s + 3)) + s) * 4;
      var ang = (h(s + 5) - 0.5) * 2.6 + Math.sin(t * (0.8 + h(s + 6)) + s * 1.7) * 0.5;
      var len = 5 + h(s + 7) * 16 * (0.7 + 0.3 * Math.sin(t * 2 + s));
      var fl = 0.5 + 0.5 * Math.sin(t * (1.5 + h(s + 8) * 2) + s * 3.1);
      var a = (0.10 + 0.26 * fl) * (0.35 + 0.65 * (1 - fx * 0.6));
      seg(x, y, ang, len, 1 + h(s + 2) * 1.2, C.muted, a);
    }

    /* the gate: a soft field, twin uprights, comb teeth at row pitch */
    var glow = dark ? 0.08 : 0.06;
    var gr = ctx.createLinearGradient(gx - 30, 0, gx + 30, 0);
    gr.addColorStop(0, rgba(C.green, 0));
    gr.addColorStop(0.5, rgba(C.green, glow));
    gr.addColorStop(1, rgba(C.green, 0));
    ctx.globalAlpha = 1;
    ctx.fillStyle = gr;
    ctx.fillRect(gx - 30, top - 12, 60, artH + 24);

    ctx.strokeStyle = C.green;
    ctx.globalAlpha = 0.35 + 0.08 * Math.sin(t * 1.3);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(gx, top - 10); ctx.lineTo(gx, top + artH + 10); ctx.stroke();
    ctx.globalAlpha = 0.14;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(gx + 6, top - 6); ctx.lineTo(gx + 6, top + artH + 6); ctx.stroke();
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1.2;
    for (i = 0; i <= rows; i++) {
      y = top + i * rowH;
      ctx.beginPath(); ctx.moveTo(gx - 5, y); ctx.lineTo(gx + 10, y); ctx.stroke();
    }

    /* migrating bytes: chaos -> gate -> snapped into a bounded slot */
    for (i = 0; i < items.length; i++) {
      var it = items[i];
      var u = ((t / it.T) + it.ph) % 1;
      var slotX = gx + 46 + (it.c + 0.5) * colW;
      var slotY = top + (it.r + 0.5) * rowH;
      var gateY = slotY + (h(it.s + 4) - 0.5) * rowH * 1.6;
      if (gateY < top + 4) gateY = top + 4;
      if (gateY > top + artH - 4) gateY = top + artH - 4;
      var A0 = (h(it.s + 5) - 0.5) * 2.2;
      var L0 = 7 + h(it.s + 3) * 15;

      if (u < 0.30) {
        var p = u / 0.30;
        var startX = -30 - h(it.s + 1) * W * 0.1;
        var yStart = top + h(it.s + 2) * artH;
        x = startX + (gx - startX) * p;
        y = yStart + (gateY - yStart) * p + Math.sin(t * 2.2 + it.s) * rowH * 0.8 * (1 - p);
        seg(x, y,
          A0 + Math.sin(t * 3 + it.s * 2) * 0.9 * (1 - p),
          L0 * (0.8 + 0.25 * Math.sin(t * 4 + it.s)),
          1.3, C.muted,
          0.3 + 0.2 * Math.sin(t * 3 + it.s * 1.3));
      } else if (u < 0.44) {
        var q = (u - 0.30) / 0.14;
        var e = q * q * (3 - 2 * q);
        x = gx + (slotX - gx) * e;
        y = gateY + (slotY - gateY) * e;
        if (e < 0.3) {
          seg(gx + 1, gateY, 0, 14, 2, C.green, 0.9 * (1 - e / 0.3));
        }
        seg(x, y, A0 * (1 - e), L0 + (tickL - L0) * e,
          1.3 + 0.7 * e, mix(C.muted, C.green, e), 0.45 + 0.4 * e);
      } else {
        var appear = Math.min(1, (u - 0.44) / 0.05);
        var fade = u > 0.94 ? 1 - (u - 0.94) / 0.06 : 1;
        var k = appear * fade;
        var cwd = colW * 0.78;
        var chd = Math.min(rowH * 0.62, 20);
        cellPath(slotX - cwd / 2, slotY - chd / 2, cwd, chd, 3);
        ctx.strokeStyle = C.green;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.24 * k;
        ctx.stroke();
        seg(slotX, slotY, 0, tickL, 2, C.green, 0.85 * k);
      }
    }

    /* melt the base of the band into --page so the h1 sits on quiet ground */
    var mg = ctx.createLinearGradient(0, H * 0.42, 0, H);
    mg.addColorStop(0, rgba(C.page, 0));
    mg.addColorStop(0.55, rgba(C.page, 0.85));
    mg.addColorStop(1, rgba(C.page, 1));
    ctx.globalAlpha = 1;
    ctx.fillStyle = mg;
    ctx.fillRect(0, H * 0.42, W, H * 0.58);
  }

  function loop(ts) {
    if (!isPlaying || !isVisible) { rafId = null; return; }
    time = ts * 0.001;
    draw(time);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    } else {
      rafId = null;
    }
  }

  var ro = new ResizeObserver(function(entries) {
    var rect = entries[0].contentRect;
    W = rect.width;
    H = rect.height;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    rebuild();
    updateColors();
    draw(time);
  });
  ro.observe(root);

  var io = new IntersectionObserver(function(entries) {
    isVisible = entries[0].isIntersecting;
    if (isVisible) {
      if (isPlaying && !rafId && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        rafId = requestAnimationFrame(loop);
      } else if (!rafId) {
        draw(time);
      }
    } else if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });
  io.observe(root);

  document.addEventListener('visibilitychange', function() {
    isPlaying = !document.hidden;
    if (isPlaying && isVisible && !rafId && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    } else if (!isPlaying && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });

  function repaint() {
    updateColors();
    draw(time); /* repaints even when idle at rest */
  }
  var mo = new MutationObserver(repaint);
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);

  updateColors();
})();
</script>
