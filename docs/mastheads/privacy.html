<!-- Concept: a protected interior. Soft green marks live and wander freely inside a calm, clearly
bounded rounded chamber — pressing gently toward the edge as they drift, then settling back inward,
never once crossing the boundary line. Outside the chamber stays empty and still. That is the Privacy
page's whole thesis in one shape: everything you make in Lolly — documents, images, video, files — is
held and worked on entirely on your own device. There is no server in the middle for it to reach, so
there is nothing for it to leave through.
Band contract: .pv is position:absolute;inset:0;overflow:hidden;pointer-events:none, aria-hidden; the
canvas fills the live element rect via ResizeObserver; particles are physically contained by a rounded-
box signed-distance field and clipped to the vessel path so nothing can ever visually cross it; detail
concentrates in the upper chamber, the lower band melts into --page. Tokens are read live via
getComputedStyle with light/dark fallbacks, repainting on html.class and prefers-color-scheme changes;
reduced motion renders one pre-settled static frame with no loop; the loop self-suspends off-screen and
when the tab is hidden.

<div class="pv" aria-hidden="true"><canvas></canvas></div>
<style>
.pv{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.pv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
<script>
(function(){
  var root=document.querySelector('.pv');
  var canvas=root.querySelector('canvas');
  var ctx=canvas.getContext('2d');

  function tok(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}
  function themeIsDark(){return document.documentElement.classList.contains('dark');}
  function clamp01(v){return v<0?0:v>1?1:v;}

  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function sdBox(px,py,cx,cy,hw,hh,r){
    var dx=Math.abs(px-cx)-(hw-r);
    var dy=Math.abs(py-cy)-(hh-r);
    var ax=dx>0?dx:0, ay=dy>0?dy:0;
    return Math.min(Math.max(dx,dy),0)+Math.sqrt(ax*ax+ay*ay)-r;
  }

  function sdNormal(px,py,v){
    var e=0.6;
    var dx=sdBox(px+e,py,v.cx,v.cy,v.hw,v.hh,v.r)-sdBox(px-e,py,v.cx,v.cy,v.hw,v.hh,v.r);
    var dy=sdBox(px,py+e,v.cx,v.cy,v.hw,v.hh,v.r)-sdBox(px,py-e,v.cx,v.cy,v.hw,v.hh,v.r);
    var len=Math.sqrt(dx*dx+dy*dy)||1;
    return {x:dx/len,y:dy/len};
  }

  function vessel(w,h){
    var x=w*0.045, y=h*0.07, vw=w*0.91, vh=h*0.58;
    var r=Math.min(vw,vh)*0.40;
    return {x:x,y:y,w:vw,h:vh,r:r,cx:x+vw/2,cy:y+vh/2,hw:vw/2,hh:vh/2};
  }

  var rectW=0, rectH=0, dpr=1, particles=null, simTime=0;
  var rafId=null, running=false, inView=true, pageVisible=!document.hidden;

  function spawnParticle(v){
    return {
      x: v.cx+(Math.random()*2-1)*v.hw*0.72,
      y: v.cy+(Math.random()*2-1)*v.hh*0.72,
      vx: (Math.random()*2-1)*0.15,
      vy: (Math.random()*2-1)*0.15,
      r: 2+Math.random()*3.2,
      seed: Math.random()*1000,
      tone: Math.random()<0.72?0:1
    };
  }

  function stepParticle(p,v,t){
    var ax=Math.sin(t*0.55+p.seed)*0.010;
    var ay=Math.cos(t*0.47+p.seed*1.3)*0.010;
    p.vx+=ax; p.vy+=ay;
    p.vx*=0.985; p.vy*=0.985;

    var margin=Math.min(v.hw,v.hh)*0.32;
    var sd=sdBox(p.x,p.y,v.cx,v.cy,v.hw,v.hh,v.r);
    if(sd>-margin){
      var n=sdNormal(p.x,p.y,v);
      var tt=clamp01((sd+margin)/margin);
      var force=tt*tt*0.05;
      p.vx-=n.x*force; p.vy-=n.y*force;
      p.vx*=0.965; p.vy*=0.965;
    }

    p.x+=p.vx; p.y+=p.vy;

    var limit=-(p.r+1.5);
    var sd2=sdBox(p.x,p.y,v.cx,v.cy,v.hw,v.hh,v.r);
    if(sd2>limit){
      var n2=sdNormal(p.x,p.y,v);
      var push=sd2-limit;
      p.x-=n2.x*push; p.y-=n2.y*push;
      var vn=p.vx*n2.x+p.vy*n2.y;
      if(vn>0){ p.vx-=n2.x*vn*1.5; p.vy-=n2.y*vn*1.5; }
    }
  }

  function initParticles(){
    var v=vessel(rectW,rectH);
    var count=Math.max(14,Math.min(30,Math.round(rectW/50)));
    particles=[];
    for(var i=0;i<count;i++){ particles.push(spawnParticle(v)); }
    var t=0;
    for(var s=0;s<220;s++){
      t+=0.016;
      for(var j=0;j<particles.length;j++){ stepParticle(particles[j],v,t); }
    }
    simTime=t;
  }

  function meltFade(w,h,page){
    var top=h*0.46, bands=40, bh=(h-top)/bands;
    ctx.fillStyle=page;
    for(var i=0;i<bands;i++){
      var a=Math.pow(i/(bands-1),1.5);
      ctx.globalAlpha=a;
      ctx.fillRect(0, top+i*bh, w, bh+1);
    }
    ctx.globalAlpha=1;
  }

  function draw(){
    var w=rectW, h=rectH;
    if(!w||!h) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);

    var dark=themeIsDark();
    var page=tok('--page',dark?'#061816':'#ffffff');
    var pale=tok('--pale',dark?'#0d2419':'#f0fbf5');
    var green=tok('--green','#30ba78');
    var light=tok('--light','#90ebcd');

    ctx.fillStyle=page;
    ctx.fillRect(0,0,w,h);

    var v=vessel(w,h);

    rr(v.x,v.y,v.w,v.h,v.r);
    ctx.fillStyle=pale;
    ctx.globalAlpha=dark?0.9:0.88;
    ctx.fill();
    ctx.globalAlpha=1;

    ctx.save();
    rr(v.x,v.y,v.w,v.h,v.r);
    ctx.clip();

    var r0=Math.max(1,Math.min(v.hw,v.hh)*0.1);
    var r1=Math.max(r0+1,Math.max(v.hw,v.hh)*1.05);
    var vg=ctx.createRadialGradient(v.cx,v.cy,r0,v.cx,v.cy,r1);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1, dark?'rgba(0,0,0,0.18)':'rgba(0,0,0,0.05)');
    ctx.fillStyle=vg;
    ctx.fillRect(v.x,v.y,v.w,v.h);

    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      var col=p.tone===1?light:green;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*2.6,0,Math.PI*2);
      ctx.fillStyle=col;
      ctx.globalAlpha=0.07;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=col;
      ctx.globalAlpha=0.55;
      ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();

    rr(v.x,v.y,v.w,v.h,v.r);
    ctx.strokeStyle=green;
    ctx.globalAlpha=0.85;
    ctx.lineWidth=1.6;
    ctx.stroke();
    ctx.globalAlpha=1;

    meltFade(w,h,page);
  }

  function resize(){
    var rect=root.getBoundingClientRect();
    var w=Math.max(1,rect.width), h=Math.max(1,rect.height);
    dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);

    var oldW=rectW, oldH=rectH;
    rectW=w; rectH=h;

    if(!particles){
      initParticles();
    } else if(oldW>0 && oldH>0 && (oldW!==w || oldH!==h)){
      var sx=w/oldW, sy=h/oldH;
      for(var i=0;i<particles.length;i++){
        particles[i].x*=sx; particles[i].y*=sy;
        particles[i].vx*=sx; particles[i].vy*=sy;
      }
    }
    draw();
  }

  function frame(){
    rafId=null;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      draw();
      return;
    }
    simTime+=0.016;
    var v=vessel(rectW,rectH);
    for(var i=0;i<particles.length;i++){ stepParticle(particles[i],v,simTime); }
    draw();
    if(running){ rafId=requestAnimationFrame(frame); }
  }

  function start(){
    if(rafId!==null) return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      draw();
      return;
    }
    running=true;
    rafId=requestAnimationFrame(frame);
  }

  function stop(){
    running=false;
    if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; }
  }

  function sync(){
    if(inView && pageVisible){ start(); } else { stop(); }
  }

  function forceRepaint(){ draw(); }

  if(typeof ResizeObserver!=='undefined'){
    var ro=new ResizeObserver(function(){ resize(); });
    ro.observe(root);
  } else {
    window.addEventListener('resize', resize);
  }

  var io=new IntersectionObserver(function(entries){
    inView = entries[0] ? entries[0].isIntersecting : true;
    sync();
  }, {threshold:0});
  io.observe(root);

  document.addEventListener('visibilitychange', function(){
    pageVisible=!document.hidden;
    sync();
  });

  var mo=new MutationObserver(function(){ forceRepaint(); });
  mo.observe(document.documentElement, {attributes:true, attributeFilter:['class']});

  var mm=window.matchMedia('(prefers-color-scheme: dark)');
  if(mm.addEventListener){ mm.addEventListener('change', forceRepaint); }
  else if(mm.addListener){ mm.addListener(forceRepaint); }

  resize();
  sync();
})();
</script>
