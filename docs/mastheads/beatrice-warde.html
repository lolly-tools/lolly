<!--
  Concept: The Crystal Goblet — Beatrice Warde's 1932 credo that typography, like a
  crystal goblet, is finest when it disappears: a clear vessel that reveals what it
  carries rather than itself. A barely-there vessel silhouette sits in the light,
  catching a slow net of crossing caustic refractions and one faint rim highlight —
  the glass stays almost invisible; the light passing through it is what reads.
  Band Contract: full-bleed absolute fragment behind the h1, aria-hidden, scoped under
  .bw, sized from the live element rect, reads theme tokens live with repaint on theme
  change, honours reduced motion (one static frame, no loop) and self-suspends
  off-screen / when hidden.
  Provenance: Generated by Claude Sonnet 5 (Anthropic) for the Lolly docs masthead
  bank, commissioned by Andy Fitzsimon (the accountable human author), per-page brief
  composed by Claude Opus 4.8, on 2026-08-13; model serving region/jurisdiction: not
  disclosed. The C2PA signature added at bank time is this file's first provenance
  record.
-->
<div class="bw" aria-hidden="true"><canvas></canvas></div>
<style>
  .bw {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bw canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script>
(function(){
  var root = document.querySelector('.bw');
  var canvas = root.querySelector('canvas');
  var ctx = canvas.getContext('2d');

  var width = 0, height = 0, dpr = 1;
  var isVisible = false, isPlaying = true, rafId = null, time = 0;
  var colors = {};
  var vx = 0, vTopY = 0, vMidY = 0, vBotY = 0, vTopHW = 0, vNeckHW = 0;

  function tok(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  function hexToRgba(hex, alpha) {
    hex = (hex || '').trim();
    if (hex.charAt(0) === '#') {
      var h = hex.substring(1);
      if (h.length === 3) { h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2); }
      var r = parseInt(h.substring(0, 2), 16);
      var g = parseInt(h.substring(2, 4), 16);
      var b = parseInt(h.substring(4, 6), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }
    var m = hex.match(/rgba?\(([^)]+)\)/);
    if (m) {
      var p = m[1].split(',');
      return 'rgba(' + p[0].trim() + ',' + p[1].trim() + ',' + p[2].trim() + ',' + alpha + ')';
    }
    return 'rgba(144,235,205,' + alpha + ')';
  }

  function updateColors() {
    colors.page = tok('--page', '#ffffff');
    colors.pale = tok('--pale', '#f0fbf5');
    colors.light = tok('--light', '#90ebcd');
    colors.green = tok('--green', '#30ba78');
    colors.border = tok('--border', '#d8ede4');
  }

  // Two crossing families of caustic wave-lines: light bent through a clear vessel
  // reads as a net of shimmering cusps, not a single directional flow.
  var wavesA = [], wavesB = [];
  (function seed() {
    var i, j;
    for (i = 0; i < 9; i++) {
      wavesA.push({
        yf: 0.06 + i * 0.058,
        amp: 5 + (i % 3) * 4,
        freq: 0.006 + (i % 4) * 0.0025,
        phase: i * 0.9,
        speed: 0.12 + (i % 3) * 0.05,
        tint: i % 2 === 0 ? 'green' : 'light',
        alpha: 0.05 + (i % 3) * 0.018
      });
    }
    for (j = 0; j < 6; j++) {
      wavesB.push({
        yf: 0.04 + j * 0.09,
        slope: 0.09 + (j % 2) * 0.05,
        amp: 4 + (j % 3) * 3,
        freq: 0.012 + (j % 3) * 0.003,
        phase: j * 1.3,
        speed: 0.09 + (j % 2) * 0.04,
        tint: j % 2 === 0 ? 'light' : 'green',
        alpha: 0.045 + (j % 3) * 0.016
      });
    }
  })();

  var glints = [
    { xf: 0.24, yf: 0.14, r: 10, ph: 0.0 },
    { xf: 0.52, yf: 0.22, r: 7,  ph: 1.4 },
    { xf: 0.66, yf: 0.10, r: 12, ph: 2.6 },
    { xf: 0.40, yf: 0.34, r: 6,  ph: 4.1 },
    { xf: 0.78, yf: 0.30, r: 8,  ph: 5.3 }
  ];

  function layout() {
    vx = width * 0.70;
    vTopY = height * -0.10;
    vMidY = height * 0.30;
    vBotY = height * 0.64;
    vTopHW = width * 0.15;
    vNeckHW = width * 0.045;
  }

  function vesselPath(rightOnly) {
    ctx.beginPath();
    if (!rightOnly) {
      ctx.moveTo(vx - vTopHW, vTopY);
      ctx.quadraticCurveTo(vx - vTopHW * 1.05, vMidY, vx - vNeckHW, vBotY);
      ctx.lineTo(vx + vNeckHW, vBotY);
      ctx.quadraticCurveTo(vx + vTopHW * 1.05, vMidY, vx + vTopHW, vTopY);
      ctx.closePath();
    } else {
      ctx.moveTo(vx + vNeckHW, vBotY);
      ctx.quadraticCurveTo(vx + vTopHW * 1.05, vMidY, vx + vTopHW, vTopY);
    }
  }

  function draw(t) {
    if (!width || !height) return;
    ctx.clearRect(0, 0, width, height);

    ctx.fillStyle = colors.page;
    ctx.fillRect(0, 0, width, height);

    var wash = ctx.createLinearGradient(0, 0, 0, height);
    wash.addColorStop(0, hexToRgba(colors.pale, 0.6));
    wash.addColorStop(0.55, hexToRgba(colors.pale, 0.15));
    wash.addColorStop(1, hexToRgba(colors.pale, 0));
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, width, Math.min(height, height * 0.68));
    ctx.clip();

    wavesA.forEach(function (w) {
      var x, y;
      ctx.beginPath();
      ctx.moveTo(0, w.yf * height + Math.sin(w.phase + t * w.speed) * w.amp);
      for (x = 0; x <= width; x += 8) {
        y = w.yf * height + Math.sin(x * w.freq + w.phase + t * w.speed) * w.amp;
        ctx.lineTo(x, y);
      }
      ctx.strokeStyle = hexToRgba(colors[w.tint], w.alpha);
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    wavesB.forEach(function (w) {
      var x, y;
      ctx.beginPath();
      for (x = 0; x <= width; x += 8) {
        y = w.yf * height + x * w.slope * 0.15 + Math.sin(x * w.freq + w.phase + t * w.speed) * w.amp;
        if (x === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
      }
      ctx.strokeStyle = hexToRgba(colors[w.tint], w.alpha);
      ctx.lineWidth = 0.75;
      ctx.stroke();
    });

    glints.forEach(function (g) {
      var gx = width * g.xf, gy = height * g.yf;
      var pulse = 0.5 + Math.sin(t * 0.35 + g.ph) * 0.18;
      var rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, g.r);
      rg.addColorStop(0, hexToRgba(colors.light, 0.35 * pulse + 0.1));
      rg.addColorStop(1, hexToRgba(colors.light, 0));
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(gx, gy, g.r, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();

    vesselPath(false);
    var vg = ctx.createLinearGradient(vx, vTopY, vx, vBotY);
    vg.addColorStop(0, hexToRgba(colors.light, 0.10));
    vg.addColorStop(0.5, hexToRgba(colors.light, 0.05));
    vg.addColorStop(1, hexToRgba(colors.light, 0));
    ctx.fillStyle = vg;
    ctx.fill();
    ctx.strokeStyle = hexToRgba(colors.border, 0.3);
    ctx.lineWidth = 1;
    ctx.stroke();

    vesselPath(true);
    var rim = 0.32 + Math.sin(t * 0.4) * 0.12;
    ctx.strokeStyle = hexToRgba(colors.light, rim);
    ctx.lineWidth = 1.4;
    ctx.stroke();

    var fade = ctx.createLinearGradient(0, height * 0.5, 0, height);
    fade.addColorStop(0, hexToRgba(colors.page, 0));
    fade.addColorStop(1, hexToRgba(colors.page, 1));
    ctx.fillStyle = fade;
    ctx.fillRect(0, height * 0.5, width, height * 0.5);
  }

  function loop(ts) {
    if (!isPlaying || !isVisible) { rafId = null; return; }
    time = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ts * 0.001;
    draw(time);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    } else {
      rafId = null;
    }
  }

  function kick() {
    if (isPlaying && isVisible && !rafId && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    }
  }

  var ro = new ResizeObserver(function (entries) {
    var rect = entries[0].contentRect;
    dpr = window.devicePixelRatio || 1;
    width = rect.width;
    height = rect.height;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    updateColors();
    draw(window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : time);
  });
  ro.observe(root);

  var io = new IntersectionObserver(function (entries) {
    isVisible = entries[0].isIntersecting;
    if (isVisible) {
      kick();
    } else if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });
  io.observe(root);

  document.addEventListener('visibilitychange', function () {
    isPlaying = !document.hidden;
    if (isPlaying) {
      kick();
    } else if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });

  var mo = new MutationObserver(function () {
    updateColors();
    draw(window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : time);
  });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    updateColors();
    draw(window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : time);
  });

  updateColors();
  var r0 = root.getBoundingClientRect();
  width = r0.width;
  height = r0.height;
  dpr = window.devicePixelRatio || 1;
  if (width && height) {
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    draw(0);
  }
  kick();
})();
</script>
