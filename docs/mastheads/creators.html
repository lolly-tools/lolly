<style>
.cr8{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.cr8 canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
<script>
(function(){
  var root=document.querySelector('.cr8');
  if(!root)return;
  var canvas=root.querySelector('canvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  if(!ctx)return;

  function tok(name,fb){var v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();return v||fb;}
  function isDark(){return document.documentElement.classList.contains('dark');}
  function rnd(n){var x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
  function sstep(a,b,x){var t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);}
  function rgb(s,fb){
    s=(s||'').trim()||fb;
    if(s.charAt(0)==='#'){
      if(s.length===4){return[parseInt(s.charAt(1)+s.charAt(1),16),parseInt(s.charAt(2)+s.charAt(2),16),parseInt(s.charAt(3)+s.charAt(3),16)];}
      return[parseInt(s.substr(1,2),16),parseInt(s.substr(3,2),16),parseInt(s.substr(5,2),16)];
    }
    var m=s.match(/([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/);
    if(m){return[Math.round(+m[1]),Math.round(+m[2]),Math.round(+m[3])];}
    if(fb&&fb!==s){return rgb(fb,'#888888');}
    return[136,136,136];
  }
  function css(c,a){return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

  var pal={},palDirty=true;
  function buildPal(){
    var dk=isDark();
    pal.page=rgb(tok('--page',dk?'#061816':'#ffffff'),dk?'#061816':'#ffffff');
    pal.pale=rgb(tok('--pale',dk?'#0d2419':'#f0fbf5'),dk?'#0d2419':'#f0fbf5');
    pal.line=rgb(tok('--border',dk?'#1b3d2c':'#d8ede4'),dk?'#1b3d2c':'#d8ede4');
    pal.green=rgb(tok('--green','#30ba78'),'#30ba78');
    pal.blue=rgb(tok('--blue','#2453ff'),'#2453ff');
    pal.orange=rgb(tok('--orange','#fe7c3f'),'#fe7c3f');
    pal.spare=dk?rgb(tok('--light','#90ebcd'),'#90ebcd'):rgb(tok('--navy','#192072'),'#192072');
    palDirty=false;
  }
  function colorFor(r){
    if(r<0.66)return pal.green;
    if(r<0.80)return pal.blue;
    if(r<0.90)return pal.orange;
    return pal.spare;
  }

  var W=0,H=0,dpr=1,lanes=[],seedX=0,seedY=0,fanX=0,exitX=0,tf=0.2,seedR=14,gl=4,DUR=16;
  function fit(){
    var r=root.getBoundingClientRect();
    W=Math.max(1,r.width);H=Math.max(1,r.height);
    dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
    var n=H<230?4:5,top=H*0.16,bot=H*0.80,gap=n>1?(bot-top)/(n-1):0;
    var half=Math.min(gap*0.36,H*0.085);
    lanes=[];
    for(var i=0;i<n;i++){
      lanes.push({y:top+gap*i,half:half*(0.82+0.34*rnd(i*31+5)),s:[0.8,1.02,0.9,1,0.74][i%5]});
    }
    seedX=Math.max(64,W*0.14);
    seedY=(top+bot)/2;
    fanX=seedX+Math.max(110,W*0.17);
    exitX=W+70;
    tf=(fanX-seedX)/(exitX-seedX);
    seedR=Math.min(24,half*1.1+6);
    gl=Math.max(3,Math.min(6,Math.round(W/300)));
  }

  function rrect(cx,cy,hw,hh,rad){
    var x=cx-hw,y=cy-hh,w2=hw*2,h2=hh*2,r2=Math.min(rad,hw,hh);
    ctx.beginPath();
    ctx.moveTo(x+r2,y);
    ctx.arcTo(x+w2,y,x+w2,y+h2,r2);
    ctx.arcTo(x+w2,y+h2,x,y+h2,r2);
    ctx.arcTo(x,y+h2,x,y,r2);
    ctx.arcTo(x,y,x+w2,y,r2);
    ctx.closePath();
  }

  function draw(time){
    if(!W||!H)return;
    if(palDirty)buildPal();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=css(pal.page,1);ctx.fillRect(0,0,W,H);
    var gg=ctx.createRadialGradient(seedX,seedY,0,seedX,seedY,Math.max(60,H*0.55));
    gg.addColorStop(0,css(pal.pale,0.85));gg.addColorStop(1,css(pal.pale,0));
    ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
    var i,j,k;
    ctx.lineWidth=1;
    ctx.strokeStyle=css(pal.line,0.9);
    for(i=0;i<lanes.length;i++){
      var L=lanes[i];
      for(k=-1;k<=1;k+=2){
        var ey=L.y+k*L.half;
        ctx.beginPath();
        ctx.moveTo(seedX+seedR*1.7,seedY+k*4);
        ctx.quadraticCurveTo(seedX+(fanX-seedX)*0.55,ey,fanX,ey);
        ctx.lineTo(W,ey);
        ctx.stroke();
      }
    }
    for(i=0;i<lanes.length;i++){
      var L2=lanes[i];
      for(j=0;j<gl;j++){
        var idx=i*97+j*13+1;
        var phase=j/gl+i*0.137+rnd(idx)*0.05;
        var t=((time/DUR)+phase)%1;
        var x=seedX+t*(exitX-seedX);
        var e=sstep(0,tf,t);
        var kind=Math.floor(rnd(idx+3)*4)%4,hh,hw;
        var s=L2.half*L2.s*(0.62+0.5*rnd(idx+11));
        if(kind===1){hh=Math.min(s*0.6,L2.half*0.88);hw=hh*2.2;}
        else if(kind===2){hh=Math.min(s*1.05,L2.half*0.92);hw=hh*0.72;}
        else{hh=Math.min(s,L2.half*0.9);hw=hh;}
        var grow=sstep(0,tf*0.8,t);
        hh*=grow;hw*=grow;
        if(hh<0.5)continue;
        var amp=Math.max(0,L2.half-hh-1.5);
        var wob=amp*0.9*Math.sin(rnd(idx+17)*6.2832+t*26)*Math.exp(-Math.max(0,t-tf)*7)*e;
        var y=seedY+(L2.y-seedY)*e+wob;
        var fa=sstep(0,0.05,t);
        var col=colorFor(rnd(idx+7));
        ctx.lineWidth=Math.max(1.3,Math.min(hw,hh)*0.2);
        if(kind===3){
          ctx.beginPath();ctx.arc(x,y,Math.max(0.5,hw*0.85),0,Math.PI*2);ctx.closePath();
        }else{
          rrect(x,y,hw,hh,Math.min(hw,hh)*0.42);
        }
        ctx.fillStyle=css(col,fa*(0.10+0.10*sstep(tf,tf+0.4,t)));
        ctx.fill();
        ctx.strokeStyle=css(col,fa*0.9);
        ctx.stroke();
      }
    }
    for(k=0;k<3;k++){
      var p=((time*0.16)+k/3)%1;
      var er=seedR*(1+p*2.6);
      ctx.lineWidth=1.4;
      ctx.strokeStyle=css(pal.green,(1-p)*(1-p)*0.45);
      rrect(seedX,seedY,er,er,er*0.42);
      ctx.stroke();
    }
    var br=seedR*(1+0.05*Math.sin(time*1.8));
    rrect(seedX,seedY,br,br,br*0.42);
    ctx.fillStyle=css(pal.green,0.96);
    ctx.fill();
    var g2=ctx.createRadialGradient(W*0.5,H*1.32,H*0.15,W*0.5,H*1.32,H*1.25);
    g2.addColorStop(0,css(pal.page,0.88));
    g2.addColorStop(1,css(pal.page,0));
    ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  }

  var running=false,rafId=0,tPrev=0,tAcc=11.3,inView=true;
  function tick(now){
    if(!running)return;
    if(!tPrev)tPrev=now;
    var dt=Math.min(60,now-tPrev);tPrev=now;tAcc+=dt/1000;
    draw(tAcc);
    if(running&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){rafId=requestAnimationFrame(tick);}
    else{running=false;rafId=0;}
  }
  function start(){
    if(running)return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){draw(tAcc);return;}
    running=true;tPrev=0;
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){rafId=requestAnimationFrame(tick);}
  }
  function stop(){running=false;if(rafId){cancelAnimationFrame(rafId);rafId=0;}}
  function sync(){if(inView&&!document.hidden){start();}else{stop();}}
  function repaint(){palDirty=true;draw(tAcc);}

  if('MutationObserver' in window){
    new MutationObserver(repaint).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  }
  var mqd=window.matchMedia('(prefers-color-scheme: dark)');
  if(mqd.addEventListener){mqd.addEventListener('change',repaint);}else if(mqd.addListener){mqd.addListener(repaint);}
  var mqm=window.matchMedia('(prefers-reduced-motion: reduce)');
  function motionFlip(){stop();tPrev=0;sync();}
  if(mqm.addEventListener){mqm.addEventListener('change',motionFlip);}else if(mqm.addListener){mqm.addListener(motionFlip);}
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(en){inView=!!(en.length&&en[en.length-1].isIntersecting);sync();},{threshold:0}).observe(root);
  }
  document.addEventListener('visibilitychange',sync);
  if('ResizeObserver' in window){
    new ResizeObserver(function(){fit();draw(tAcc);}).observe(root);
  }else{
    window.addEventListener('resize',function(){fit();draw(tAcc);});
  }
  fit();
  draw(tAcc);
  sync();
})();
</script>
