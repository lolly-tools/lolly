<script>
(function(){
  var root=document.querySelector('.qs');
  var canvas=root.querySelector('canvas');
  var ctx=canvas.getContext('2d');
  if(!ctx)return;
  var W=0,H=0,S=48,RH=42,cells=[],sockets=[],P=null,raf=0,visible=true;

  function tok(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}
  function readPal(){

      bord:tok('--border',d?'#1b3d2c':'#d8ede4'),

  }
  function rgba(hex,a){
    var s=(''+hex).replace('#','');
    if(s.length===3)s=s.charAt(0)+s.charAt(0)+s.charAt(1)+s.charAt(1)+s.charAt(2)+s.charAt(2);
    var n=parseInt(s,16);

  function eio(u){return u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;}

    canvas.height=Math.max(1,Math.round(H*dpr));

  function triPts(x0,y0,up){

    var cx=(p[0][0]+p[1][0]+p[2][0])/3,cy=(p[0][1]+p[1][1]+p[2][1])/3,i;

  function build(){

      else if(sv<0.975){ctx.fillStyle=rgba(P.light,(P.d?0.16:0.28)*fade*br);ctx.fill();}

        for(s2=2;s2>=1;s2--){
