<!--
Concept: a vast, near-empty field holding exactly one small, quiet mark — a thin-stroked circle
planted by a hairline stem to a short ground tick — breathing at an almost imperceptible rate.
Everything else is left blank. That emptiness IS the statement: rendering and export happen on
your device, and this is the entirety of what the server touches — one contained footprint, no more.
Contract: full-bleed absolute band, live-rect sizing, theme tokens read live + repainted on
class/scheme change, reduced motion renders one static frame, self-suspends offscreen/hidden.
Provenance: Generated by Claude Sonnet 5 (Anthropic) for the Lolly docs masthead bank, commissioned by Andy Fitzsimon (the accountable human author), per-page brief composed by Claude Opus 4.8, on 2026-08-13; model serving region/jurisdiction: not disclosed. The C2PA signature added at bank time is this file's first provenance record.
-->
<div class="ss" aria-hidden="true">
  <canvas class="ss-c"></canvas>
</div>
<style>
  .ss {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ss-c {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script>
(function(){
  var root = document.querySelector('.ss');
  if (!root) return;
  var canvas = root.querySelector('.ss-c');
  var ctx = canvas.getContext('2d');

  var w = 0, h = 0;
  var palette = {};
  var isPlaying = false;
  var isVisible = true;
  var isIntersecting = true;
  var reqId = null;
  var startTs = null;

  var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

  // A handful of ambient, static dust marks — never more than a few, never moving.
  // The point is scarcity: the field stays almost entirely empty.
  var dots = [
    { fx: 0.14, fy: 0.20, r: 1.3, a: 0.16 },
    { fx: 0.40, fy: 0.50, r: 1.0, a: 0.10 },
    { fx: 0.86, fy: 0.15, r: 1.4, a: 0.14 }
  ];

  function tok(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function updatePalette(forceDraw) {
    palette = {
      page: tok('--page', '#ffffff'),
      pale: tok('--pale', '#f0fbf5'),
      muted: tok('--muted', '#5a7067'),
      border: tok('--border', '#d8ede4'),
      green: tok('--green', '#30ba78')
    };
    if (forceDraw) draw(true, 0);
  }

  function resize() {
    var rect = root.getBoundingClientRect();
    w = rect.width;
    h = rect.height;
    if (w === 0 || h === 0) return;

    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);

    updatePalette(true);
  }

  function hexToRgb(hex) {
    var s = hex.replace('#', '');
    if (s.length === 3) {
      s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    }
    var num = parseInt(s, 16);
    if (isNaN(num)) return { r: 48, g: 186, b: 120 };
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function rgba(hex, alpha) {
    var c = hexToRgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha + ')';
  }

  // Single contained footprint: a thin ring on a hairline stem to a short ground tick.
  // Kept small and off toward the upper-right, well clear of the lower-left h1 and
  // well clear of the bottom edge, which is left to melt into plain --page.
  function draw(isStatic, tsNow) {
    if (!w || !h) return;

    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, palette.pale);
    grad.addColorStop(0.6, palette.page);
    grad.addColorStop(1, palette.page);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      ctx.beginPath();
      ctx.arc(d.fx * w, d.fy * h, d.r, 0, Math.PI * 2);
      ctx.fillStyle = rgba(palette.muted, d.a);
      ctx.fill();
    }

    var nodeX = w * 0.66;
    var nodeY = h * 0.30;
    var baseR = clamp(Math.min(w, h) * 0.045, 10, 28);

    var period = 9000;
    var phase = 0;
    if (!isStatic && tsNow != null) {
      phase = ((tsNow % period) / period) * Math.PI * 2;
    }
    var breathe = Math.sin(phase);
    var r = baseR * (1 + breathe * 0.035);
    var haloAlpha = 0.06 + breathe * 0.02;

    var haloR = r * 4.5;
    var halo = ctx.createRadialGradient(nodeX, nodeY, 0, nodeX, nodeY, Math.max(1, haloR));
    halo.addColorStop(0, rgba(palette.green, Math.max(0, haloAlpha)));
    halo.addColorStop(1, rgba(palette.green, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(nodeX, nodeY, Math.max(1, haloR), 0, Math.PI * 2);
    ctx.fill();

    var stemLen = clamp(h * 0.14, 28, 64);
    var stemTopY = nodeY + r;
    var stemBotY = stemTopY + stemLen;
    ctx.strokeStyle = rgba(palette.border, 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(nodeX, stemTopY);
    ctx.lineTo(nodeX, stemBotY);
    ctx.stroke();

    var tickHalf = r * 0.9;
    ctx.strokeStyle = rgba(palette.muted, 0.4);
    ctx.beginPath();
    ctx.moveTo(nodeX - tickHalf, stemBotY);
    ctx.lineTo(nodeX + tickHalf, stemBotY);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(nodeX, nodeY, Math.max(0.5, r), 0, Math.PI * 2);
    ctx.fillStyle = rgba(palette.pale, 0.5);
    ctx.fill();
    ctx.strokeStyle = rgba(palette.green, 0.7);
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  function loop(timestamp) {
    if (!isPlaying) return;

    // Reduced motion: paint one static frame and never re-arm the loop. Checked
    // live at this call site (not a cached variable) so the honest, self-
    // suspending contract holds even if the preference flips mid-flight.
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      draw(true, 0);
      return;
    }

    if (startTs === null) startTs = timestamp;
    draw(false, timestamp - startTs);
    reqId = requestAnimationFrame(loop);
  }

  function checkPlayState() {
    var shouldPlay = isVisible && isIntersecting && !motionQuery.matches;
    if (shouldPlay && !isPlaying) {
      isPlaying = true;
      startTs = null;
      reqId = requestAnimationFrame(loop);
    } else if (!shouldPlay && isPlaying) {
      isPlaying = false;
      if (reqId) cancelAnimationFrame(reqId);
      reqId = null;
    }
    if (!shouldPlay) {
      // Idle at rest: force one repaint of the calm static frame.
      draw(true, 0);
    }
  }

  var ro = new ResizeObserver(resize);
  ro.observe(root);

  var io = new IntersectionObserver(function(entries) {
    isIntersecting = entries[0].isIntersecting;
    checkPlayState();
  });
  io.observe(root);

  document.addEventListener('visibilitychange', function() {
    isVisible = !document.hidden;
    checkPlayState();
  });

  motionQuery.addEventListener('change', checkPlayState);

  var mo = new MutationObserver(function(mutations) {
    for (var i = 0; i < mutations.length; i++) {
      if (mutations[i].attributeName === 'class') {
        updatePalette(true);
        break;
      }
    }
  });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    updatePalette(true);
  });

  resize();
  checkPlayState();
})();
</script>
