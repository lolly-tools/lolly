<!--
  Concept: Five ascending strata, loose anonymous green mud at the base tightening into a
  settled, lit navy apex. Small marks drift upward through the tiers; most stall and dissolve
  partway (an on-device key, unverified past its own tier), and one reliably climbs all the
  way to hold and glow at the top (a CA-verified identity) -- the page's thesis that identity
  comes in escalating, provable levels, not a single yes/no.
  Band contract: .cci is position:absolute;inset:0;overflow:hidden;pointer-events:none and
  fills from the live element rect on resize; detail concentrates in the upper strata while
  the lowest band melts into --page at the bottom edge. Colours are read live from CSS custom
  properties and repaint on html.class mutation and prefers-color-scheme change; motion
  collapses to one settled static frame under prefers-reduced-motion and self-suspends
  off-screen or hidden, resuming when visible again.

  signature added at bank time is this file's first provenance record.

<div class="cci" aria-hidden="true"><canvas></canvas></div>
<style>
  .cci {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .cci canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script>
(function(){
  var root = document.querySelector('.cci');
  var canvas = root.querySelector('canvas');
  var ctx = canvas.getContext('2d');

  var w = 0, h = 0;
  var palette = {};
  var bands = [];
  var motes = [];
  var isVisible = true;
  var isIntersecting = true;
  var isPlaying = false;
  var reqId = null;
  var startTime = null;

  // Six boundary lines (fractions of band height, top to bottom) make five strata;
  // below the last line the strata give way to the melt-to-page fade zone.
  var LINES = [0.06, 0.15, 0.26, 0.39, 0.54, 0.74];
  var TOP_N = LINES.length - 1;

  var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

  function tok(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  function updatePalette() {
    palette = {
      page: tok('--page', '#ffffff'),
      muted: tok('--muted', '#5a7067'),
      border: tok('--border', '#d8ede4'),
      green: tok('--green', '#30ba78'),
      navy: tok('--navy', '#192072'),
      light: tok('--light', '#90ebcd')
    };
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // Cheap deterministic pseudo-random spread, keyed by index -- stable across resizes.
  function seededRand(seed) {
    var x = Math.sin(seed * 999.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function computeBands() {
    bands = [];
    for (var i = 0; i < TOP_N; i++) {
      var t = 1 - i / (TOP_N - 1); // i=0 (top) -> t=1 navy/firm; bottom -> t=0 green/loose
      bands.push({
        yTop: LINES[i] * h,
        yBot: LINES[i + 1] * h,
        colorT: t,
        alpha: lerp(0.14, 0.46, t),
        waveAmp: lerp(11, 2, t),
        waveFreq: lerp(0.006, 0.014, t),
        wavePhase: Math.random() * Math.PI * 2,
        hatch: Math.round(lerp(3, 11, t))
      });
    }
  }

  function computeMotes() {
    motes = [];
    var count = clamp(Math.round(w / 55), 9, 24);
    var baseY = h * LINES[LINES.length - 1];
    var apexY = h * LINES[0];
    for (var i = 0; i < count; i++) {
      var r1 = seededRand(i + 1.1);
      var r2 = seededRand(i + 2.7);
      var r3 = seededRand(i + 3.3);
      var r4 = seededRand(i + 4.9);
      var r5 = seededRand(i + 5.5);
      var tier = clamp(1 + Math.floor(Math.pow(r1, 1.9) * TOP_N), 1, TOP_N);
      if (i === 0) tier = TOP_N; // guarantee one mark always resolves all the way to a lit apex
      var targetY = LINES[TOP_N - tier] * h;
      var distance = baseY - targetY;
      var speed = h * (0.045 + r2 * 0.02);
      var rise = Math.max(1.2, distance / speed);
      var reachesApex = tier === TOP_N;
      var hold = reachesApex ? (2.4 + r3 * 1.6) : (0.5 + r3 * 0.5);
      var gap = 1 + r4 * 2.6;
      motes.push({
        x: (0.05 + 0.9 * r5) * w,
        r: lerp(2, 3.6, r2),
        baseY: baseY,
        targetY: targetY,
        apexY: apexY,
        rise: rise,
        hold: hold,
        total: rise + hold + gap,
        phase: seededRand(i + 6.1) * (rise + hold + gap),
        reachesApex: reachesApex
      });
    }
  }

  function resize() {
    var rect = root.getBoundingClientRect();
    w = rect.width;
    h = rect.height;
    if (w === 0 || h === 0) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updatePalette();
    computeBands();
    computeMotes();
    draw(true);
  }

  // Two-pass alpha blend from green to navy -- avoids parsing whatever colour
  // syntax the live token happens to be in, works for any valid CSS colour.
  function fillBlend(colorT, alphaMul, drawFn) {
    ctx.save();
    ctx.globalAlpha = (1 - colorT) * alphaMul;
    ctx.fillStyle = palette.green;
    drawFn();
    ctx.globalAlpha = colorT * alphaMul;
    ctx.fillStyle = palette.navy;
    drawFn();
    ctx.restore();
  }

  function drawBands(t, still) {
    // Ambient pool of light settling near the apex, upper-right so it stays clear of the h1.
    var ambient = ctx.createRadialGradient(w * 0.72, h * LINES[0], 0, w * 0.72, h * LINES[0], h * 0.55);
    ambient.addColorStop(0, palette.light);
    ambient.addColorStop(1, 'transparent');
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = ambient;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();

    for (var i = 0; i < bands.length; i++) {
      var b = bands[i];
      var amp = still ? b.waveAmp * 0.4 : b.waveAmp;

      fillBlend(b.colorT, b.alpha, function() {
        ctx.fillRect(0, b.yTop, w, b.yBot - b.yTop);
      });

      // Settled contour along the top edge -- crisper (flatter wave) the higher the tier.
      ctx.beginPath();
      for (var x = 0; x <= w; x += 24) {
        var yy = b.yTop + Math.sin(x * b.waveFreq + b.wavePhase + (still ? 0 : t * 0.25)) * amp;
        if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.save();
      ctx.globalAlpha = clamp(b.alpha * 2.1, 0.12, 0.85);
      ctx.strokeStyle = b.colorT > 0.5 ? palette.navy : palette.green;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      // Grain -- fine and dense near the top (firm), sparse near the bottom (loose).
      ctx.save();
      ctx.globalAlpha = clamp(b.alpha * 0.9, 0.05, 0.4);
      ctx.strokeStyle = palette.border;
      ctx.lineWidth = 1;
      var rows = b.hatch;
      for (var r = 1; r <= rows; r++) {
        var ry = b.yTop + ((b.yBot - b.yTop) * r) / (rows + 1);
        ctx.beginPath();
        ctx.moveTo(0, ry);
        ctx.lineTo(w, ry);
        ctx.stroke();
      }
      ctx.restore();
    }

    var fadeTop = h * LINES[LINES.length - 1];
    if (fadeTop < h) {
      var grad = ctx.createLinearGradient(0, fadeTop, 0, h);
      grad.addColorStop(0, palette.green);
      grad.addColorStop(1, 'transparent');
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = grad;
      ctx.fillRect(0, fadeTop, w, h - fadeTop);
      ctx.restore();
    }
  }

  function drawMote(m, u, still) {
    var y, alpha, r, holding = false;
    if (u < m.rise) {
      var frac = easeOutCubic(u / m.rise);
      y = m.baseY - frac * (m.baseY - m.targetY);
      alpha = lerp(0.3, 1, frac);
      r = m.r;
    } else if (u < m.rise + m.hold) {
      var v = (u - m.rise) / m.hold;
      y = m.targetY;
      if (m.reachesApex) {
        alpha = 1;
        r = m.r * 1.15;
        holding = true;
      } else {
        alpha = 1 - v;
        r = m.r * (1 - v * 0.5);
      }
    } else {
      return; // resting in its gap, unseen, before it rises again from the base
    }

    var colorT = clamp(1 - (y - m.apexY) / (m.baseY - m.apexY), 0, 1);

    if (holding) {
      var pulse = still ? 0.5 : (0.5 + Math.sin(u * 3) * 0.5);
      var glowR = m.r * (5 + pulse * 2);
      var glow = ctx.createRadialGradient(m.x, y, 0, m.x, y, glowR);
      glow.addColorStop(0, palette.light);
      glow.addColorStop(1, 'transparent');
      ctx.save();
      ctx.globalAlpha = 0.3 + pulse * 0.25;
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(m.x, y, glowR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    fillBlend(colorT, alpha, function() {
      ctx.beginPath();
      ctx.arc(m.x, y, Math.max(0.3, r), 0, Math.PI * 2);
      ctx.fill();
    });

    if (holding) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = palette.light;
      ctx.beginPath();
      ctx.arc(m.x, y, Math.max(0.3, r * 0.4), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function draw(still) {
    if (!w || !h) return;
    ctx.clearRect(0, 0, w, h);
    if (!still && startTime === null) startTime = performance.now();
    var t = still ? 0 : (performance.now() - startTime) / 1000;

    drawBands(t, still);

    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      var u;
      if (still) {
        // A representative frame: one mark held glowing at the apex, the rest spread
        // mid-climb through the lower strata, so the story reads without motion.
        u = (i === 0) ? (m.rise + m.hold * 0.5) : (((i * 0.6180339887) % 1) * m.rise * 0.9 + m.rise * 0.05);
      } else {
        u = (t + m.phase) % m.total;
      }
      drawMote(m, u, still);
    }
  }

  function loop() {
    if (!isPlaying) return;

    // Reduced motion: paint one static, settled frame and never re-arm the loop. The guard
    // is inlined here (not a cached variable) so it is visible beside the requestAnimationFrame
    // it governs -- the honest, self-suspending contract.
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      draw(true);
      return;
    }

    draw(false);
    reqId = requestAnimationFrame(loop);
  }

  function checkPlayState() {
    var shouldPlay = isVisible && isIntersecting && !motionQuery.matches;
    if (shouldPlay && !isPlaying) {
      isPlaying = true;
      loop();
    } else if (!shouldPlay && isPlaying) {
      isPlaying = false;
      if (reqId) cancelAnimationFrame(reqId);
      if (motionQuery.matches) draw(true);
    }
  }

  var ro = new ResizeObserver(resize);
  ro.observe(root);

  var io = new IntersectionObserver(function(entries) {
    isIntersecting = entries[0].isIntersecting;
    checkPlayState();
  });
  io.observe(root);

  document.addEventListener('visibilitychange', function() {
    isVisible = !document.hidden;
    checkPlayState();
  });

  motionQuery.addEventListener('change', checkPlayState);

  var mo = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      if (m.attributeName === 'class') {
        updatePalette();
        draw(true);
      }
    });
  });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    updatePalette();
    draw(true);
  });

  resize();
  checkPlayState();
})();
</script>
