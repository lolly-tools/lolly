<!-- Concept: an aligned grid of unit-cells sits inside a governing frame (rounded boundary + audit-style corner ticks + a policy rail feeding straight drop-lines into each column). A calm brightness wave sweeps left-to-right, and cells it has passed settle into a lit "deployed" state before the whole field resets — orderly, columnar, accountable rollout under one authority, for the Operators (governance/deployment/trust) page. Band contract: .ops is absolute+inset:0+overflow:hidden+pointer-events:none, canvas is sized from the live element rect (no constants), detail concentrates in the upper band while a bottom + lower-left gradient melts into --page so the lower-left <h1> reads clearly. Generated by Claude Sonnet 5 (Anthropic) for the Lolly docs masthead bank, commissioned by Andy Fitzsimon (the accountable human author), per-page brief composed by Claude Opus 4.8, on 2026-08-13; model serving region/jurisdiction: not disclosed. The C2PA signature added at bank time is this file's first provenance record. -->
<div class="ops" aria-hidden="true"><canvas></canvas></div>
<style>
.ops{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:var(--page,#ffffff)}
.ops canvas{display:block;width:100%;height:100%}
</style>
<script>
(function(){
  var root=document.querySelector('.ops');
  var canvas=root.querySelector('canvas');
  var ctx=canvas.getContext('2d');

  function tok(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}
  function hexToRgb(hex){
    var m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
    if(!m) return [255,255,255];
    return [parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)];
  }
  function roundRect(x,y,w,h,r){
    if(r>w/2)r=w/2; if(r>h/2)r=h/2; if(r<0)r=0;
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  var page,pale,border,muted,green,navy,isDark;
  function refreshColors(){
    isDark=document.documentElement.classList.contains('dark');
    page=tok('--page',isDark?'#061816':'#ffffff');
    pale=tok('--pale',isDark?'#0d2419':'#f0fbf5');
    border=tok('--border',isDark?'#1b3d2c':'#d8ede4');
    muted=tok('--muted',isDark?'#7aaa90':'#5a7067');
    green=tok('--green','#30ba78');
    navy=tok('--navy','#192072');
  }

  var w=0,h=0,dpr=1;
  var cols=10,rows=5,marginX=0,frame={x:0,y:0,w:0,h:0},railY=0,gridTop=0,gridBottom=0,cellSize=10;
  var cells=[];

  function buildGrid(){
    cols=Math.max(9,Math.min(18,Math.round(w/54)));
    rows=Math.max(4,Math.min(6,Math.round(h/62)));
    marginX=w*0.07;
    var frameMargin=Math.min(w,h)*0.05;
    gridTop=h*0.32;
    gridBottom=h*0.62;
    railY=Math.max(frameMargin+10,gridTop-h*0.10);
    var spacingX=cols>1?(w-marginX*2)/(cols-1):0;
    var spacingY=rows>1?(gridBottom-gridTop)/(rows-1):0;
    cellSize=Math.max(6,Math.min(24,Math.min(spacingX,spacingY)*0.42));

    frame.x=frameMargin;
    frame.y=frameMargin*0.6;
    frame.w=w-frameMargin*2;
    var frameBottom=gridBottom+spacingY*0.62;
    frame.h=Math.max(20,frameBottom-frame.y);

    cells=[];
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var x=marginX+c*spacingX;
        var y=gridTop+r*spacingY;
        var nx=cols>1?c/(cols-1):0;
        var phase=((c*7+r*13)%29)/29*Math.PI*2;
        cells.push({x:x,y:y,nx:nx,phase:phase,settled:0});
      }
    }
  }

  function drawCornerTicks(){
    var len=Math.min(16,frame.w*0.05,frame.h*0.18);
    var x0=frame.x,y0=frame.y,x1=frame.x+frame.w,y1=frame.y+frame.h;
    ctx.beginPath();
    ctx.moveTo(x0,y0+len); ctx.lineTo(x0,y0); ctx.lineTo(x0+len,y0);
    ctx.moveTo(x1-len,y0); ctx.lineTo(x1,y0); ctx.lineTo(x1,y0+len);
    ctx.moveTo(x1,y1-len); ctx.lineTo(x1,y1); ctx.lineTo(x1-len,y1);
    ctx.moveTo(x0+len,y1); ctx.lineTo(x0,y1); ctx.lineTo(x0,y1-len);
    ctx.stroke();
  }

  var lastT=0;
  var prevFrameT=null;
  var speed=0.075,cycleLen=1.7,sigma=0.09;

  function draw(t){
    lastT=t;
    refreshColors();
    var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dt;
    if(prevFrameT===null||reduced){dt=0;} else {dt=t-prevFrameT; if(dt<0||dt>0.12)dt=0.016;}
    prevFrameT=t;

    ctx.clearRect(0,0,w,h);

    ctx.globalAlpha=0.55;
    ctx.fillStyle=pale;
    roundRect(frame.x,frame.y,frame.w,frame.h,10);
    ctx.fill();

    ctx.globalAlpha=isDark?0.32:0.26;
    ctx.strokeStyle=navy;
    ctx.lineWidth=1;
    roundRect(frame.x,frame.y,frame.w,frame.h,10);
    ctx.stroke();

    ctx.globalAlpha=isDark?0.55:0.48;
    ctx.lineWidth=1.4;
    drawCornerTicks();

    ctx.globalAlpha=isDark?0.4:0.32;
    ctx.lineWidth=1;
    ctx.strokeStyle=navy;
    ctx.beginPath();
    ctx.moveTo(marginX,railY);
    ctx.lineTo(w-marginX,railY);
    ctx.stroke();

    ctx.globalAlpha=isDark?0.22:0.18;
    ctx.strokeStyle=muted;
    var seenX={};
    for(var i=0;i<cells.length;i++){
      var cx=cells[i].x;
      var key=Math.round(cx);
      if(seenX[key])continue;
      seenX[key]=true;
      ctx.beginPath();
      ctx.moveTo(cx,railY);
      ctx.lineTo(cx,gridTop);
      ctx.stroke();
    }

    var front=reduced?0.55:((t*speed)%cycleLen)-0.35;

    for(var j=0;j<cells.length;j++){
      var cell=cells[j];
      var dx=cell.nx-front;
      var pulse=Math.exp(-(dx*dx)/(2*sigma*sigma));
      var target=cell.nx<front?1:0;
      if(reduced){
        cell.settled=target;
      } else {
        var rate=2.2;
        cell.settled+= (target-cell.settled)*(1-Math.exp(-rate*dt));
      }
      var breathe=reduced?0:(Math.sin(t*1.1+cell.phase)*0.5+0.5);
      var alpha=0.08+cell.settled*0.5+pulse*0.32+breathe*0.03;
      if(alpha>0.95)alpha=0.95;
      var scale=1+pulse*0.22+cell.settled*0.06;
      var s=cellSize*scale;

      ctx.globalAlpha=alpha;
      ctx.fillStyle=green;
      roundRect(cell.x-s/2,cell.y-s/2,s,s,s*0.28);
      ctx.fill();

      var strokeA=0.12+cell.settled*0.45+pulse*0.25;
      if(strokeA>0.9)strokeA=0.9;
      ctx.globalAlpha=strokeA;
      ctx.strokeStyle=navy;
      ctx.lineWidth=1;
      ctx.stroke();
    }

    var pg=hexToRgb(page);
    var fadeStart=h*0.58;
    var grad=ctx.createLinearGradient(0,fadeStart,0,h);
    grad.addColorStop(0,'rgba('+pg[0]+','+pg[1]+','+pg[2]+',0)');
    grad.addColorStop(1,'rgba('+pg[0]+','+pg[1]+','+pg[2]+',0.96)');
    ctx.globalAlpha=1;
    ctx.fillStyle=grad;
    ctx.fillRect(0,fadeStart,w,Math.max(0,h-fadeStart));

    var rg=ctx.createRadialGradient(w*0.16,h*1.02,0,w*0.16,h*1.02,Math.max(w,h)*0.55);
    rg.addColorStop(0,'rgba('+pg[0]+','+pg[1]+','+pg[2]+',0.85)');
    rg.addColorStop(1,'rgba('+pg[0]+','+pg[1]+','+pg[2]+',0)');
    ctx.fillStyle=rg;
    ctx.fillRect(0,0,w,h);

    ctx.globalAlpha=1;
  }

  function resize(){
    var rect=root.getBoundingClientRect();
    w=Math.max(1,rect.width);
    h=Math.max(1,rect.height);
    dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px';
    canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildGrid();
    draw(lastT);
  }

  var rafId=null,startTs=null;
  function loop(ts){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      draw(0);
      rafId=null;
      return;
    }
    if(startTs===null)startTs=ts;
    var t=(ts-startTs)/1000;
    draw(t);
    rafId=requestAnimationFrame(loop);
  }
  function start(){
    if(rafId!==null)return;
    startTs=null;
    rafId=requestAnimationFrame(loop);
  }
  function stop(){
    if(rafId!==null){cancelAnimationFrame(rafId);rafId=null;}
  }

  var isVisible=true,isHidden=document.hidden;
  function updateRunning(){
    if(isVisible&&!isHidden){start();} else {stop();}
  }

  var io=new IntersectionObserver(function(entries){
    var e=entries[entries.length-1];
    isVisible=e.isIntersecting;
    updateRunning();
  },{threshold:0});
  io.observe(root);

  document.addEventListener('visibilitychange',function(){
    isHidden=document.hidden;
    updateRunning();
  });

  var ro=new ResizeObserver(function(){resize();});
  ro.observe(root);

  function onThemeChange(){
    draw(lastT);
  }
  var mo=new MutationObserver(onThemeChange);
  mo.observe(document.documentElement,{attributes:true,attributeFilter:['class']});

  var mqDark=window.matchMedia('(prefers-color-scheme: dark)');
  try{mqDark.addEventListener('change',onThemeChange);}catch(e){try{mqDark.addListener(onThemeChange);}catch(e2){}}

  var mqReduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  function onReducedChange(){updateRunning();}
  try{mqReduced.addEventListener('change',onReducedChange);}catch(e){try{mqReduced.addListener(onReducedChange);}catch(e2){}}

  refreshColors();
  resize();
  updateRunning();
})();
</script>
