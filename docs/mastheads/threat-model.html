<!--
  Threat Model & Trust Boundaries: one living perimeter holds a calm green interior while probing
  vectors arrive from outside — most strike and ricochet away, each contact ticked on the line; two
  plainly dashed gaps let a few red probes pass straight through and fade: limits drawn as honestly
  as the protections. Band contract: absolute full-bleed, aria-hidden, all rules scoped under .tm,
  sized from the live rect, live theme tokens with repaint on class/scheme change, reduced motion is
  one static frame, self-suspends off-screen and when hidden; detail kept upper, bottom melts to page.
  Generated by Claude Fable 5 (Anthropic) for the Lolly docs masthead bank, commissioned by Andy Fitzsimon (the accountable human author), per-page brief composed by Claude Opus 4.8, on 2026-08-13; model serving region/jurisdiction: not disclosed. The C2PA signature added at bank time is this file's first provenance record.
-->
<div class="tm" aria-hidden="true"><canvas></canvas></div>
<style>
.tm{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.tm canvas{display:block;width:100%;height:100%}
</style>
<script>
(function(){
  var root=document.querySelector('.tm');
  var canvas=root.querySelector('canvas');
  var ctx=canvas.getContext('2d');

  var W=0,H=0,dpr=1,visible=true,raf=null,t0=null,lastT=0,isDark=false,LA=1;
  var P={};

  function tok(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}
  function pc(str,fb){
    var re=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i,m=re.exec((str||'').trim());
    if(!m){m=re.exec(fb);}
    var h=m[1];
    if(h.length===3){h=h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2);}
    return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
  }
  function css(c,a){return 'rgba('+c.r+','+c.g+','+c.b+','+a+')';}
  function palette(){
    isDark=document.documentElement.classList.contains('dark');
    P.page  =pc(tok('--page',''),  isDark?'#061816':'#ffffff');
    P.muted =pc(tok('--muted',''), isDark?'#7aaa90':'#5a7067');
    P.border=pc(tok('--border',''),isDark?'#1b3d2c':'#d8ede4');
    P.text  =pc(tok('--text',''),  isDark?'#cce8da':'#1d2726');
    P.green =pc(tok('--green',''),'#30ba78');
    P.red   =pc(tok('--red',''),'#c8102e');
    LA=isDark?1.3:1;
  }

  /* the perimeter: a gently breathing vertical membrane */
  function bX(u,t){return 0.615+0.03*Math.sin(u*5.3+t*0.35+1.2)+0.016*Math.sin(u*12.7-t*0.22);}

  /* acknowledged gaps in the boundary (the stated limits), kept in the upper area */
  var GAPS=[{y:0.17,h:0.075},{y:0.46,h:0.06}];
  function inGap(u){for(var i=0;i<GAPS.length;i++){var g=GAPS[i];if(u>=g.y&&u<=g.y+g.h)return g;}return null;}

  /* deterministic probe field, biased to the upper band */
  var probes=[];
  (function(){
    var s=20260813;
    function rnd(){s=(s*1664525+1013904223)>>>0;return s/4294967296;}
    var i,k,yT;
    for(i=0;i<26;i++){
      var pen=(i%6===2);
      if(pen){
        var g=GAPS[(i>>1)%GAPS.length];
        yT=g.y+g.h*(0.25+0.5*rnd());
      }else{
        yT=0.06;
        for(k=0;k<24;k++){
          yT=0.05+0.70*Math.pow(rnd(),1.3);
          if(!inGap(yT)&&!inGap(yT-0.02)&&!inGap(yT+0.02))break;
        }
      }
      var y0=yT+(rnd()-0.5)*1.1;
      if(y0<0.03)y0=0.03; if(y0>0.95)y0=0.95;
      probes.push({pen:pen,yT:yT,y0:y0,ph:rnd(),sp:0.05+rnd()*0.08,j:(rnd()-0.5)*1.4});
    }
  })();

  function ptAt(pts,s){
    for(var i=0;i<pts.length-1;i++){
      var vx=pts[i+1].x-pts[i].x,vy=pts[i+1].y-pts[i].y,len=Math.hypot(vx,vy);
      if(s<=len||i===pts.length-2){
        var f=len?Math.min(1,s/len):0;
        return {x:pts[i].x+vx*f,y:pts[i].y+vy*f};
      }
      s-=len;
    }
    return pts[pts.length-1];
  }

  function membranePath(off,t){
    ctx.beginPath();
    var started=false,y,u,x,bot=0.9*H;
    for(y=2;y<=bot;y+=5){
      u=y/H;
      if(inGap(u)){started=false;continue;}
      x=bX(u,t)*W+off;
      if(started){ctx.lineTo(x,y);}else{ctx.moveTo(x,y);started=true;}
    }
  }

  function draw(t){
    if(!W||!H)return;
    lastT=t;
    ctx.setLineDash([]);
    ctx.lineCap='round';
    ctx.globalAlpha=1;
    ctx.fillStyle=css(P.page,1);
    ctx.fillRect(0,0,W,H);

    var i,k,mx=0.615*W;

    /* calm protected interior: a quiet green wash and laminar rest lines */
    var wash=ctx.createLinearGradient(mx,0,0,0);
    wash.addColorStop(0,css(P.green,Math.min(1,0.07*LA)));
    wash.addColorStop(0.55,css(P.green,Math.min(1,0.028*LA)));
    wash.addColorStop(1,css(P.green,0));
    ctx.fillStyle=wash;
    ctx.fillRect(0,0,mx,H);
    ctx.lineWidth=1;
    ctx.strokeStyle=css(P.green,1);
    for(i=0;i<3;i++){
      var ly=(0.14+i*0.17)*H;
      ctx.globalAlpha=0.06*LA;
      ctx.beginPath();
      ctx.moveTo(W*0.02,ly);
      ctx.lineTo(bX(ly/H,t)*W-16,ly);
      ctx.stroke();
    }

    /* probe geometry for this frame */
    var geo=[];
    for(i=0;i<probes.length;i++){
      var pr=probes[i];
      var hy=pr.yT*H,hx=bX(pr.yT,t)*W;
      var sx=W*1.03,sy=pr.y0*H;
      var dx=hx-sx,dy=hy-sy,inLen=Math.hypot(dx,dy);
      dx/=inLen;dy/=inLen;
      var pts,L;
      if(pr.pen){
        var cdx=dx,cdy=dy*0.45,cn=Math.hypot(cdx,cdy);
        var cl=0.30*W;
        pts=[{x:sx,y:sy},{x:hx,y:hy},{x:hx+cdx/cn*cl,y:hy+cdy/cn*cl}];
        L=inLen+cl;
      }else{
        var odx=-dx,ody=dy*0.3+pr.j,on=Math.hypot(odx,ody);
        var ol=0.5*W;
        pts=[{x:sx,y:sy},{x:hx,y:hy},{x:hx+odx/on*ol,y:hy+ody/on*ol}];
        L=inLen+ol;
      }
      geo.push({pr:pr,pts:pts,L:L,hitF:inLen/L,hx:hx,hy:hy});
    }

    /* faint standing traces */
    ctx.lineWidth=1;
    for(i=0;i<geo.length;i++){
      var g0=geo[i],p0=g0.pts;
      ctx.globalAlpha=(g0.pr.pen?0.11:0.08)*LA;
      ctx.strokeStyle=css(g0.pr.pen?P.red:P.muted,1);
      ctx.beginPath();ctx.moveTo(p0[0].x,p0[0].y);ctx.lineTo(p0[1].x,p0[1].y);ctx.stroke();
      if(g0.pr.pen){
        var fade=ctx.createLinearGradient(p0[1].x,p0[1].y,p0[2].x,p0[2].y);
        fade.addColorStop(0,css(P.red,0.14));
        fade.addColorStop(1,css(P.red,0));
        ctx.globalAlpha=Math.min(1,LA);
        ctx.strokeStyle=fade;
      }else{
        ctx.globalAlpha=0.05*LA;
        ctx.strokeStyle=css(P.muted,1);
      }
      ctx.beginPath();ctx.moveTo(p0[1].x,p0[1].y);ctx.lineTo(p0[2].x,p0[2].y);ctx.stroke();
    }

    /* the defended boundary: depth echoes, then the line itself */
    var vg=ctx.createLinearGradient(0,0,0,H);
    vg.addColorStop(0,css(P.green,Math.min(1,0.55*LA)));
    vg.addColorStop(0.62,css(P.green,Math.min(1,0.4*LA)));
    vg.addColorStop(0.92,css(P.green,0));
    ctx.strokeStyle=vg;
    ctx.lineWidth=1;
    ctx.globalAlpha=0.14;membranePath(-26,t);ctx.stroke();
    ctx.globalAlpha=0.32;membranePath(-12,t);ctx.stroke();
    ctx.lineWidth=1.6;
    ctx.globalAlpha=1;membranePath(0,t);ctx.stroke();

    /* the acknowledged gaps, dashed and bracketed in plain sight */
    ctx.lineWidth=1;
    for(i=0;i<GAPS.length;i++){
      var gp=GAPS[i],yA=gp.y*H,yB=(gp.y+gp.h)*H,yy;
      ctx.setLineDash([3,5]);
      ctx.globalAlpha=0.5*LA;
      ctx.strokeStyle=css(P.muted,1);
      ctx.beginPath();
      for(yy=yA;yy<=yB;yy+=4){
        var gx=bX(yy/H,t)*W;
        if(yy===yA){ctx.moveTo(gx,yy);}else{ctx.lineTo(gx,yy);}
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha=0.55*LA;
      ctx.strokeStyle=css(P.text,1);
      var xa=bX(yA/H,t)*W,xb=bX(yB/H,t)*W;
      ctx.beginPath();ctx.moveTo(xa-6,yA);ctx.lineTo(xa+6,yA);ctx.stroke();
      ctx.beginPath();ctx.moveTo(xb-6,yB);ctx.lineTo(xb+6,yB);ctx.stroke();
    }

    /* every deflected contact leaves an asserted tick on the line */
    ctx.lineWidth=2;
    ctx.strokeStyle=css(P.green,1);
    for(i=0;i<geo.length;i++){
      if(geo[i].pr.pen)continue;
      ctx.globalAlpha=0.3*LA;
      ctx.beginPath();ctx.moveTo(geo[i].hx,geo[i].hy-4);ctx.lineTo(geo[i].hx,geo[i].hy+4);ctx.stroke();
    }

    /* travelling probes: comets with impact glints */
    ctx.lineWidth=1.6;
    for(i=0;i<geo.length;i++){
      var G=geo[i],pr2=G.pr;
      var pos=(t*pr2.sp+pr2.ph)%1;
      var tail=0.085,steps=7;
      for(k=0;k<steps;k++){
        var s1=pos-tail*k/steps,s2=pos-tail*(k+1)/steps;
        if(s1<=0)break;
        if(s2<0)s2=0;
        var mid=(s1+s2)/2,base;
        if(pr2.pen){base=mid<G.hitF?0.55:0.08+0.5*Math.max(0,1-(mid-G.hitF)/(1-G.hitF));}
        else{base=mid<G.hitF?0.45:0.26;}
        ctx.globalAlpha=Math.min(1,base*(1-k/steps)*LA);
        ctx.strokeStyle=css(pr2.pen?P.red:P.muted,1);
        var A=ptAt(G.pts,s1*G.L),B=ptAt(G.pts,s2*G.L);
        ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
      }
      if(!pr2.pen){
        var kk=1-Math.abs(pos-G.hitF)/0.05;
        if(kk>0){
          ctx.globalAlpha=Math.min(1,0.75*kk*LA);
          ctx.strokeStyle=css(P.green,1);
          ctx.lineWidth=1.4;
          ctx.beginPath();ctx.arc(G.hx,G.hy,3+9*(1-kk),-1.35,1.35);ctx.stroke();
          ctx.lineWidth=1.6;
        }
      }
    }

    /* the band melts into the page ground where the h1 sits */
    var melt=ctx.createLinearGradient(0,H*0.5,0,H);
    melt.addColorStop(0,css(P.page,0));
    melt.addColorStop(1,css(P.page,1));
    ctx.globalAlpha=1;
    ctx.fillStyle=melt;
    ctx.fillRect(0,H*0.5,W,H*0.5+1);
  }

  function frame(ts){
    raf=null;
    if(!visible||document.hidden)return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){draw(0);return;}
    if(t0===null)t0=ts-lastT*1000;
    draw((ts-t0)/1000);
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      raf=requestAnimationFrame(frame);
    }
  }
  function start(){
    if(raf!==null||!visible||document.hidden)return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){draw(0);return;}
    t0=null;
    raf=requestAnimationFrame(frame);
  }
  function stop(){
    if(raf!==null){cancelAnimationFrame(raf);raf=null;}
  }
  function repaint(){
    palette();
    if(raf===null)draw(lastT);
  }
  function size(){
    var r=root.getBoundingClientRect();
    W=Math.max(1,r.width);H=Math.max(1,r.height);
    dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.round(W*dpr);
    canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(raf===null)draw(lastT);
  }

  var ro=new ResizeObserver(size);
  ro.observe(root);

  var io=new IntersectionObserver(function(es){
    visible=es[0].isIntersecting;
    if(visible){start();}else{stop();}
  });
  io.observe(root);

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){stop();}else{start();}
  });

  var mo=new MutationObserver(repaint);
  mo.observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',repaint);

  palette();
  size();
  start();
})();
</script>
