<div class="ns-sq" aria-hidden="true">
  <canvas></canvas>
</div>
<style>
  .ns-sq {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ns-sq canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script>
(function(){
  const root = document.querySelector('.ns-sq');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');

  let width = 0, height = 0;
  let isVisible = false, isPlaying = true;
  let time = 0, rafId = null;
  let colors = {};

  function tok(name, fallback) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  }

  function updateColors() {
    colors.page = tok('--page', '#ffffff');
    colors.muted = tok('--muted', '#5a7067');
    colors.border = tok('--border', '#d8ede4');
    colors.orange = tok('--orange', '#fe7c3f');
  }

  const slabs = [
    { y: 0.05, h: 0.35, speed: 0.012, dir: 1 },
    { y: 0.48, h: 0.40, speed: 0.015, dir: -1 }
  ];

  function draw(t) {
    ctx.fillStyle = colors.page;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    // Rotate slightly to create an oppressive fault line
    ctx.translate(width / 2, height / 2);
    ctx.rotate(-0.03);
    ctx.translate(-width / 2, -height / 2);

    // Draw massive rigid slabs
    for (let i = 0; i < slabs.length; i++) {
      const slab = slabs[i];
      const sy = height * slab.y;
      const sh = height * slab.h;
      const offset = (t * slab.speed * width * slab.dir) % 60;

      ctx.fillStyle = colors.muted;
      ctx.globalAlpha = 0.08;
      ctx.fillRect(-width, sy, width * 3, sh);

      // Rigid structural hashing
      ctx.beginPath();
      for (let x = -width + offset; x < width * 2; x += 30) {
        ctx.moveTo(x, sy);
        ctx.lineTo(x, sy + sh);
      }
      ctx.strokeStyle = colors.border;
      ctx.globalAlpha = 0.25;
      ctx.lineWidth = 1;
      ctx.stroke();

      // Heavy slab borders
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(-width, sy); ctx.lineTo(width * 3, sy);
      ctx.moveTo(-width, sy + sh); ctx.lineTo(width * 3, sy + sh);
      ctx.stroke();
    }

    // The friction shear line between the tectonic plates
    const frictionY = height * 0.44;
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = colors.orange;
    ctx.lineWidth = 2;

    ctx.beginPath();
    for (let x = -width; x <= width * 2; x += 15) {
      // High-frequency noise visualising stress and grinding
      const noise = Math.sin(x * 0.08 + t * 2.5) * 3 + Math.cos(x * 0.12 - t * 1.5) * 2;
      const y = frictionY + noise;
      if (x === -width) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Secondary stress scatter
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = colors.orange;
    for (let x = -width; x <= width * 2; x += 40) {
      const sparkNoise = Math.sin(x * 0.2 + t * 3);
      if (sparkNoise > 0.5) {
        ctx.fillRect(x, frictionY + (sparkNoise * 15) - 7, 2, 2);
      }
    }

    ctx.restore();
  }

  function loop(timestamp) {
    if (!isPlaying || !isVisible) return;

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    time = reduced ? 0 : timestamp * 0.001;
    draw(time);

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    }
  }

  const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    const dpr = window.devicePixelRatio || 1;
    width = rect.width;
    height = rect.height;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    updateColors();

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    draw(reduced ? 0 : time);
  });
  ro.observe(root);

  const io = new IntersectionObserver(entries => {
    isVisible = entries[0].isIntersecting;
    if (isVisible && isPlaying && !rafId && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    } else if (!isVisible && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });
  io.observe(root);

  document.addEventListener('visibilitychange', () => {
    isPlaying = !document.hidden;
    if (isPlaying && isVisible && !rafId && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    } else if (!isPlaying && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });

  const mo = new MutationObserver(() => {
    updateColors();
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    draw(reduced ? 0 : time);
  });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    updateColors();
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    draw(reduced ? 0 : time);
  });

  updateColors();
})();
</script>
