<div class="cce" aria-hidden="true"><canvas></canvas></div>
<style>
.cce{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cce canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
</style>
<script>
(function(){
  var root=document.querySelector('.cce');
  if(!root)return;
  var canvas=root.querySelector('canvas');
  if(!canvas||!canvas.getContext)return;
  var ctx=canvas.getContext('2d');
  if(!ctx)return;

  var w=0,h=0,dpr=1,boxes=[],deepest=0,pal={},dark=false;
  var raf=0,playing=false,inView=true;
  var CYCLE=7200,STILL=CYCLE*0.78,MAXD=5;

  function tok(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}
  function hexRgb(hx){
    var m=/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(hx);
    if(!m)return null;
    var s=m[1];
    if(s.length===3)s=s.charAt(0)+s.charAt(0)+s.charAt(1)+s.charAt(1)+s.charAt(2)+s.charAt(2);
    var n=parseInt(s,16);
    return[(n>>16)&255,(n>>8)&255,n&255];
  }
  function rgba(hx,a){
    var c=hexRgb(hx)||(dark?[6,24,22]:[255,255,255]);
    return'rgba('+c[0]+','+c[1]+','+c[2]+','+a.toFixed(3)+')';
  }
  function clamp01(x){return x<0?0:x>1?1:x;}
  function smooth(x){x=clamp01(x);return x*x*(3-2*x);}

  function readTheme(){
    dark=document.documentElement.classList.contains('dark');
    pal={
      page:tok('--page',dark?'#061816':'#ffffff'),
      pale:tok('--pale',dark?'#0d2419':'#f0fbf5'),
      green:tok('--green','#30ba78'),
      blue:tok('--blue','#2453ff')
    };
  }

  function mulberry(seed){
    return function(){
      seed|=0;seed=seed+0x6D2B79F5|0;
      var t=Math.imul(seed^seed>>>15,1|seed);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return((t^t>>>14)>>>0)/4294967296;
    };
  }

  function split(x,y,bw,bh,d,rnd){
    boxes.push({x:x,y:y,w:bw,h:bh,d:d});
    if(d>deepest)deepest=d;
    if(d>=MAXD)return;
    if(d>=2&&rnd()<0.18)return;
    var p=Math.max(4,Math.min(bw,bh)*0.085+3);
    var ix=x+p,iy=y+p,iw=bw-2*p,ih=bh-2*p;
    if(iw<30||ih<20)return;
    if(d>0&&rnd()<0.2){split(ix,iy,iw,ih,d+1,rnd);return;}
    var vert=iw/ih>1.4?true:(iw/ih<0.72?false:rnd()<0.5);
    var n=2+(rnd()<0.45?1:0);
    var g=Math.max(3,p*0.5);
    var span=(vert?iw:ih)-g*(n-1);
    if(span<n*16)return;
    var fr=[],s=0,i;
    for(i=0;i<n;i++){var f=0.55+rnd();fr.push(f);s+=f;}
    var off=0;
    for(i=0;i<n;i++){
      var c=span*fr[i]/s;
      if(rnd()<0.92){
        if(vert)split(ix+off,iy,c,ih,d+1,rnd);
        else split(ix,iy+off,iw,c,d+1,rnd);
      }
      off+=c+g;
    }
  }

  function build(){
    boxes=[];deepest=0;
    var rnd=mulberry(20260813);
    split(w*0.035,h*0.09,w*0.93,h*0.74,0,rnd);
  }

  function boxPath(b){
    var r=Math.min(4,b.w*0.5,b.h*0.5);
    ctx.beginPath();
    ctx.moveTo(b.x+r,b.y);
    ctx.arcTo(b.x+b.w,b.y,b.x+b.w,b.y+b.h,r);
    ctx.arcTo(b.x+b.w,b.y+b.h,b.x,b.y+b.h,r);
    ctx.arcTo(b.x,b.y+b.h,b.x,b.y,r);
    ctx.arcTo(b.x,b.y,b.x+b.w,b.y,r);
    ctx.closePath();
  }

  function draw(t){
    if(!w||!h)return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=pal.page;
    ctx.fillRect(0,0,w,h);

    var wash=ctx.createLinearGradient(0,0,0,h*0.7);
    wash.addColorStop(0,rgba(pal.pale,dark?0.5:0.7));
    wash.addColorStop(1,rgba(pal.pale,0));
    ctx.fillStyle=wash;
    ctx.fillRect(0,0,w,h*0.7);

    var ph=(t%CYCLE)/CYCLE;
    var lvl=deepest*(1-smooth(ph/0.68));
    var amp=smooth(ph/0.08)*(1-smooth((ph-0.9)/0.1));
    var seal=smooth((ph-0.7)/0.12)*(1-smooth((ph-0.92)/0.08));

    for(var i=0;i<boxes.length;i++){
      var b=boxes[i];
      var e=amp*Math.exp(-((b.d-lvl)*(b.d-lvl))/0.6);
      var col=(b.d%2===0)?pal.green:pal.blue;
      boxPath(b);
      ctx.fillStyle=rgba(col,(dark?0.05:0.035)+e*0.05);
      ctx.fill();
      ctx.strokeStyle=rgba(col,Math.min(0.9,(dark?0.36:0.3)+e*0.45));
      ctx.lineWidth=Math.max(0.7,1.7-b.d*0.22)+e*0.9;
      ctx.stroke();
    }

    if(seal>0.01&&boxes.length){
      var rb=boxes[0];
      boxPath(rb);
      ctx.save();
      ctx.shadowColor=rgba(pal.green,0.5*seal);
      ctx.shadowBlur=14*seal;
      ctx.strokeStyle=rgba(pal.green,0.85*seal);
      ctx.lineWidth=2.2;
      ctx.stroke();
      ctx.restore();
    }

    var melt=ctx.createLinearGradient(0,h*0.52,0,h*0.98);
    melt.addColorStop(0,rgba(pal.page,0));
    melt.addColorStop(1,rgba(pal.page,1));
    ctx.fillStyle=melt;
    ctx.fillRect(0,h*0.5,w,h*0.5+2);

    var rad=ctx.createRadialGradient(0,h*1.05,0,0,h*1.05,Math.max(w*0.5,h*1.4));
    rad.addColorStop(0,rgba(pal.page,0.92));
    rad.addColorStop(0.55,rgba(pal.page,0.4));
    rad.addColorStop(1,rgba(pal.page,0));
    ctx.fillStyle=rad;
    ctx.fillRect(0,0,w,h);
  }

  function still(){draw(STILL);}

  function frame(ts){
    raf=0;
    if(!playing)return;
    draw(ts);
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      raf=requestAnimationFrame(frame);
    }
  }

  function play(){
    if(document.hidden||!inView)return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      playing=false;
      still();
      return;
    }
    playing=true;
    if(!raf)raf=requestAnimationFrame(frame);
  }

  function stop(){
    playing=false;
    if(raf){cancelAnimationFrame(raf);raf=0;}
  }

  function sync(){
    if(document.hidden||!inView)stop();
    else play();
  }

  function resize(){
    var r=root.getBoundingClientRect();
    var nw=Math.round(r.width),nh=Math.round(r.height);
    if(!nw||!nh)return;
    var nd=Math.min(window.devicePixelRatio||1,2);
    if(nw===w&&nh===h&&nd===dpr&&canvas.width===Math.round(nw*nd))return;
    w=nw;h=nh;dpr=nd;
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);
    build();
    if(!raf)still();
  }

  function themed(){
    readTheme();
    if(!raf)still();
  }

  readTheme();
  resize();

  new MutationObserver(themed).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener)mq.addEventListener('change',themed);
  else if(mq.addListener)mq.addListener(themed);

  if('ResizeObserver' in window)new ResizeObserver(resize).observe(root);
  window.addEventListener('resize',resize);

  if('IntersectionObserver' in window){
    new IntersectionObserver(function(en){
      inView=!!(en.length&&en[en.length-1].isIntersecting);
      sync();
    }).observe(root);
  }
  document.addEventListener('visibilitychange',sync);

  sync();
})();
</script>
