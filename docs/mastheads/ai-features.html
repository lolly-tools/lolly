<!--
  Concept: a soft generative haze wavers until its boundary snaps ONCE into an exact crystalline outline that then holds perfectly still, and the very same fixed form recurs identically each cycle (with faint identical ghosts standing for earlier renders of the same artifact) - a model's shifting output resolving into a locked set of bytes: "Generated once, rendered the same", the AI-features page's thesis. Flux is --green; the locked artifact is --blue.

<div class="af" aria-hidden="true"><canvas></canvas></div>
<style>
  .af { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .af canvas { display: block; width: 100%; height: 100%; }
</style>
<script>
(function(){
  var root = document.querySelector('.af');
  var canvas = root.querySelector('canvas');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;
  var raf = null, pv = null, tm = 0;
  var vis = false, ply = !document.hidden;
  var C = {};
  var TAU = Math.PI * 2;
  var CYCLE = 10; /* seconds per generate-then-lock cycle */

  function tok(n, f) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return v || f;
  }
  function isDark() { return document.documentElement.classList.contains('dark'); }
  function rgbOf(cs) {
    cs = (cs || '').trim();
    if (cs[0] === '#') {
      var h = cs.slice(1);
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      var n = parseInt(h.slice(0, 6), 16);
      if (!isNaN(n)) return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    var m = cs.match(/[\d.]+/g);
    if (m && m.length >= 3) return [+m[0], +m[1], +m[2]];
    return [48, 186, 120];
  }
  function A(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function MIX(c1, c2, m, a) {
    return 'rgba(' + Math.round(c1[0] + (c2[0]-c1[0]) * m) + ',' +
      Math.round(c1[1] + (c2[1]-c1[1]) * m) + ',' +
      Math.round(c1[2] + (c2[2]-c1[2]) * m) + ',' + a + ')';
  }
  function refresh() {
    var dk = isDark();
    C.page = tok('--page', dk ? '#061816' : '#ffffff');
    C.p = rgbOf(C.page);
    C.g = rgbOf(tok('--green', '#30ba78'));
    C.b = rgbOf(tok('--blue', '#2453ff'));
  }
  function ss(a, b, x) {
    x = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return x * x * (3 - 2 * x);
  }

  /* The one fixed artifact: a seeded, immutable crystalline polygon.
     Identical every cycle, identical in every ghost - never regenerated. */
  var seed = 20260813;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  var NV = 9, va = [], vx = [], vy = [];
  (function(){
    var a0 = rnd() * TAU, tmp = [];
    for (var i = 0; i < NV; i++) {
      var a = a0 + (i / NV) * TAU + (rnd() - 0.5) * 0.30;
      a = Math.atan2(Math.sin(a), Math.cos(a));
      tmp.push([a, 0.74 + rnd() * 0.40]);
    }
    tmp.sort(function(p, q){ return p[0] - q[0]; });
    for (var j = 0; j < NV; j++) {
      va.push(tmp[j][0]);
      vx.push(Math.cos(tmp[j][0]) * tmp[j][1]);
      vy.push(Math.sin(tmp[j][0]) * tmp[j][1]);
    }
  })();
  var CHORDS = [[0, 4], [2, 6], [7, 3]];

  function polyR(th) {
    var d = Math.atan2(Math.sin(th), Math.cos(th));
    var i = NV - 1;
    for (var k = 0; k < NV - 1; k++) { if (d >= va[k] && d < va[k + 1]) { i = k; break; } }
    var j = (i + 1) % NV;
    var c = Math.cos(d), s = Math.sin(d);
    var den = (vy[j] - vy[i]) * c - (vx[j] - vx[i]) * s;
    if (Math.abs(den) < 1e-6) return 1;
    var r = (vx[i] * vy[j] - vx[j] * vy[i]) / den;
    return (isFinite(r) && r > 0) ? r : 1;
  }
  function blobR(th, ts) {
    return (1 + 0.15 * Math.sin(3 * th + ts * 0.9 + 1.7)
              + 0.10 * Math.sin(5 * th - ts * 0.7 + 4.0)
              + 0.06 * Math.sin(8 * th + ts * 0.45 + 2.2))
           * (1 + 0.05 * Math.sin(ts * 0.6));
  }

  function haze(x, y, r, col, a) {
    if (a <= 0 || r <= 0) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, A(col, a));
    g.addColorStop(1, A(col, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function ghost(gx, gy, s, a) {
    ctx.beginPath();
    for (var i = 0; i <= NV; i++) {
      var j = i % NV, x = gx + vx[j] * s, y = gy + vy[j] * s;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = A(C.b, a);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function draw(ms) {
    if (!W || !H) return;
    var dk = isDark();
    var ts = ms / 1000;
    var p = (ts % CYCLE) / CYCLE;
    /* envelope: flux -> snap (once) -> long identical hold -> melt back */
    var e = ss(0.40, 0.465, p) * (1 - ss(0.88, 0.985, p));
    var flux = 1 - e;

    var cx = W * 0.72, cy = H * 0.38;
    var R = Math.min(H * 0.46, W * 0.16);

    ctx.fillStyle = C.page;
    ctx.fillRect(0, 0, W, H);

    /* the generative field: soft, always shifting, strongest pre-lock */
    haze(W * (0.30 + 0.03 * Math.sin(ts * 0.21)), H * (0.20 + 0.05 * Math.sin(ts * 0.17 + 2)), W * 0.28, C.g, dk ? 0.09 : 0.055);
    haze(W * (0.54 + 0.02 * Math.sin(ts * 0.13 + 1)), H * 0.12, W * 0.17, C.g, dk ? 0.06 : 0.04);
    haze(cx + R * 0.2 * Math.sin(ts * 0.23), cy + R * 0.15 * Math.cos(ts * 0.19), R * 2.1, C.b, (dk ? 0.09 : 0.05) * (0.5 + 0.8 * flux));

    /* prior renders of the SAME artifact: faint, crisp, identical, still */
    ghost(W * 0.34, H * 0.26, R * 0.42, dk ? 0.16 : 0.11);
    ghost(W * 0.53, H * 0.15, R * 0.26, dk ? 0.12 : 0.085);
    ghost(W * 0.12, H * 0.30, R * 0.30, dk ? 0.10 : 0.07);

    /* boundary: flux blob mixed toward the exact polygon by e */
    var M = 160, pts = [];
    for (var i = 0; i <= M; i++) {
      var th = (i / M) * TAU;
      var r = (blobR(th, ts) * flux + polyR(th) * e) * R;
      pts.push([cx + Math.cos(th) * r, cy + Math.sin(th) * r]);
    }
    function trace(sc) {
      ctx.beginPath();
      for (var k = 0; k < pts.length; k++) {
        var x = cx + (pts[k][0] - cx) * sc, y = cy + (pts[k][1] - cy) * sc;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    /* soft uncertainty aura - collapses to nothing at the snap */
    if (flux > 0.02) {
      for (var k2 = 1; k2 <= 3; k2++) {
        trace(1 + (0.055 * k2) * flux + 0.012 * k2);
        ctx.strokeStyle = A(C.g, flux * (dk ? 0.11 : 0.08) / k2);
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
    }

    /* the form itself: green + fuzzy while shifting, blue + crisp once locked */
    trace(1);
    ctx.fillStyle = MIX(C.g, C.b, e, (dk ? 0.10 : 0.055) + 0.05 * e);
    ctx.fill();
    ctx.strokeStyle = MIX(C.g, C.b, e, 0.35 + 0.5 * e);
    ctx.lineWidth = 1 + 0.6 * e;
    ctx.stroke();

    if (e > 0.01) {
      /* fixed internal cleavage lines + vertex marks: the exactness of the artifact */
      for (var c2 = 0; c2 < CHORDS.length; c2++) {
        var a1 = CHORDS[c2][0], b1 = CHORDS[c2][1];
        ctx.beginPath();
        ctx.moveTo(cx + vx[a1] * R, cy + vy[a1] * R);
        ctx.lineTo(cx + vx[b1] * R, cy + vy[b1] * R);
        ctx.strokeStyle = c2 === 1 ? A(C.g, 0.26 * e) : A(C.b, 0.22 * e);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      for (var v2 = 0; v2 < NV; v2++) {
        ctx.beginPath();
        ctx.arc(cx + vx[v2] * R, cy + vy[v2] * R, v2 % 5 === 0 ? 2.2 : 1.5, 0, TAU);
        ctx.fillStyle = v2 % 5 === 0 ? A(C.g, 0.7 * e) : A(C.b, 0.6 * e);
        ctx.fill();
      }
    }

    /* one settle pulse the instant the artifact locks */
    if (p > 0.465 && p < 0.64) {
      var q = (p - 0.465) / 0.175;
      trace(1.03 + q * 0.55);
      ctx.strokeStyle = A(C.b, (1 - q) * (1 - q) * (dk ? 0.34 : 0.26));
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    /* bottom melts to the page for the h1 */
    var gr = ctx.createLinearGradient(0, H * 0.5, 0, H);
    gr.addColorStop(0, A(C.p, 0));
    gr.addColorStop(1, A(C.p, 1));
    ctx.fillStyle = gr;
    ctx.fillRect(0, H * 0.5, W, H * 0.5 + 2);
  }

  function drawStatic() { draw(CYCLE * 700); } /* p = 0.7: the locked, resolved artifact */

  function loop(t) {
    raf = null;
    if (!vis || !ply) { pv = null; return; }
    if (pv == null) pv = t;
    tm += Math.min(100, t - pv);
    pv = t;
    draw(tm);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      raf = requestAnimationFrame(loop);
    }
  }
  function start() {
    if (raf != null) return;
    pv = null;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { drawStatic(); return; }
    if (vis && ply) { raf = requestAnimationFrame(loop); }
  }
  function stop() {
    if (raf != null) { cancelAnimationFrame(raf); raf = null; }
    pv = null;
  }

  var ro = new ResizeObserver(function(en){
    var r = en[0].contentRect;
    W = r.width; H = r.height;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { drawStatic(); }
    else { draw(tm); start(); }
  });
  ro.observe(root);

  var io = new IntersectionObserver(function(en){
    vis = en[0].isIntersecting;
    if (vis) { start(); } else { stop(); }
  });
  io.observe(root);

  document.addEventListener('visibilitychange', function(){
    ply = !document.hidden;
    if (ply) { start(); } else { stop(); }
  });

  function themed() {
    refresh();
    if (raf == null) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { drawStatic(); }
      else { draw(tm); }
    }
  }
  new MutationObserver(themed).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themed);
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', function(ev){
    if (ev.matches) { stop(); drawStatic(); } else { start(); }
  });

  refresh();
})();
</script>
