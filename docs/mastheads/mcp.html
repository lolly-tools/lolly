<style>

<script>

  var canvas=root.querySelector('canvas');
  var ctx=canvas.getContext('2d');
  function tok(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}
  function rgba(c,a){var m=/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(c);if(!m)return c;var s=m[1];if(s.length===3){s=s.charAt(0)+s.charAt(0)+s.charAt(1)+s.charAt(1)+s.charAt(2)+s.charAt(2);}var n=parseInt(s,16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}

      ctx.strokeStyle=rgba(C.green,0.9);ctx.lineWidth=1.2;

    mg.addColorStop(0,rgba(C.page,0));
