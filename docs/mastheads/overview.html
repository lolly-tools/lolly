<!-- Concept: one green CORE sends a single, consistent, ordered pulse outward along direct spokes to
     five distinct frame-shells (web/desktop/mobile/CLI/TUI) — varied rectangles in brand hues — for one
     engine, one render path, many surfaces; tools ride the path as data, not bundled code. Distinct from
     forms already used: strict radial spokes to a small fixed set of frames with staggered, identical
     arrivals, not a particle field, node mesh, parting seal, tectonic slabs, channel irrigation, wedge/
     lens rings, guard-railed lanes, or a colour confluence.
     Band contract: .ov is position:absolute;inset:0;overflow:hidden;pointer-events:none, sized each frame
     from the live element rect (no constants), detail kept in the upper ~55%, lower edge CSS-masked to
     melt into the page; tokens read live via getComputedStyle with dark detected through
     documentElement.classList.contains('dark'), repainted on MutationObserver(class) + matchMedia(dark)
     change, reduced-motion rendered as one static frame (literal inline checks at each rAF site), and the
     loop self-suspends offscreen/hidden and resumes when visible.
     Generated by Claude Sonnet 5 (Anthropic) for the Lolly docs masthead bank, commissioned by Andy Fitzsimon (the accountable human author), per-page brief composed by Claude Opus 4.8, on 2026-08-13; model serving region/jurisdiction: not disclosed. The C2PA signature added at
     bank time is this file's first provenance record. -->
<div class="ov" aria-hidden="true"><canvas></canvas></div>
<style>
.ov{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.ov canvas{display:block;width:100%;height:100%;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,0) 97%);mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,0) 97%)}
</style>
<script>
(function(){
  var root=document.querySelector('.ov');
  var canvas=root.querySelector('canvas');
  var ctx=canvas.getContext('2d');

  function tok(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}

  var w=0,h=0,dpr=1,raf=null,intersecting=true;

  var shells=[
    {key:'web',    fx:0.40, fy:0.13, fw:0.160, fh:0.060, corner:'soft',  dash:null,      colorTok:'--blue'},
    {key:'desktop',fx:0.60, fy:0.09, fw:0.105, fh:0.095, corner:'round', dash:null,      colorTok:'--navy'},
    {key:'mobile', fx:0.79, fy:0.16, fw:0.052, fh:0.115, corner:'pill',  dash:null,      colorTok:'--orange'},
    {key:'cli',    fx:0.865,fy:0.37, fw:0.105, fh:0.058, corner:'bevel', dash:[5,4],     colorTok:'--blue'},
    {key:'tui',    fx:0.745,fy:0.49, fw:0.082, fh:0.044, corner:'sharp', dash:[2,3],     colorTok:'--orange'}
  ];

  function rrect(x,y,ww,hh,r){
    var rr=Math.min(r,ww/2,hh/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.lineTo(x+ww-rr,y);
    ctx.arcTo(x+ww,y,x+ww,y+rr,rr);
    ctx.lineTo(x+ww,y+hh-rr);
    ctx.arcTo(x+ww,y+hh,x+ww-rr,y+hh,rr);
    ctx.lineTo(x+rr,y+hh);
    ctx.arcTo(x,y+hh,x,y+hh-rr,rr);
    ctx.lineTo(x,y+rr);
    ctx.arcTo(x,y,x+rr,y,rr);
    ctx.closePath();
  }

  function bevRect(x,y,ww,hh,cut){
    ctx.beginPath();
    ctx.moveTo(x+cut,y);
    ctx.lineTo(x+ww,y);
    ctx.lineTo(x+ww,y+hh-cut);
    ctx.lineTo(x+ww-cut,y+hh);
    ctx.lineTo(x,y+hh);
    ctx.lineTo(x,y+cut);
    ctx.closePath();
  }

  function drawFrame(s,x,y,ww,hh,col,flash){
    ctx.save();
    ctx.setLineDash(s.dash||[]);
    if(s.corner==='pill'){ rrect(x,y,ww,hh,hh/2); }
    else if(s.corner==='round'){ rrect(x,y,ww,hh,Math.min(ww,hh)*0.28); }
    else if(s.corner==='soft'){ rrect(x,y,ww,hh,Math.min(ww,hh)*0.14); }
    else if(s.corner==='bevel'){ bevRect(x,y,ww,hh,Math.min(ww,hh)*0.34); }
    else { ctx.beginPath(); ctx.rect(x,y,ww,hh); }
    ctx.globalAlpha=0.08+flash*0.22;
    ctx.fillStyle=col;
    ctx.fill();
    ctx.globalAlpha=0.5+flash*0.45;
    ctx.strokeStyle=col;
    ctx.lineWidth=1.3;
    ctx.stroke();
    ctx.restore();
    if(s.key==='tui'){
      ctx.save();
      ctx.setLineDash([]);
      ctx.globalAlpha=0.35+flash*0.3;
      ctx.strokeStyle=col;
      ctx.lineWidth=1;
      ctx.strokeRect(x+3,y+3,Math.max(0,ww-6),Math.max(0,hh-6));
      ctx.restore();
    }
  }

  function resize(){
    var rect=root.getBoundingClientRect();
    w=Math.max(1,rect.width);
    h=Math.max(1,rect.height);
    dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function draw(ts){
    var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var isDark=document.documentElement.classList.contains('dark');
    var page=tok('--page',isDark?'#061816':'#ffffff');
    var pale=tok('--pale',isDark?'#0d2419':'#f0fbf5');
    var green=tok('--green','#30ba78');
    var border=tok('--border',isDark?'#1b3d2c':'#d8ede4');
    var dark=tok('--dark','#0c322c');

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=page;
    ctx.fillRect(0,0,w,h);

    var cx=0.17*w, cy=0.38*h;
    var wash=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*0.6);
    wash.addColorStop(0,pale);
    wash.addColorStop(1,page);
    ctx.save();
    ctx.globalAlpha=0.85;
    ctx.fillStyle=wash;
    ctx.fillRect(0,0,w,h);
    ctx.restore();

    var tsec=(ts||0)/1000;

    for(var i=0;i<shells.length;i++){
      var s=shells[i];
      var col=tok(s.colorTok,'#2453ff');
      var x=s.fx*w, y=s.fy*h, ww=s.fw*w, hh=s.fh*h;
      var fcx=x+ww/2, fcy=y+hh/2;
      var dx=fcx-cx, dy=fcy-cy;

      var grad=ctx.createLinearGradient(cx,cy,fcx,fcy);
      grad.addColorStop(0,green);
      grad.addColorStop(1,col);
      ctx.save();
      ctx.setLineDash([]);
      ctx.strokeStyle=grad;
      ctx.globalAlpha=0.32;
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(fcx,fcy);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.setLineDash([]);
      ctx.strokeStyle=border;
      ctx.globalAlpha=0.55;
      ctx.lineWidth=1;
      var len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len, ny=dx/len;
      var tks=[0.32,0.64];
      for(var k=0;k<tks.length;k++){
        var px=cx+dx*tks[k], py=cy+dy*tks[k];
        ctx.beginPath();
        ctx.moveTo(px-nx*3,py-ny*3);
        ctx.lineTo(px+nx*3,py+ny*3);
        ctx.stroke();
      }
      ctx.restore();

      var flash=0, showPulse=false, pex=cx, pey=cy, pulseAlpha=0;
      if(!reduced){
        var local=(tsec/2.6)-i*0.16;
        var cyclePos=local-Math.floor(local);
        var travel=Math.min(1,cyclePos/0.75);
        pulseAlpha=Math.sin(Math.PI*travel);
        pex=cx+dx*travel; pey=cy+dy*travel;
        flash=Math.max(0,1-Math.abs(cyclePos-0.8)/0.18);
        showPulse=pulseAlpha>0.02;
      }

      drawFrame(s,x,y,ww,hh,col,flash);

      if(showPulse){
        ctx.save();
        ctx.globalAlpha=Math.min(0.95,pulseAlpha);
        ctx.fillStyle=green;
        ctx.beginPath();
        ctx.arc(pex,pey,Math.max(2,Math.min(w,h)*0.013),0,Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    var coreR=Math.max(6,Math.min(w,h)*0.05);
    var coreGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*2);
    coreGrad.addColorStop(0,green);
    coreGrad.addColorStop(1,page);
    ctx.save();
    ctx.globalAlpha=0.85;
    ctx.fillStyle=coreGrad;
    ctx.beginPath();
    ctx.arc(cx,cy,coreR*2,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.fillStyle=green;
    ctx.beginPath();
    ctx.arc(cx,cy,coreR,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=0.4;
    ctx.strokeStyle=dark;
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.restore();
  }

  function tick(ts){
    draw(ts);
    if(intersecting && !document.hidden && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      raf=requestAnimationFrame(tick);
    } else {
      raf=null;
    }
  }

  function start(){
    if(raf) return;
    draw(performance.now());
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      raf=requestAnimationFrame(tick);
    }
  }

  function stop(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
  }

  resize();
  start();

  if(typeof ResizeObserver!=='undefined'){
    var ro=new ResizeObserver(function(){ resize(); draw(performance.now()); });
    ro.observe(root);
  } else {
    window.addEventListener('resize', function(){ resize(); draw(performance.now()); });
  }

  var io=new IntersectionObserver(function(entries){
    var entry=entries[entries.length-1];
    intersecting=entry.isIntersecting;
    if(intersecting){ start(); } else { stop(); }
  },{threshold:0.01});
  io.observe(root);

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ stop(); } else if(intersecting){ start(); }
  });

  var mo=new MutationObserver(function(){ draw(performance.now()); });
  mo.observe(document.documentElement,{attributes:true,attributeFilter:['class']});

  var mmDark=window.matchMedia('(prefers-color-scheme: dark)');
  function onScheme(){ draw(performance.now()); }
  if(mmDark.addEventListener){ mmDark.addEventListener('change',onScheme); }
  else if(mmDark.addListener){ mmDark.addListener(onScheme); }
})();
</script>
