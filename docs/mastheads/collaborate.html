<!-- "Confluence": four streams of color merge into one unified flow — collaboration
     as contributions meeting, blending, advancing together. Upper-band detail only;
     h1 area clear. Theme-aware via live tokens; repaints on .dark and prefers-color-scheme.
     PROVENANCE: Generated by GLM-5.2 (z.ai) for the Lolly docs masthead
     bank, prompt-directed by Andy Fitzsimon on 2026-08-13; region: not disclosed. The

<div class="collab" aria-hidden="true">
  <canvas></canvas>
</div>
<style>
  .collab{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .collab canvas{display:block;width:100%;height:100%}
</style>
<script>
(function(){
  var root=document.querySelector('.collab');
  var canvas=root.querySelector('canvas');
  var ctx=canvas.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=0,h=0,rafId=null,running=false,t=0,ribbons=[],reduced=false;

  function tok(n,f){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}
  function isDark(){return document.documentElement.classList.contains('dark')||window.matchMedia('(prefers-color-scheme: dark)').matches;}
  var C={};
  function readTokens(){
    C.page=tok('--page','#ffffff');
    C.green=tok('--green','#30ba78');
    C.blue=tok('--blue','#2453ff');
    C.orange=tok('--orange','#fe7c3f');
    C.dark=tok('--dark','#0c322c');
    C.pale=tok('--pale','#f0fbf5');
    C.light=tok('--light','#90ebcd');
    C.navy=tok('--navy','#192072');
    C.muted=tok('--muted','#5a7067');
    C.isDark=isDark();
  }
  function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16)||0,parseInt(h.substr(2,2),16)||0,parseInt(h.substr(4,2),16)||0];}
  function rgba(h,a){var c=hexRgb(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
  function lerp(a,b,t){return a+(b-a)*t;}
  function smooth(t){return t*t*(3-2*t);}

  function resize(){
    var r=root.getBoundingClientRect();
    w=Math.max(1,r.width);h=Math.max(1,r.height);
    canvas.width=Math.max(1,Math.round(w*dpr));
    canvas.height=Math.max(1,Math.round(h*dpr));
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function initRibbons(){
    ribbons=[];
    var hues=['green','blue','orange','light'];
    var n=4;
    var top=h*0.10;
    var spread=h*0.50;
    for(var i=0;i<n;i++){
      ribbons.push({
        entryY:top+(i/(n-1))*spread,
        freq:0.006+i*0.001,
        phase:i*0.9,
        speed:0.10+i*0.02,
        amp:5+(i%3)*3,
        thick:1.5+(i%2)*1.2,
        hue:hues[i]
      });
    }
  }

  function ribbonY(r,x,time){
    var p=x/w;
    var ms=0.35,me=0.55;
    var uy=h*0.28;
    if(p<ms){
      return r.entryY+Math.sin(x*r.freq+r.phase+time*r.speed)*r.amp;
    }else if(p<me){
      var tp=(p-ms)/(me-ms);
      var s=smooth(tp);
      var indY=r.entryY+Math.sin(ms*w*r.freq+r.phase+time*r.speed)*r.amp;
      return lerp(indY,uy,s);
    }else{
      var up=(p-me)/(1-me);
      return uy+Math.sin(x*r.freq*0.3+time*r.speed*0.5)*2*smooth(Math.min(up*3,1));
    }
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    var ba=C.isDark?0.35:0.22;
    var ga=C.isDark?0.08:0.05;
    for(var i=0;i<ribbons.length;i++){
      var r=ribbons[i];
      ctx.beginPath();
      ctx.strokeStyle=rgba(C[r.hue],ga);
      ctx.lineWidth=r.thick*5;
      ctx.lineCap='round';ctx.lineJoin='round';
      for(var x=0;x<=w;x+=3){
        var y=ribbonY(r,x,t);
        if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    for(var i=0;i<ribbons.length;i++){
      var r=ribbons[i];
      ctx.beginPath();
      ctx.strokeStyle=rgba(C[r.hue],ba);
      ctx.lineWidth=r.thick;
      ctx.lineCap='round';ctx.lineJoin='round';
      for(var x=0;x<=w;x+=2){
        var y=ribbonY(r,x,t);
        if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    var cx=w*0.45,cy=h*0.28;
    var gr=Math.min(w,h)*0.25+Math.sin(t*0.3)*3;
    var grad=ctx.createRadialGradient(cx,cy,0,cx,cy,gr);
    var gA=C.isDark?0.14:0.08;
    grad.addColorStop(0,rgba(C.green,gA));
    grad.addColorStop(0.4,rgba(C.green,gA*0.4));
    grad.addColorStop(1,rgba(C.green,0));
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,w,h);
  }

  function frame(){
    if(!running)return;
    t+=0.016;
    draw();
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){running=false;return;}
    rafId=requestAnimationFrame(frame);
  }
  function start(){if(running||reduced)return;running=true;rafId=requestAnimationFrame(frame);}
  function stop(){running=false;if(rafId){cancelAnimationFrame(rafId);rafId=null;}}

  function setup(){
    reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    resize();initRibbons();readTokens();
    if(reduced){t=0.5;draw();}
    else{start();}
    new MutationObserver(function(){readTokens();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){readTokens();draw();});
    new IntersectionObserver(function(e){e.forEach(function(en){if(en.isIntersecting&&!reduced)start();else stop();});},{threshold:0}).observe(root);
    document.addEventListener('visibilitychange',function(){if(document.hidden)stop();else if(!reduced)start();});
    window.addEventListener('resize',function(){resize();initRibbons();draw();});
  }
  setup();
})();
</script>
