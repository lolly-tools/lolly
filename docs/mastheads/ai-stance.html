<div class="ns-ai" aria-hidden="true">
  <canvas></canvas>
</div>
<style>
  .ns-ai {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ns-ai canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script>
(function(){
  const root = document.querySelector('.ns-ai');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');

  let width = 0, height = 0;
  let isVisible = false, isPlaying = true;
  let time = 0, rafId = null;
  let colors = {};

  function tok(name, fallback) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  }

  function updateColors() {
    colors.page = tok('--page', '#ffffff');
    colors.muted = tok('--muted', '#5a7067');
    colors.border = tok('--border', '#d8ede4');
    colors.green = tok('--green', '#30ba78');
    colors.blue = tok('--blue', '#2453ff');
  }

  const channelsCount = 40;
  const channels = [];
  for (let i = 0; i < channelsCount; i++) {
    channels.push({
      yRatio: i / (channelsCount - 1),
      speed: 30 + Math.random() * 45,
      pulseOffset: Math.random() * 2000
    });
  }

  function getContourY(x, yRatio) {
    const wave1 = Math.sin(x * 0.0015 + yRatio * 6) * 45;
    const wave2 = Math.cos(x * 0.0028 - yRatio * 3) * 25;
    return (yRatio * height * 1.3) - (height * 0.15) + wave1 + wave2;
  }

  function drawPath(startX, endX, yRatio) {
    ctx.beginPath();
    for (let x = startX; x <= endX; x += 15) {
      const y = getContourY(x, yRatio);
      if (x === startX) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function draw(t) {
    ctx.fillStyle = colors.page;
    ctx.fillRect(0, 0, width, height);

    // Draw the static structural channels (the 'irrigation' grid)
    ctx.strokeStyle = colors.muted;
    ctx.globalAlpha = 0.12;
    ctx.lineWidth = 1;
    for (let i = 0; i < channelsCount; i++) {
      drawPath(0, width, channels[i].yRatio);
    }

    // Draw the flowing abundance (water turning to growth)
    for (let i = 0; i < channelsCount; i++) {
      const ch = channels[i];
      // Pulse moves continuously left to right, wrapping around
      const p = (t * ch.speed + ch.pulseOffset) % (width + 600) - 300;

      // Growth trail - fading tail (green)
      const fadeStart = Math.max(0, p - 220);
      const fadeEnd = Math.min(width, p - 60);
      if (fadeStart < width && fadeEnd > 0 && fadeStart < fadeEnd) {
        ctx.strokeStyle = colors.green;
        ctx.globalAlpha = 0.15;
        ctx.lineWidth = 1.5;
        drawPath(fadeStart, fadeEnd, ch.yRatio);
      }

      // Growth trail - core (green)
      const coreStart = Math.max(0, p - 60);
      const coreEnd = Math.min(width, p);
      if (coreStart < width && coreEnd > 0 && coreStart < coreEnd) {
        ctx.strokeStyle = colors.green;
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = 2;
        drawPath(coreStart, coreEnd, ch.yRatio);
      }

      // Water head - leading edge (blue)
      const headStart = Math.max(0, p - 15);
      const headEnd = Math.min(width, p + 5);
      if (headStart < width && headEnd > 0 && headStart < headEnd) {
        ctx.strokeStyle = colors.blue;
        ctx.globalAlpha = 0.8;
        ctx.lineWidth = 2.5;
        drawPath(headStart, headEnd, ch.yRatio);
      }

      // Leading droplet
      if (p > 0 && p < width) {
        const headY = getContourY(p + 5, ch.yRatio);
        ctx.beginPath();
        ctx.arc(p + 5, headY, 2, 0, Math.PI * 2);
        ctx.fillStyle = colors.blue;
        ctx.globalAlpha = 0.9;
        ctx.fill();
      }
    }
  }

  function loop(timestamp) {
    if (!isPlaying || !isVisible) return;

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    time = reduced ? 0 : timestamp * 0.001;
    draw(time);

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    }
  }

  const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    const dpr = window.devicePixelRatio || 1;
    width = rect.width;
    height = rect.height;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    updateColors();

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    draw(reduced ? 0 : time);
  });
  ro.observe(root);

  const io = new IntersectionObserver(entries => {
    isVisible = entries[0].isIntersecting;
    if (isVisible && isPlaying && !rafId && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    } else if (!isVisible && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });
  io.observe(root);

  document.addEventListener('visibilitychange', () => {
    isPlaying = !document.hidden;
    if (isPlaying && isVisible && !rafId && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    } else if (!isPlaying && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });

  const mo = new MutationObserver(() => {
    updateColors();
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    draw(reduced ? 0 : time);
  });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    updateColors();
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    draw(reduced ? 0 : time);
  });

  updateColors();
})();
</script>
