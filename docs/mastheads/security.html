<!--
  Concept: GUILLOCHÉ — layered spirograph rosettes (hypotrochoid curves that close into
  many self-crossing loops) plus a fine engine-turned ribbon, in --green/--navy line-work
  on --page: many precise interlacing curves settling into one exact, stable form — the
  cryptographic rigor (standards-based, on-device WebCrypto, tested to the known-answer
  vector) behind Lolly's Content Credentials, engraved rather than merely drawn.
  Band contract: full-bleed absolute fragment, aria-hidden, scoped under .sec; the canvas
  fills the live element rect via ResizeObserver; detail concentrates upper-right/upper-left
  while a destination-out gradient melts the lower band into --page; tokens are read live
  via getComputedStyle and repainted on html.class + prefers-color-scheme changes; reduced
  motion renders one static settled frame (checked inline at every requestAnimationFrame
  site); the loop self-suspends off-screen and when the tab is hidden.

<div class="sec" aria-hidden="true"><canvas></canvas></div>
<style>
.sec{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sec canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
<script>
(function(){
  var root = document.querySelector('.sec');
  var canvas = root.querySelector('canvas');
  var ctx = canvas.getContext('2d');

  var width = 0, height = 0, dpr = 1;
  var colors = {};
  var medallions = [];
  var ribbonRows = [];
  var isVisible = true, pageVisible = !document.hidden;
  var rafId = null;

  function tok(n, f) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return v || f;
  }
  function themeIsDark(){ return document.documentElement.classList.contains('dark'); }

  function updateColors(){
    var dark = themeIsDark();
    colors.page = tok('--page', dark ? '#061816' : '#ffffff');
    colors.pale = tok('--pale', dark ? '#0d2419' : '#f0fbf5');
    colors.border = tok('--border', dark ? '#1b3d2c' : '#d8ede4');
    colors.muted = tok('--muted', dark ? '#7aaa90' : '#5a7067');
    colors.green = tok('--green', '#30ba78');
    colors.navy = tok('--navy', '#192072');
  }

  function buildSpiroPath(R1, R2, num, den, phase){
    var path = new Path2D();
    var steps = Math.min(2200, den * 320);
    var span = Math.PI * 2 * den;
    for (var i = 0; i <= steps; i++){
      var t = (i / steps) * span;
      var x = R1 * Math.cos(t) + R2 * Math.cos(t * num / den + phase);
      var y = R1 * Math.sin(t) + R2 * Math.sin(t * num / den + phase);
      if (i === 0) path.moveTo(x, y); else path.lineTo(x, y);
    }
    path.closePath();
    return path;
  }

  function buildRipplePath(R, k, amp){
    var path = new Path2D();
    var steps = 360;
    for (var i = 0; i <= steps; i++){
      var theta = (i / steps) * Math.PI * 2;
      var rr = R * (1 + amp * Math.sin(k * theta));
      var x = rr * Math.cos(theta), y = rr * Math.sin(theta);
      if (i === 0) path.moveTo(x, y); else path.lineTo(x, y);
    }
    path.closePath();
    return path;
  }

  function makeMedallion(cx, cy, r, speed, maxAngle, phaseSeed, layerDefs){
    var layers = [];
    for (var i = 0; i < layerDefs.length; i++){
      var d = layerDefs[i];
      var R1 = r * 0.60;
      var R2 = r * d.r2;
      layers.push({
        path: buildSpiroPath(R1, R2, d.num, d.den, d.phase),
        color: d.color,
        alpha: d.alpha,
        width: 0.7 + (layerDefs.length - i) * 0.06
      });
    }
    return {
      cx: cx, cy: cy, r: r, speed: speed, maxAngle: maxAngle, phaseSeed: phaseSeed,
      layers: layers,
      guide: buildRipplePath(r * 0.97, 9, 0.03)
    };
  }

  function buildGeometry(w, h){
    var m = Math.min(w, h);
    medallions = [
      makeMedallion(w * 0.72, h * 0.30, m * 0.44, 0.00013, 0.05, 0.0, [
        { num: 7, den: 3, r2: 0.30, phase: 0.0, color: 'green', alpha: 0.55 },
        { num: 9, den: 4, r2: 0.34, phase: 0.9, color: 'navy', alpha: 0.48 },
        { num: 11, den: 5, r2: 0.38, phase: 1.8, color: 'green', alpha: 0.38 },
        { num: 5, den: 2, r2: 0.24, phase: 2.5, color: 'navy', alpha: 0.40 },
        { num: 13, den: 5, r2: 0.42, phase: 3.3, color: 'green', alpha: 0.26 }
      ]),
      makeMedallion(w * 0.09, h * 0.15, m * 0.24, -0.00017, 0.065, 2.1, [
        { num: 7, den: 3, r2: 0.30, phase: 0.4, color: 'navy', alpha: 0.40 },
        { num: 9, den: 4, r2: 0.35, phase: 1.3, color: 'green', alpha: 0.34 },
        { num: 5, den: 2, r2: 0.22, phase: 2.1, color: 'navy', alpha: 0.24 }
      ]),
      makeMedallion(w * 0.97, h * 0.52, m * 0.15, 0.00021, 0.045, 4.2, [
        { num: 11, den: 5, r2: 0.36, phase: 0.2, color: 'green', alpha: 0.30 },
        { num: 7, den: 3, r2: 0.28, phase: 1.1, color: 'navy', alpha: 0.26 }
      ])
    ];

    ribbonRows = [];
    var rows = 9;
    for (var j = 0; j < rows; j++){
      ribbonRows.push({
        y: h * (0.05 + 0.40 * (j / (rows - 1))),
        f1: 0.006 + j * 0.0007,
        f2: 0.013 - j * 0.0004,
        a1: m * 0.026,
        a2: m * 0.013,
        phase: j * 0.7,
        color: (j % 2 === 0) ? 'green' : 'navy',
        alpha: 0.09 + (j % 3) * 0.02
      });
    }
  }

  function draw(time){
    if (!width || !height) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = colors.page;
    ctx.fillRect(0, 0, width, height);

    var m0 = medallions[0];
    if (m0){
      var glow = ctx.createRadialGradient(m0.cx, m0.cy, 0, m0.cx, m0.cy, m0.r * 1.15);
      glow.addColorStop(0, colors.pale);
      glow.addColorStop(1, colors.page);
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(m0.cx, m0.cy, m0.r * 1.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.lineWidth = 0.6;
    for (var j = 0; j < ribbonRows.length; j++){
      var row = ribbonRows[j];
      ctx.beginPath();
      for (var x = 0; x <= width; x += 6){
        var y = row.y + row.a1 * Math.sin(x * row.f1 + row.phase) + row.a2 * Math.sin(x * row.f2 - row.phase * 1.3);
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = colors[row.color];
      ctx.globalAlpha = row.alpha;
      ctx.stroke();
    }
    ctx.restore();

    for (var mi = 0; mi < medallions.length; mi++){
      var med = medallions[mi];
      var reducedM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var angle = reducedM ? 0 : Math.sin(time * med.speed + med.phaseSeed) * med.maxAngle;
      ctx.save();
      ctx.translate(med.cx, med.cy);
      ctx.rotate(angle);
      ctx.save();
      ctx.strokeStyle = colors.border;
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = 1;
      ctx.stroke(med.guide);
      ctx.restore();
      ctx.lineJoin = 'round';
      for (var li = 0; li < med.layers.length; li++){
        var layer = med.layers[li];
        ctx.strokeStyle = colors[layer.color];
        ctx.globalAlpha = layer.alpha;
        ctx.lineWidth = layer.width;
        ctx.stroke(layer.path);
      }
      ctx.restore();
    }

    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    var fade = ctx.createLinearGradient(0, height * 0.44, 0, height);
    fade.addColorStop(0, 'rgba(0,0,0,0)');
    fade.addColorStop(0.6, 'rgba(0,0,0,0.45)');
    fade.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = fade;
    ctx.fillRect(0, 0, width, height);
    ctx.restore();
  }

  function loop(ts){
    draw(ts);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      rafId = requestAnimationFrame(loop);
    } else {
      rafId = null;
    }
  }

  function kick(){
    if (rafId) return;
    if (!isVisible || !pageVisible) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      draw(0);
      return;
    }
    rafId = requestAnimationFrame(loop);
  }

  function stopLoop(){
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  }

  var ro = new ResizeObserver(function(entries){
    var rect = entries[0].contentRect;
    width = rect.width;
    height = rect.height;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(width * dpr));
    canvas.height = Math.max(1, Math.round(height * dpr));
    buildGeometry(width, height);
    draw(0);
    kick();
  });
  ro.observe(root);

  var io = new IntersectionObserver(function(entries){
    isVisible = entries[0].isIntersecting;
    if (isVisible){ kick(); } else { stopLoop(); }
  });
  io.observe(root);

  document.addEventListener('visibilitychange', function(){
    pageVisible = !document.hidden;
    if (pageVisible){ kick(); } else { stopLoop(); }
  });

  var mo = new MutationObserver(function(){
    updateColors();
    draw(0);
  });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
    updateColors();
    draw(0);
  });

  updateColors();
})();
</script>
