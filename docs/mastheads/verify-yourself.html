<style>
  .ns-vy {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ns-vy canvas {
    display: block;
    width: 100%;
    height: 100%;

<script>
(function(){
  const root = document.querySelector('.ns-vy');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');

  let width = 0, height = 0;
  let isVisible = false, isPlaying = true;
  let time = 0, rafId = null;
  let colors = {};

  function tok(name, fallback) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  }

  function updateColors() {
    colors.page = tok('--page', '#ffffff');
    colors.muted = tok('--muted', '#5a7067');
    colors.border = tok('--border', '#d8ede4');
    colors.green = tok('--green', '#30ba78');
  }

  // Generate deterministic but random-looking cryptographic rings
  const rings = [];
  for (let i = 0; i < 16; i++) {
    rings.push({
      r: 40 + (i * 24) + (Math.sin(i * 45) * 5),
      w: 1 + Math.abs(Math.cos(i * 12)) * 1.5,
      speed: (i % 2 === 0 ? 1 : -1) * (15 + Math.abs(Math.sin(i * 99)) * 25),
      dash: [4 + Math.abs(Math.cos(i)) * 40, 6 + Math.abs(Math.sin(i)) * 20]
    });
  }

  function draw(t) {
    ctx.fillStyle = colors.page;
    ctx.fillRect(0, 0, width, height);

    // Position the "lens" on the right side of the screen
    const cx = Math.min(width - 80, width * 0.85);
    const cy = height * 0.5;
    const maxR = Math.max(width, height) * 0.8;

    // PASS 1: The unverified state (ambient, opaque data)
    ctx.save();
    ctx.translate(cx, cy);
    rings.forEach(ring => {
      ctx.beginPath();
      ctx.arc(0, 0, ring.r, 0, Math.PI * 2);
      ctx.lineWidth = ring.w;
      ctx.strokeStyle = colors.muted;
      ctx.globalAlpha = 0.15;
      ctx.setLineDash(ring.dash);
      ctx.lineDashOffset = t * ring.speed;
      ctx.stroke();
    });
    ctx.restore();

    // PASS 2: The verified state (the local cryptographic lens)
    ctx.save();
    ctx.translate(cx, cy);

    // Define the offline verification boundary (a wedge pointing left into the text)
    const angle = Math.PI / 6; // 30 degrees half-angle
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, maxR, Math.PI - angle, Math.PI + angle);
    ctx.lineTo(0, 0);
    ctx.clip(); // Cryptographic certainty: a hard, exact boundary

    // Subtle background glow inside the verified zone
    ctx.fillStyle = colors.green;
    ctx.globalAlpha = 0.03;
    ctx.fill();

    // Draw the verified rings (illuminated and aligned in purpose)
    rings.forEach(ring => {
      ctx.beginPath();
      ctx.arc(0, 0, ring.r, 0, Math.PI * 2);
      ctx.lineWidth = ring.w * 1.5; // Thicker when verified
      ctx.strokeStyle = colors.green;
      ctx.globalAlpha = 0.85;
      ctx.setLineDash(ring.dash);
      ctx.lineDashOffset = t * ring.speed;
      ctx.stroke();
    });

    // The central verification axis
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-maxR, 0);
    ctx.strokeStyle = colors.green;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.4;
    ctx.setLineDash([4, 4]);
    ctx.lineDashOffset = -t * 10; // Axis moves inwards toward the center
    ctx.stroke();

    // Outer boundary of the lens
    ctx.beginPath();
    ctx.arc(0, 0, maxR * 0.7, Math.PI - angle, Math.PI + angle);
    ctx.strokeStyle = colors.green;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.2;
    ctx.setLineDash([]);
    ctx.stroke();

    ctx.restore();
  }

  function loop(timestamp) {
    if (!isPlaying || !isVisible) return;

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    time = reduced ? 0 : timestamp * 0.001;
    draw(time);

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    }
  }

  const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    const dpr = window.devicePixelRatio || 1;
    width = rect.width;
    height = rect.height;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    updateColors();

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    draw(reduced ? 0 : time);
  });
  ro.observe(root);

  const io = new IntersectionObserver(entries => {
    isVisible = entries[0].isIntersecting;
    if (isVisible && isPlaying && !rafId && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    } else if (!isVisible && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });
  io.observe(root);

  document.addEventListener('visibilitychange', () => {
    isPlaying = !document.hidden;
    if (isPlaying && isVisible && !rafId && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      rafId = requestAnimationFrame(loop);
    } else if (!isPlaying && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });

  const mo = new MutationObserver(() => {
    updateColors();
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    draw(reduced ? 0 : time);
  });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    updateColors();
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    draw(reduced ? 0 : time);
  });

  updateColors();
})();
</script>
