<!--
  Concept: where Lolly Demo appears. In the app, the chrome the pack sets for the light and dark looks
  (Spearmint whatever the colourway), the Etiquette icons and the kangaroo of the Unsaved edits dialog.
  At the register, Lolly's three rings and the stripe while a render, an export or a send runs. In a
  finished PNG, the record of the design system and colourway, Content Credentials and the invisible
  Lolly Imprint.
  Band Contract: static fragment scoped under .ldu, reads the docs theme tokens with fallbacks, no
  script, no motion, no network. The two app pictures keep the pack's own chrome values in every theme.
  Sources: chrome values from demo.json (light.color.chrome and dark.color.chrome); the app bar after the
  "A pack may set the chrome" demo on /brand; the kangaroo is kangarooArt() in its end pose; the rings are
  the three-ring diagram of /brand, drawn here rather than copied from a credentialed file; the record
  text is the export panel's Design system card (docs/exporting.md).
  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon on
  2026-10-21. The C2PA signature added at bank time is the first provenance record of this file.
-->
<style>
.ldu{--ldu-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ldu-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));
 --ldu-ground:hsl(var(--secondary,84.5 55% 92.2%));--ldu-paper:hsl(var(--card,0 0% 100%));
 --ldu-accent:hsl(var(--primary,176.5 89.5% 11.2%));--ldu-on-accent:hsl(var(--primary-foreground,0 0% 100%));
 --ldu-line:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .13);--ldu-soft:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .06);
 --ldu-wash:color-mix(in oklab,var(--ldu-accent) 14%,var(--ldu-paper));
 --ldu-head:#033633;--ldu-mark:#008657;--ldu-yes:#0b6b45;--ldu-no:#a43427;
 --ldu-display:"Outfit","SUSE",ui-sans-serif,system-ui,sans-serif;--ldu-mono:"SUSE Mono",ui-monospace,Menlo,Consolas,monospace;
 color:var(--ldu-ink);background:var(--ldu-ground);border-radius:1.2em;padding:clamp(12px,2.6vw,22px);
 font-size:1rem;line-height:1.35;text-align:start;container-type:inline-size}
:is([data-theme="dark"],[data-theme="brand"]) .ldu{--ldu-head:#ffffff;--ldu-mark:#50c369;--ldu-yes:#7ddc97;--ldu-no:#ef9275}
.ldu *{box-sizing:border-box}
.ldu ul,.ldu ol{list-style:none;margin:0;padding:0}
.ldu li{list-style:none;margin:0;font-size:inherit}
.ldu p{margin:0}
.ldu.ldu a{color:inherit;text-decoration:none}
.ldu.ldu a:hover{text-decoration:none}
.ldu b{font-weight:600}
.ldu .ldu-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ldu .ldu-ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ldu .ldu-cap{font:500 11px/1.3 var(--ldu-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ldu-muted)}
.ldu .ldu-card{background:var(--ldu-paper);border-radius:18px;box-shadow:0 0 0 1px var(--ldu-line)}
.ldu .ldu-tag{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--ldu-mono);letter-spacing:.03em}
.ldu .ldu-tag svg{width:15px;height:15px;stroke-width:3}
.ldu .ldu-yes{color:var(--ldu-yes)}
.ldu .ldu-no{color:var(--ldu-no)}
.ldu .ldu-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.ldu .ldu-panel{padding:14px;display:grid;gap:12px;align-content:start}
.ldu .ldu-head{display:flex;align-items:center;gap:8px;font:500 18px/1.15 var(--ldu-display);color:var(--ldu-head)}
.ldu .ldu-head span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ldu-wash);font:600 12px/1 var(--ldu-mono)}
.ldu .ldu-app{border-radius:12px;overflow:hidden;background:var(--pg);box-shadow:inset 0 0 0 1px var(--ed);color:var(--ink)}
.ldu .ldu-bar{display:flex;align-items:center;gap:7px;padding:7px 9px;background:var(--rs);box-shadow:0 1px 0 var(--ed);font:600 11.5px/1 "SUSE",ui-sans-serif,system-ui,sans-serif}
.ldu .ldu-bar i{width:10px;height:10px;border-radius:50%;background:var(--mk)}
.ldu .ldu-save{margin-left:auto;padding:4px 8px;border-radius:999px;background:var(--sv);color:#09141a;font-weight:700;font-size:10.5px}
.ldu .ldu-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px}
.ldu .ldu-rail{display:grid;gap:7px;padding:7px 6px;border-radius:9px;background:var(--rs);box-shadow:inset 0 0 0 1px var(--ed)}
.ldu .ldu-rail .ldu-ico{width:15px;height:15px}
.ldu .ldu-canvas{border-radius:8px;background:linear-gradient(135deg,#033633,#008657 60%,#50c369);min-height:64px}
.ldu .ldu-sw{display:flex;gap:4px;align-items:center}
.ldu .ldu-sw i{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgb(127 127 127 / .35)}
.ldu .ldu-sw .ldu-cap{margin-right:auto}
.ldu .ldu-dialog{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--ldu-paper);box-shadow:0 0 0 1px var(--ldu-line),0 12px 24px -18px rgb(9 20 26 / .6);--ldu-kg-ground:var(--ldu-paper)}
.ldu .ldu-kg{width:52px;height:auto;overflow:visible;color:var(--ldu-ink)}
.ldu .ldu-joey{fill:var(--ldu-kg-ground)}
.ldu .ldu-dialog b{display:block;font:600 14px/1.2 "SUSE",ui-sans-serif,system-ui,sans-serif}
.ldu .ldu-btn{display:inline-block;margin-top:6px;padding:6px 10px;border-radius:999px;background:var(--ldu-accent);color:var(--ldu-on-accent);font:600 11.5px/1 "SUSE",ui-sans-serif,system-ui,sans-serif}
.ldu .ldu-reg{display:grid;justify-items:center;align-content:center;gap:14px;padding:16px 10px;border-radius:14px;
 background:radial-gradient(130% 95% at 50% 6%,var(--ldu-paper) 0%,color-mix(in oklab,var(--ldu-ground) 55%,var(--ldu-paper)) 50%,var(--ldu-ground) 100%);box-shadow:0 0 0 1px var(--ldu-line)}
.ldu .ldu-rings{width:96px;height:96px}
.ldu .ldu-words{font:500 15px/1.2 var(--ldu-display);color:var(--ldu-head);text-align:center}
.ldu .ldu-stripe{display:grid;gap:6px;width:100%}
.ldu .ldu-track{height:12px;border-radius:99px;background:var(--ldu-paper);box-shadow:inset 0 0 0 1px var(--ldu-line);overflow:hidden}
.ldu .ldu-track i{display:block;height:100%;width:62%;border-radius:99px;background:repeating-linear-gradient(-45deg,#008657 0 7px,#ffffff 7px 14px)}
.ldu .ldu-file{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--ldu-soft);font:500 14px/1.2 var(--ldu-mono);color:var(--ldu-head)}
.ldu .ldu-file .ldu-ico{width:28px;height:28px;color:var(--ldu-mark)}
.ldu .ldu-chips{display:grid;gap:7px}
.ldu .ldu-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--ldu-soft);font:500 12px/1.3 "SUSE",ui-sans-serif,system-ui,sans-serif}
.ldu .ldu-chip .ldu-ico{width:17px;height:17px;color:var(--ldu-mark)}
@container (max-width:640px){
 .ldu .ldu-cols{grid-template-columns:minmax(0,1fr)}
}
</style>
