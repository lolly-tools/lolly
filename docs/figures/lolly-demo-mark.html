<!--
  Concept: the Lolly mark as Lolly Demo carries the mark. The primary mark in a soft box, the three rings
  (you, Lolly, Lolly at scale), the four versions on their grounds, the wordmark three ways and the
  mark's four rules. Copied from the 19 October 2026 brand standards at /brand (section "Three rings,
  three parties").
  Band Contract: static fragment scoped under .ldm, reads the docs theme tokens (light, dark and brand
  via --secondary, --card, --card-foreground and --muted-foreground, with fallbacks), no script, no
  motion, no network. Marks and wordmarks sit on their own fixed grounds in every theme.
  Sources: shells/web/public/icon-primary.svg, icon-reverse.svg, brand/mono.svg and brand/mono-reverse.svg
  with the C2PA manifest, metadata, editor attributes and the spin style removed (svgo, two decimals),
  each defined once as a symbol; the wordmark path from brand/horizontal.svg.
  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon on
  2026-10-21. The C2PA signature added at bank time is the first provenance record of this file.
-->
<style>
.ldm{--ldm-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ldm-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));
 --ldm-ground:hsl(var(--secondary,84.5 55% 92.2%));--ldm-paper:hsl(var(--card,0 0% 100%));
 --ldm-accent:hsl(var(--primary,176.5 89.5% 11.2%));--ldm-on-accent:hsl(var(--primary-foreground,0 0% 100%));
 --ldm-line:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .13);--ldm-soft:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .06);
 --ldm-wash:color-mix(in oklab,var(--ldm-accent) 14%,var(--ldm-paper));
 --ldm-head:#033633;--ldm-mark:#008657;--ldm-yes:#0b6b45;--ldm-no:#a43427;
 --ldm-display:"Outfit","SUSE",ui-sans-serif,system-ui,sans-serif;--ldm-mono:"SUSE Mono",ui-monospace,Menlo,Consolas,monospace;
 color:var(--ldm-ink);background:var(--ldm-ground);border-radius:1.2em;padding:clamp(12px,2.6vw,22px);
 font-size:1rem;line-height:1.35;text-align:start;container-type:inline-size}
:is([data-theme="dark"],[data-theme="brand"]) .ldm{--ldm-head:#ffffff;--ldm-mark:#50c369;--ldm-yes:#7ddc97;--ldm-no:#ef9275}
.ldm *{box-sizing:border-box}
.ldm ul,.ldm ol{list-style:none;margin:0;padding:0}
.ldm li{list-style:none;margin:0;font-size:inherit}
.ldm p{margin:0}
.ldm.ldm a{color:inherit;text-decoration:none}
.ldm.ldm a:hover{text-decoration:none}
.ldm b{font-weight:600}
.ldm .ldm-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ldm .ldm-ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ldm .ldm-cap{font:500 11px/1.3 var(--ldm-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ldm-muted)}
.ldm .ldm-card{background:var(--ldm-paper);border-radius:18px;box-shadow:0 0 0 1px var(--ldm-line)}
.ldm .ldm-tag{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--ldm-mono);letter-spacing:.03em}
.ldm .ldm-tag svg{width:15px;height:15px;stroke-width:3}
.ldm .ldm-yes{color:var(--ldm-yes)}
.ldm .ldm-no{color:var(--ldm-no)}
.ldm{display:grid;gap:12px;--ldm-sweep:radial-gradient(130% 95% at 50% 6%,#ffffff 0%,#edf6e0 60%,#dcecd6 100%);--ldm-clear:#d7eecb}
:is([data-theme="dark"],[data-theme="brand"]) .ldm{--ldm-sweep:radial-gradient(130% 95% at 50% 6%,#1d2e28 0%,#111e1d 52%,#0b161b 100%);--ldm-clear:#17352b}
.ldm-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ldm .ldm-box{display:grid;place-items:center;aspect-ratio:4/3;border-radius:18px;box-shadow:0 0 0 1px var(--ldm-line);
 background:radial-gradient(130% 95% at 50% 6%,var(--ldm-paper) 0%,color-mix(in oklab,var(--ldm-ground) 55%,var(--ldm-paper)) 50%,var(--ldm-ground) 100%)}
.ldm .ldm-big{width:52%;height:auto;filter:drop-shadow(0 18px 22px rgb(10 30 20 / .22))}
.ldm-rings{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 18px}
.ldm .ldm-ring-art{width:min(190px,36cqi);height:auto;justify-self:center}
.ldm-rings ol{display:grid;gap:12px}
.ldm-rings li{display:grid;grid-template-columns:auto auto;align-items:center;justify-content:start;column-gap:9px}
.ldm-rings li i{grid-row:span 2;width:14px;height:14px;border-radius:50%;background:var(--c)}
.ldm-rings li b{font:500 21px/1.05 var(--ldm-display);color:var(--ldm-head)}
.ldm-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ldm-row--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ldm-row li{display:grid;gap:7px;align-content:start;min-width:0}
.ldm .ldm-plate{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:16px;background:var(--pb);box-shadow:0 0 0 1px var(--ldm-line);overflow:hidden}
.ldm .ldm-m{width:56%;height:auto;position:relative;z-index:2}
.ldm-row--3 .ldm-plate{aspect-ratio:2/1}
.ldm .ldm-w{width:52%;height:auto;fill:currentColor}
.ldm .ldm-plate--sweep{background:var(--ldm-sweep)}
.ldm .ldm-clear{background:var(--ldm-clear)}
.ldm .ldm-clear span{display:grid;place-items:center;width:72%;aspect-ratio:1;border-radius:12px;background:var(--ldm-paper)}
.ldm .ldm-clear .ldm-m{width:66%}
.ldm .ldm-stick{position:absolute;left:24%;bottom:22%;width:38%;height:5%;border-radius:99px;background:linear-gradient(180deg,#ffffff,#b7c4bd);
 transform-origin:0 50%;transform:rotate(-45deg);box-shadow:0 0 0 1px rgb(9 20 26 / .12),0 4px 8px -3px rgb(0 0 0 / .35);z-index:1}
.ldm .ldm-dish{position:absolute;left:50%;bottom:14%;width:74%;aspect-ratio:4.6/1;transform:translateX(-50%);border-radius:50%;
 background:radial-gradient(70% 120% at 50% 20%,rgb(255 255 255 / .95),rgb(255 255 255 / .35));box-shadow:inset 0 -5px 10px rgb(0 134 87 / .3),0 14px 22px -12px rgb(0 0 0 / .35);z-index:1}
.ldm .ldm-tilt{transform:rotate(-18deg) scaleX(1.25)}
.ldm .ldm-tag{font-size:11.5px}
.ldm .ldm-t{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@container (max-width:560px){
 .ldm-hero{grid-template-columns:minmax(0,1fr)}
 .ldm-row{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ldm-row--3{grid-template-columns:minmax(0,1fr)}
 .ldm-row--3 .ldm-plate{aspect-ratio:4/1}
 .ldm .ldm-w{width:30%}
}
</style>
