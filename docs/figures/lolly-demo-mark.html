<!--
  Concept: the idea inside the Lolly mark and how to treat the mark. The three rings (you, Lolly, Lolly at
  scale) as a plain diagram, then the four rules from the brand standards at /brand ("Three rings, three
  parties"): clear space of a quarter all round, and never a stick, a dish or a tilt under the mark.
  The real marks sit above this figure on the page as their own credentialed files; this figure
  draws only the three-ring diagram, so it carries no copy of them.
  Band Contract: static fragment scoped under .ldm, reads the docs theme tokens (light, dark and brand
  via --secondary, --card, --card-foreground and --muted-foreground, with fallbacks), no script, no
  motion, no network. Every rule tag is an icon and a word.
  Sources: the rings diagram and the rule wording of the mark section of /brand; colours from
  brands/lolly-demo/catalog/assets/lolly/tokens/demo.json.
  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon on
  2026-10-21. The C2PA signature added at bank time is the first provenance record of this file.
-->
<style>
.ldm{--ldm-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ldm-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));
 --ldm-ground:hsl(var(--secondary,84.5 55% 92.2%));--ldm-paper:hsl(var(--card,0 0% 100%));
 --ldm-accent:hsl(var(--primary,176.5 89.5% 11.2%));--ldm-on-accent:hsl(var(--primary-foreground,0 0% 100%));
 --ldm-line:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .13);--ldm-soft:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .06);
 --ldm-head:#033633;--ldm-mark:#008657;--ldm-pop:#50c369;--ldm-yes:#0b6b45;--ldm-no:#a43427;
 --ldm-display:"Outfit","SUSE",ui-sans-serif,system-ui,sans-serif;--ldm-mono:"SUSE Mono",ui-monospace,Menlo,Consolas,monospace;
 color:var(--ldm-ink);background:var(--ldm-ground);border-radius:1.2em;padding:clamp(12px,2.6vw,22px);
 font-size:1rem;line-height:1.35;text-align:start;container-type:inline-size}
:is([data-theme="dark"],[data-theme="brand"]) .ldm{--ldm-head:#ffffff;--ldm-mark:#50c369;--ldm-yes:#7ddc97;--ldm-no:#ef9275}
.ldm *{box-sizing:border-box}
.ldm ul,.ldm ol{list-style:none;margin:0;padding:0}
.ldm li{list-style:none;margin:0;font-size:inherit}
.ldm p{margin:0}
.ldm.ldm a{color:inherit;text-decoration:none}
.ldm.ldm a:hover{text-decoration:none}
.ldm b{font-weight:600}
.ldm .ldm-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ldm .ldm-cap{font:500 11px/1.3 var(--ldm-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ldm-muted)}
.ldm .ldm-card{background:var(--ldm-paper);border-radius:18px;box-shadow:0 0 0 1px var(--ldm-line)}
.ldm .ldm-tag{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1.2 var(--ldm-mono);letter-spacing:.03em}
.ldm .ldm-yes{color:var(--ldm-yes)}
.ldm .ldm-no{color:var(--ldm-no)}
.ldm{display:grid;gap:12px;--ldm-sweep:radial-gradient(130% 95% at 50% 6%,#ffffff 0%,#edf6e0 60%,#dcecd6 100%);--ldm-clear:#d7eecb}
:is([data-theme="dark"],[data-theme="brand"]) .ldm{--ldm-sweep:radial-gradient(130% 95% at 50% 6%,#1d2e28 0%,#111e1d 52%,#0b161b 100%);--ldm-clear:#17352b}
.ldm-rings{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;gap:18px 40px;padding:18px 22px}
.ldm .ldm-ring-art{width:min(170px,34cqi);height:auto}
.ldm-rings ol{display:grid;gap:14px}
.ldm-rings li{display:grid;grid-template-columns:auto auto;align-items:center;justify-content:start;column-gap:10px}
.ldm-rings li i{grid-row:span 2;width:14px;height:14px;border-radius:50%;background:var(--c)}
.ldm-rings li b{font:500 22px/1.05 var(--ldm-display);color:var(--ldm-head)}
.ldm-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ldm-row li{display:grid;gap:7px;align-content:start;min-width:0}
.ldm .ldm-plate{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:16px;background:var(--ldm-sweep);box-shadow:0 0 0 1px var(--ldm-line);overflow:hidden}
.ldm .ldm-m{width:52%;height:auto;position:relative;z-index:2}
.ldm .ldm-clear{background:var(--ldm-clear)}
.ldm .ldm-clear span{display:grid;place-items:center;width:72%;aspect-ratio:1;border-radius:12px;background:var(--ldm-paper)}
.ldm .ldm-clear .ldm-m{width:66%}
.ldm .ldm-stick{position:absolute;left:24%;bottom:22%;width:38%;height:5%;border-radius:99px;background:linear-gradient(180deg,#ffffff,#b7c4bd);
 transform-origin:0 50%;transform:rotate(-45deg);box-shadow:0 0 0 1px rgb(9 20 26 / .12),0 4px 8px -3px rgb(0 0 0 / .35);z-index:1}
.ldm .ldm-dish{position:absolute;left:50%;bottom:14%;width:74%;aspect-ratio:4.6/1;transform:translateX(-50%);border-radius:50%;
 background:radial-gradient(70% 120% at 50% 20%,rgb(255 255 255 / .95),rgb(255 255 255 / .35));box-shadow:inset 0 -5px 10px rgb(0 134 87 / .3),0 14px 22px -12px rgb(0 0 0 / .35);z-index:1}
.ldm .ldm-tilt{transform:rotate(-18deg) scaleX(1.25)}
.ldm .ldm-t{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@container (max-width:520px){
 .ldm-rings{grid-template-columns:minmax(0,1fr);justify-items:center}
 .ldm .ldm-ring-art{width:min(150px,52cqi)}
 .ldm-row{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
<div class="ldm">
<div class="ldm-card ldm-rings">
<svg class="ldm-ring-art" viewBox="0 0 200 200" role="img" aria-label="Three rings: you at the centre, Lolly around you, Lolly at scale on the outside"><use href="#ldm-rings"/></svg>
<ol>
<li><i style="--c:var(--ldm-head)"></i><b>You</b><span class="ldm-cap">Inner ring</span></li>
<li><i style="--c:var(--ldm-mark)"></i><b>Lolly</b><span class="ldm-cap">Middle ring</span></li>
<li><i style="--c:var(--ldm-pop);opacity:.6"></i><b>At Scale</b><span class="ldm-cap">Outer ring</span></li>
</ol>
</div>
<ul class="ldm-row" aria-label="How to place the mark">
<li><span class="ldm-plate ldm-clear"><span><svg class="ldm-m" viewBox="0 0 200 200" role="img" aria-label="The rings with clear space all round"><use href="#ldm-rings"/></svg></span></span><span class="ldm-tag ldm-yes"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="ldm-t"><path d="M20 6 9 17l-5-5"/></svg>Clear space: a quarter</span></li>
<li><span class="ldm-plate"><span class="ldm-stick"></span><svg class="ldm-m" viewBox="0 0 200 200" role="img" aria-label="Wrong: the rings on a stick"><use href="#ldm-rings"/></svg></span><span class="ldm-tag ldm-no"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="ldm-t"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>No stick</span></li>
<li><span class="ldm-plate"><span class="ldm-dish"></span><svg class="ldm-m" viewBox="0 0 200 200" role="img" aria-label="Wrong: the rings on a glass dish"><use href="#ldm-rings"/></svg></span><span class="ldm-tag ldm-no"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="ldm-t"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>No dish</span></li>
<li><span class="ldm-plate"><svg class="ldm-m ldm-tilt" viewBox="0 0 200 200" role="img" aria-label="Wrong: the rings tilted and stretched"><use href="#ldm-rings"/></svg></span><span class="ldm-tag ldm-no"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="ldm-t"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>No tilt or stretch</span></li>
</ul>
<svg class="ldm-sprite" viewBox="0 0 1 1" aria-hidden="true" focusable="false"><symbol id="ldm-rings" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--ldm-pop)" stroke-width="16" opacity=".6"/><circle cx="100" cy="100" r="56" fill="none" stroke="var(--ldm-mark)" stroke-width="16"/><circle cx="100" cy="100" r="25" fill="var(--ldm-head)"/></symbol></svg>
</div>
