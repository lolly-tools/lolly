<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" role="img" aria-label="A file carrying its AI mark, and the export that uses it carrying the same mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A file carrying its AI mark, and the export that uses it carrying the same mark</title><!--
  Preserved: a file arrives wearing its AI mark (the sparkle pin), and the export that uses it wears the same mark.
  One of three cards on docs/eu-ai-act.md (::: pillars). Painted from --eti-base (ink),
  --eti-accent (the AI mark) and --eti-paper (the sheet), which the docs reading stylesheet sets
  from the theme; the fallbacks are the Etiquette icons' own pairing.
  Provenance: authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon
  on 2026-11-14. The C2PA signature added at bank time is the first provenance record of this file.
