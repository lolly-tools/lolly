<!--
  Concept: what changes when you load your own design system. Your colours and colourways, type, logos
  and, when your pack sets one, the chrome take the place of Lolly Demo. Clinic, Etiquette, Fauna and the
  register stay with Lolly, and the register's rings take your hue. Two links open Settings at Design systems and
  Design System Setup.
  Band Contract: static fragment scoped under .ldw, reads the docs theme tokens with fallbacks, no
  script, no motion, no network. Links rest without an accent outline and show a 3 px focus ring.
  Sources: the brand standards at /brand ("Load a design system and Lolly steps back", Clinic, Etiquette,
  Devices) and docs/brand-studio.md; the wordmark path from brand/horizontal.svg; the kangaroo is
  kangarooArt() in its end pose; the rings are the three-ring diagram of /brand, drawn here with
  the middle ring in --brand-primary.
  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon on
  2026-10-21. The C2PA signature added at bank time is the first provenance record of this file.
-->
<style>
.ldw{--ldw-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ldw-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));
 --ldw-ground:hsl(var(--secondary,84.5 55% 92.2%));--ldw-paper:hsl(var(--card,0 0% 100%));
 --ldw-accent:hsl(var(--primary,176.5 89.5% 11.2%));--ldw-on-accent:hsl(var(--primary-foreground,0 0% 100%));
 --ldw-line:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .13);--ldw-soft:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .06);
 --ldw-wash:color-mix(in oklab,var(--ldw-accent) 14%,var(--ldw-paper));
 --ldw-head:#033633;--ldw-mark:#008657;--ldw-yes:#0b6b45;--ldw-no:#a43427;
 --ldw-display:"Outfit","SUSE",ui-sans-serif,system-ui,sans-serif;--ldw-mono:"SUSE Mono",ui-monospace,Menlo,Consolas,monospace;
 color:var(--ldw-ink);background:var(--ldw-ground);border-radius:1.2em;padding:clamp(12px,2.6vw,22px);
 font-size:1rem;line-height:1.35;text-align:start;container-type:inline-size}
:is([data-theme="dark"],[data-theme="brand"]) .ldw{--ldw-head:#ffffff;--ldw-mark:#50c369;--ldw-yes:#7ddc97;--ldw-no:#ef9275}
.ldw *{box-sizing:border-box}
.ldw ul,.ldw ol{list-style:none;margin:0;padding:0}
.ldw li{list-style:none;margin:0;font-size:inherit}
.ldw p{margin:0}
.ldw.ldw a{color:inherit;text-decoration:none}
.ldw.ldw a:hover{text-decoration:none}
.ldw b{font-weight:600}
.ldw .ldw-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ldw .ldw-ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ldw .ldw-cap{font:500 11px/1.3 var(--ldw-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ldw-muted)}
.ldw .ldw-card{background:var(--ldw-paper);border-radius:18px;box-shadow:0 0 0 1px var(--ldw-line)}
.ldw .ldw-tag{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--ldw-mono);letter-spacing:.03em}
.ldw .ldw-tag svg{width:15px;height:15px;stroke-width:3}
.ldw .ldw-yes{color:var(--ldw-yes)}
.ldw .ldw-no{color:var(--ldw-no)}
.ldw{display:grid;gap:12px}
.ldw .ldw-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ldw .ldw-col{padding:14px;display:grid;gap:10px;align-content:start}
.ldw .ldw-col>p{display:flex;align-items:center;gap:8px;font:500 19px/1.15 var(--ldw-display);color:var(--ldw-head)}
.ldw .ldw-col>p .ldw-ico{width:20px;height:20px;color:var(--ldw-mark)}
.ldw .ldw-col ul{display:grid;gap:8px}
.ldw .ldw-col li{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:12px;padding:8px;border-radius:12px;background:var(--ldw-soft);font-size:14px;line-height:1.25}
.ldw .ldw-vis{height:48px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden;background:var(--ldw-paper);color:var(--ldw-head)}
.ldw .ldw-opal{gap:0;align-items:stretch}
.ldw .ldw-opal i{flex:1;background:var(--c)}
.ldw .ldw-aa{font:500 28px/1 var(--ldw-display)}
.ldw .ldw-word{width:54px;height:auto;fill:#09141a}
.ldw .ldw-vis.ldw-wordbox{background:#ffffff}
.ldw .ldw-chrome{gap:0;align-items:stretch}
.ldw .ldw-chrome i{flex:1;background:var(--c)}
.ldw .ldw-btn{padding:6px 10px;border-radius:999px;font:600 11px/1 "SUSE",ui-sans-serif,system-ui,sans-serif;background:var(--ldw-accent);color:var(--ldw-on-accent);outline:2.5px solid var(--ldw-accent);outline-offset:2.5px}
.ldw .ldw-vis .ldw-ico{width:18px;height:18px}
.ldw .ldw-kg{width:auto;height:44px;overflow:visible;color:var(--ldw-ink);align-self:flex-end}
.ldw .ldw-joey{fill:var(--ldw-paper)}
.ldw .ldw-rings{width:36px;height:36px}
.ldw .ldw-go{display:flex;flex-wrap:wrap;gap:8px}
.ldw.ldw .ldw-go a{text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font:600 14px/1.1 "SUSE",ui-sans-serif,system-ui,sans-serif;background:var(--ldw-accent);color:var(--ldw-on-accent)}
.ldw.ldw .ldw-go a.ldw-alt{background:var(--ldw-paper);color:var(--ldw-head);box-shadow:inset 0 0 0 1px var(--ldw-line)}
.ldw.ldw .ldw-go a:hover{box-shadow:0 10px 20px -14px rgb(9 20 26 / .7)}
.ldw.ldw .ldw-go a.ldw-alt:hover{box-shadow:inset 0 0 0 1.5px var(--ldw-accent)}
.ldw.ldw .ldw-go a:focus-visible{outline:3px solid var(--ldw-accent);outline-offset:3px}
.ldw .ldw-go .ldw-ico{width:17px;height:17px}
@container (max-width:560px){
 .ldw .ldw-cols{grid-template-columns:minmax(0,1fr)}
}
</style>
