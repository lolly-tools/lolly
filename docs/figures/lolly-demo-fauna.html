  work to look after, framed in the soft box as the brand standards at /brand show them. Each picture

  script, no motion, no network.

  high (WebP, quality 62) so the six fit inside the figure budget. Names, roles and alt text from /brand.

<style>
.ldf{--ldf-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ldf-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));

.ldf ul,.ldf ol{list-style:none;margin:0;padding:0}

.ldf b{font-weight:600}
.ldf .ldf-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ldf .ldf-ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ldf .ldf-cap{font:500 11px/1.3 var(--ldf-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ldf-muted)}
.ldf .ldf-card{background:var(--ldf-paper);border-radius:18px;box-shadow:0 0 0 1px var(--ldf-line)}

.ldf .ldf-no{color:var(--ldf-no)}
.ldf .ldf-cast{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ldf.ldf .ldf-one{display:grid;gap:7px;align-content:start;border-radius:16px;color:var(--ldf-ink)}

 background:var(--ldf-sweep);box-shadow:0 0 0 1px var(--ldf-line)}
.ldf .ldf-frame img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;margin:0;max-width:none}
.ldf .ldf-seal{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ldf-paper);color:var(--ldf-mark);box-shadow:0 0 0 1px var(--ldf-line)}
.ldf .ldf-seal svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ldf .ldf-one b{font:500 17px/1.1 var(--ldf-display);color:var(--ldf-head);padding-inline:2px}
.ldf .ldf-one .ldf-cap{padding-inline:2px;margin-top:-3px}
.ldf.ldf .ldf-one:hover .ldf-frame{box-shadow:0 0 0 1.5px var(--ldf-accent),0 14px 26px -18px rgb(9 20 26 / .55)}
.ldf.ldf .ldf-one:focus-visible{outline:3px solid var(--ldf-accent);outline-offset:3px}
.ldf{--ldf-sweep:radial-gradient(130% 95% at 50% 6%,#ffffff 0%,#edf6e0 60%,#dcecd6 100%)}
:is([data-theme="dark"],[data-theme="brand"]) .ldf{--ldf-sweep:radial-gradient(130% 95% at 50% 6%,#1d2e28 0%,#111e1d 52%,#0b161b 100%)}
@container (max-width:620px){
 .ldf .ldf-cast{grid-template-columns:repeat(3,minmax(0,1fr))}
}
