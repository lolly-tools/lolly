<!--
  Concept: naming under a masterbrand: Company, Domain, Descriptor and Context, built up from a product line to a product variant, with the three context words. Invented organisation (Northwind).
  Band Contract: static fragment scoped under .ba, reads the docs theme tokens
  (light/dark/brand via --secondary/--card-foreground/--primary, with fallbacks),
  no script, no motion, no network. Logos sit on white plates in every theme.
  Trademarks: every logo is a trademark of its owner, shown to illustrate a brand
  arrangement on a page about brand arrangements. No owner is connected with Lolly.
  A product name beside a mark is set in the page's own type.
  Logo sources (path data cleaned with svgo, viewBox cropped to the drawn bounds):

  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by
  Andy Fitzsimon on 2026-10-21 from his earlier brand-architecture slides. The C2PA
  signature added at bank time is this file's first provenance record.
-->
<style>.ba{--ba-ink:hsl(var(--card-foreground,201 49% 7%));--ba-muted:hsl(var(--muted-foreground,208 11% 30%));
 --ba-ground:hsl(var(--secondary,85 55% 92%));--ba-accent:hsl(var(--primary,177 90% 11%));
 --ba-on-accent:hsl(var(--primary-foreground,0 0% 100%));--ba-soft:hsl(var(--card-foreground,201 49% 7%) / .07);
 --ba-plate:#fff;--ba-plate-ink:#09141a;--ba-plate-muted:#5b6770;--ba-plate-line:#e1e7e2;--ba-warn:var(--warn,#72251c);
 --u:22px;color:var(--ba-ink);background:var(--ba-ground);border-radius:1.2em;padding:clamp(12px,2.4vw,22px);
 font-size:1rem;line-height:1.35;text-align:start}
.ba *{box-sizing:border-box}
.ba ul,.ba ol{list-style:none;margin:0;padding:0}
.ba li{list-style:none;margin:0;font-size:inherit}
.ba p{margin:0}
.ba.ba a{color:inherit;text-decoration:none}
.ba-logo{display:block;height:calc(var(--h,1) * var(--u));width:auto;max-width:100%;flex:none}
.ba-plate{background:var(--ba-plate);color:var(--ba-plate-ink);border-radius:14px;
 box-shadow:0 1px 2px #0000000f,0 6px 18px #0000000f;padding:12px 10px;display:flex;flex-direction:column;
 align-items:center;justify-content:flex-start;gap:12px}
.ba-plate>li{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;max-width:100%}
.ba-plate>li.ba-kids{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px 22px;width:100%}
.ba-plate>li.ba-kids--col{flex-direction:column;gap:10px}
.ba-parent{width:100%;padding-bottom:12px;border-bottom:1px solid var(--ba-plate-line)}
.ba-parent>.ba-logo,.ba-parent>.ba-lock{margin-inline:auto}
.ba-owner{order:99;width:100%;padding-top:10px;border-top:1px solid var(--ba-plate-line);filter:grayscale(1);opacity:.6}
.ba-owner-label{display:block;text-align:center;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ba-plate-muted);margin-bottom:4px}
.ba-owner .ba-lock{margin-inline:auto}
.ba-lock{display:inline-flex;flex-direction:column;align-items:center;gap:2px;max-width:100%}
.ba-lock-row{display:inline-flex;align-items:center;gap:.35em;max-width:100%}
.ba-word{font-weight:600;font-size:calc(var(--u) * .62);line-height:1.1;min-width:0;text-wrap:balance}
.ba-word.ba-caps{text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ba-word.ba-light{font-weight:300;text-transform:uppercase;letter-spacing:.08em;font-size:calc(var(--u) * .8)}
.ba-eyebrow{font-size:calc(var(--u) * .36);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#0052cc;line-height:1}
.ba-by{font-size:calc(var(--u) * .42);color:var(--ba-plate-muted);line-height:1.1;white-space:nowrap}
.ba-stack{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px}
.ba-naming{container-type:inline-size;--slot:var(--ba-accent)}
.ba-ngrid{display:grid;grid-template-columns:auto repeat(4,auto) 1fr;align-items:baseline;column-gap:.32em;row-gap:14px;
 font-size:clamp(.72rem,3.6cqi,1.55rem)}
.ba-ngrid>*{white-space:nowrap}
.ba-slot{align-self:end;justify-self:stretch;text-align:center;font-weight:500;padding:0 .35em .2em;margin-bottom:6px;
 border:3px solid var(--slot);border-top:0;border-radius:0 0 10px 10px}
.ba-slot--co{font-weight:800}
.ba-slot--cx{color:color-mix(in oklab,var(--ba-accent) 75%,var(--ba-ink))}
.ba-lvl{justify-self:end;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ba-muted);padding-inline-end:.8em}
.ba-co{font-weight:800}
.ba-cx{color:var(--ba-muted)}
.ba-cx b{color:var(--ba-ink);font-style:italic;font-weight:700}
.ba-ctx{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem}
.ba-ctx span{border-radius:999px;background:var(--ba-soft);padding:.3em .8em}
.ba-ctx b{font-style:italic}
@container (max-width:520px){.ba-ngrid{grid-template-columns:repeat(4,auto) 1fr;column-gap:.3em;row-gap:4px;font-size:clamp(.72rem,4.3cqi,1.2rem)}.ba-corner,.ba-lvl--more{display:none}.ba-lvl{grid-column:1/-1;justify-self:start;margin-top:8px;padding:0}.ba-slot{margin-bottom:2px}}
</style><div class="ba ba-naming"><div class="ba-ngrid"><span class="ba-corner"></span><span class="ba-slot ba-slot--co">Company</span><span class="ba-slot ba-slot--do">Domain</span><span class="ba-slot ba-slot--de">Descriptor</span><span class="ba-slot ba-slot--cx">Context</span><span></span><span class="ba-lvl">Product line</span><span class="ba-co">Northwind</span><span>Freight</span><span></span><span class="ba-cx"></span><span></span><span class="ba-lvl">Product</span><span class="ba-co">Northwind</span><span>Freight</span><span>Tracker</span><span class="ba-cx"></span><span></span><span class="ba-lvl">Product variant</span><span class="ba-co">Northwind</span><span>Freight</span><span>Tracker</span><span class="ba-cx"><b>for</b> Retail</span><span></span><span class="ba-lvl ba-lvl--more"></span><span class="ba-co"></span><span></span><span></span><span class="ba-cx"><b>with</b> Live Alerts</span><span></span><span class="ba-lvl ba-lvl--more"></span><span class="ba-co"></span><span></span><span></span><span class="ba-cx"><b>on</b> Android</span><span></span></div><p class="ba-ctx"><span><b>for</b> a purpose</span><span><b>with</b> a feature</span><span><b>on</b> a platform or architecture</span></p></div>
