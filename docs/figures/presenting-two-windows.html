<!--
  Concept: Present with camera opens two windows. The audience window is one 16:9 picture (slides, the
  camera inset, the logo top right and the lower third) and is the one shared in the call. The private
  controls window holds the current and next slide, speaker notes, and the Camera, Logo, Lower third and
  Saved scenes controls.
  Contract: static fragment scoped under .ptw, reads the docs theme tokens with fallbacks, no script, no
  motion, no network.
  Sources: shells/web/src/views/present-production/ (scene.ts 1280 x 720, controls.ts, prepared-scenes.ts)
  and docs/presenting.md.
  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon on
  2026-10-23. The C2PA signature added at bank time is the first provenance record of this file.
-->
<style>
.ptw{--ptw-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ptw-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));
 --ptw-ground:hsl(var(--secondary,84.5 55% 92.2%));--ptw-paper:hsl(var(--card,0 0% 100%));
 --ptw-accent:hsl(var(--primary,176.5 89.5% 11.2%));--ptw-line:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .14);
 --ptw-wash:color-mix(in oklab,var(--ptw-accent) 12%,var(--ptw-paper));
 color:var(--ptw-ink);background:var(--ptw-ground);border-radius:1.2em;padding:clamp(12px,2.6vw,22px);
 font-size:1rem;line-height:1.35;text-align:start;container-type:inline-size}
.ptw *{box-sizing:border-box}
.ptw p{margin:0}
.ptw ul{list-style:none;margin:0;padding:0}
.ptw li{list-style:none;margin:0;font-size:inherit}
.ptw .ptw-row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.ptw .ptw-label{font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ptw .ptw-tag{font-size:.75em;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--ptw-accent);color:hsl(var(--primary-foreground,0 0% 100%))}
.ptw .ptw-tag.ptw-private{background:transparent;color:var(--ptw-muted);box-shadow:0 0 0 1px var(--ptw-line)}
.ptw .ptw-win{background:var(--ptw-paper);border-radius:12px;box-shadow:0 0 0 1px var(--ptw-line);overflow:hidden}
.ptw .ptw-bar{height:14px;background:var(--ptw-wash);border-bottom:1px solid var(--ptw-line)}
.ptw .ptw-stage{position:relative;aspect-ratio:16/9;background:var(--ptw-wash);margin:10px;border-radius:6px;overflow:hidden}
.ptw .ptw-slide{position:absolute;left:7%;top:12%;width:52%;display:flex;flex-direction:column;gap:6px}
.ptw .ptw-line1{height:10px;width:85%;background:var(--ptw-accent);border-radius:3px;opacity:.75}
.ptw .ptw-line2{height:6px;width:65%;background:var(--ptw-ink);border-radius:3px;opacity:.25}
.ptw .ptw-line3{height:6px;width:55%;background:var(--ptw-ink);border-radius:3px;opacity:.25}
.ptw .ptw-cam{position:absolute;right:6%;bottom:12%;width:26%;aspect-ratio:4/3;border-radius:8px;background:var(--ptw-paper);box-shadow:0 0 0 2px var(--ptw-paper),0 0 0 3px var(--ptw-line);display:grid;place-items:center}
.ptw .ptw-cam svg{width:46%;height:auto;fill:var(--ptw-muted);opacity:.6}
.ptw .ptw-logo{position:absolute;right:5%;top:8%;width:9%;aspect-ratio:1;border-radius:50%;background:var(--ptw-accent)}
.ptw .ptw-third{position:absolute;left:5%;bottom:9%;background:var(--ptw-paper);border-radius:4px;padding:3px 8px;font-size:.66em;line-height:1.2;box-shadow:0 0 0 1px var(--ptw-line)}
.ptw .ptw-third b{display:block;font-weight:600}
.ptw .ptw-ctl{margin:10px;display:grid;gap:8px}
.ptw .ptw-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ptw .ptw-mini{aspect-ratio:16/9;border-radius:4px;background:var(--ptw-wash);box-shadow:0 0 0 1px var(--ptw-line);font-size:.66em;color:var(--ptw-muted);display:flex;align-items:flex-end;padding:3px 5px}
.ptw .ptw-notes{font-size:.72em;color:var(--ptw-muted);background:var(--ptw-ground);border-radius:4px;padding:5px 7px}
.ptw .ptw-chips{display:flex;flex-wrap:wrap;gap:4px}
.ptw .ptw-chips li{font-size:.7em;border-radius:999px;padding:1px 7px;box-shadow:0 0 0 1px var(--ptw-line)}
.ptw .ptw-cap{margin-top:8px;font-size:.82em;color:var(--ptw-muted)}
@container (max-width:520px){.ptw .ptw-row{grid-template-columns:minmax(0,1fr)}}
</style>
<div class="ptw" role="group" aria-label="The audience window and the private controls window">
  <div class="ptw-row">
    <div>
      <p class="ptw-label">Audience window <span class="ptw-tag">Share this in your call</span></p>
      <div class="ptw-win">
        <div class="ptw-bar"></div>
        <div class="ptw-stage" role="img" aria-label="A 16:9 picture: the slide on the left, the camera inset bottom right, the logo top right and a name caption bottom left">
          <div class="ptw-slide"><span class="ptw-line1"></span><span class="ptw-line2"></span><span class="ptw-line3"></span></div>
          <span class="ptw-logo"></span>
          <span class="ptw-cam"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span>
          <p class="ptw-third"><b>Sam Rivera</b>Product lead</p>
        </div>
      </div>
      <p class="ptw-cap">One clean picture, 1280 × 720.</p>
    </div>
    <div>
      <p class="ptw-label">Private controls <span class="ptw-tag ptw-private">Stays on your side</span></p>
      <div class="ptw-win">
        <div class="ptw-bar"></div>
        <div class="ptw-ctl">
          <div class="ptw-pair"><span class="ptw-mini">Current</span><span class="ptw-mini">Next</span></div>
          <p class="ptw-notes">Speaker notes</p>
          <ul class="ptw-chips"><li>Camera</li><li>Logo</li><li>Lower third</li><li>Saved scenes</li><li>Recording</li></ul>
        </div>
      </div>
      <p class="ptw-cap">Edits wait here until Apply scene.</p>
    </div>
  </div>
</div>
