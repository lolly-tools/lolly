<!--
  Concept: the five named parts of Lolly Demo, each as a small picture, its name and one word, the way
  the hero of the brand standards at /brand lays them out. Each tile opens its part of /brand.
  Band Contract: static fragment scoped under .ldp, reads the docs theme tokens with fallbacks, no
  script, no motion, no network. Tiles rest on a neutral hairline; the accent arrives on hover and
  keyboard focus, with a 3 px focus ring.
  Sources: Opal values from brands/lolly-demo/catalog/assets/lolly/tokens/demo.json; the Etiquette glyphs
  are the /brand symbols (Lucide line style); the kangaroo is kangarooArt() from
  shells/web/src/components/kangaroo-art.ts in its end pose, every SMIL motion removed.
  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon on
  2026-10-21. The C2PA signature added at bank time is the first provenance record of this file.
-->
<style>
.ldp{--ldp-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ldp-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));
 --ldp-ground:hsl(var(--secondary,84.5 55% 92.2%));--ldp-paper:hsl(var(--card,0 0% 100%));
 --ldp-accent:hsl(var(--primary,176.5 89.5% 11.2%));--ldp-on-accent:hsl(var(--primary-foreground,0 0% 100%));
 --ldp-line:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .13);--ldp-soft:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .06);
 --ldp-wash:color-mix(in oklab,var(--ldp-accent) 14%,var(--ldp-paper));
 --ldp-head:#033633;--ldp-mark:#008657;--ldp-yes:#0b6b45;--ldp-no:#a43427;
 --ldp-display:"Outfit","SUSE",ui-sans-serif,system-ui,sans-serif;--ldp-mono:"SUSE Mono",ui-monospace,Menlo,Consolas,monospace;
 color:var(--ldp-ink);background:var(--ldp-ground);border-radius:1.2em;padding:clamp(12px,2.6vw,22px);
 font-size:1rem;line-height:1.35;text-align:start;container-type:inline-size}
:is([data-theme="dark"],[data-theme="brand"]) .ldp{--ldp-head:#ffffff;--ldp-mark:#50c369;--ldp-yes:#7ddc97;--ldp-no:#ef9275}
.ldp *{box-sizing:border-box}
.ldp ul,.ldp ol{list-style:none;margin:0;padding:0}
.ldp li{list-style:none;margin:0;font-size:inherit}
.ldp p{margin:0}
.ldp.ldp a{color:inherit;text-decoration:none}
.ldp.ldp a:hover{text-decoration:none}
.ldp b{font-weight:600}
.ldp .ldp-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ldp .ldp-ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ldp .ldp-cap{font:500 11px/1.3 var(--ldp-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ldp-muted)}
.ldp .ldp-card{background:var(--ldp-paper);border-radius:18px;box-shadow:0 0 0 1px var(--ldp-line)}
.ldp .ldp-tag{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--ldp-mono);letter-spacing:.03em}
.ldp .ldp-tag svg{width:15px;height:15px;stroke-width:3}
.ldp .ldp-yes{color:var(--ldp-yes)}
.ldp .ldp-no{color:var(--ldp-no)}
.ldp .ldp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ldp.ldp .ldp-part{display:grid;gap:3px;align-content:start;height:100%;padding:10px 10px 12px;border-radius:16px;background:var(--ldp-paper);color:var(--ldp-ink);
 box-shadow:0 0 0 1px var(--ldp-line)}
.ldp.ldp .ldp-part:hover{box-shadow:0 0 0 1.5px var(--ldp-accent),0 14px 26px -18px rgb(9 20 26 / .55)}
.ldp.ldp .ldp-part:focus-visible{outline:3px solid var(--ldp-accent);outline-offset:3px}
.ldp .ldp-part b{font:500 19px/1.1 var(--ldp-display);color:var(--ldp-head)}
.ldp .ldp-vis{--ldp-vis:color-mix(in oklab,var(--ldp-ground) 70%,var(--ldp-paper));height:68px;margin-bottom:7px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;background:var(--ldp-vis);color:var(--ldp-head)}
.ldp .ldp-opal{gap:0;align-items:stretch}
.ldp .ldp-opal i{flex:1;background:var(--c)}
.ldp .ldp-cross{font:500 34px/1 var(--ldp-display)}
.ldp .ldp-cross em{font:italic 400 30px/1 "SUSE",ui-sans-serif,system-ui,sans-serif}
.ldp .ldp-clinic{padding:0 10px}
.ldp .ldp-clinic span{flex:1;height:24px;border-radius:999px;background:var(--ldp-paper);box-shadow:inset 0 0 0 1px var(--ldp-line)}
.ldp .ldp-clinic span:first-child{background:var(--ldp-accent);box-shadow:none}
.ldp .ldp-fauna{align-items:flex-end;padding-top:6px}
.ldp .ldp-kg{width:auto;height:62px;overflow:visible}
.ldp .ldp-joey{fill:var(--ldp-vis)}
@container (max-width:600px){
 .ldp .ldp-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container (max-width:400px){
 .ldp .ldp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ldp .ldp-grid li:last-child{grid-column:1 / -1}
}
</style>
