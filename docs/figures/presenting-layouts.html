<!--
  Concept: the five prepared layouts of Present with camera as small 16:9 tiles: Content only, Camera
  inset, Side by side, Camera full screen and Holding screen.
  Contract: static fragment scoped under .ply, reads the docs theme tokens with fallbacks, no script, no
  motion, no network.
  Sources: the Prepared scene options in shells/web/src/views/present-production/prepared-scenes.ts and
  the layout table in docs/presenting.md.
  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon on
  2026-10-23. The C2PA signature added at bank time is the first provenance record of this file.
-->
<style>
.ply{--ply-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ply-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));
 --ply-ground:hsl(var(--secondary,84.5 55% 92.2%));--ply-paper:hsl(var(--card,0 0% 100%));
 --ply-accent:hsl(var(--primary,176.5 89.5% 11.2%));--ply-line:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .14);
 --ply-wash:color-mix(in oklab,var(--ply-accent) 12%,var(--ply-paper));
 color:var(--ply-ink);background:var(--ply-ground);border-radius:1.2em;padding:clamp(12px,2.6vw,22px);
 font-size:1rem;line-height:1.35;text-align:start;container-type:inline-size}
.ply *{box-sizing:border-box}
.ply ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ply li{list-style:none;margin:0;font-size:.82em;font-weight:500;display:flex;flex-direction:column;gap:6px}
.ply .ply-tile{position:relative;aspect-ratio:16/9;border-radius:6px;background:var(--ply-wash);box-shadow:0 0 0 1px var(--ply-line);overflow:hidden}
.ply .ply-content{position:absolute;inset:16% 40% 16% 10%;display:flex;flex-direction:column;gap:4px}
.ply .ply-content i{display:block;height:5px;border-radius:2px;background:var(--ply-accent);opacity:.7}
.ply .ply-content i+i{opacity:.25;background:var(--ply-ink);width:80%}
.ply .ply-cam{position:absolute;background:var(--ply-paper);box-shadow:0 0 0 1px var(--ply-line);border-radius:4px}
.ply .ply-cam::after{content:"";position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-60%);border-radius:50%;background:var(--ply-muted);opacity:.35}
.ply .ply-black{position:absolute;inset:0;background:#111}
@container (max-width:560px){.ply ul{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (max-width:340px){.ply ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="ply" role="group" aria-label="Five prepared layouts">
  <ul>
    <li><span class="ply-tile" role="img" aria-label="Slides fill the picture"><span class="ply-content" style="right:10%"><i></i><i></i><i></i></span></span>Content only</li>
    <li><span class="ply-tile" role="img" aria-label="Slides with a small camera in the corner"><span class="ply-content"><i></i><i></i><i></i></span><span class="ply-cam" style="right:6%;bottom:10%;width:30%;height:38%"></span></span>Camera inset</li>
    <li><span class="ply-tile" role="img" aria-label="Slides on the left, a tall camera on the right"><span class="ply-content" style="right:48%"><i></i><i></i><i></i></span><span class="ply-cam" style="right:5%;top:8%;width:38%;height:84%"></span></span>Side by side</li>
    <li><span class="ply-tile" role="img" aria-label="The camera fills the picture"><span class="ply-cam" style="inset:0;border-radius:0"></span></span>Camera full screen</li>
    <li><span class="ply-tile" role="img" aria-label="A black picture"><span class="ply-black"></span></span>Holding screen</li>
  </ul>
</div>
