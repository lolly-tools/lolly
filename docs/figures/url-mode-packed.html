<!--
  Concept: the same Design link readable and packed. Two bars on one scale of characters: the
  readable query at 2,729 characters and the packed z form at 1,059, with the 1,800-character line
  where the address bar switches to the packed form, and the region past about 2,000 characters
  where pasted links, QR codes and some servers start to fail.
  Band Contract: static fragment scoped under .ump, reads the docs theme tokens with fallbacks,
  no script, no motion, no network.
  Sources: AUTO_PACK_MIN = 1800 in shells/web/src/lib/url-budget.ts; the example lengths are the
  ones the URL Mode guide quotes for one Design document.
  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon on
  2026-10-23. The C2PA signature added at bank time is the first provenance record of this file.
-->
<style>
.ump{--ump-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ump-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));
 --ump-ground:hsl(var(--secondary,84.5 55% 92.2%));--ump-paper:hsl(var(--card,0 0% 100%));
 --ump-line:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .16);
 --ump-read:#1a6fa3;--ump-pack:#008657;--ump-risk:#b2461c;
 --ump-mono:"SUSE Mono",ui-monospace,Menlo,Consolas,monospace;
 color:var(--ump-ink);background:var(--ump-ground);border-radius:1.2em;padding:clamp(12px,2.6vw,22px);
 font-size:1rem;line-height:1.35;text-align:start;container-type:inline-size}
:is([data-theme="dark"],[data-theme="brand"]) .ump{--ump-read:#5fcaff;--ump-pack:#50c369;--ump-risk:#fac044}
.ump *{box-sizing:border-box}
.ump p{margin:0}
.ump ul{list-style:none;margin:0;padding:0}
.ump li{list-style:none;margin:0;font-size:inherit}
.ump-plate{position:relative;background:var(--ump-paper);border-radius:14px;padding:16px 14px 12px;
 box-shadow:0 1px 2px #0000000f,0 6px 18px #0000000f}
.ump-track{position:relative;display:flex;flex-direction:column;gap:14px;padding-top:26px}
.ump-row{display:grid;grid-template-columns:5.6em minmax(0,1fr);align-items:center;gap:10px}
.ump-label{font-weight:650;font-size:.82rem}
.ump-lane{position:relative;height:30px}
.ump-bar{position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:8px;background:var(--c);display:flex;align-items:center;
 justify-content:flex-end;padding:0 8px;color:var(--ump-paper);font:600 12px/1 var(--ump-mono);white-space:nowrap}
.ump-marks{position:absolute;top:0;bottom:0;left:calc(5.6em + 10px);right:0;pointer-events:none}
.ump-mark{position:absolute;top:0;bottom:-6px;left:var(--x);border-left:2px dashed var(--c)}
.ump-mark span{position:absolute;top:0;left:6px;font:600 11px/1.2 var(--ump-mono);color:var(--c);white-space:nowrap}
.ump-risk{position:absolute;top:22px;bottom:-6px;left:var(--x);right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,hsl(var(--card-foreground,201.2 48.6% 6.9%) / .06) 6px 12px);border-radius:0 8px 8px 0}
.ump-scale{position:relative;height:14px;margin:8px 0 0 calc(5.6em + 10px);font:500 11px/1 var(--ump-mono);color:var(--ump-muted)}
.ump-scale span{position:absolute;top:0;left:var(--x);transform:translateX(-50%);white-space:nowrap}
.ump-scale span:first-child{transform:none}
.ump-scale span:last-child{transform:translateX(-100%)}
.ump-key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:12px;font-size:.8rem;color:var(--ump-muted)}
@container (max-width:460px){.ump-key{grid-template-columns:1fr}.ump-mark span{font-size:10px}}
.ump-key b{color:var(--ump-ink);font-weight:650}
</style><div class="ump"><div class="ump-plate"><div class="ump-track"><div class="ump-marks" aria-hidden="true"><div class="ump-risk" style="--x:66.67%"></div><div class="ump-mark" style="--x:60%;--c:var(--ump-ink)"><span>1,800</span></div></div><div class="ump-row"><p class="ump-label">Readable</p><div class="ump-lane"><p class="ump-bar" style="--w:90.97%;--c:var(--ump-read)">2,729</p></div></div><div class="ump-row"><p class="ump-label">Packed <code>z</code></p><div class="ump-lane"><p class="ump-bar" style="--w:35.3%;--c:var(--ump-pack)">1,059</p></div></div></div><p class="ump-scale" aria-hidden="true"><span style="--x:0%">0</span><span style="--x:33.33%">1,000</span><span style="--x:66.67%">2,000</span><span style="--x:100%">3,000 characters</span></p></div><ul class="ump-key"><li><b>1,800 characters.</b> Past this length the address bar switches to the packed form, when packing is shorter.</li><li><b>Past about 2,000.</b> Pasted links, social crawlers, QR codes and some servers start to fail.</li></ul></div>
