<!--
  Concept: where a six-still contact sheet samples a twelve-second sequence. The timeline is cut
  into six equal slices and each still is taken at the middle of its slice (1, 3, 5, 7, 9 and 11
  seconds). The two ends, 0 and 12 seconds, are marked as the blank frames that sampling the
  endpoints would return.
  Band Contract: static fragment scoped under .ucs, reads the docs theme tokens with fallbacks,
  no script, no motion, no network.
  Sources: the midpoint rule t = duration x (i + 0.5) / N and the 1 to 64 clamp for the cuts
  parameter in engine/src/url-mode.ts (CUTS_MAX).
  Provenance: Authored with Claude Code (Anthropic, Claude Opus 5.5), directed by Andy Fitzsimon on
  2026-10-23. The C2PA signature added at bank time is the first provenance record of this file.
-->
<style>
.ucs{--ucs-ink:hsl(var(--card-foreground,201.2 48.6% 6.9%));--ucs-muted:hsl(var(--muted-foreground,207.7 10.6% 24.1%));
 --ucs-ground:hsl(var(--secondary,84.5 55% 92.2%));--ucs-paper:hsl(var(--card,0 0% 100%));
 --ucs-line:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .16);--ucs-soft:hsl(var(--card-foreground,201.2 48.6% 6.9%) / .06);
 --ucs-take:#008657;--ucs-blank:#b2461c;
 --ucs-mono:"SUSE Mono",ui-monospace,Menlo,Consolas,monospace;
 color:var(--ucs-ink);background:var(--ucs-ground);border-radius:1.2em;padding:clamp(12px,2.6vw,22px);
 font-size:1rem;line-height:1.35;text-align:start;container-type:inline-size}
:is([data-theme="dark"],[data-theme="brand"]) .ucs{--ucs-take:#50c369;--ucs-blank:#fac044}
.ucs *{box-sizing:border-box}
.ucs p{margin:0}
.ucs ol,.ucs ul{list-style:none;margin:0;padding:0}
.ucs li{list-style:none;margin:0;font-size:inherit}
.ucs-plate{background:var(--ucs-paper);border-radius:14px;padding:16px 16px 12px;box-shadow:0 1px 2px #0000000f,0 6px 18px #0000000f}
.ucs-cap{font:600 11px/1.3 var(--ucs-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ucs-muted);margin-bottom:10px}
.ucs-stills{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0 0 8px}
.ucs-still{aspect-ratio:16/10;border-radius:6px;background:linear-gradient(160deg,color-mix(in oklab,var(--ucs-take) 70%,var(--ucs-paper)),var(--ucs-take));
 display:flex;align-items:flex-end;justify-content:flex-start;padding:4px 6px;color:var(--ucs-paper);font:700 11px/1 var(--ucs-mono)}
.ucs-axis{position:relative;height:56px}
.ucs-slices{position:absolute;left:0;right:0;top:10px;height:22px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
 border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--ucs-line)}
.ucs-slices li{background:var(--ucs-soft);box-shadow:inset -1px 0 0 var(--ucs-line);display:flex;align-items:center;justify-content:center}
.ucs-slices li:last-child{box-shadow:none}
.ucs-dot{width:10px;height:10px;border-radius:50%;background:var(--ucs-take);box-shadow:0 0 0 2px var(--ucs-paper)}
.ucs-end{position:absolute;top:4px;height:34px;border-left:2px dashed var(--ucs-blank)}
.ucs-end--a{left:0}.ucs-end--b{right:0;border-left:0;border-right:2px dashed var(--ucs-blank)}
.ucs-ticks{position:absolute;left:0;right:0;top:38px;display:flex;justify-content:space-between;font:500 11px/1 var(--ucs-mono);color:var(--ucs-muted)}
.ucs-key{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:12px;font-size:.8rem;color:var(--ucs-muted)}
@container (max-width:460px){.ucs-key{grid-template-columns:1fr}.ucs-ticks span:nth-child(even){visibility:hidden}}
.ucs-key b{color:var(--ucs-ink);font-weight:650}
.ucs-sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ucs-sw--take{background:var(--ucs-take)}
.ucs-sw--blank{border:2px dashed var(--ucs-blank);border-radius:2px}
</style><div class="ucs"><div class="ucs-plate"><p class="ucs-cap">cuts=6 on a 12-second sequence</p><ol class="ucs-stills" aria-label="Six stills"><li class="ucs-still">1s</li><li class="ucs-still">3s</li><li class="ucs-still">5s</li><li class="ucs-still">7s</li><li class="ucs-still">9s</li><li class="ucs-still">11s</li></ol><div class="ucs-axis" aria-hidden="true"><ol class="ucs-slices"><li><span class="ucs-dot"></span></li><li><span class="ucs-dot"></span></li><li><span class="ucs-dot"></span></li><li><span class="ucs-dot"></span></li><li><span class="ucs-dot"></span></li><li><span class="ucs-dot"></span></li></ol><span class="ucs-end ucs-end--a"></span><span class="ucs-end ucs-end--b"></span><p class="ucs-ticks"><span>0s</span><span>2s</span><span>4s</span><span>6s</span><span>8s</span><span>10s</span><span>12s</span></p></div></div><ul class="ucs-key"><li><span class="ucs-sw ucs-sw--take"></span><b>The middle of each slice.</b> Still i of N is taken at duration × (i + 0.5) ÷ N.</li><li><span class="ucs-sw ucs-sw--blank"></span><b>Never the two ends.</b> At 0s an enter transition has not faded in, and at 12s every clip has ended.</li></ul></div>
