# Security headers, in ONE file because nginx drops every inherited add_header
# in any location that declares one of its own - so each such location has to
# re-add them, and three hand-copied blocks is how one of them loses a directive.
# `include`d at server level and inside every location in lolly-web.conf that
# sets Cache-Control.
#
# $lolly_csp is defined by the `map` in lolly-web.conf (both files are loaded
# inside the same http{} block), so keep that file present and included first.
#
# Kept identical to the headers block in deploy/docker/security-headers.conf and
# the production vercel.json; tests/security-headers.test.ts fails the build if
# they disagree. See the SUSE security assessment 2026-08 (S2) for the reasoning,
# and the $lolly_csp map in lolly-web.conf for what the policy allows and why.
#
# The two Cross-Origin-* headers are not optional hardening here: they are what
# grants the SharedArrayBuffer the app's wasm features need. Remove them and the
# page still loads but the on-device ML, text-to-path and video paths refuse.
add_header Content-Security-Policy $lolly_csp always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
