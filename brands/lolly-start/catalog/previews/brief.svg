<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><path fill="#e5e5e5" d="M0 0h1600v1000H0z"/><path fill="#1d1d1d" d="M0 0h1600v12H0z"/><text x="59.27" y="67.33" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="20.75" font-weight="650" letter-spacing="2.9">BRIEF</text><text x="59.27" y="96.84" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="55.33" font-weight="750" letter-spacing="-.83">Alex Morgan</text><text x="59.27" y="171.81" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="24.7" font-weight="400" opacity=".7">Head of IT · Example Council</text><path fill="#1d1d1d" fill-opacity=".7" d="M59.27 234.52h720.97v2H59.27z"/><text x="59.27" y="253.81" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="23.12" font-weight="700" letter-spacing="2.08">IN THE NEWS</text><g fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="29.64" font-weight="400"><text x="59.27" y="294.61">The council opened a tender for its data centre move on</text><text x="59.27" y="335.5">14 October.</text></g><path fill="#1d1d1d" fill-opacity=".7" d="M819.75 234.52h720.98v2H819.75z"/><text x="819.75" y="253.81" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="23.12" font-weight="700" letter-spacing="2.08">SIGNAL</text><g fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="29.64" font-weight="400"><text x="819.75" y="294.61">Downloaded the migration guide twice this month and</text><text x="819.75" y="335.5">asked for pricing.</text></g><path fill="#1d1d1d" fill-opacity=".7" d="M59.27 410.95h720.97v2H59.27z"/><text x="59.27" y="430.25" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="23.12" font-weight="700" letter-spacing="2.08">ACCOUNT</text><g fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="29.64" font-weight="400"><text x="59.27" y="471.05">A customer since 2021, with 340 subscriptions and a</text><text x="59.27" y="511.94">renewal due in March.</text></g><path fill="#1d1d1d" fill-opacity=".7" d="M819.75 410.95h720.98v2H819.75z"/><text x="819.75" y="430.25" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="23.12" font-weight="700" letter-spacing="2.08">SUPPORT</text><text x="819.75" y="471.05" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="29.64" font-weight="400">Two cases this year, both closed within a day.</text><path fill="#1d1d1d" fill-opacity=".7" d="M59.27 587.39h720.97v2H59.27z"/><text x="59.27" y="606.69" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="23.12" font-weight="700" letter-spacing="2.08">WATCH OUT</text><text x="59.27" y="647.48" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="29.64" font-weight="400">A competitor won the storage project in June.</text><path fill="#1d1d1d" fill-opacity=".7" d="M819.75 587.39h720.98v2H819.75z"/><text x="819.75" y="606.69" fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="23.12" font-weight="700" letter-spacing="2.08">NEXT STEP</text><g fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="29.64" font-weight="400"><text x="819.75" y="647.48">Offer thirty minutes on the migration plan before the</text><text x="819.75" y="688.38">tender closes.</text></g><g fill="#1d1d1d" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="23.12" opacity=".7"><text x="59.27" y="914.77" font-weight="700">Not confirmed:</text><text x="220.08" y="914.77" font-weight="400">Who signs off the tender.</text></g></svg>