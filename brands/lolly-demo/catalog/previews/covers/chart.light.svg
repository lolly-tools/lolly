<?xml version="1.0" standalone="no"?>
<svg id="d3-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" style="width:100%;height:auto;display:block;" data-lolly-anno="vector bar bar3d auto grouped monotone uniform none linear auto ordered category  #ffffff bc">
  <title>bar chart</title>
  <desc>bar chart uses 6 data rows across 1 series, styled from Lolly Demo.</desc>
  <defs>
    <style>
      /* Brand font via the injected var (community pattern - no @font-face here;
         the shell loads the active brand's faces). 'SUSE' rides the fallback
         tail so an already-registered face still resolves on older shells. */
      #d3-svg text, #d3-svg tspan { font-family: var(--font-brand, 'SUSE', system-ui, -apple-system, sans-serif); }
      /* Click-to-focus: annotated parts jump to their sidebar control on click - hint it. */
      #d3-svg [data-canvas-input] { cursor: pointer; }
      /* Click-to-recolour: bars/slices open a brand-swatch picker on click. */
      #d3-svg [data-recolor] { cursor: pointer; }
      /* Click a data label to annotate it (arrow + note). */
      #d3-svg [data-annot] { cursor: pointer; }
    </style>
  </defs>
  <rect id="d3-bg" width="1280" height="800" fill="none" pointer-events="all"/>
  <g id="d3-plot"><g><rect x="108.33930704898455" y="494.48" width="127.06332138590203" height="245.51999999999998" fill="#033633" rx="6" ry="6" data-recolor="A"/><rect x="294.79091995221034" y="344.44" width="127.06332138590203" height="395.56" fill="#008657" rx="6" ry="6" data-recolor="B"/><rect x="481.24253285543614" y="433.1000000000001" width="127.06332138590203" height="306.8999999999999" fill="#c55123" rx="6" ry="6" data-recolor="C"/><rect x="667.6941457586619" y="180.76000000000005" width="127.06332138590203" height="559.24" fill="#da1889" rx="6" ry="6" data-recolor="D"/><rect x="854.1457586618877" y="276.23999999999995" width="127.06332138590203" height="463.76000000000005" fill="#1a85c4" rx="6" ry="6" data-recolor="E"/><rect x="1040.5973715651135" y="92.10000000000002" width="127.06332138590203" height="647.9" fill="#72251c" rx="6" ry="6" data-recolor="F"/></g></g>
</svg>