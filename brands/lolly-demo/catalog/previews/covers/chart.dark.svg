<?xml version="1.0" standalone="no"?>
<svg id="d3-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" style="width:100%;height:auto;display:block;" data-lolly-anno="vector bar bar3d auto grouped monotone uniform none linear auto suse category  #ffffff bc">
  <title>bar chart</title>
  <desc>bar chart uses 3 data rows across 1 series, styled from Lolly Demo.</desc>
  <defs>
    <style>
      /* Brand font via the injected var (community pattern - no @font-face here;
         the shell loads the active brand's faces). 'SUSE' rides the fallback
         tail so an already-registered face still resolves on older shells. */
      #d3-svg text, #d3-svg tspan { font-family: var(--font-brand, 'SUSE', system-ui, -apple-system, sans-serif); }
      /* Click-to-focus: annotated parts jump to their sidebar control on click - hint it. */
      #d3-svg [data-canvas-input] { cursor: pointer; }
      /* Click-to-recolour: bars/slices open a brand-swatch picker on click. */
      #d3-svg [data-recolor] { cursor: pointer; }
      /* Click a data label to annotate it (arrow + note). */
      #d3-svg [data-annot] { cursor: pointer; }
    </style>
  </defs>
  <rect id="d3-bg" width="1280" height="800" fill="none" pointer-events="all"/>
  <g id="d3-plot"><g><rect x="153.65740740740736" y="344.44" width="246.18518518518522" height="395.56" fill="#008657" rx="6" ry="6" data-recolor="A"/><rect x="514.9074074074074" y="221.68" width="246.18518518518522" height="518.3199999999999" fill="#b3b3b3" rx="6" ry="6" data-recolor="B"/><rect x="876.1574074074074" y="92.10000000000002" width="246.18518518518522" height="647.9" fill="#da1889" rx="6" ry="6" data-recolor="C"/></g></g>
</svg>