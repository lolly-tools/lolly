{{#if _useThree}}
<div class="chart3d-wrap" data-chart3d-wrap data-renderer="{{_rendererFamily}}" data-style="{{_chartStyle}}"
     role="img" aria-label="{{_chartDescription}}"
     style="position:relative;width:100%;max-width:{{width}}px;aspect-ratio:{{width}}/{{height}};overflow:hidden;background:{{_bgFill}};font-family:var(--font-brand,'SUSE',system-ui,-apple-system,sans-serif);">
  <!-- First paint, CLI and vector-export path. It stays in the DOM after WebGL
       succeeds so SVG/PDF can deliberately choose real geometry over pixels. -->
  <svg data-chart3d-fallback xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{width}} {{height}}"
       width="{{width}}" height="{{height}}" style="position:absolute;inset:0;width:100%;height:100%;display:block;">
    <title>{{_chartTitle}}</title>
    <desc>{{_chartDescription}}</desc>
    <rect width="{{width}}" height="{{height}}" fill="{{_bgFill}}"/>
    {{{_threeFallback}}}
  </svg>
  <!-- Three renders to a detached GPU canvas, then copies into this 2-D
       presentation canvas. That makes the ordinary Lolly image/video capture
       path deterministic and avoids preserveDrawingBuffer. -->
  <canvas data-chart3d-canvas data-capture-stream width="{{width}}" height="{{height}}"
          style="position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;"></canvas>
  <svg data-chart3d-overlay xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{width}} {{height}}"
       width="{{width}}" height="{{height}}" aria-hidden="true"
       style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;overflow:visible;">
    <style>[data-chart3d-overlay] text{font-family:var(--font-brand,'SUSE',system-ui,-apple-system,sans-serif)}</style>
    <g data-chart3d-overlay-root></g>
  </svg>
</div>
{{{_a11yTable}}}
<canvas data-chart3d-clock width="1" height="1" style="display:none" aria-hidden="true"></canvas>
<script type="application/json" data-chart3d-state>{{{_state}}}</script>
<script>
(function () {
  var cs = document.currentScript;
  var ROOT = (cs && cs.parentNode) || document;
  ROOT.__chart3dEpoch = (ROOT.__chart3dEpoch || 0) + 1;
  var epoch = ROOT.__chart3dEpoch;
  var wrap = ROOT.querySelector('[data-chart3d-wrap]');
  var stateEl = ROOT.querySelector('[data-chart3d-state]');
  var clock = ROOT.querySelector('[data-chart3d-clock]');
  if (!wrap || !stateEl) return;

  var state;
  try { state = JSON.parse(stateEl.textContent || '{}'); } catch (e) { return; }

  window.__toolHasReadySignal = true;
  var readyFired = false;
  function fireReady() {
    if (readyFired) return;
    readyFired = true;
    try { document.dispatchEvent(new CustomEvent('tool:ready')); } catch (e) {}
  }

  if (ROOT.__lollyChart3d && typeof ROOT.__lollyChart3d.dispose === 'function') {
    try { ROOT.__lollyChart3d.dispose(); } catch (e) {}
    ROOT.__lollyChart3d = null;
  }

  function loadOnce(name, src, present) {
    if (present()) return Promise.resolve();
    window[name] = window[name] || new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { s.remove(); window[name] = null; reject(new Error(src + ' failed to load')); };
      document.head.appendChild(s);
    });
    return window[name];
  }

  Promise.all([
    loadOnce('__lollyChartThreeLoading', '/tools/chart/lib/three-chart.min.js', function () { return !!window.LollyChartThree; }),
    loadOnce('__lollyChartAdapterLoading', '/tools/chart/lib/chart-three.js', function () { return !!window.LollyChart3D; })
  ]).then(function () {
    if (ROOT.__chart3dEpoch !== epoch) return;
    if (!window.LollyChartThree || !window.LollyChart3D) throw new Error('3-D chart renderer is unavailable');
    var mounted = window.LollyChart3D.mount({ root: wrap, state: state, THREE: window.LollyChartThree });
    ROOT.__lollyChart3d = mounted;
    if (clock && mounted && typeof mounted.renderAt === 'function') clock.__lollyFrameRender = mounted.renderAt;
    fireReady();
  }).catch(function (err) {
    wrap.setAttribute('data-backend', 'vector-fallback');
    console.error('[chart 3d]', err);
    fireReady();
  });
})();
</script>

<div data-chart-plot-wrap data-renderer="{{_rendererFamily}}" data-style="{{_chartStyle}}"
     style="position:relative;width:100%;max-width:{{width}}px;aspect-ratio:{{width}}/{{height}};overflow:hidden;background:{{_bgFill}};font-family:var(--font-brand,'SUSE',system-ui,-apple-system,sans-serif);">

    <rect width="{{width}}" height="{{height}}" fill="{{_bgFill}}"/>
    {{{_plotFallback}}}
  </svg>
  <div data-chart-plot-root style="position:absolute;inset:0;width:100%;height:100%;display:none;"></div>
  <canvas data-chart-plot-clock width="1" height="1" style="display:none" aria-hidden="true"></canvas>
</div>
{{{_a11yTable}}}
<script type="application/json" data-chart-plot-state>{{{_state}}}</script>
<script>
(function () {
  var cs = document.currentScript;
  var ROOT = (cs && cs.parentNode) || document;
  ROOT.__chartPlotEpoch = (ROOT.__chartPlotEpoch || 0) + 1;
  var epoch = ROOT.__chartPlotEpoch;
  var wrap = ROOT.querySelector('[data-chart-plot-wrap]');
  var stateEl = ROOT.querySelector('[data-chart-plot-state]');
  var clock = ROOT.querySelector('[data-chart-plot-clock]');
  if (!wrap || !stateEl) return;
  var state;
  try { state = JSON.parse(stateEl.textContent || '{}'); } catch (e) { return; }

  window.__toolHasReadySignal = true;
  var ready = false;
  function fireReady() {
    if (ready) return; ready = true;
    try { document.dispatchEvent(new CustomEvent('tool:ready')); } catch (e) {}
  }
  function loadOnce(name, src, present) {
    if (present()) return Promise.resolve();
    window[name] = window[name] || new Promise(function (resolve, reject) {
      var s = document.createElement('script'); s.src = src; s.onload = resolve;
      s.onerror = function () { s.remove(); window[name] = null; reject(new Error(src + ' failed to load')); };
      document.head.appendChild(s);
    });
    return window[name];
  }
  if (ROOT.__lollyChartPlot && typeof ROOT.__lollyChartPlot.dispose === 'function') {
    try { ROOT.__lollyChartPlot.dispose(); } catch (e) {}
    ROOT.__lollyChartPlot = null;
  }
  // Observable Plot's official browser build deliberately shares Chart's pinned
  // D3 runtime. Load sequentially so the UMD factory always sees window.d3.
  loadOnce('__d3Loading', '/tools/chart/lib/d3.min.js', function () { return !!window.d3; })
    .then(function () { return loadOnce('__lollyObservablePlotLoading', '/tools/chart/lib/observable-plot.min.js', function () { return !!window.Plot; }); })
    .then(function () { return loadOnce('__lollyChartPlotAdapterLoading', '/tools/chart/lib/chart-plot.js', function () { return !!window.LollyChartPlot; }); })
    .then(function () {
      if (ROOT.__chartPlotEpoch !== epoch) return;
      if (!window.Plot || !window.LollyChartPlot) throw new Error('Statistical chart renderer is unavailable');
      ROOT.__lollyChartPlot = window.LollyChartPlot.mount({ root: wrap, state: state, Plot: window.Plot, clock: clock });
      if (ROOT.__lollyChartPlot) {
        wrap.__lollyPlotPoster = ROOT.__lollyChartPlot.poster;
        wrap.__lollyPlotRestore = ROOT.__lollyChartPlot.restore;
      }
      fireReady();
    }).catch(function (err) {
      wrap.setAttribute('data-backend', 'semantic-fallback');
      console.error('[chart statistical]', err);
      fireReady();
    });
})();
</script>
{{else}}
<svg id="d3-svg" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 {{width}} {{height}}" width="{{width}}" height="{{height}}"
     style="width:100%;height:auto;display:block;"
     data-lolly-anno="{{renderMode}} {{chartType}} {{sceneType}} {{delimiter}} {{stackMode}} {{curve}} {{sizeBy}} {{sort}} {{yScaleType}} {{numberFormat}} {{palette}} {{colorBy}} {{textColor}} {{strokeColor}} {{legendPosition}}">
  <title>{{_chartTitle}}</title>
  <desc>{{_chartDescription}}</desc>
  <defs>
    <style>
      /* Brand font via the injected var (community pattern - no @font-face here;
         the shell loads the active brand's faces). 'SUSE' rides the fallback
         tail so an already-registered face still resolves on older shells. */
      #d3-svg text, #d3-svg tspan { font-family: var(--font-brand, 'SUSE', system-ui, -apple-system, sans-serif); }
      /* Click-to-focus: annotated parts jump to their sidebar control on click - hint it. */
      #d3-svg [data-canvas-input] { cursor: pointer; }
      /* Click-to-recolour: bars/slices open a brand-swatch picker on click. */
      #d3-svg [data-recolor] { cursor: pointer; }
      /* Click a data label to annotate it (arrow + note). */
      #d3-svg [data-annot] { cursor: pointer; }
    </style>
  </defs>
  <rect id="d3-bg" width="{{width}}" height="{{height}}" fill="{{_bgFill}}" pointer-events="all"/>
  <g id="d3-plot" data-canvas-input="data"></g>
</svg>
{{{_a11yTable}}}
<!-- Export frame-clock carrier. The animated chart is rAF-driven SVG (no <canvas>), but
     the video/apng/webp-anim pipeline seeks motion through a deterministic clock it finds
     on a descendant <canvas> OR the export node itself (see createFrameSource →
     frameClockCanvas). This hidden 1×1 canvas carries __lollyFrameRender so the export can
     drive each exact phase; startAnim also puts the hook on #d3-svg for whichever element
     the export captures. display:none → found by querySelectorAll, never rasterised. -->
<canvas id="d3-clock" width="1" height="1" style="display:none" aria-hidden="true"></canvas>
<script type="application/json" id="d3-state">{{{_state}}}</script>
<script>
(function () {
  /* Idempotent per-paint IIFE (the template re-runs on every render). An epoch
     guard drops any stale async callback from a previous paint. See street-map.
     Multi-edit mounts MANY d3 instances inline in ONE document, so everything
     resolves against THIS instance's own container (found via the running
     <script>) and its per-instance state (epoch, rAF handle) lives on that ROOT
     - never on `window`, which would collide across cards and, via duplicate
     ids + a shared epoch, blank all but one. Only the d3 library itself and its
     load promise stay global (loaded once, legitimately shared). */
  var _cs = document.currentScript;
  var ROOT = (_cs && _cs.parentNode) || document;
  ROOT.__d3Epoch = (ROOT.__d3Epoch || 0) + 1;
  var _ep = ROOT.__d3Epoch;
  function alive() { return ROOT.__d3Epoch === _ep; }

  var stateEl = ROOT.querySelector('#d3-state');
  var svgEl = ROOT.querySelector('#d3-svg');
  if (!stateEl || !svgEl) return;
  /* Scoped once: the plot/bg live inside THIS svg, the clock beside it - d3.select
     and getElementById would otherwise grab the first match across all cards. */
  var plotEl = svgEl.querySelector('#d3-plot');
  var bgEl = svgEl.querySelector('#d3-bg');
  var clockEl = ROOT.querySelector('#d3-clock');

  var state;
  try { state = JSON.parse(stateEl.textContent || '{}'); } catch (e) { return; }
  if (!state || !state.cfg) return;

  /* Load d3 once (dedupe concurrent loads across re-paints), then render. */
  var LIB = '/tools/chart/lib/d3.min.js';
  function loadD3() {
    if (window.d3) return Promise.resolve();
    window.__d3Loading = window.__d3Loading || new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = LIB; s.onload = res;
      /* Remove the failed node so a re-paint doesn't accrete orphan <script>s. */
      s.onerror = function () { s.remove(); window.__d3Loading = null; rej(new Error('d3 load failed')); };
      document.head.appendChild(s);
    });
    return window.__d3Loading;
  }

  loadD3().then(function () {
    if (!alive()) return;
    /* Loaded but no global (e.g. an SPA fallback served index.html at the lib URL)
       - surface it rather than leaving a silently blank canvas. */
    if (!window.d3) { message('Chart library failed to load.'); return; }
    try { render(state, window.d3); startAnim(state, window.d3); }
    catch (err) { console.error('[d3] render error:', err); message(String(err && err.message || err)); }
  }).catch(function (e) { console.error('[d3]', e); message('Chart library failed to load.'); });

  /* ── palettes (shipped fallback) ──────────────────────────────────────────────────────── */
  /* Ordered categorical hues - distinct colour families, CVD-considered. */
  /* Lead with a green that clears WCAG 1.4.11 (3:1) on white - Pine #30BA78 is
     only ~2.5:1, so the deeper #008657 takes slot 0 (like the reference tool). */
  var CATEGORICAL = ['#008657','#2453FF','#FE7C3F','#5D4F99','#00BDA7','#BD3314','#3C8EEF','#192072','#30BA78','#FAB088'];
  /* Sequential ramps, light → dark, as interpolate anchors. The dark anchor is the
     neutral near-black ink #111111 (not any brand's ink hex). SHIPPED = the fallback
     when the hook couldn't derive brand ramps (older shell / no host.color). */
  var SHIPPED_RAMPS = {
    suse:      ['#DDF3EA','#8FE3C0','#30BA78','#0C7C4E','#111111'],
    pine:      ['#DDF3EA','#8FE3C0','#30BA78','#0C7C4E','#111111'],
    waterhole: ['#E3EAFF','#93A9FF','#2453FF','#1B37B8','#192072'],
    warm:      ['#FDE7D8','#FAB088','#FE7C3F','#C6461B','#7A2A10'],
    cool:      ['#BFF1EA','#5FC7D8','#2E77E6','#1E2C86','#192072'],
    diverging: ['#2453FF','#93A9FF','#EFEFEF','#FCB98F','#FE7C3F'],
    mono:      ['#D6E3DE','#93B7AA','#3E7D68','#1C4E40','#111111']
  };
  /* Chart types that support click-to-recolour (a single label → one brand-swatch
     override). Shared by render()'s tagMark gate AND setupRecolor's click gate so
     the two never drift. Single-series categorical charts, like pie/donut. */
  var RECOLOR_CHARTS = ['bar','bar-horizontal','pie','donut','radial-bar','treemap','pack','funnel','waffle','lollipop','polar','waterfall','pareto','bullet','range-bar'];

  /* ── colour helpers (WCAG legibility guard, ported from chart-creator) ─────── */
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function isHex(s) { return /^#[0-9a-fA-F]{6}$/.test(String(s)); }
  function lum(hex) {
    var c = String(hex).replace('#', '');
    if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
    var f = function (v) { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
    return 0.2126*f(parseInt(c.slice(0,2),16)) + 0.7152*f(parseInt(c.slice(2,4),16)) + 0.0722*f(parseInt(c.slice(4,6),16));
  }
  function contrast(a, b) { var hi = Math.max(lum(a),lum(b)), lo = Math.min(lum(a),lum(b)); return (hi+0.05)/(lo+0.05); }
  /* Crossover for the near-black ink #111111 (luminance ~0.005) is ~0.18 - above it
     dark ink out-contrasts white on the mark (matches chart-creator's autoText). */
  function autoText(bg) { return lum(bg) > 0.179 ? '#111111' : '#ffffff'; }
  /* Auto ink for chart chrome (titles/axes/labels/legend/gridlines) when the user
     leaves "Text & axis colour" blank - contrasts with the background so a dark bg
     flips everything light without the user colouring each element. */
  function autoInk(bg) { return lum(bg) > 0.42 ? '#141414' : '#f4f4f4'; }
  function toRgb(hex){var c=String(hex).replace('#','');return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
  function toHex(a){return '#'+a.map(function(v){return clamp(Math.round(v),0,255).toString(16).padStart(2,'0');}).join('');}
  /* Nudge a fill away from the surface until it clears a legibility floor. */
  function legible(hex, bg, floor) {
    if (!isHex(hex) || !isHex(bg)) return hex;
    var FLOOR = floor || 1.9;
    if (contrast(hex, bg) >= FLOOR) return hex;
    var target = lum(bg) > 0.4 ? [0,0,0] : [255,255,255];
    var rgb = toRgb(hex);
    for (var t = 0.15; t < 1; t += 0.15) {
      var cand = toHex(rgb.map(function (v,i){ return v + (target[i]-v)*t; }));
      if (contrast(cand, bg) >= FLOOR) return cand;
    }
    return toHex(target);
  }

  function message(text) {
    var d3 = window.d3;
    if (!d3) return;
    var svg = d3.select(svgEl);
    var W = state.cfg.width, H = state.cfg.height;
    svg.attr('viewBox', '0 0 '+W+' '+H).attr('width', W).attr('height', H);
    d3.select(bgEl).attr('width', W).attr('height', H);
    var g = d3.select(plotEl); g.selectAll('*').remove();
    var size = clamp(W / 30, 14, 26);
    var lines = wrapToWidth(text || 'No data', Math.max(80, W - 64), size, 500, 6);
    var colour = isHex(state.cfg.textColor) ? state.cfg.textColor : autoInk(state.cfg.transparent ? '#ffffff' : state.cfg.background);
    drawTextLines(g, lines, W / 2, H / 2, 'middle', size, 500, colour, 1, 'center');
  }

  /* ── keyframe animation ──────────────────────────────────────────────────────
     When the data carries frames (a frame/time column), morph the chart between
     them on a loop by re-rendering with tweened series each tick. render() clears
     and redraws #d3-plot every call, so the DOM genuinely changes frame-to-frame -
     which is what lets the existing video pipeline (render.video) capture it as a
     looping APNG / MP4 / WebM, and what animates it live in the preview. The epoch
     guard stops a stale loop the moment a new paint supersedes it.

     Playback is driven by a normalised clock t∈[0,1). A shared `window.__lollyAnim`
     is the CONTRACT with the shell's transport bar: the tool publishes {active,
     labels, loopMs, curT} and reads back {playing, scrubT} so a generic play/pause/
     scrub control can drive ANY animated tool without knowing its internals. When no
     transport is present the tool just free-runs. */
  function startAnim(baseState, d3) {
    if (ROOT.__d3Raf) { cancelAnimationFrame(ROOT.__d3Raf); ROOT.__d3Raf = 0; }
    var data = baseState.data, cfg = baseState.cfg, frames = data.frames, labels = data.frameLabels || [];
    if (!frames || frames.length < 2) {
      if (window.__lollyAnim) window.__lollyAnim.active = false;   // hide the transport
      [clockEl, svgEl].forEach(function (el) { if (el) delete el.__lollyFrameRender; });  // a static chart must not be export-driven
      svgEl.__lollyBuildSmil = null; svgEl.__lollyRestoreLive = null; svgEl.__lollySmilActive = false;   // clear a stale SMIL builder so a static SVG export stays static
      return;
    }
    var nF = frames.length, stepMs = clamp(cfg.animSpeed || 1.5, 0.3, 8) * 1000, holdFrac = 0.35, loopMs = nF * stepMs;
    var bounce = cfg.animDirection === 'bounce', easeMode = cfg.animEase || 'smooth';
    var guardBg = cfg.transparent ? '#ffffff' : (isHex(cfg.background) ? cfg.background : '#ffffff');
    var ink = isHex(cfg.textColor) ? cfg.textColor : autoInk(guardBg);
    var easeIO = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
    /* Tween two frames' series element-wise; a value absent in one frame appears/
       disappears (uses the finite endpoint) rather than snapping through 0. */
    var lerp = function (A, B, tw) {
      return A.map(function (sa, si) {
        var sb = B[si] || sa;
        return { name: sa.name, values: sa.values.map(function (va, ci) {
          var a = isFinite(va) ? +va : null, vb = sb.values[ci], b = isFinite(vb) ? +vb : null;
          if (a == null && b == null) return null;   // absent in BOTH → stays hidden (null)
          if (a == null) return b * tw;              // appearing: grow 0 → b
          if (b == null) return a * (1 - tw);        // leaving: shrink a → 0
          return a + (b - a) * tw;
        }) };
      });
    };
    /* Map the clock t∈[0,1) → (frame i, frame j, tween tw), honouring direction +
       easing. Bounce plays 0→last→0 without wrapping; loop wraps last→0. */
    function frameFor(t) {
      var i, j, local;
      if (bounce) { var u = t < 0.5 ? t * 2 : (1 - t) * 2; var p = u * (nF - 1); i = Math.min(nF - 1, Math.floor(p)); j = Math.min(nF - 1, i + 1); local = p - i; }
      else { var q = t * nF; i = Math.floor(q) % nF; j = (i + 1) % nF; local = q - Math.floor(q); }
      var tw = easeMode === 'steps' ? 0 : easeMode === 'linear' ? local : (local < holdFrac ? 0 : easeIO((local - holdFrac) / (1 - holdFrac)));
      return { i: i, j: j, tw: tw };
    }
    function draw(t) {
      var f = frameFor(t);
      var tweened = lerp(frames[f.i], frames[f.j], f.tw);
      /* scatter reads numericCols (x/y); the others read series - feed the tween to the right one. */
      var st = { cfg: cfg, data: { categories: data.categories, series: tweened,
        numericCols: cfg.chartType === 'scatter' ? tweened : [], errorValues: null } };
      try { render(st, d3); } catch (e) { console.error('[d3 anim]', e); return; }
      if (cfg.frameLabelShow !== false && labels.length) {
        var fSz = clamp(cfg.frameLabelSize || 36, 8, 160), fPos = cfg.frameLabelPos || 'tr';
        var left = (fPos === 'tl' || fPos === 'bl'), bottom = (fPos === 'bl' || fPos === 'br');
        d3.select(plotEl).append('text').attr('x', left ? 18 : cfg.width - 18).attr('y', bottom ? cfg.height - 18 : fSz + 12)
          .attr('text-anchor', left ? 'start' : 'end').attr('font-size', fSz).attr('font-weight', cfg.frameLabelWeight || 700)
          .attr('fill', isHex(cfg.frameLabelColor) ? cfg.frameLabelColor : ink).attr('opacity', 0.92).text(labels[f.tw < 0.5 ? f.i : f.j]);
      }
    }
    /* Deterministic EXPORT clock: the video/apng/webp-anim pipeline freezes this tool's
       rAF (sets __lollyFrameDriven) and calls __lollyFrameRender(t) to paint each exact
       phase, so the exported motion FOLLOWS the animation instead of one held frame. The
       hook rides both the hidden #d3-clock <canvas> (found via querySelectorAll) and
       #d3-svg (the node itself), covering whichever element the export captures. */
    var clockEls = [clockEl, svgEl].filter(Boolean);
    clockEls.forEach(function (el) { el.__lollyFrameRender = function (t) { draw(clamp(+t || 0, 0, 0.999999)); }; });
    var frameDriven = function () { for (var i = 0; i < clockEls.length; i++) if (clockEls[i].__lollyFrameDriven) return true; return false; };
    /* Animated-SVG (SMIL) export: a sampled flipbook. Render draw(k/N) into N sibling
       <g>s and cycle their visibility with discrete-opacity SMIL - reuses the exact live
       renderer, so labels, hide-empties and every chart type come along for free, and a
       self-contained looping vector SVG plays natively. Driven by the beforeExport hook
       (format=svg); the rAF loop parks on __d3SmilActive so it can't clobber the build. */
    svgEl.__lollySmilActive = false;
    var SVGNS = 'http://www.w3.org/2000/svg', loopSec = loopMs / 1000;
    svgEl.__lollyBuildSmil = function () {
      if (!frames || frames.length < 2) return false;
      var plot = plotEl; if (!plot) return false;
      svgEl.__lollySmilActive = true;
      var N = Math.max(nF * 2, Math.min(60, Math.round(loopSec * 12)));   // ~12 fps, capped
      var groups = [], k;
      for (k = 0; k < N; k++) {
        draw(k / N);
        var g = document.createElementNS(SVGNS, 'g');

  /* ── trend / regression fit ───────────────────────────────────────────────

  /* Draw a fitted trend (or moving average) over one series/cloud. xScale/yScale

  function drawTrend(api, plot, xScale, yScale, xdata, ydata, col, showR2) {

      var pts = [], win = Math.max(2, Math.round(xdata.length / 6));
      for (var i = 0; i < xdata.length; i++) {

      .attr('stroke-width', 2).attr('stroke-dasharray', '6 4').attr('opacity', 0.92);
    if (showR2 && isFinite(fit.r2) && last) {
      var sz = clamp(api.cfg.labelSize, 10, 18);

        .attr('font-size', sz).attr('font-weight', 600).attr('fill', col).attr('opacity', 0.9).text('R² ' + fit.r2.toFixed(2));

  /* Error whiskers with end caps. `scale` maps value→pixel on the value axis;

    for (var i = 0; i < values.length; i++) {
      var e = errs[i], v = values[i]; if (e == null || !isFinite(e) || e <= 0 || !isFinite(v)) continue;

      if (horizontal) { whisk(p1, c, p2, c); whisk(p1, c - cap, p1, c + cap); whisk(p2, c - cap, p2, c + cap); }

  /* Category tick labels - auto-fit: wrap into the column (horizontal bars),

    var cfg = api.cfg, ink = api.ink, sz = catSz(cfg), weight = cfg.labelWeight;
    if (!cfg.showAxes) return;

    function label(c) { return api.categoryLabel ? api.categoryLabel(c) : c; }
    var g = api.root.append('g').attr('class', 'cat-axis');
    var layout = resolveLayout(api, horizontal);
    if (horizontal) {
      var maxW = Math.max(20, plot.x - api.box.x - 8);
      cats.forEach(function (c) {
        var yc = band(c) + band.bandwidth() / 2;

      return;
    }

      var maxLen = capH / 0.7071, ay = plot.y + plot.h + sz * 0.6 + 4;

          .attr('text-anchor', 'end').attr('font-size', sz).attr('font-weight', weight).attr('fill', ink).attr('opacity', 0.8)

        .attr('font-size', sz).attr('font-weight', weight).attr('fill', ink).attr('opacity', 0.8)

  function drawAxisTitles(api, plot, horizontal) {

  /* Inset the plot box to leave room for axes/labels. Category-label charts

    var cfg = api.cfg, b = api.box, sz = clamp(cfg.labelSize, 11, 24);

  /* ── bars (vertical + horizontal; grouped / stacked / stacked100) ─────────── */
  function drawBars(api, horizontal) {

  /* Pixel of the value baseline: 0 clamped into a linear domain, else the axis

    var vals = grp.values; if (vals.length < 2) { drawBox(api, g, grp, cx, bw, y, col); return; }
    var dom = y.domain(), lo = Math.min(dom[0], dom[1]), hi = Math.max(dom[0], dom[1]);
    var n = vals.length, sd = d3.deviation(vals) || (hi - lo) / 10 || 1, h = 1.06 * sd * Math.pow(n, -0.2) || (hi - lo) / 20;
    var N = 48, half = Math.min(bw * 0.46, 80), dens = [], maxD = 0;   // Gaussian KDE, Silverman bandwidth
    for (var i = 0; i <= N; i++) {
      var yv = lo + (hi - lo) * i / N, s = 0;
      for (var j = 0; j < n; j++) { var u = (yv - vals[j]) / h; s += Math.exp(-0.5 * u * u); }
      s /= (n * h * Math.sqrt(2 * Math.PI)); dens.push([yv, s]); if (s > maxD) maxD = s;
    }
    if (maxD <= 0) return;
    var right = dens.map(function (d) { return [cx + (d[1] / maxD) * half, y(d[0])]; });
    var left = dens.slice().reverse().map(function (d) { return [cx - (d[1] / maxD) * half, y(d[0])]; });
    var pts = right.concat(left);
    api.tagMark(g.append('path').attr('d', 'M' + pts.map(function (p) { return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }).join('L') + 'Z')
      .attr('fill', col).attr('fill-opacity', clamp(api.cfg.fillOpacity, 0.25, 0.8)).attr('stroke', col).attr('stroke-width', 1), grp.name);
    var q = quantiles(vals);
    if (q) g.append('line').attr('x1', cx - half * 0.3).attr('y1', y(q.med)).attr('x2', cx + half * 0.3).attr('y2', y(q.med)).attr('stroke', api.guardBg).attr('stroke-width', 2);
  }
  function drawBeeswarm(api, g, grp, cx, bw, y, col) {
    var r = clamp(api.cfg.pointSize / 2, 2, 7), placed = [], half = Math.min(bw * 0.46, 90);
    var step = Math.max(2, r * 1.6), minD2 = (2 * r) * (2 * r);
    var vals = grp.values.slice().sort(function (a, b) { return a - b; });
    if (vals.length > 600) { var keep = [], st = vals.length / 600; for (var t = 0; t < vals.length; t += st) keep.push(vals[Math.floor(t)]); vals = keep; }  // O(n²) packing cap
    vals.forEach(function (v) {
      var py = y(v); if (!isFinite(py)) return;
      var px = cx, k = 0;
      for (;;) {
        var off = k === 0 ? 0 : (k % 2 ? 1 : -1) * Math.ceil(k / 2) * step;
        var cand = cx + off, ok = Math.abs(off) <= half;
        if (ok) for (var m = 0; m < placed.length; m++) { var dx = cand - placed[m][0], dy = py - placed[m][1]; if (dx * dx + dy * dy < minD2) { ok = false; break; } }
        if (ok) { px = cand; break; }
        if (++k > 180) { px = cx; break; }
      }
      placed.push([px, py]);
      g.append('circle').attr('cx', px).attr('cy', py).attr('r', r).attr('fill', col).attr('fill-opacity', clamp(api.cfg.fillOpacity, 0.5, 1)).attr('stroke', api.guardBg).attr('stroke-width', 0.5);
    });
  }

  /* ── pie / donut ──────────────────────────────────────────────────────────── */
  function drawPie(api, isDonut) {
    var d3 = api.d3, cfg = api.cfg, cats = api.cats;
    var vals = api.series[0].values.map(function (v){ return Math.abs(+v) || 0; });
    var items = cats.map(function (c, i){ return { label: c, value: vals[i], oi: i }; });
    items = sortItems(items, cfg.sort);
    var total = d3.sum(items, function (d){ return d.value; }) || 1;
    var b = api.box;
    var cx = b.x + b.w/2, cy = b.y + b.h/2;
    var R = Math.min(b.w, b.h)/2 * 0.92;
    var ir = isDonut ? R * cfg.donutRadius : 0;
    var ccf = api.catColorFn(cats.length);
    if (cfg.pie3d) { drawPie3d(api, items, total, cx, cy, R, ir, ccf); return; }
    var pie = d3.pie().sort(null).value(function (d){ return d.value; }).padAngle(cfg.sliceGap / Math.max(R,1));
    var arc = d3.arc().innerRadius(ir).outerRadius(R).cornerRadius(clamp(cfg.cornerRadius, 0, 40));
    var g = api.root.append('g').attr('transform', 'translate(' + cx + ',' + cy + ')');
    var stroke = cfg.strokeWidth > 0 ? { s: cfg.strokeColor, w: cfg.strokeWidth } : null;
    pie(items).forEach(function (d, i) {
      var col = api.override(d.data.label, legible(ccf(d.data.oi), api.guardBg));
      var p = g.append('path').attr('d', arc(d)).attr('fill', col);
      if (stroke) p.attr('stroke', stroke.s).attr('stroke-width', stroke.w).attr('stroke-linejoin', 'round');
      api.markShadow(api.tagMark(p, d.data.label), col);
      api.overlayPath(g, arc(d), i, col);
      var frac = d.data.value / total;
      if (cfg.showValues && frac > 0.03) {
        var c = arc.centroid(d);
        var lab = cfg.numberFormat === 'percent' || cfg.numberFormat === 'auto' ? Math.round(frac*100) + '%' : api.fmt(d.data.value);
        g.append('text').attr('x', c[0]).attr('y', c[1] + 6).attr('text-anchor', 'middle')
          .attr('font-size', clamp(cfg.labelSize, 12, 30)).attr('font-weight', 700).attr('fill', autoText(col)).text(lab);
      }
    });
    if (isDonut && cfg.heading === '' && cfg.subheading === '') { /* nothing centred by default */ }
  }

  /* Faux-3-D pie/donut: squash to a tilted ellipse and drop a darkened copy of
     the disc behind + below to read as an extruded rim. Slice labels are placed
     in un-squashed screen space so the type isn't vertically compressed. */
  function drawPie3d(api, items, total, cx, cy, R, ir, ccf) {
    var d3 = api.d3, cfg = api.cfg;
    var k = 0.60;                                       // vertical squash → tilt
    var dep = cfg.depth3d > 0 ? cfg.depth3d : clamp(R * 0.22, 10, 48);
    var depLocal = dep / k;
    var pieTop = d3.pie().sort(null).value(function (d) { return d.value; }).padAngle(cfg.sliceGap / Math.max(R, 1));
    var pieBase = d3.pie().sort(null).value(function (d) { return d.value; }).padAngle(0);
    var arcGen = d3.arc().innerRadius(ir).outerRadius(R).cornerRadius(0);
    var topArcs = pieTop(items), baseArcs = pieBase(items);
    var oy = cy - dep * 0.5;
    var g = api.root.append('g').attr('transform', 'translate(' + cx + ',' + oy + ') scale(1,' + k + ')');
    var baseG = g.append('g').attr('transform', 'translate(0,' + depLocal + ')');
    baseArcs.forEach(function (d) { baseG.append('path').attr('d', arcGen(d)).attr('fill', shade(api.override(d.data.label, legible(ccf(d.data.oi), api.guardBg)), -0.30)); });
    var stroke = cfg.strokeWidth > 0 ? { s: cfg.strokeColor, w: cfg.strokeWidth } : null;
    topArcs.forEach(function (d, i) {
      var col = api.override(d.data.label, legible(ccf(d.data.oi), api.guardBg));
      var p = g.append('path').attr('d', arcGen(d)).attr('fill', col);
      if (stroke) p.attr('stroke', stroke.s).attr('stroke-width', stroke.w).attr('stroke-linejoin', 'round');
      api.markShadow(api.tagMark(p, d.data.label), col);
      api.overlayPath(g, arcGen(d), i, col);
      var frac = d.data.value / total;
      if (cfg.showValues && frac > 0.03) {
        var c = arcGen.centroid(d);
        var lab = (cfg.numberFormat === 'percent' || cfg.numberFormat === 'auto') ? Math.round(frac * 100) + '%' : api.fmt(d.data.value);
        api.root.append('text').attr('x', cx + c[0]).attr('y', oy + k * c[1] + 6).attr('text-anchor', 'middle')
          .attr('font-size', clamp(cfg.labelSize, 12, 30)).attr('font-weight', 700).attr('fill', autoText(col)).text(lab);
      }
    });
  }

  /* ── radial bar ───────────────────────────────────────────────────────────── */
  function drawRadialBar(api) {
    var d3 = api.d3, cfg = api.cfg, cats = api.cats;
    var vals = api.series[0].values.map(function (v){ return Math.abs(+v) || 0; });
    var items = sortItems(cats.map(function (c,i){ return { label: c, value: vals[i], oi: i }; }), cfg.sort);
    var b = api.box, cx = b.x + b.w/2, cy = b.y + b.h/2;
    var R = Math.min(b.w, b.h)/2 * 0.9;
    var ir = Math.max(24, R * cfg.donutRadius);
    var maxV = cfg.yMax > 0 ? cfg.yMax : (d3.max(items, function (d){ return d.value; }) || 1);
    var xb = d3.scaleBand().domain(items.map(function (d){ return d.label; })).range([0, 2*Math.PI]).padding(clamp(cfg.barPadding, 0, 0.6));
    var rScale = makeYScale(cfg.yScaleType === 'log' ? 'linear' : cfg.yScaleType, [0, maxV], [ir, R], d3);
    var arc = d3.arc().innerRadius(function (d){ return ir; }).outerRadius(function (d){ return rScale(d.value); })
      .startAngle(function (d){ return xb(d.label); }).endAngle(function (d){ return xb(d.label) + xb.bandwidth(); })
      .padAngle(0.01).cornerRadius(clamp(cfg.cornerRadius, 0, 40));
    var ccf = api.catColorFn(cats.length);
    var g = api.root.append('g').attr('transform', 'translate(' + cx + ',' + cy + ')');
    /* faint track rings */
    if (cfg.showGrid) rScale.ticks(4).forEach(function (t){ if (t<=0) return; g.append('circle').attr('r', rScale(t)).attr('fill','none').attr('stroke', api.ink).attr('opacity', 0.1); });
    items.forEach(function (d, i) {
      var col = api.override(d.label, legible(ccf(d.oi), api.guardBg));
      var p = api.tagMark(g.append('path').attr('d', arc(d)).attr('fill', col), d.label);
      if (cfg.strokeWidth > 0) p.attr('stroke', cfg.strokeColor).attr('stroke-width', cfg.strokeWidth).attr('stroke-linejoin','round');
      var mid = xb(d.label) + xb.bandwidth()/2 - Math.PI/2;
      var rr = rScale(d.value) + 14;
      if (cfg.showValues) {
        var lx = Math.cos(mid)*rr, ly = Math.sin(mid)*rr;
        g.append('text').attr('x', lx).attr('y', ly + 5).attr('text-anchor', Math.cos(mid) > 0.1 ? 'start' : Math.cos(mid) < -0.1 ? 'end' : 'middle')
          .attr('font-size', clamp(cfg.labelSize, 11, 22)).attr('font-weight', 600).attr('fill', api.ink).attr('opacity', 0.8)
          .text(trunc(d.label, 12) + ' ' + api.fmt(d.value));
      }
    });
  }

  /* ── radar ────────────────────────────────────────────────────────────────── */
  function drawRadar(api) {
    var d3 = api.d3, cfg = api.cfg, cats = api.cats, series = api.series;
    var b = api.box, cx = b.x + b.w/2, cy = b.y + b.h/2;
    var R = Math.min(b.w, b.h)/2 * 0.82;
    var n = cats.length; if (n < 3) { drawBars(api, false); return; }
    var maxV = cfg.yMax > 0 ? cfg.yMax : (d3.max(series, function (s){ return d3.max(s.values, function (v){ return +v||0; }); }) || 1);
    var rScale = d3.scaleLinear([0, maxV], [0, R]);
    var angle = function (i){ return (i / n) * 2*Math.PI - Math.PI/2; };
    var g = api.root.append('g').attr('transform', 'translate(' + cx + ',' + cy + ')');
    /* rings + spokes + axis labels */
    var rings = rScale.ticks(clamp(cfg.tickCount, 3, 6));
    rings.forEach(function (t) {
      if (t <= 0) return;
      var pts = d3.range(n).map(function (i){ return [Math.cos(angle(i))*rScale(t), Math.sin(angle(i))*rScale(t)]; });
      g.append('polygon').attr('points', pts.map(function (p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' '))
        .attr('fill', 'none').attr('stroke', api.ink).attr('opacity', 0.12);
      if (cfg.showAxes) g.append('text').attr('x', 4).attr('y', -rScale(t) - 2).attr('font-size', clamp(cfg.labelSize,10,18)).attr('fill', api.ink).attr('opacity', 0.45).text(api.fmt(t));
    });
    cats.forEach(function (c, i) {
      var a = angle(i), ex = Math.cos(a)*R, ey = Math.sin(a)*R;
      g.append('line').attr('x1', 0).attr('y1', 0).attr('x2', ex).attr('y2', ey).attr('stroke', api.ink).attr('opacity', 0.14);
      var lr = R + 16;
      g.append('text').attr('x', Math.cos(a)*lr).attr('y', Math.sin(a)*lr + 4)
        .attr('text-anchor', Math.cos(a) > 0.2 ? 'start' : Math.cos(a) < -0.2 ? 'end' : 'middle')
        .attr('font-size', clamp(cfg.labelSize, 11, 22)).attr('font-weight', 500).attr('fill', api.ink).attr('opacity', 0.8).text(trunc(c, 14));
    });
    var scf = api.catColorFn(series.length);
    series.forEach(function (s, si) {
      var col = legible(scf(si), api.guardBg);
      var pts = cats.map(function (c, i){ var v = +s.values[i] || 0; return [Math.cos(angle(i))*rScale(v), Math.sin(angle(i))*rScale(v)]; });
      var poly = pts.map(function (p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
      g.append('polygon').attr('points', poly).attr('fill', col).attr('fill-opacity', clamp(cfg.fillOpacity*0.5, 0.05, 0.7))
        .attr('stroke', col).attr('stroke-width', cfg.lineWidth).attr('stroke-linejoin', 'round');
      if (cfg.showPoints) pts.forEach(function (p){ g.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', clamp(cfg.pointSize/2,2,12)).attr('fill', col); });
    });
  }

  /* ── treemap / circle pack ────────────────────────────────────────────────── */
  function drawHierarchy(api, kind) {
    var d3 = api.d3, cfg = api.cfg, cats = api.cats;
    var vals = api.series[0].values.map(function (v){ return Math.abs(+v) || 0; });
    var items = sortItems(cats.map(function (c,i){ return { label: c, value: vals[i], oi: i }; }), cfg.sort === 'none' ? 'desc' : cfg.sort);
    var b = api.box;
    var rootNode = d3.hierarchy({ children: items }).sum(function (d){ return d.value || 0; }).sort(function (a,c){ return c.value - a.value; });
    var maxV = d3.max(items, function (d){ return d.value; }) || 1;
    var seq = api.seqColorFn(0, maxV);
    var ccf = api.catColorFn(cats.length);
    /* Only the true ramp palettes colour a cell by its value; the categorical
       palettes (ordered / suse / seed) colour each cell by its own hue. */
    var useSeq = ['pine','waterhole','warm','cool','diverging','mono'].indexOf(cfg.palette) >= 0;
    var g = api.root.append('g');
    var stroke = cfg.strokeWidth > 0 ? { s: cfg.strokeColor, w: cfg.strokeWidth } : { s: (cfg.transparent ? '#ffffff' : cfg.background), w: 2 };

    if (kind === 'treemap') {
      d3.treemap().size([b.w, b.h]).paddingInner(clamp(cfg.sliceGap || 3, 1, 12)).round(true)(rootNode);
      rootNode.leaves().forEach(function (leaf) {
        var col = api.override(leaf.data.label, legible(useSeq ? seq(leaf.value) : ccf(leaf.data.oi), api.guardBg));
        api.tagMark(rect(g, b.x + leaf.x0, b.y + leaf.y0, leaf.x1 - leaf.x0, leaf.y1 - leaf.y0, col, clamp(cfg.cornerRadius,0,20), stroke), leaf.data.label);
        labelCell(api, b.x + leaf.x0 + 8, b.y + leaf.y0 + 8, leaf.x1 - leaf.x0 - 12, leaf.y1 - leaf.y0 - 8, leaf.data.label, leaf.value, autoText(col));
      });
    } else {
      d3.pack().size([b.w, b.h]).padding(clamp(cfg.sliceGap || 3, 1, 14))(rootNode);
      rootNode.leaves().forEach(function (leaf) {
        var col = api.override(leaf.data.label, legible(useSeq ? seq(leaf.value) : ccf(leaf.data.oi), api.guardBg));
        var c = g.append('circle').attr('cx', b.x + leaf.x).attr('cy', b.y + leaf.y).attr('r', leaf.r).attr('fill', col);
        api.tagMark(c, leaf.data.label);
        if (stroke) c.attr('stroke', stroke.s).attr('stroke-width', stroke.w);
        if (leaf.r > 22) {
          g.append('text').attr('x', b.x + leaf.x).attr('y', b.y + leaf.y + 2).attr('text-anchor', 'middle')
            .attr('font-size', clamp(Math.min(leaf.r*0.5, cfg.labelSize), 9, 28)).attr('font-weight', 600).attr('fill', autoText(col))
            .text(trunc(leaf.data.label, Math.max(3, Math.floor(leaf.r/6))));
          if (cfg.showValues && leaf.r > 34) g.append('text').attr('x', b.x + leaf.x).attr('y', b.y + leaf.y + clamp(leaf.r*0.32,12,22)).attr('text-anchor','middle')
            .attr('font-size', clamp(leaf.r*0.32, 9, 20)).attr('fill', autoText(col)).attr('opacity', 0.85).text(api.fmt(leaf.value));
        }
      });
    }
  }
  function labelCell(api, x, y, w, h, label, value, fill) {
    var cfg = api.cfg;
    if (w < 34 || h < 22) return;
    var sz = clamp(Math.min(cfg.labelSize, w/5, h/2.4), 9, 30);
    api.root.append('text').attr('x', x).attr('y', y + sz).attr('font-size', sz).attr('font-weight', 600).attr('fill', fill)
      .text(trunc(label, Math.max(3, Math.floor(w / (sz*0.55)))));
    if (cfg.showValues && h > sz*2 + 8) api.root.append('text').attr('x', x).attr('y', y + sz*2 + 4).attr('font-size', sz*0.85).attr('fill', fill).attr('opacity', 0.85).text(api.fmt(value));
  }

  /* ── heatmap ──────────────────────────────────────────────────────────────── */
  function drawHeatmap(api) {
    var d3 = api.d3, cfg = api.cfg, cats = api.cats, series = api.series;
    var plot = insetForAxes(api, true);
    /* Reserve a strip above the grid for the column headers. */
    if (cfg.showAxes) { var head = clamp(cfg.labelSize, 10, 20) + 14; plot = { x: plot.x, y: plot.y + head, w: plot.w, h: Math.max(20, plot.h - head) }; }
    var colNames = series.map(function (s){ return s.name; });
    var x = d3.scaleBand().domain(colNames).range([plot.x, plot.x + plot.w]).padding(0.04);
    var y = d3.scaleBand().domain(cats).range([plot.y, plot.y + plot.h]).padding(0.04);
    var all = [];
    series.forEach(function (s){ s.values.forEach(function (v){ if (isFinite(v)) all.push(+v); }); });
    var lo = d3.min(all), hi = d3.max(all);
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    var seq = api.seqColorFn(lo, hi);
    var g = api.root.append('g');
    var sz = clamp(cfg.labelSize, 10, 20);
    /* column headers */
    if (cfg.showAxes) colNames.forEach(function (c){ g.append('text').attr('x', x(c) + x.bandwidth()/2).attr('y', plot.y - 8).attr('text-anchor','middle').attr('font-size', sz).attr('font-weight',500).attr('fill', api.ink).attr('opacity',0.8).text(trunc(c, Math.max(4, Math.floor(x.bandwidth()/(sz*0.5))))); });
    if (cfg.showAxes) cats.forEach(function (c){ g.append('text').attr('x', plot.x - 8).attr('y', y(c) + y.bandwidth()/2 + sz*0.34).attr('text-anchor','end').attr('font-size', sz).attr('font-weight',500).attr('fill', api.ink).attr('opacity',0.8).text(trunc(c, 18)); });
    cats.forEach(function (c, ri) {
      series.forEach(function (s) {
        var v = s.values[ri];
        var col = isFinite(v) ? legible(seq(+v), api.guardBg) : (cfg.transparent ? '#ffffff' : cfg.background);
        var r = rect(g, x(s.name), y(c), x.bandwidth(), y.bandwidth(), isFinite(v) ? col : 'none', clamp(cfg.cornerRadius,0,14), cfg.strokeWidth>0?{s:cfg.strokeColor,w:cfg.strokeWidth}:null);
        if (!isFinite(v)) r.attr('opacity', 0.25);
        if (cfg.showValues && isFinite(v) && x.bandwidth() > 30 && y.bandwidth() > 20)
          g.append('text').attr('x', x(s.name) + x.bandwidth()/2).attr('y', y(c) + y.bandwidth()/2 + 5).attr('text-anchor','middle')
            .attr('font-size', clamp(Math.min(sz, y.bandwidth()/2.2), 8, 20)).attr('font-weight', 600).attr('fill', autoText(col)).text(api.fmt(+v));
      });
    });
  }

  /* ── histogram ────────────────────────────────────────────────────────────── */
  function drawHistogram(api) {
    var d3 = api.d3, cfg = api.cfg;
    var col0 = api.numericCols[0];
    var vals = col0.values.filter(isFinite);
    var plot = insetForAxes(api, false);
    var dom = d3.extent(vals); if (!isFinite(dom[0])) dom = [0, 1];
    if (dom[0] === dom[1]) { dom = [dom[0] - 0.5, dom[1] + 0.5]; }
    var x = d3.scaleLinear(dom, [plot.x, plot.x + plot.w]).nice();
    var thresholds = cfg.binCount > 0 ? cfg.binCount : d3.thresholdSturges(vals);
    var bins = d3.bin().domain(x.domain()).thresholds(thresholds)(vals);
    var maxC = d3.max(bins, function (b){ return b.length; }) || 1;
    var y = makeYScale(cfg.yScaleType === 'log' ? 'linear' : cfg.yScaleType, [0, cfg.yMax > 0 ? cfg.yMax : maxC], [plot.y + plot.h, plot.y], d3);
    drawValueAxis(api, plot, y, 'y');
    /* x ticks */
    if (cfg.showAxes) x.ticks(cfg.tickCount).forEach(function (t){ api.root.append('text').attr('x', x(t)).attr('y', plot.y + plot.h + clamp(cfg.labelSize,11,22) + 6).attr('text-anchor','middle').attr('font-size', clamp(cfg.labelSize,11,22)).attr('fill', api.ink).attr('opacity',0.6).text(api.fmt(t)); });
    var col = legible(api.catColorFn(1)(0), api.guardBg);
    var g = api.root.append('g');
    var pad = clamp(cfg.barPadding, 0, 0.6);
    bins.forEach(function (bn) {
      var bx = x(bn.x0), bw = Math.max(1, x(bn.x1) - x(bn.x0));
      var gap = bw * pad;
      var h = (plot.y + plot.h) - y(bn.length);
      if (h <= 0) return;
      rect(g, bx + gap/2, y(bn.length), Math.max(1, bw - gap), h, col, clamp(cfg.cornerRadius, 0, 14), cfg.strokeWidth>0?{s:cfg.strokeColor,w:cfg.strokeWidth}:null);
      if (cfg.showValues && bw > 20) valueLabel(api, bx + bw/2, y(bn.length) - 6 - cfg.valueOffset, String(bn.length), 'middle', api.ink, 0.75);
    });
    drawAxisTitles(api, plot, false);
    if (!cfg.xTitle) api.root.append('text').attr('x', plot.x + plot.w/2).attr('y', plot.y + plot.h + clamp(cfg.labelSize,12,22)*2 + 14).attr('text-anchor','middle').attr('font-size', clamp(cfg.labelSize,12,22)).attr('font-weight',600).attr('fill',api.ink).attr('opacity',0.6).text(col0.name);
  }

  /* ══ EXPANDED CHART TYPES ═══════════════════════════════════════════════════
     Every renderer below reuses the shared helpers (insetForAxes, makeYScale,
     drawValueAxis/CategoryAxis, rect, valueLabel, catColorFn, legible, arc) and
     emits only vector-safe SVG (rect/circle/line/path/polygon/text, no rotation). */

  function niceCeil(v) {
    if (!(v > 0)) return 10;

  /* ── streamgraph (wiggle offset, basis curve) ───────────────────────────── */

  /* ── waterfall (single series, running total) ───────────────────────────── */

  /* ── polar area / nightingale rose (equal angle, radius ∝ value) ────────── */
