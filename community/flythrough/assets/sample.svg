<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- A layered app-screenshot mock. Each top-level <g> is one lift layer (plans/104 section 7):
       background, window chrome, the three cards, and the call-to-action. The Flythrough
       tool stands them off each other in real z and flies a camera through the stack. -->
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#0e1726"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#glow)"/>
  </g>
  <g id="window">
    <rect x="140" y="96" width="1000" height="528" rx="18" fill="#152238"/>
    <rect x="140" y="96" width="1000" height="56" rx="18" fill="#1d2f4d"/>
    <circle cx="176" cy="124" r="8" fill="#ef6a5e"/>
    <circle cx="204" cy="124" r="8" fill="#f5bd4f"/>
    <circle cx="232" cy="124" r="8" fill="#61c063"/>
    <rect x="300" y="114" width="360" height="20" rx="10" fill="#0e1726"/>
  </g>
  <g id="title">
    <rect x="184" y="196" width="420" height="30" rx="8" fill="#e7eefb"/>
    <rect x="184" y="240" width="620" height="16" rx="8" fill="#5c6f8f"/>
  </g>
  <g id="cards">
    <rect x="184" y="300" width="290" height="270" rx="16" fill="#1f3252"/>
    <rect x="216" y="332" width="120" height="120" rx="12" fill="#30ba78"/>
    <rect x="216" y="472" width="226" height="16" rx="8" fill="#9fb4d6"/>
    <rect x="216" y="504" width="180" height="12" rx="6" fill="#5c6f8f"/>

    <rect x="496" y="300" width="290" height="270" rx="16" fill="#1f3252"/>
    <rect x="528" y="332" width="120" height="120" rx="12" fill="#4f9cf5"/>
    <rect x="528" y="472" width="226" height="16" rx="8" fill="#9fb4d6"/>
    <rect x="528" y="504" width="180" height="12" rx="6" fill="#5c6f8f"/>

    <rect x="808" y="300" width="290" height="270" rx="16" fill="#1f3252"/>
    <rect x="840" y="332" width="120" height="120" rx="12" fill="#c07ef5"/>
    <rect x="840" y="472" width="226" height="16" rx="8" fill="#9fb4d6"/>
    <rect x="840" y="504" width="180" height="12" rx="6" fill="#5c6f8f"/>
  </g>
  <g id="cta">
    <rect x="908" y="196" width="190" height="52" rx="26" fill="#30ba78"/>
    <rect x="948" y="214" width="110" height="16" rx="8" fill="#0c322c"/>
  </g>
  <defs>
    <radialGradient id="glow" cx="30%" cy="18%" r="90%">
      <stop offset="0" stop-color="#24406e" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0e1726" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
