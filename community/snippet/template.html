<!-- Code Canvas — design help from Jeroen van Erp <jeroen.vanerp@suse.com>. -->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.cc-root {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 56px;
  /* The ACTIVE brand's monospace first (the shell sets --font-mono from the brand's
     `font.mono` token); the literal stack is only the no-brand fallback. lolly-start
     and SUSE both resolve the var to SUSE Mono, which is why the old hardwired form
     looked right on every default profile and wrong on any brand with its own mono. */
  font-family: var(--font-mono, 'SUSE Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace);
}

/* ── Window card ── */
.cc-window {
  width: 100%; max-width: 1088px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.12), 0 8px 24px rgba(0,0,0,0.25);
}

/* ── Header ── */
/* The window controls are built per "window manager" by the script below
   (cupertino = macOS dots, redmond = Windows caption buttons, nuremberg =
   GNOME Adwaita close button). All chrome colours are derived from the active
   theme's foreground via translucent overlays, so no style clashes the theme. */
.cc-header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 20px;
}
.cc-controls { display: flex; align-items: center; flex-shrink: 0; }
.cc-dot { border-radius: 50%; flex-shrink: 0; }
.cc-cap { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cc-filename { font-size: 14px; font-weight: 700; margin: 0 auto; display: flex; align-items: center; gap: 0.5em; min-width: 0; }
/* Title-bar icon: sized in `em` so it tracks the filename font-size the script scales. */
.cc-icon { height: 1.15em; width: auto; flex-shrink: 0; display: block; border-radius: 3px; object-fit: contain; }
.cc-filename-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Code body ── */
.cc-body {
  display: flex;
  overflow: hidden;
}
.cc-gutter {
  flex-shrink: 0;
  padding: 20px 16px 20px 20px;
  text-align: right; white-space: pre;
  user-select: none;
  font-size: 13px; line-height: 1.7;
  opacity: 0.3;
  border-right: 1px solid rgba(255,255,255,0.08);
}
.cc-code {
  flex: 1; min-width: 0;
  padding: 20px 24px;
  /* Restate the stack ON the <pre>: the UA `pre{font-family:monospace}` rule matches
     the element directly and beats the stack inherited from .cc-root, so without this
     the code renders in a generic monospace AND the SVG export can't outline it to
     <path> (the vector path resolves the COMPUTED family through the font registry,
     which needs a real face name, not `monospace`). Brand var first, same as .cc-root. */
  font-family: var(--font-mono, 'SUSE Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace);
  font-size: 13px; line-height: 1.7;
  white-space: pre;
  overflow: hidden;
  /* Fallback only: the script expands tabs to spaces before render (see TAB_SIZE),
     so no tab normally reaches here. Keep this value == TAB_SIZE for any that slips
     through. `tab-size` is NOT honoured inside the raster export's <foreignObject> on
     some browsers, which is why indentation is expanded to spaces, not left to it. */
  tab-size: 2;
}

/* ── Blinking caret (opt-in; off by default) ───────────────────────────
   A terminal-style block caret after the code - a subtle "alive" cue in the
   live editor. Injected via ::after so the syntax highlighter's innerHTML can't
   clobber it; currentColor tracks the theme. Off by default (data-blink="off"),
   so a saved PNG/SVG is a clean still unless the author turns "Blink cursor" on. */
.cc-root[data-blink="on"] .cc-code::after {
  content: "";
  display: inline-block;
  width: 0.5em; height: 1.05em;
  margin-left: 0.08em;
  vertical-align: text-bottom;
  background: currentColor;
  animation: cc-blink 1.06s step-end infinite;
}
@keyframes cc-blink { 0% { opacity: 0.9; } 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .cc-root[data-blink="on"] .cc-code::after { animation: none; opacity: 0.9; }
}

/* ── Token colors (set by JS via CSS vars) ── */
.tok-keyword  { color: var(--tok-keyword); }
.tok-string   { color: var(--tok-string); }
.tok-comment  { color: var(--tok-comment); font-style: italic; }
.tok-number   { color: var(--tok-number); }
.tok-function { color: var(--tok-function); }
.tok-type     { color: var(--tok-type); }
.tok-operator { color: var(--tok-operator); }

/* ── Comment callouts (opt-in via calloutMode) ──────────────────────────────
   A trailing end-of-line comment rendered as a pill pointing back at its line
   instead of dim inline text. In-flow inline-block so it sits on the same line
   as the code (arrow points left, at the code). max-height is clamped by JS to
   one code line-height (--cc-ca-max) so a 2-line pill never grows the row and
   the separate line-number gutter stays aligned; overflow clips a 3rd line.
   inline-block box + block text child + inline <svg> arrow all survive the
   SVG/PDF vector walker (each is an own-box the walker visits). */
.cc-callout {
  position: relative;
  display: inline-block; vertical-align: middle;
  margin-left: 0.9em;
  padding: 0.12em 0.6em 0.12em 1.5em;
  border-radius: 999px;
  border: 1px solid var(--cc-ca-bd, currentColor);
  background: var(--cc-ca-bg, transparent);
  color: var(--cc-ca-fg, currentColor);
  font-family: var(--cc-ca-font, inherit);
  font-size: 0.66em; font-weight: 600; line-height: 1.12;
  white-space: normal; text-align: left;
  max-width: 22em;
  max-height: var(--cc-ca-max, 2.4em); overflow: hidden;
}
/* Arrow keeps the mono glyph regardless of the text font, so it always reads as an arrow. */
.cc-callout-arrow { position: absolute; left: 0.55em; top: calc(50% - 0.5em); line-height: 1; font-size: 1.05em; font-weight: 700; font-style: normal; font-family: var(--font-mono, 'SUSE Mono', monospace); color: var(--cc-ca-arrow, currentColor); }
.cc-callout-text  { display: inline; font-style: var(--cc-ca-style, normal); }
.cc-callout-text strong { font-weight: 800; }
.cc-callout-text em     { font-style: italic; }
</style>

<div class="cc-root" id="cc-root" data-code="{{code}}" data-language="{{language}}" data-theme="{{theme}}" data-window-style="{{windowStyle}}" data-line-numbers="{{lineNumbers}}" data-show-window="{{showWindow}}" data-shadow="{{#if shadow}}on{{else}}off{{/if}}" data-scale="{{scale}}" data-title-scale="{{titleScale}}" data-icon-scale="{{iconScale}}" data-line-height="{{lineHeight}}" data-callout-mode="{{calloutMode}}" data-callout-prefix="{{calloutPrefix}}" data-callout-font="{{calloutFont}}" data-transparent-bg="{{transparentBg}}" data-blink="{{#if blinkCursor}}on{{else}}off{{/if}}">
  <div class="cc-window" id="cc-window">
    <div class="cc-header" id="cc-header">
      <div class="cc-controls cc-controls-left" id="cc-controls-left"></div>
      <div class="cc-filename" id="cc-filename">{{#if titleIcon}}<img class="cc-icon" src="{{asset titleIcon}}" alt="">{{/if}}{{#if filename}}<span class="cc-filename-text">{{filename}}</span>{{/if}}</div>
      <div class="cc-controls cc-controls-right" id="cc-controls-right"></div>
    </div>
    <div class="cc-body" id="cc-body">
      <div class="cc-gutter" id="cc-gutter"></div>
      <pre class="cc-code" id="cc-code"></pre>
    </div>
  </div>
</div>

<script>
(function () {
  var DEFAULT_CODE = "const greet = (name) => {\\n  console.log(`Hello, ${name}!`);\\n  return name;\\n};\\n\\ngreet('World');";

  // Indentation tab stop. Kept in lockstep with `tab-size` in the stylesheet above:
  // both must be the same number so an expanded snippet reads identically to a raw one.
  var TAB_SIZE = 2;

  // Expand tabs to spaces against fixed tab stops BEFORE anything renders. A raw TAB is
  // the one whitespace character whose rendered width depends on `tab-size` being
  // honoured, and that does NOT survive every export path. The raster (PNG/JPEG) export
  // serialises the canvas into an SVG <foreignObject>, and some browser versions drop
  // `tab-size` there: leading tabs collapse to zero width while internal spaces are
  // kept, so indentation vanishes from the saved image even though the on-screen preview
  // is perfect (the exact bug a gofmt'd, tab-indented snippet hit). Expanding here makes
  // indentation pure spaces, which render the same on screen and in every export, on
  // every browser. Column-aware, so a tab used for alignment lands on the same stop it
  // would on screen.
  function expandTabs(src, size) {
    var out = '', col = 0;
    for (var i = 0; i < src.length; i++) {
      var c = src[i];
      if (c === '\t') {
        var n = size - (col % size);
        for (var s = 0; s < n; s++) out += ' ';
        col += n;
      } else if (c === '\n') {
        out += c; col = 0;
      } else {
        out += c; col++;
      }
    }
    return out;
  }

  var root = document.getElementById('cc-root');
  var code = expandTabs(root.dataset.code || DEFAULT_CODE, TAB_SIZE);
  var language = root.dataset.language || 'javascript';
  var theme = root.dataset.theme || 'suse-dark';
  var lineNums = root.dataset.lineNumbers !== 'false';
  var showWindow = root.dataset.showWindow !== 'false';
  var shadow = root.dataset.shadow !== 'off';
  var scale = parseFloat(root.dataset.scale || '100') / 100;
  var titleScale = parseFloat(root.dataset.titleScale || '100') / 100;
  var iconScale = parseFloat(root.dataset.iconScale || '100') / 100;
  var lineHeight = parseFloat(root.dataset.lineHeight || '1.7');
  if (isNaN(lineHeight)) lineHeight = 1.7;
  var calloutMode = root.dataset.calloutMode || 'off';
  var calloutPrefixes = (root.dataset.calloutPrefix || '').split(',')
    .map(function (s) { return s.trim().toLowerCase(); })
    .filter(function (s) { return s.length > 0; });
  var calloutFont = root.dataset.calloutFont || 'mono';
  var transparentBg = root.dataset.transparentBg === 'true';
  var windowStyle = root.dataset.windowStyle || 'nuremberg';

  // ── Theme definitions ────────────────────────────────────────────────────
  var THEMES = {
    'suse-dark': {
      outerBg:   'linear-gradient(135deg, #1a5c3a 0%, #0c322c 100%)',
      windowBg:  '#0c322c',
      headerBg:  '#092b23',
      codeBg:    '#0c322c',
      fg:        '#d4ede1',
      gutter:    '#d4ede1',
      keyword:   '#30ba78',
      string:    '#7dd3a8',
      comment:   '#3d7a58',
      number:    '#fe7c3f',
      fn:        '#5ecf94',
      type:      '#8be9fd',
      operator:  '#30ba78'
    },
    'suse-light': {
      outerBg:   'linear-gradient(135deg, #30ba78 0%, #e8f5ee 100%)',
      windowBg:  '#ffffff',
      headerBg:  '#f0f7f3',
      codeBg:    '#ffffff',
      fg:        '#0c322c',
      gutter:    '#0c322c',
      keyword:   '#0c8c5c',
      string:    '#1a6e40',
      comment:   '#7aaa90',
      number:    '#d45c00',
      fn:        '#0c322c',
      type:      '#006b8c',
      operator:  '#0c8c5c'
    },
    'github-dark': {
      outerBg:   'linear-gradient(135deg, #1c2128 0%, #0d1117 100%)',
      windowBg:  '#0d1117',
      headerBg:  '#161b22',
      codeBg:    '#0d1117',
      fg:        '#c9d1d9',
      gutter:    '#c9d1d9',
      keyword:   '#ff7b72',
      string:    '#a5d6ff',
      comment:   '#8b949e',
      number:    '#79c0ff',
      fn:        '#d2a8ff',
      type:      '#ffa657',
      operator:  '#ff7b72'
    },
    'nord': {
      outerBg:   'linear-gradient(135deg, #5e81ac 0%, #2e3440 100%)',
      windowBg:  '#2e3440',
      headerBg:  '#252932',
      codeBg:    '#2e3440',
      fg:        '#d8dee9',
      gutter:    '#d8dee9',
      keyword:   '#81a1c1',
      string:    '#a3be8c',
      comment:   '#4c566a',
      number:    '#b48ead',
      fn:        '#88c0d0',
      type:      '#8fbcbb',
      operator:  '#81a1c1'
    }
  };

  // ── Brand-derived "Brand Dark / Brand Light" ─────────────────────────────
  // The suse-dark/suse-light entries above are only the FALLBACK seeds (the
  // CLI and an unbranded canvas inject no --brand-* vars). On a branded
  // canvas the two "Brand" themes re-derive every green-family member from
  // the resolved --brand-primary hue, so their labels stay true under any
  // design system. `number` and `type` keep their fixed contrast hues -
  // syntax needs more distinguishable hues than one brand slot provides
  // (sandbox's auto theme takes the same line). Values stay hex so the
  // rgba() helper below keeps working.
  function hexHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    var h = 0;
    if (d > 0) {
      if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
      else if (mx === g) h = ((b - r) / d + 2) * 60;
      else h = ((r - g) / d + 4) * 60;
    }
    var l = (mx + mn) / 2;
    var s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    return [h, s * 100, l * 100];
  }
  function hslHex(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
    var rgb = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var v = Math.round((rgb[i] + m) * 255).toString(16);
      out += v.length < 2 ? '0' + v : v;
    }
    return out;
  }
  // Any CSS colour the canvas hands over -> #rrggbb. The brand layer passes ramp
  // values through as raw oklch() strings (brand-vars.ts: the browser resolves them
  // in var()), so a hex-only test here quietly threw the whole brand away and the
  // SUSE seeds above painted a magenta brand green (Andy, 2026-09-03). A 1x1 canvas
  // fill is the one parser every engine shares for oklch/lch/lab/hsl/rgb/named
  // colours; a sentinel fill first tells a refused value from a real black. Under
  // jsdom (the CLI) there is no 2D context, so this returns null and the seeds stand.
  function cssHex(v) {
    v = (v || '').trim();
    if (!v) return null;
    if (/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase();
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 1;
      var ctx = c.getContext('2d');
      if (!ctx) return null;
      ctx.fillStyle = '#010203';
      ctx.fillStyle = v;
      if (ctx.fillStyle === '#010203') return null;   // not a colour the engine can read
      ctx.fillRect(0, 0, 1, 1);
      var d = ctx.getImageData(0, 0, 1, 1).data;
      var out = '#';
      for (var i = 0; i < 3; i++) { var s = d[i].toString(16); out += s.length < 2 ? '0' + s : s; }
      return out;
    } catch (e) { return null; }
  }
  function brandVar(name) {
    try { return cssHex(getComputedStyle(root).getPropertyValue(name)); } catch (e) { return null; }
  }
  (function brandise() {
    var v = brandVar('--brand-primary');
    if (!v) return;
    // Only the HUE is taken from the brand; every role sits at a FIXED
    // lightness band so contrast holds by construction. The raw value is
    // never used as a text colour - a brand whose primary is near-black
    // (SUSE's Pine) or near-white would otherwise vanish into the derived
    // background of the same hue.
    var p = hexHsl(v), h = p[0], s = Math.min(p[1], 72);
    var d = THEMES['suse-dark'], l = THEMES['suse-light'];
    d.outerBg = 'linear-gradient(135deg, ' + hslHex(h, s, 26) + ' 0%, ' + hslHex(h, s, 12) + ' 100%)';
    d.windowBg = d.codeBg = hslHex(h, s, 12);
    d.headerBg = hslHex(h, s, 9);
    d.fg = d.gutter = hslHex(h, 25, 88);
    d.keyword = d.operator = hslHex(h, 58, 58);
    d.string = hslHex(h, 45, 74);
    d.comment = hslHex(h, 20, 44);
    d.fn = hslHex(h, 50, 66);
    l.outerBg = 'linear-gradient(135deg, ' + hslHex(h, 52, 46) + ' 0%, ' + hslHex(h, 35, 94) + ' 100%)';
    l.headerBg = hslHex(h, 30, 96);
    l.fg = l.gutter = hslHex(h, 45, 14);
    l.keyword = l.operator = hslHex(h, 62, 30);
    l.string = hslHex(h, 55, 25);
    l.comment = hslHex(h, 18, 58);
    l.fn = hslHex(h, 45, 20);
    // The brand's own surface and ink, where the canvas exposes them and they fit the
    // theme: a light surface is Brand Light's paper and a dark one is Brand Dark's
    // window, an ink darker than mid is Brand Light's text and a lighter one Brand
    // Dark's. An ink-and-paper brand (no hue at all) reads as its real greys this way
    // instead of a derived tint; a mismatched pair (say a dark surface while the app
    // is in light mode) is simply left to the hue derivation above.
    var surface = brandVar('--brand-surface'), ink = brandVar('--brand-text');
    if (surface) {
      var sl = hexHsl(surface)[2];
      if (sl >= 60) { l.windowBg = l.codeBg = surface; l.headerBg = hslHex(hexHsl(surface)[0], Math.min(hexHsl(surface)[1], 30), Math.max(0, sl - 4)); }
      else if (sl <= 40) { d.windowBg = d.codeBg = surface; d.headerBg = hslHex(hexHsl(surface)[0], Math.min(hexHsl(surface)[1], 30), Math.max(0, sl - 3)); }
    }
    if (ink) {
      var il = hexHsl(ink)[2];
      if (il <= 40) l.fg = l.gutter = ink;
      else if (il >= 60) d.fg = d.gutter = ink;
    }
  })();

  var t = THEMES[theme] || THEMES['suse-dark'];

  // ── Apply theme ──────────────────────────────────────────────────────────
  var window_ = document.getElementById('cc-window');
  var header = document.getElementById('cc-header');
  var codeEl = document.getElementById('cc-code');
  var gutter = document.getElementById('cc-gutter');
  var filenameEl = document.getElementById('cc-filename');
  var leftCtl = document.getElementById('cc-controls-left');
  var rightCtl = document.getElementById('cc-controls-right');

  root.style.background = transparentBg ? 'transparent' : t.outerBg;
  if (!shadow) window_.style.boxShadow = 'none';
  window_.style.background = t.codeBg;
  header.style.background  = t.headerBg;
  codeEl.style.background  = t.codeBg;
  codeEl.style.color       = t.fg;
  gutter.style.background  = t.headerBg;
  gutter.style.color       = t.gutter;

  // CSS vars on root (token colours + ui scale)
  var cssVars = '--tok-keyword:' + t.keyword + ';--tok-string:' + t.string +
    ';--tok-comment:' + t.comment + ';--tok-number:' + t.number +
    ';--tok-function:' + t.fn + ';--tok-type:' + t.type +
    ';--tok-operator:' + t.operator +
    ';--cc-ca-fg:' + t.fg + ';--cc-ca-bg:' + rgba(t.fg, 0.07) +
    ';--cc-ca-bd:' + rgba(t.number, 0.55) + ';--cc-ca-arrow:' + t.number +
    ';--cc-ca-font:' + (calloutFont.indexOf('brand') === 0
      ? "var(--font-brand, 'SUSE', ui-sans-serif, sans-serif)"
      : "var(--font-mono, 'SUSE Mono', 'Roboto Mono', ui-monospace, monospace)") +
    ';--cc-ca-style:' + (/italic/.test(calloutFont) ? 'italic' : 'normal');
  root.setAttribute('style', root.getAttribute('style') + ';' + cssVars);

  // ── Window chrome ────────────────────────────────────────────────────────
  if (!showWindow) {
    document.getElementById('cc-header').style.display = 'none';
    gutter.style.borderTop = 'none';
  }

  // ── Syntax tokenizer ─────────────────────────────────────────────────────
  var KW = {
    javascript: 'const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|delete|typeof|instanceof|in|of|class|extends|import|export|default|from|async|await|try|catch|finally|throw|this|super|true|false|null|undefined|void|yield|static',
    typescript: 'const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|delete|typeof|instanceof|in|of|class|extends|import|export|default|from|async|await|try|catch|finally|throw|this|super|true|false|null|undefined|void|yield|static|type|interface|enum|implements|abstract|readonly|private|public|protected|namespace|declare|as|keyof|infer|never|unknown|any|string|number|boolean|object',
    python:     'def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|try|except|finally|raise|with|lambda|yield|global|nonlocal|pass|break|continue|True|False|None|del|assert|is|self|print',
    rust:       'fn|let|mut|const|struct|enum|impl|trait|use|mod|pub|return|if|else|match|for|while|loop|break|continue|in|where|type|async|await|move|ref|self|Self|super|crate|true|false',
    go:         'func|var|const|type|struct|interface|return|if|else|for|range|switch|case|break|continue|default|import|package|go|chan|select|defer|fallthrough|map|make|new|nil|true|false|iota',
    css:        'important|media|keyframes|charset|import|supports|root|hover|focus|active|before|after|not|nth-child|first-child|last-child',
    bash:       'if|then|else|elif|fi|for|do|done|while|case|esac|in|function|return|exit|echo|export|local|source|readonly|set|unset|true|false',
    dockerfile: 'FROM|AS|RUN|CMD|LABEL|MAINTAINER|EXPOSE|ENV|ADD|COPY|ENTRYPOINT|VOLUME|USER|WORKDIR|ARG|ONBUILD|STOPSIGNAL|HEALTHCHECK|SHELL',
    json:       '',
    html:       '',
    plain:      ''
  };

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Comment callouts ──────────────────────────────────────────────────────
  // A "trailing" comment (code before it on the line) can be lifted out of the
  // dim comment flow into a pill callout. The tokenizer emits the whole pill
  // (arrow <svg> + esc()'d text) inline in the highlighted markup, so it is
  // complete after innerHTML with no post-render DOM step.
  var TAG_RE = /^(TODO|FIXME|FIX|NOTE|HACK|XXX|BUG|WIP|WARNING|WARN|OPTIMIZE|REVIEW|DEPRECATED)\b/i;
  function commentText(raw, marker) { return raw.slice(marker).replace(/^\s+/, ''); }
  function calloutMatch(text) {
    if (calloutMode === 'all')  return true;
    if (calloutMode === 'tags') return TAG_RE.test(text);
    if (calloutMode === 'custom') {
      var lc = text.toLowerCase();
      for (var p = 0; p < calloutPrefixes.length; p++) {
        if (lc.indexOf(calloutPrefixes[p]) === 0) return true;
      }
    }
    return false;
  }
  function lineHasCodeBefore(src, i) {          // trailing comment vs full-line
    for (var k = i - 1; k >= 0 && src[k] !== '\n'; k--) {
      if (src[k] !== ' ' && src[k] !== '\t') return true;
    }
    return false;
  }
  // The arrow is the real U+2190 glyph from the brand mono font (SUSE Mono),
  // inherited from .cc-root, so it matches the code's own arrows; the comment text
  // is esc()'d straight in, so the callout is complete after innerHTML.
  // Tiny inline markdown for callout text, run AFTER esc() so the input can never
  // inject markup: bold before italic; the `_` forms need a boundary so snake_case
  // is left alone (`my_var` stays literal, `_note_` becomes emphasis).
  function mdInline(s) {
    return s
      .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\w*])__([^_]+?)__(?![\w])/g, '$1<strong>$2</strong>')
      .replace(/\*([^*]+?)\*/g, '<em>$1</em>')
      .replace(/(^|[^\w*])_([^_]+?)_(?![\w])/g, '$1<em>$2</em>');
  }
  function calloutSpan(text) {
    return '<span class="cc-callout"><span class="cc-callout-arrow">←</span>' +
      '<span class="cc-callout-text">' + mdInline(esc(text)) + '</span></span>';
  }
  function maybeCallout(src, i, j, marker) {    // returns placeholder or null
    if (calloutMode === 'off' || !lineHasCodeBefore(src, i)) return null;
    var text = commentText(src.slice(i, j), marker);
    return calloutMatch(text) ? calloutSpan(text) : null;
  }

  function tokenize(src, lang) {
    var kwSet = {};
    var kwStr = KW[lang] || KW.javascript;
    if (kwStr) kwStr.split('|').forEach(function(k) { kwSet[k] = true; });

    var out = '';
    var i = 0;
    var n = src.length;

    function peek(offset) { return src[i + (offset || 0)] || ''; }
    function span(cls, val) { return '<span class="tok-' + cls + '">' + esc(val) + '</span>'; }

    while (i < n) {
      var c = src[i];

      // HTML tags (lang === html)
      if (lang === 'html' && c === '<') {
        var j = i + 1;
        while (j < n && src[j] !== '>') j++;
        j = Math.min(j + 1, n);
        out += span('keyword', src.slice(i, j));
        i = j; continue;
      }

      // HTML entities
      if (lang === 'html' && c === '&') {
        var j = i + 1;
        while (j < n && src[j] !== ';' && j - i < 12) j++;
        if (src[j] === ';') j++;
        out += span('string', src.slice(i, j));
        i = j; continue;
      }

      // Single-line comment: // (but not the // in a URL like https://…)
      if (c === '/' && peek(1) === '/' && peek(-1) !== ':' && lang !== 'css') {
        var j = i;
        while (j < n && src[j] !== '\n') j++;
        out += maybeCallout(src, i, j, 2) || span('comment', src.slice(i, j));
        i = j; continue;
      }

      // # comment (python, bash, dockerfile)
      if (c === '#' && (lang === 'python' || lang === 'bash' || lang === 'dockerfile')) {
        var j = i;
        while (j < n && src[j] !== '\n') j++;
        out += maybeCallout(src, i, j, 1) || span('comment', src.slice(i, j));
        i = j; continue;
      }

      // /* */ comment
      if (c === '/' && peek(1) === '*') {
        var j = i + 2;
        while (j < n && !(src[j] === '*' && src[j+1] === '/')) j++;
        j = Math.min(j + 2, n);
        out += span('comment', src.slice(i, j));
        i = j; continue;
      }

      // CSS /* */ already handled above; CSS // not standard

      // Template literal
      if (c === '`' && (lang === 'javascript' || lang === 'typescript')) {
        var j = i + 1;
        while (j < n && src[j] !== '`') {
          if (src[j] === '\\') j++;
          j++;
        }
        j = Math.min(j + 1, n);
        out += span('string', src.slice(i, j));
        i = j; continue;
      }

      // String " or '
      if (c === '"' || c === "'") {
        var q = c;
        var j = i + 1;
        while (j < n && src[j] !== q && src[j] !== '\n') {
          if (src[j] === '\\') j++;
          j++;
        }
        j = Math.min(j + 1, n);
        out += span('string', src.slice(i, j));
        i = j; continue;
      }

      // Number
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(peek(1)))) {
        var j = i;
        while (j < n && /[0-9a-fA-FxX._]/.test(src[j])) j++;
        out += span('number', src.slice(i, j));
        i = j; continue;
      }

      // Identifier / keyword / function / type
      if (/[a-zA-Z_$]/.test(c)) {
        var j = i;
        while (j < n && /[a-zA-Z0-9_$]/.test(src[j])) j++;
        var word = src.slice(i, j);
        // look ahead past spaces for '('
        var k = j;
        while (k < n && src[k] === ' ') k++;
        var isFn = src[k] === '(';

        if (kwSet[word]) {
          out += span('keyword', word);
        } else if (isFn) {
          out += span('function', word);
        } else if (/^[A-Z]/.test(word)) {
          out += span('type', word);
        } else {
          out += esc(word);
        }
        i = j; continue;
      }

      // Operators
      if (/[+\-*/%=!<>&|^~?:@]/.test(c)) {
        out += span('operator', c);
        i++; continue;
      }

      // Everything else (punctuation, whitespace)
      out += esc(c);
      i++;
    }

    return out;
  }

  // ── Render ───────────────────────────────────────────────────────────────
  var highlighted = language === 'plain' ? esc(code) : tokenize(code, language);
  codeEl.innerHTML = highlighted;

  var lineCount = code.split('\n').length;
  if (lineNums) {
    var nums = '';
    for (var ln = 1; ln <= lineCount; ln++) nums += (ln > 1 ? '\n' : '') + ln;
    gutter.textContent = nums;
    gutter.style.display = '';
  } else {
    gutter.style.display = 'none';
  }

  // ── Window-manager chrome (cupertino / redmond / nuremberg) ──────────────
  // Glyphs are inline SVG with EXPLICIT stroke colours (not currentColor) so
  // they survive both the PNG path (foreignObject) and the SVG export path
  // (inline-<svg> passthrough clones verbatim, with no inherited colour). The
  // Adwaita close button is a border-radius:50% div → exports as a circle.
  var SVGNS = 'http://www.w3.org/2000/svg';

  function hexToRgb(hex) {
    hex = String(hex || '').trim().replace('#', '');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    var n = parseInt(hex, 16);
    if (isNaN(n)) return [128, 128, 128];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgba(hex, a) { var c = hexToRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  function makeSvg(box) {
    var s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('viewBox', '0 0 ' + box + ' ' + box);
    s.setAttribute('width', box);
    s.setAttribute('height', box);
    s.style.display = 'block';
    s.style.overflow = 'visible';
    return s;
  }
  function svgLine(svg, x1, y1, x2, y2, stroke, w) {
    var l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', stroke); l.setAttribute('stroke-width', w);
    l.setAttribute('stroke-linecap', 'round');
    svg.appendChild(l);
  }

  // macOS traffic-light dot
  function macDot(color, IS) {
    var d = document.createElement('span');
    d.className = 'cc-dot';
    d.style.width = d.style.height = (12 * IS) + 'px';
    d.style.background = color;
    return d;
  }

  // Windows 11 caption button (minimize / maximize / close), flat + monochrome
  function winCap(kind, IS) {
    var b = document.createElement('div');
    b.className = 'cc-cap';
    b.style.width = (46 * IS) + 'px';
    b.style.alignSelf = 'stretch';
    var glyph = rgba(t.fg, 0.78);          // neutral monochrome, never the hover-red
    var sw = Math.max(1, 1.1 * IS);
    var box = 10 * IS;
    var svg = makeSvg(box);
    if (kind === 'min') {
      svgLine(svg, 0, box / 2, box, box / 2, glyph, sw);
    } else if (kind === 'max') {
      var r = document.createElementNS(SVGNS, 'rect');
      r.setAttribute('x', sw / 2); r.setAttribute('y', sw / 2);
      r.setAttribute('width', box - sw); r.setAttribute('height', box - sw);
      r.setAttribute('rx', 1.5 * IS);
      r.setAttribute('fill', 'none');
      r.setAttribute('stroke', glyph); r.setAttribute('stroke-width', sw);
      svg.appendChild(r);
    } else {
      svgLine(svg, 0, 0, box, box, glyph, sw);
      svgLine(svg, box, 0, 0, box, glyph, sw);
    }
    b.appendChild(svg);
    return b;
  }

  // GNOME Adwaita close button: circular, faint currentColor-tinted background
  // (libadwaita resting bg ≈ currentColor @10%), thin × glyph.
  function adwClose(IS) {
    var b = document.createElement('div');
    b.className = 'cc-cap';
    var d = 26 * IS;
    b.style.width = b.style.height = d + 'px';
    b.style.borderRadius = '50%';
    b.style.background = rgba(t.fg, 0.13);
    var box = 11 * IS;
    var sw = Math.max(1, 1.5 * IS);
    var glyph = rgba(t.fg, 0.92);
    var svg = makeSvg(box);
    svgLine(svg, 0, 0, box, box, glyph, sw);
    svgLine(svg, box, 0, 0, box, glyph, sw);
    b.appendChild(svg);
    return b;
  }

  function buildChrome(IS) {
    leftCtl.innerHTML = '';
    rightCtl.innerHTML = '';
    // reset shared props (inline styles persist across re-renders / WM switches)
    header.style.minHeight   = '';
    header.style.gap         = (14 * IS) + 'px';
    header.style.borderBottom = '1px solid ' + rgba(t.fg, 0.10);
    leftCtl.style.gap        = '0';
    rightCtl.style.gap       = '0';
    rightCtl.style.alignSelf = '';
    filenameEl.style.color      = t.fg;
    filenameEl.style.margin     = '0 auto';
    filenameEl.style.opacity    = '1';
    filenameEl.style.fontWeight = '700';
    filenameEl.style.fontSize   = (14 * IS * titleScale) + 'px';

    var radius;
    if (windowStyle === 'redmond') {
      radius = 8;
      header.style.padding   = '0 0 0 ' + (16 * IS) + 'px';
      header.style.minHeight = (34 * IS) + 'px';
      filenameEl.style.margin     = '0 auto 0 0';   // title left, controls flush right
      filenameEl.style.opacity    = '0.8';
      filenameEl.style.fontWeight = '600';
      rightCtl.appendChild(winCap('min', IS));
      rightCtl.appendChild(winCap('max', IS));
      rightCtl.appendChild(winCap('close', IS));
    } else if (windowStyle === 'cupertino') {
      radius = 11;
      header.style.padding = (14 * IS) + 'px ' + (20 * IS) + 'px';
      filenameEl.style.opacity = '0.5';
      leftCtl.style.gap = (8 * IS) + 'px';
      leftCtl.appendChild(macDot('#ff5f56', IS));
      leftCtl.appendChild(macDot('#febc2e', IS));
      leftCtl.appendChild(macDot('#28c840', IS));
    } else { // nuremberg - GNOME Adwaita (default)
      radius = 14;
      header.style.padding = (12 * IS) + 'px ' + (14 * IS) + 'px';
      rightCtl.appendChild(adwClose(IS));
    }
    window_.style.borderRadius = (radius * IS) + 'px';
  }

  // ── Chrome sizing (slider scale only, not content-dependent) ─────────────
  var IS = scale; // slider value: 0.7 - 2.0
  buildChrome(IS);

  // Title-bar icon scale: em-based so it tracks the (already title-scaled) filename
  // font-size; iconScale is an extra multiplier on top of that.
  var iconEl = filenameEl.querySelector('.cc-icon');
  if (iconEl) iconEl.style.height = (1.15 * iconScale) + 'em';

  // Line height applies to code + gutter alike so line numbers stay aligned. Set
  // before fit() so the binary search measures the real rendered height.
  codeEl.style.lineHeight = String(lineHeight);
  gutter.style.lineHeight = String(lineHeight);

  codeEl.style.paddingTop    = (20 * IS) + 'px';
  codeEl.style.paddingRight  = (24 * IS) + 'px';
  codeEl.style.paddingBottom = (20 * IS) + 'px';
  codeEl.style.paddingLeft   = (24 * IS) + 'px';
  gutter.style.paddingTop    = (20 * IS) + 'px';
  gutter.style.paddingRight  = (16 * IS) + 'px';
  gutter.style.paddingBottom = (20 * IS) + 'px';
  gutter.style.paddingLeft   = (20 * IS) + 'px';

  // ── Auto-fit: binary search for the largest font that doesn't overflow ────
  // The slider then acts as a multiplier on the fitted size.
  function applyFs(fs) {
    codeEl.style.fontSize  = fs + 'px';
    gutter.style.fontSize  = fs + 'px';
    // Cap callout pills to one code line so a 2-line pill can't grow the row and
    // drift the separate gutter. Tracks the fitted size on every fit() path.
    codeEl.style.setProperty('--cc-ca-max', (fs * lineHeight) + 'px');
  }

  function fit() {
    var availH = root.clientHeight - 112; // 56px root-padding each side
    if (availH <= 0) { applyFs(13 * IS); return; }
    var lo = 7, hi = 26;
    applyFs(hi);
    if (window_.scrollHeight <= availH && codeEl.scrollWidth <= codeEl.clientWidth) {
      applyFs(hi * IS); return;
    }
    while (hi - lo > 0.25) {
      var mid = (lo + hi) / 2;
      applyFs(mid);
      if (window_.scrollHeight > availH || codeEl.scrollWidth > codeEl.clientWidth) hi = mid;
      else lo = mid;
    }
    applyFs(lo * IS);
  }

  fit();

  // Re-fit whenever the canvas element is resized
  if (window.__ccRo) window.__ccRo.disconnect();
  if (typeof ResizeObserver !== 'undefined') {
    window.__ccRo = new ResizeObserver(function() { fit(); });
    window.__ccRo.observe(root);
  }

}());

</script>
