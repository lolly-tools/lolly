<div class="booth-wrap">
  <canvas class="booth-canvas" id="booth-canvas" data-capture-stream></canvas>
  <!-- Click proxy. Clicking a WebGL panel can't open the sidebar's asset picker
       directly (a raycast hit is not a DOM node, and template scripts have no
       `host`), so the raycast stamps the hit panel's role onto this hidden element
       and clicks it: the shell's delegated [data-canvas-input] handler then opens
       its own asset picker for that input id and commits the pick. No shell
       changes, and the picker stays byte-for-byte the sidebar's. Kept out of the
       layout (not display:none - a click must still bubble). -->
  <span class="booth-proxy" id="booth-proxy" aria-hidden="true"></span>
</div>
<script type="application/json" id="booth-state">{{{_state}}}</script>
<script>
(function () {
  /* Idempotent per-paint IIFE - the template re-runs on EVERY paint (see the
     'Template script IIFE required' invariant). An epoch guard drops stale async
     callbacks from a prior paint; the previous renderer is disposed so we never
     leak WebGL contexts (browsers cap ~16). Mirrors tools/3d/template.html. */
  window.__lollyBoothEpoch = (window.__lollyBoothEpoch || 0) + 1;
  var EP = window.__lollyBoothEpoch;
  function alive() { return window.__lollyBoothEpoch === EP; }

  var canvas = document.getElementById('booth-canvas');
  var proxy = document.getElementById('booth-proxy');
  var stateEl = document.getElementById('booth-state');
  if (!canvas || !stateEl) return;
  var cfg; try { cfg = JSON.parse(stateEl.textContent || '{}'); } catch (e) { return; }
  if (!cfg || !cfg.panels) return;

  /* Async readiness handshake: tell the export path to WAIT until every panel
     texture has decoded and the first frame is drawn, else it snapshots a blank
     or half-dressed booth. */
  window.__toolHasReadySignal = true;
  var readyFired = false;
  function fireReady() {
    if (readyFired) return; readyFired = true;
    try { document.dispatchEvent(new CustomEvent('tool:ready')); } catch (e) {}
  }

  /* Tear down the renderer from the previous paint (its <canvas> was just
     replaced by the innerHTML swap, so its GL context is orphaned). */
  if (window.__lollyBooth && typeof window.__lollyBooth.dispose === 'function') {
    try { window.__lollyBooth.dispose(); } catch (e) {}
    window.__lollyBooth = null;
  }

  function message(txt) {
    var w = canvas && canvas.parentNode;
    if (w) { var d = document.createElement('div'); d.className = 'booth-msg'; d.textContent = txt; w.appendChild(d); }
  }

  /* Borrow three.js from the community `flythrough` tool - both live in this
     public pack, so the profile view always mounts them together and this URL is
     stable on every profile. (Was `/tools/3d/lib/...`, but `3d` moved to the
     PRIVATE brands/suse pack, so that 404'd - and defaulted to "3D library failed
     to load." - on lolly-start, public clones and CI.) A tool id is a permanent
     contract, so this path is stable. A second copy would be ~780 KB of duplicate
     three.js to keep version-synced; if `flythrough` ever leaves community, vendor
     a copy here. */
  var LIB = '/tools/flythrough/lib/three.min.js';
  function loadThree() {
    if (window.LollyThree) return Promise.resolve(window.LollyThree);
    window.__lollyThreeLoading = window.__lollyThreeLoading || new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = LIB;
      s.onload = function () { res(window.LollyThree); };
      s.onerror = function () { s.remove(); window.__lollyThreeLoading = null; rej(new Error('three load failed')); };
      document.head.appendChild(s);
    });
    return window.__lollyThreeLoading;
  }

  // ---- booth designs --------------------------------------------------------
  // Procedural, not GLB: a booth is boxes and planes, so modelling it in data
  // costs nothing to author and a new stand is a table entry, not an asset
  // pipeline. Metres; ground at y=0; the stand faces +z (the camera's side).
  //
  // A panel is a thin box whose LOCAL +z face carries the artwork, so `rot` aims
  // it: roty 90 faces +x, rotx -90 faces up (a floor decal). `role` matches an
  // asset input id in tool.json and a key in cfg.panels.
  var DESIGNS = {
    inline: {
      panels: [
        { role: 'backWall', w: 3,   h: 2.5,  t: 0.06, pos: [0, 1.25, -1.5] },
        { role: 'header',   w: 3,   h: 0.45, t: 0.08, pos: [0, 2.73, -1.5] },
        { role: 'screen',   w: 1.1, h: 0.62, t: 0.04, pos: [-0.85, 1.55, -1.43] },
        { role: 'counter',  w: 1.4, h: 0.9,  t: 0.03, pos: [0.75, 0.5, 0.765] },
        { role: 'floor',    w: 2.4, h: 2.4,  t: 0.01, pos: [0, 0.005, 0.1], rot: [-90, 0, 0] },
      ],
      struct: [
        { size: [1.5, 1.0, 0.6],   pos: [0.75, 0.5, 0.45] },   // counter body
        { size: [0.08, 2.96, 0.08], pos: [-1.54, 1.48, -1.54] }, // uprights
        { size: [0.08, 2.96, 0.08], pos: [1.54, 1.48, -1.54] },
        { size: [1.2, 0.72, 0.05], pos: [-0.85, 1.55, -1.46] }, // screen bezel
      ],
    },
    corner: {
      panels: [
        { role: 'backWall', w: 3,   h: 2.5,  t: 0.06, pos: [0, 1.25, -1.5] },
        { role: 'leftWing', w: 3,   h: 2.5,  t: 0.06, pos: [-1.5, 1.25, 0], rot: [0, 90, 0] },
        { role: 'header',   w: 3,   h: 0.45, t: 0.08, pos: [0, 2.73, -1.5] },
        { role: 'screen',   w: 1.1, h: 0.62, t: 0.04, pos: [-1.43, 1.55, -0.6], rot: [0, 90, 0] },
        { role: 'counter',  w: 1.4, h: 0.9,  t: 0.03, pos: [0.75, 0.5, 0.765] },
        { role: 'floor',    w: 2.4, h: 2.4,  t: 0.01, pos: [-0.1, 0.005, 0.1], rot: [-90, 0, 0] },
      ],
      struct: [
        { size: [1.5, 1.0, 0.6],   pos: [0.75, 0.5, 0.45] },
        { size: [0.08, 2.96, 0.08], pos: [-1.54, 1.48, -1.54] },
        { size: [0.08, 2.96, 0.08], pos: [1.54, 1.48, -1.54] },
        { size: [0.08, 2.96, 0.08], pos: [-1.54, 1.48, 1.46] },
        { size: [0.05, 0.72, 1.2], pos: [-1.46, 1.55, -0.6] },
      ],
    },
    // The tower sits front-LEFT on purpose. The default camera views from +x/+z,
    // so anything parked front-right eclipses the whole stand - which is exactly
    // what the first pass did.
    island: {
      panels: [
        { role: 'backWall',  w: 4,   h: 2.6,  t: 0.06, pos: [0, 1.3, -1.75] },
        { role: 'leftWing',  w: 2.5, h: 2.6,  t: 0.06, pos: [-2.0, 1.3, -0.55], rot: [0, 90, 0] },
        // Faces OUTWARD (+x), unlike the left wing. Panels are single-sided, so an
        // inward-facing right wing shows the default camera nothing but its
        // unprinted back - a black slab across a third of the frame. Outward-facing
        // is also what an island stand actually does with its street-side fin.
        { role: 'rightWing', w: 2.2, h: 2.6,  t: 0.06, pos: [2.0, 1.3, -0.65], rot: [0, 90, 0] },
        { role: 'header',    w: 4.3, h: 0.55, t: 0.1,  pos: [0, 3.05, -0.7] },
        { role: 'screen',    w: 1.4, h: 0.79, t: 0.04, pos: [0, 1.62, -1.68] },
        { role: 'tower',     w: 0.8, h: 2.3,  t: 0.05, pos: [-2.0, 1.25, 1.34] },
        { role: 'counter',   w: 1.8, h: 0.9,  t: 0.03, pos: [0.7, 0.5, 1.265] },
        { role: 'floor',     w: 3.6, h: 2.4,  t: 0.01, pos: [0, 0.005, -0.3], rot: [-90, 0, 0] },
      ],
      struct: [
        { size: [1.9, 1.0, 0.6],    pos: [0.7, 0.5, 0.95] },     // counter body
        { size: [0.9, 2.5, 0.26],   pos: [-2.0, 1.25, 1.2] },    // tower body
        { size: [0.1, 3.35, 0.1],   pos: [-2.04, 1.675, -1.79] }, // uprights, to the header truss
        { size: [0.1, 3.35, 0.1],   pos: [2.04, 1.675, -1.79] },
        { size: [0.1, 3.35, 0.1],   pos: [-2.04, 1.675, 0.7] },
        { size: [0.1, 3.35, 0.1],   pos: [2.04, 1.675, 0.7] },
        { size: [4.2, 0.08, 0.08],  pos: [0, 3.32, -1.79] },     // header truss
        { size: [4.2, 0.08, 0.08],  pos: [0, 3.32, 0.7] },
        { size: [0.08, 0.08, 2.55], pos: [-2.04, 3.32, -0.55] },
        { size: [0.08, 0.08, 2.55], pos: [2.04, 3.32, -0.55] },
        { size: [1.52, 0.91, 0.05], pos: [0, 1.62, -1.71] },     // screen bezel
      ],
    },
    kiosk: {
      panels: [
        { role: 'tower',   w: 0.9, h: 2.4, t: 0.05, pos: [0, 1.3, -0.28] },
        { role: 'counter', w: 1.2, h: 0.9, t: 0.03, pos: [0, 0.5, 0.615] },
      ],
      struct: [
        { size: [1.0, 2.5, 0.22], pos: [0, 1.3, -0.38] },  // totem body
        { size: [1.3, 1.0, 0.6],  pos: [0, 0.5, 0.3] },    // counter body
        { size: [1.1, 0.04, 0.5], pos: [0, 1.02, 0.35] },  // counter top lip
      ],
    },
  };

  // Human-readable panel names - used for the empty-panel placeholder art. Kept
  // in step with the input labels in tool.json.
  var ROLE_LABEL = {
    backWall: 'Back wall', leftWing: 'Left wing', rightWing: 'Right wing',
    header: 'Header', counter: 'Counter front', tower: 'Tower',
    screen: 'Screen', floor: 'Floor decal',
  };

  loadThree().then(function (THREE) {
    if (!alive()) return;
    if (!THREE || !THREE.WebGLRenderer) { message('3D library failed to load.'); fireReady(); return; }
    try { start(THREE); }
    catch (err) { console.error('[booth-studio] init error:', err); message(String(err && err.message || err)); fireReady(); }
  }).catch(function (e) { console.error('[booth-studio]', e); message('3D library failed to load.'); fireReady(); });

  // ---- helpers --------------------------------------------------------------
  function easeInOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function ease(p, kind) { return kind === 'linear' ? p : easeInOut(Math.max(0, Math.min(1, p))); }
  function pingpong(p) { var t = (p % 1) * 2; return t > 1 ? 2 - t : t; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function d2r(d) { return d * Math.PI / 180; }

  // Decoded-image cache, keyed by URL and hung off `window` so it OUTLIVES the
  // per-paint teardown. Network + decode is the expensive part of a repaint (a
  // slider drag repaints constantly); compositing from a cached bitmap is cheap.
  // Rejections are not cached, so a transient failure can retry on the next paint.
  var imgCache = window.__lollyBoothImgs = window.__lollyBoothImgs || {};
  function loadImage(url) {
    if (imgCache[url]) return imgCache[url];
    var p = new Promise(function (res, rej) {
      var img = new Image();
      // Best-effort: a cross-origin panel image without CORS headers would taint
      // the 2D canvas we composite on, which taints the WebGL canvas, which makes
      // toDataURL throw and every export come out blank.
      img.crossOrigin = 'anonymous';
      img.onload = function () { res(img); };
      img.onerror = function () { rej(new Error('image load failed: ' + url)); };
      img.src = url;
    });
    p.catch(function () { delete imgCache[url]; });
    imgCache[url] = p;
    return p;
  }

  // Background video. Cached on `window` like the images, and for a stronger
  // reason: the template re-runs on EVERY paint, so a per-paint <video> would
  // restart playback on every slider nudge. The element is deliberately detached
  // (never in the DOM) - it exists only as a frame source to draw from.
  var vidCache = window.__lollyBoothVids = window.__lollyBoothVids || {};
  function loadVideo(url) {
    if (vidCache[url]) return vidCache[url];
    var p = new Promise(function (res, rej) {
      var v = document.createElement('video');
      v.crossOrigin = 'anonymous';
      v.muted = true;          // required for autoplay
      v.loop = true;
      v.playsInline = true;
      v.preload = 'auto';
      v.onloadeddata = function () { res(v); };
      v.onerror = function () { rej(new Error('video load failed: ' + url)); };
      v.src = url;
    });
    p.catch(function () { delete vidCache[url]; });
    vidCache[url] = p;
    return p;
  }

  function loadMedia(slot) {
    return slot.kind === 'video' ? loadVideo(slot.url) : loadImage(slot.url);
  }
  function mediaSize(m) {
    return { w: m.naturalWidth || m.videoWidth || m.width || 1, h: m.naturalHeight || m.videoHeight || m.height || 1 };
  }

  // Texture pixels for a panel of a given aspect, capped so a wall and a fascia
  // both stay sharp without allocating 1024² for a thin strip.
  function texSize(w, h) {
    var MAX = 1024, a = w / h;
    return a >= 1 ? { w: MAX, h: Math.max(16, Math.round(MAX / a)) }
                  : { w: Math.max(16, Math.round(MAX * a)), h: MAX };
  }

  // Composite artwork onto a 2D canvas at the panel's exact aspect, rather than
  // driving THREE texture repeat/offset: it makes `contain` letterboxing, padding
  // and the empty-panel placeholder all one code path, with no wrap-mode edge
  // smearing, and costs one draw per panel per paint.
  function panelCanvas(p, img, cfg) {
    var s = texSize(p.w, p.h);
    var c = document.createElement('canvas'); c.width = s.w; c.height = s.h;
    var ctx = c.getContext('2d');
    ctx.fillStyle = cfg.panelBase;
    ctx.fillRect(0, 0, s.w, s.h);

    if (!img) { drawPlaceholder(ctx, s, p); return c; }

    // Fit is per-panel (the sidebar's icon-toggle on each image slot), so read it
    // off the slot rather than a global.
    var slot = cfg.panels[p.role];
    var fit = (slot && slot.fit) || 'cover';
    var iw = img.naturalWidth || img.width || 1;
    var ih = img.naturalHeight || img.height || 1;
    var framing = (slot && slot.framing) || null;
    if (fit === 'contain') {
      // Contain keeps this tool's own padding inset - artwork on a panel should
      // not touch the frame - so it frames into the padded box and offsets.
      var pad = (cfg.padding / 100) * Math.min(s.w, s.h);
      ctx.save();
      ctx.translate(pad, pad);
      drawFramed(ctx, img, iw, ih, Math.max(1, s.w - pad * 2), Math.max(1, s.h - pad * 2), framing, 'contain');
      ctx.restore();
    } else {
      drawFramed(ctx, img, iw, ih, s.w, s.h, framing, 'cover');
    }
    return c;
  }

  // An unset panel. Deliberately reads as an empty slot rather than an
  // affordance ("click to add"), because this art is captured verbatim by every
  // export - a hint would ship inside the sponsor's PNG. Discoverability comes
  // from the hover highlight and the sidebar's Panels list instead.
  function drawPlaceholder(ctx, s, p) {
    // Just a quiet name on the flat brand colour. An earlier pass drew a dashed
    // border here and the whole stand read as an unbuilt wireframe rather than an
    // undressed booth - and that art is what a sponsor sees in any export where a
    // panel was left empty. The click affordance lives in the hover highlight.
    var label = (ROLE_LABEL[p.role] || p.role).toUpperCase();
    var size = Math.max(10, Math.min(s.w, s.h) * 0.055);
    ctx.font = '600 ' + size + 'px SUSE, system-ui, -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.letterSpacing = (size * 0.14) + 'px';
    ctx.fillText(label, s.w / 2, s.h / 2);
  }

  function texFromCanvas(THREE, c) {
    var t = new THREE.CanvasTexture(c);
    if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    return t;
  }

  // The backdrop, composited on a 2D canvas: colour/gradient base, then the
  // background content blurred + blended over it. Doing it in 2D (rather than as
  // a textured quad in the scene) is what makes blend modes and a real blur free -
  // globalCompositeOperation and ctx.filter do both natively, and the result maps
  // 1:1 onto scene.background because it's authored at the render aspect.
  //
  // BG_W is well under the render width on purpose: this is a backdrop, usually
  // blurred, and it is re-composited EVERY FRAME when the source is a video -
  // so full-resolution blur per frame would be paid for nothing visible.
  var BG_W = 1280;
  function backgroundCanvas(cfg, media, aspect) {
    var w = BG_W, h = Math.max(1, Math.round(BG_W / aspect));
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d');

    if (cfg.gradientBg) {
      var g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, cfg.bgColor2); g.addColorStop(1, cfg.background);
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = cfg.background;
    }
    ctx.fillRect(0, 0, w, h);

    if (media && cfg.bgOpacity > 0) {
      // Blur is authored against the 1600-wide render, so scale it to this canvas
      // - otherwise the slider would mean different amounts at different BG_W.
      var blur = cfg.bgBlur * (w / 1600);
      // Overscan by the blur radius. A blur samples beyond the source edges, so an
      // image drawn exactly to the canvas edge fades to transparent at the border
      // and the base colour shows through as a bright halo - very visible under a
      // blend mode. Growing the draw rect pushes that fade off-canvas.
      var over = blur * 3;
      ctx.save();
      if (blur > 0.01) ctx.filter = 'blur(' + blur.toFixed(2) + 'px)';
      ctx.globalAlpha = cfg.bgOpacity;
      ctx.globalCompositeOperation = cfg.bgBlend;
      drawMedia(ctx, media, w, h, cfg.bgFit, cfg.bgPosition, over);
      ctx.restore();
    }
    return c;
  }

  // Fit `media` into a w×h box (grown by `over` on every side) with the shared
  // framing maths - the SAME placement as every other tool's image slot and as
  // the DOM {{framing}} recipe (plans/148). This used to be a fifth hand-written
  // copy of the same cover/contain arithmetic; the `over` bleed (which pushes a
  // blur's transparent fade off-canvas) is the only thing left that is local to
  // this tool, and it is expressed by simply framing into the grown box and
  // translating back.
  function drawMedia(ctx, media, w, h, fit, framing, over) {
    var s = mediaSize(media);
    ctx.save();
    ctx.translate(-over, -over);
    drawFramed(ctx, media, s.w, s.h, w + over * 2, h + over * 2, framing, fit);
    ctx.restore();
  }

// === lolly:shared frameRect - generated from community/_shared/framing.js; edit there and run npm run sync:shared ===
// Where an iw×ih image lands inside a W×H frame, as CSS would place it:
// object-fit + object-position + transform:scale about the pan point. Returns
// source/destination rects for one drawImage, plus the roll and its origin.
function frameRect(iw, ih, W, H, framing, fit) {
  var f = framing || {};
  var nz = Number(f.zoom); var zoom = isFinite(nz) ? Math.max(1, nz) : 100;
  var nx = Number(f.x); var px = (isFinite(nx) ? nx : 50) / 100;
  var ny = Number(f.y); var py = (isFinite(ny) ? ny : 50) / 100;
  var nr = Number(f.rotate); var rotate = isFinite(nr) ? nr : 0;
  if (!(iw > 0) || !(ih > 0) || !(W > 0) || !(H > 0)) {
    return { sx: 0, sy: 0, sw: Math.max(1, iw), sh: Math.max(1, ih),
      dx: 0, dy: 0, dw: W, dh: H, rotate: rotate, originX: W / 2, originY: H / 2 };
  }
  var base = fit === 'contain' ? Math.min(W / iw, H / ih) : Math.max(W / iw, H / ih);
  var s = base * (zoom / 100);
  var dw = iw * s, dh = ih * s;
  return { sx: 0, sy: 0, sw: iw, sh: ih,
    dx: (W - dw) * px, dy: (H - dh) * py, dw: dw, dh: dh,
    rotate: rotate, originX: W * px, originY: H * py };
}
// === /lolly:shared frameRect ===

// === lolly:shared projectFraming - generated from community/_shared/framing.js; edit there and run npm run sync:shared ===
// The CSS perspective projection, expanded by hand: roll about Z, then yaw about
// Y, then pitch about X, then the perspective divide - all about the pan origin.
// 1200 is the same viewing distance the {{framing}} helper writes into
// `perspective(...)`, so the canvas and the DOM tilt identically.
var FRAMING_PERSPECTIVE = 1200;
function projectFraming(px, py, originX, originY, framing, persp) {
  var f = framing || {};
  var d = isFinite(Number(persp)) && Number(persp) > 0 ? Number(persp) : FRAMING_PERSPECTIVE;
  var roll = Number(f.rotate) || 0, pitch = Number(f.pitch) || 0, yaw = Number(f.yaw) || 0;
  var X = px - originX, Y = py - originY, Z = 0;
  var rad = Math.PI / 180, c, s, nx, ny, nz;
  if (roll) {
    c = Math.cos(roll * rad); s = Math.sin(roll * rad);
    nx = X * c - Y * s; ny = X * s + Y * c; X = nx; Y = ny;
  }
  if (yaw) {
    c = Math.cos(yaw * rad); s = Math.sin(yaw * rad);
    nx = X * c + Z * s; nz = -X * s + Z * c; X = nx; Z = nz;
  }
  if (pitch) {
    c = Math.cos(pitch * rad); s = Math.sin(pitch * rad);
    ny = Y * c - Z * s; nz = Y * s + Z * c; Y = ny; Z = nz;
  }
  var w = 1 - Z / d;
  var k = 1 / (w > 1e-3 ? w : 1e-3);
  return { x: originX + X * k, y: originY + Y * k };
}
// === /lolly:shared projectFraming ===

// === lolly:shared drawFramed - generated from community/_shared/framing.js; edit there and run npm run sync:shared ===
// Draw `source` into the current context's W×H frame with the given framing.
// Needs frameRect() and projectFraming() in scope.
//
// No tilt: one drawImage, with roll applied about the pan point (matching CSS
// transform-origin). Tilted: a mesh of small quads, each drawn with the affine
// map through three of its projected corners - canvas 2-D has no projective
// transform, so perspective emerges from the subdivision. Tiles are drawn with a
// half-pixel overlap because adjacent affine patches otherwise leave hairline
// seams where their edges disagree.
// Measured against the exact projection at a hard 12 degree pitch / 9 degree yaw
// on a 1080 frame: 8 tiles is 11.0px out at the worst corner, 16 is 2.9, 24 is
// 1.3. 24 is the live-preview compromise - a canvas tool redraws this per frame,
// and 576 draws is affordable where 1024 starts to cost. The shell's one-off bake
// (lib/framing-bake.ts) uses 32 for the extra half-pixel.
var FRAMING_TILES = 24;
function drawFramed(ctx, source, iw, ih, W, H, framing, fit) {
  var r = frameRect(iw, ih, W, H, framing, fit);
  var f = framing || {};
  ctx.imageSmoothingEnabled = true;
  if (ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = 'high';
  if (!Number(f.pitch) && !Number(f.yaw)) {
    if (r.rotate) {
      ctx.save();
      ctx.translate(r.originX, r.originY);
      ctx.rotate(r.rotate * Math.PI / 180);
      ctx.translate(-r.originX, -r.originY);
    }
