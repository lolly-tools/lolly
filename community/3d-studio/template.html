<div class="studio-frame" data-lolly-studio="{{_studioState}}" data-studio-state="loading" data-clip-ms="{{_clipMs}}">
  <div class="studio-collection-actions" data-export-hide>
    <div class="studio-camera-actions" data-studio-camera-actions>
      <div class="studio-group" role="group" aria-label="Pointer mode">
        <button type="button" data-studio-orbit aria-pressed="true" title="Drag to orbit the camera; arrow keys turn it" aria-label="Orbit"><span class="studio-label-full">Orbit</span><span class="studio-label-short">Orbit</span></button>
        {{#if _arrangement}}<button type="button" data-studio-move aria-pressed="false" title="Drag objects to move them; arrow keys nudge, comma and full stop turn, brackets select" aria-label="Move objects"><span class="studio-label-full">Move objects</span><span class="studio-label-short">Objects</span></button>{{/if}}
        <button type="button" data-studio-turn aria-pressed="false" title="Drag sideways to turn {{#if _arrangement}}the selected object{{else}}the object{{/if}} on the floor and up or down to tilt it; arrow keys turn and tilt, comma and full stop lean" aria-label="Turn object"><span class="studio-label-full">Turn object</span><span class="studio-label-short">Turn</span></button>
        <button type="button" data-studio-lights aria-pressed="false" title="Drag a light around the subject; arrow keys turn it, plus and minus change its distance, brackets select" aria-label="Move lights"><span class="studio-label-full">Move lights</span><span class="studio-label-short">Lights</span></button>
      </div>
      <div class="studio-group" role="group" aria-label="Framing">
        <button type="button" data-studio-fit aria-label="{{#if _arrangement}}Frame all{{else}}Fit object{{/if}}"><span class="studio-label-full">{{#if _arrangement}}Frame all{{else}}Fit object{{/if}}</span><span class="studio-label-short">{{#if _arrangement}}Frame{{else}}Fit{{/if}}</span></button>
        {{#if _arrangement}}<button type="button" data-studio-fit-selected aria-label="Fit selected"><span class="studio-label-full">Fit selected</span><span class="studio-label-short">Fit one</span></button>{{/if}}
        <button type="button" data-studio-reset aria-label="Reset camera"><span class="studio-label-full">Reset camera</span><span class="studio-label-short">Reset</span></button>
      </div>
      <div class="studio-group" role="group" aria-label="Camera path">
        <button type="button" data-studio-add-key title="Save the current view as the next key of the camera path" aria-label="Add camera key"><span class="studio-label-full">Add camera key</span><span class="studio-label-short">Add key</span></button>
        {{#if _cameraKeys}}<button type="button" data-studio-go-key title="Show the next saved key's view in the preview" aria-label="Go to key"><span class="studio-label-full">Go to key</span><span class="studio-label-short">Go to</span></button>{{/if}}
        {{#if _cameraKeys}}<button type="button" data-studio-play aria-pressed="{{#if _cameraPlays}}true{{else}}false{{/if}}" title="Play the camera path in the preview; off to compose the next view" aria-label="Play path"><span class="studio-label-full">Play path</span><span class="studio-label-short">Play</span></button>{{/if}}
        <button type="button" data-studio-convert-keys title="Turn the chosen camera move into keys you can edit" aria-label="Convert to keys"><span class="studio-label-full">Convert to keys</span><span class="studio-label-short">To keys</span></button>
      </div>
      {{#if depthOfField}}
      <div class="studio-group" role="group" aria-label="Focus">
        <button type="button" data-studio-focus aria-pressed="false" title="Click the subject to focus there" aria-label="Pick focus"><span class="studio-label-full">Pick focus</span><span class="studio-label-short">Focus</span></button>
        <button type="button" data-studio-auto-focus aria-label="Auto focus"><span class="studio-label-full">Auto focus</span><span class="studio-label-short">Auto</span></button>
      </div>
      {{/if}}
      <span data-studio-camera-note role="status" aria-live="polite"></span>
    </div>
  {{#if _collection}}
    <span class="studio-status-pill" data-studio-item-label></span>
    <button type="button" data-studio-add aria-label="Add items"><span class="studio-label-full">Add items</span><span class="studio-label-short">Add</span></button>
    <button type="button" data-studio-review aria-label="Review collection"><span class="studio-label-full">Review collection</span><span class="studio-label-short">Review</span></button>
    <button type="button" data-studio-shared-camera aria-label="Use shared framing"><span class="studio-label-full">Use shared framing</span><span class="studio-label-short">Shared</span></button>
  {{/if}}
  {{#if _arrangement}}
    <span class="studio-status-pill" data-studio-object-label></span>
    <button type="button" data-studio-add title="Choose several SVG or model files from the library or your uploads" aria-label="Add objects"><span class="studio-label-full">Add objects</span><span class="studio-label-short">Add</span></button>
  {{/if}}
  </div>
  <p class="studio-status" data-studio-status data-export-hide role="status">Preparing the studio...</p>
  <details class="studio-info" data-export-hide>
    <summary>{{#if _expert}}Material slots and source notes{{else}}Source notes{{/if}}</summary>
    <p data-studio-info></p>
  </details>
</div>
