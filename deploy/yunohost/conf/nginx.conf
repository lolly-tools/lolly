# Lolly web app - one whole domain (full_domain), static files, no upstream.
# A port of deploy/docker/nginx.conf into a YunoHost domain: the same SPA fallback,
# cache tiers and security headers. This file is included INSIDE the domain's
# server block, so everything sits in locations; `root` is scoped to them.
#
# Placeholders (__INSTALL_DIR__, __DOMAIN__, __APP__) are substituted by
# ynh_config_add_nginx. The headers live in a sibling .inc that every location
# includes (see that file for how they interact with YunoHost's own baseline) -
# and the .inc suffix keeps YunoHost's `conf.d/<domain>.d/*.conf` glob from
# including it a second time at server level.

location / {
    root __INSTALL_DIR__;
    index index.html;

    # The YunoHost portal overlay (the tile button on every app page).
    include conf.d/yunohost_panel.conf.inc;

    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;

    # A location that declares `types` drops the inherited table, so bring the
    # stock one back before adding the two Debian 12's mime.types still lacks
    # (wasm, avif, webp and woff2 are already there and would only warn).
    include /etc/nginx/mime.types;
    types {
        application/manifest+json             webmanifest;
        model/gltf-binary                     glb;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json application/wasm;

    # Serve the file, then its prerendered .html twin (/t/<id> -> /t/<id>.html,
    # the /info/ pages), then a directory index, then the app shell for
    # client-routed paths.
    try_files $uri $uri.html $uri/index.html /index.html;

    # Service worker: never cached, allowed to control the whole origin.
    location = /sw.js {
        more_set_headers "Cache-Control: no-cache, no-store, must-revalidate";
        more_set_headers "Service-Worker-Allowed: /";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
    }

    # App shell + PWA manifest: revalidate on every load so an upgrade shows up.
    location = /index.html {
        more_set_headers "Cache-Control: no-cache";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
    }
    location = /manifest.webmanifest {
        more_set_headers "Cache-Control: no-cache";
        default_type application/manifest+json;
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
    }

    # Content-hashed build output and the ONNX runtime: immutable. Scoped to
    # success statuses so a 404 for a missing hash is not cached for a year.
    location ^~ /assets/ {
        more_set_headers -s "200 206 304" "Cache-Control: public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
        try_files $uri =404;
    }
    location ^~ /ort/ {
        more_set_headers -s "200 206 304" "Cache-Control: public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
        try_files $uri =404;
    }
    location ^~ /ort-hf/ {
        more_set_headers -s "200 206 304" "Cache-Control: public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        more_set_headers -s "200 206 304" "Cache-Control: public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
        try_files $uri =404;
    }

    # Clean routes whose prerendered file is not named after the path.
    location = /d       { try_files /view/d.html =404; }
    location = /v       { try_files /view/v.html =404; }
    location = /c       { try_files /view/c.html =404; }
    location = /p       { try_files /view/p.html =404; }
    location = /profile { try_files /view/profile.html =404; }
}
