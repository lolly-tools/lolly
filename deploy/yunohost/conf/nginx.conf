# Lolly web app - one whole domain (full_domain), static files, no upstream.
# A port of deploy/docker/nginx.conf into a YunoHost domain: the same SPA fallback,
# cache tiers and security headers. This file is included INSIDE the domain's
# server block, so everything sits in locations; `root` is scoped to them.
#
# Placeholders (__INSTALL_DIR__, __DOMAIN__, __APP__) are substituted by
# ynh_config_add_nginx. The headers live in a sibling .inc that every location
# includes (see that file for how they interact with YunoHost's own baseline) -
# and the .inc suffix keeps YunoHost's `conf.d/<domain>.d/*.conf` glob from
# including it a second time at server level.

# "Allow pages from any site" (plan 288): the app shell under the one policy that
# frames any https page. A regex location wins over `location /`, and `rewrite ...
# break` serves index.html without a new location lookup, so the nested
# `location = /index.html` (and its narrower policy) never applies here.
location ~ ^/any-site(/|$) {
    root __INSTALL_DIR__;
    include conf.d/yunohost_panel.conf.inc;
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.any-site.inc;
    more_set_headers "Cache-Control: private, no-store, max-age=0, no-transform" "CDN-Cache-Control: no-store";
    more_set_headers -s "200 206 304" "Cache-Control: public, max-age=0, s-maxage=0, must-revalidate, no-transform" "CDN-Cache-Control: max-age=0, must-revalidate, no-transform";
    rewrite ^ /index.html break;
}

location / {
    root __INSTALL_DIR__;
    index index.html;

    # The YunoHost portal overlay (the tile button on every app page).
    include conf.d/yunohost_panel.conf.inc;

    include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;

    # Errors stay private even when the requested name looks immutable.
    more_set_headers "Cache-Control: private, no-store, max-age=0, no-transform" "CDN-Cache-Control: no-store";
    more_set_headers -s "200 206 304" "Cache-Control: public, max-age=0, s-maxage=0, must-revalidate, no-transform" "CDN-Cache-Control: max-age=0, must-revalidate, no-transform";

    # A location that declares `types` drops the inherited table, so bring the
    # stock one back before adding the two Debian 12's mime.types still lacks
    # (wasm, avif, webp and woff2 are already there and would only warn).
    include /etc/nginx/mime.types;
    types {
        application/manifest+json             webmanifest;
        model/gltf-binary                     glb;
    }

    gzip              on;
    gzip_static       on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json application/wasm;

    # Serve the file, then its prerendered .html twin (/t/<id> -> /t/<id>.html,
    # the /info/ pages), then a directory index, then the app shell for
    # client-routed paths.
    try_files $uri $uri.html $uri/index.html /index.html;

    # Service worker: never cached, allowed to control the whole origin.
    location = /sw.js {
        more_set_headers "Cache-Control: private, no-store, max-age=0, no-transform" "CDN-Cache-Control: no-store";
        more_set_headers -s "200 206 304" "Cache-Control: no-cache, s-maxage=0, no-transform";
        more_set_headers "Service-Worker-Allowed: /";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
        try_files $uri =404;
    }

    # App shell + PWA manifest: revalidate on every load so an upgrade shows up.
    location = /index.html {
        more_set_headers "Cache-Control: private, no-store, max-age=0, no-transform" "CDN-Cache-Control: no-store";
        more_set_headers -s "200 206 304" "Cache-Control: public, max-age=0, s-maxage=0, must-revalidate, no-transform" "CDN-Cache-Control: max-age=0, must-revalidate, no-transform";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        more_set_headers "Cache-Control: private, no-store, max-age=0, no-transform" "CDN-Cache-Control: no-store";
        more_set_headers -s "200 206 304" "Cache-Control: public, max-age=0, s-maxage=0, must-revalidate, no-transform" "CDN-Cache-Control: max-age=0, must-revalidate, no-transform";
        default_type application/manifest+json;
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
        try_files $uri =404;
    }

    # Content-hashed build output and the ONNX runtime: immutable. Scoped to
    # success statuses so a 404 for a missing hash is not cached for a year.
    # The build writes to /_app/, not /assets/, which is the Assets view's URL.
    location /_app/ {
        more_set_headers "Cache-Control: private, no-store, max-age=0, no-transform" "CDN-Cache-Control: no-store";
        more_set_headers -s "200 206 304" "Cache-Control: public, max-age=31536000, s-maxage=31536000, immutable, no-transform" "CDN-Cache-Control: max-age=31536000, no-transform";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
        try_files $uri =404;
    }
    # A static package exposes no application API or operator metadata.
    location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location = /models/model-manifest.json { return 404; }
    location = /models/models-release.json { return 404; }
    location ~ ^/(api|live|tool)(/|$) { return 404; }

    # Only published hash names and the versioned runtime tree are immutable.
    # This regex precedes the reserved-file rule; aliases use its revalidation.
    location ~ "^/(?:ort-hf/[^/]+/|tools/[a-zA-Z0-9-]+@[0-9a-f]{16}/|models/.+@[0-9a-f]{16}/|(?:catalog|info/shots|fonts|icons|ort)/.+\.[0-9a-f]{16}\.[a-zA-Z0-9]{1,16}$)" {
        more_set_headers "Cache-Control: private, no-store, max-age=0, no-transform" "CDN-Cache-Control: no-store";
        more_set_headers -s "200 206 304" "Cache-Control: public, max-age=31536000, s-maxage=31536000, immutable, no-transform" "CDN-Cache-Control: max-age=31536000, no-transform";
        include /etc/nginx/conf.d/__DOMAIN__.d/__APP__.headers.inc;
        try_files $uri =404;
    }

    # Missing catalog and runtime files must not turn into a 200 app shell.
    location ~ ^/t/[a-z0-9-]+$ { try_files $uri.html =404; }
    location ~ ^/(catalog|fonts|icons|ort|ort-hf|models|info|tools|view|t|\.well-known)(/|$) {
        try_files $uri $uri/index.html =404;
    }

    # Clean routes whose prerendered file is not named after the path.
    location = /d       { try_files /view/d.html =404; }
    location = /v       { try_files /view/v.html =404; }
    location = /a       { try_files /view/a.html =404; }
    location = /assets  { try_files /view/a.html =404; }
    location = /c       { try_files /view/a.html =404; }
    location = /p       { try_files /view/p.html =404; }
    location = /profile { try_files /view/profile.html =404; }
}
