# Apply after public.compose.yml when using the independently qualified browser image.
# Runtime defaults still require the operator to set LOLLY_PUBLIC_WEB_BASE.
services:
  mcp:
    security_opt:
      - seccomp=${LOLLY_PUBLIC_BROWSER_SECCOMP_FILE:?Set the verified public browser seccomp profile file}
    tmpfs: ["/tmp:size=512m,mode=1777"]
    mem_limit: 2048m
    cpus: "2.00"
    pids_limit: 256
