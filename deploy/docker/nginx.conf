# ============================================================================
# Lolly Web PWA - nginx server config (nginx-unprivileged, non-root, :8080).
# ============================================================================
# Serves the static SPA/PWA in /usr/share/nginx/html with:
#   - SPA fallback that also resolves the build's .html multi-page views
#   - long immutable caching for hashed /assets/, short/no-cache for the shell
#   - never-cache the service worker (sw.js) and index.html
#   - correct MIME for .wasm / .avif / .webmanifest
#   - a cheap /healthz for k8s probes
# Mirrors the production Vercel rewrites in shells/web/vercel.json.
# ============================================================================

# ── Security headers (SUSE assessment 2026-08, S2) ─────────────────────────
# CSP notes for this codebase:
#   - `unsafe-eval` is required: tool hooks run via new Function() by design
#     (engine/src/runtime.ts) - an accepted, documented residual risk. The value
#     of this policy is connect-src: injected script cannot exfiltrate to an
#     arbitrary host even though it can execute.
#   - The Google Fonts hosts serve the OPT-IN brand-editor font picker. A
#     deployment that doesn't want any Google contact (e.g. an enterprise
#     deployment with its own fonts) can delete both fonts.g* hosts - the
#     picker's fetch then fails closed; uploaded/self-hosted fonts are
#     unaffected. Same for *.somafm.com (the opt-in net-radio player).
#   - A deployment configured with an org control plane must append that origin
#     to connect-src, or the shell's instanceFetch calls will be blocked.
# The CSP string lives in this one map, and the headers themselves in
# security-headers.conf, which every location `include`s. nginx drops ALL
# inherited add_header directives in a location that declares one of its own,
# so a location setting Cache-Control silently ships with no security headers
# unless it re-includes them. tests/security-headers.test.ts enforces that.
map $host $lolly_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data: https://lolli.li https://www.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com https://api.somafm.com https://registry.color.org https://www.color.org https://geocoding-api.open-meteo.com https://api.dropboxapi.com https://content.dropboxapi.com https://login.microsoftonline.com https://graph.microsoft.com https://api.onedrive.com https://*.up.1drv.com https://*.sharepoint.com; img-src 'self' data: blob:; media-src 'self' blob: data: https://*.somafm.com; font-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'";
}

# Explicit types for assets stock mime.types may miss on older nginx builds.
types {
    application/wasm                      wasm;
    image/avif                            avif;
    image/webp                            webp;
    application/manifest+json             webmanifest;
    model/gltf-binary                     glb;
    font/woff2                            woff2;
}

server {
    # nginx-unprivileged cannot bind <1024; 8080 is the image default.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers on every response (see the $lolly_csp map above).
    include /etc/nginx/security-headers.conf;

    # Absolute-path assets are large binaries (wasm, fonts, onnx models); let
    # nginx stream them and keep gzip for text.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json application/wasm;

    # Liveness/readiness - cheap, unauthenticated, no filesystem lookup.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    # ── Service worker: MUST never be cached, and may control the whole scope.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        include /etc/nginx/security-headers.conf;
    }

    # ── App shell + PWA manifest: revalidate every load so deploys take effect.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
    }

    # ── Content-hashed build output: safe to cache forever (immutable).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ── ONNX runtime wasm/glue + models: hashed by upstream, cache long.
    location /ort/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location /models/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ── Fonts: long cache.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ── Short URL aliases the SPA expects (parity with vercel.json rewrites).
    location = /d       { try_files /view/d.html =404; }
    location = /v       { try_files /view/v.html =404; }
    location = /c       { try_files /view/c.html =404; }
    location = /p       { try_files /view/p.html =404; }
    location = /profile { try_files /view/profile.html =404; }

    # ── Everything else: serve the file, then its .html twin, then a directory
    # index, then fall back to the SPA shell. Covers /t/<id> → /t/<id>.html and
    # /info/* real pages while keeping client-routed paths on index.html.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
