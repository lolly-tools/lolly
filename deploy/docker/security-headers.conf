# Security headers, in ONE file because nginx drops every inherited add_header
# in any location that declares one of its own — so each such location has to
# re-add them, and three hand-copied blocks is how one of them loses a directive.
# `include`d at server level and inside every location that sets Cache-Control.
#
# Deliberately NOT in conf.d/: stock nginx auto-includes conf.d/*.conf at http
# level, and this file is meant to be included explicitly, where we say.
#
# Kept identical to the headers block in vercel.json and shells/web/vercel.json;
# tests/security-headers.test.ts fails the build if the three disagree.
# See the SUSE security assessment 2026-08 (S2) for the reasoning, and the
# $lolly_csp map in nginx.conf for what the policy allows and why.
add_header Content-Security-Policy $lolly_csp always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
