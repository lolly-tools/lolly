# Optional public render cache. Include inside http{}, after substituting an
# immutable release id and the MCP upstream. Private workspace APIs never cache.
proxy_cache_path /var/cache/lolly/render levels=1:2 keys_zone=lolly_render:16m
                 max_size=1g inactive=7d use_temp_path=off;
map "$http_authorization:$http_cookie" $lolly_private_request {
    default 1;
    ":" 0;
}
map $args $lolly_token_request {
    default 0;
    # Encoded names are ambiguous at a proxy boundary: do not cache them.
    ~% 1;
    ~*(^|&)(dt|pw|password|token|authorization|cookie|signature|sig|x-amz-[^=]+)= 1;
}
map $upstream_http_cache_control $lolly_origin_not_public {
    default 1;
    ~*^public, 0;
}
server {
    listen 8081;
    server_name _;
    location /tool/ {
        proxy_pass http://__MCP_UPSTREAM__;
        proxy_cache lolly_render;
        proxy_cache_key "__RELEASE_ID__:$scheme:$host:$request_uri";
        proxy_cache_bypass $lolly_private_request $lolly_token_request;
        proxy_no_cache $lolly_private_request $lolly_token_request $lolly_origin_not_public $upstream_http_set_cookie;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        # Cache-Control, Set-Cookie and Vary remain authoritative. Do not add
        # proxy_ignore_headers or collapse private queries into a public key.
        proxy_hide_header Cache-Tag;
        proxy_hide_header Surrogate-Key;
        proxy_hide_header X-Cache-Tag;
        proxy_hide_header X-Cache-Tags;
    }
    location / {
        proxy_cache off;
        proxy_pass http://__MCP_UPSTREAM__;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_hide_header Cache-Tag;
        proxy_hide_header Surrogate-Key;
        proxy_hide_header X-Cache-Tag;
        proxy_hide_header X-Cache-Tags;
    }
}
