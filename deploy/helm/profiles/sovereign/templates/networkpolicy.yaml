{{- $peers := list }}
{{- range .Values.edge.proxyAddresses }}
{{- $peers = append $peers (trimPrefix "::ffff:" .) }}
{{- end }}
{{- range $name, $component := .Values.components }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sovereign.name" (dict "root" $ "name" $name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sovereign.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sovereign.selector" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $peers | uniq }}
        - ipBlock: {cidr: {{ printf "%s/32" . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: {{ $component.port }}}]
{{- end }}
