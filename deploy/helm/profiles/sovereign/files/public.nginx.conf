# Public static routes. Caddy owns all API and websocket routing.
# Mount over the web image's default.conf; retain its security-headers.conf.
# script-src carries blob: for the Rondocode utility: its editor runs in an
# opaque-origin srcdoc frame that inherits this policy, and the editor's audio
# engine is an AudioWorklet module made from a blob: URL there. Worklets follow
# script-src, not worker-src.
map $request_uri $lolly_csp {
    default "default-src 'self'; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://$host blob: data: https://lolly.ing wss://lolly.ing https://lolli.li https://www.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com https://api.somafm.com https://registry.color.org https://www.color.org https://geocoding-api.open-meteo.com https://api.dropboxapi.com https://content.dropboxapi.com https://login.microsoftonline.com https://graph.microsoft.com https://api.onedrive.com https://*.up.1drv.com https://*.files.1drv.com https://my.microsoftpersonalcontent.com https://*.sharepoint.com; img-src 'self' data: blob:; media-src 'self' blob: data: https://*.somafm.com; font-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob: https://www.youtube-nocookie.com https://player.vimeo.com https://www.loom.com https://www.google.com https://www.figma.com https://wikipedia.org https://*.wikipedia.org https://commons.wikimedia.org https://upload.wikimedia.org https://www.wikidata.org https://www.mediawiki.org https://www.openstreetmap.org; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'";
    "~^/any-site(/|\?|$)" "default-src 'self'; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://$host blob: data: https://lolly.ing wss://lolly.ing https://lolli.li https://www.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com https://api.somafm.com https://registry.color.org https://www.color.org https://geocoding-api.open-meteo.com https://api.dropboxapi.com https://content.dropboxapi.com https://login.microsoftonline.com https://graph.microsoft.com https://api.onedrive.com https://*.up.1drv.com https://*.files.1drv.com https://my.microsoftpersonalcontent.com https://*.sharepoint.com; img-src 'self' data: blob:; media-src 'self' blob: data: https://*.somafm.com; font-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob: https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'";
}


types {
    application/wasm wasm;
    application/c2pa c2pa;
    application/manifest+json webmanifest;
    text/markdown md;
    image/avif avif;
    image/webp webp;
    model/gltf-binary glb;
    font/woff2 woff2;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    include /etc/nginx/security-headers.conf;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/wasm text/markdown;

    # Operator metadata and dotfiles are never public model or site assets.
    location ~ (^|/)\. { return 404; }
    location = /models/model-manifest.json { return 404; }
    location = /models/models-release.json { return 404; }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /t/layout-studio { return 308 /design$is_args$args; }
    location = /sitemap.xml { return 308 /info/sitemap.xml$is_args$args; }
    location = /design { try_files /t/design.html =404; }
    location = /tools { try_files /view/tools.html =404; }
    location = /utilities { try_files /view/utilities.html =404; }
    location = /u { try_files /view/utilities.html =404; }
    location = /d { try_files /view/d.html =404; }
    location = /v { try_files /view/v.html =404; }
    location = /verify { try_files /view/v.html =404; }
    location = /valid { try_files /view/v.html =404; }
    location = /a { try_files /view/a.html =404; }
    location = /assets { try_files /view/a.html =404; }
    location = /c { try_files /view/a.html =404; }
    location = /p { try_files /view/p.html =404; }
    location = /start { try_files /view/start.html =404; }
    location = /lab { try_files /view/lab.html =404; }
    location = /batch { try_files /view/batch.html =404; }
    location = /pro { try_files /view/batch.html =404; }
    location = /unpack { try_files /view/unpack.html =404; }
    location = /pdf { try_files /view/unpack.html =404; }
    location = /profile { try_files /view/profile.html =404; }
    location ~ ^/t/[a-z0-9-]+$ { try_files $uri.html =404; }

    location = /docs { try_files /info/index.html =404; }
    location ~ ^/docs/(start|create|build|operate|trust)/([a-z0-9-]+)$ {
        try_files /info/$1/$2.html =404;
    }
    location ~ ^/docs/(ar|bg|bn|cs|de|es|fr|hi|id|it|ja|ko|ms|nl|no|pl|pt|ro|sv|tl|tr|uk|ur|vi|zh|zh-hant)/(start|create|build|operate|trust)/([a-z0-9-]+)$ {
        try_files /info/$1/$2/$3.html =404;
    }
    location ~ ^/docs/([a-z0-9-]+)$ { try_files /info/$1.html =404; }
    location ~ ^/docs/(ar|bg|bn|cs|de|es|fr|hi|id|it|ja|ko|ms|nl|no|pl|pt|ro|sv|tl|tr|uk|ur|vi|zh|zh-hant)/([a-z0-9-]+)$ {
        try_files /info/$1/$2.html =404;
    }
    location /docs/ { return 404; }
    location = /agents.md { try_files /info/agents.md =404; }
    location = /llms.txt { try_files /info/llms.txt =404; }
    location = /llms-full.txt { try_files /info/llms-full.txt =404; }
    location = /openapi.json { try_files /info/openapi.json =404; }
    location = /.well-known/lolly.json { try_files /info/well-known-lolly.json =404; }
    location = /robots.txt { try_files /robots-lolly-tools.txt =404; }
    location = /.well-known/openai-apps-challenge {
        default_type text/plain;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location ~ ^/info/.*\.c2pa$ {
        default_type application/c2pa;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location = /precache.json {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location = /catalog/tools/index.json {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location = /catalog/tools/index.slim.json {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location = /catalog/assets/index.json {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location /ort-hf/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location /ort/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location /models/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/security-headers.conf;
        # No buffering or application handler: nginx serves native HEAD/Range.
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location /catalog/fonts/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location /catalog/previews/ {
        add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Missing reserved assets are errors, even when the app shell exists.
    location /api/ { return 404; }
    location /live/ { return 404; }
    location /tool/ { return 404; }
    location /.well-known/ { return 404; }
    location /info/ { try_files $uri $uri/index.html =404; }
    location /catalog/ { try_files $uri =404; }
    location /icons/ { try_files $uri =404; }
    location /t/ { try_files $uri =404; }
    location /view/ { try_files $uri =404; }
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
