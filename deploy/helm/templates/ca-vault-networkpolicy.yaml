{{- if and .Values.ca.enabled (eq .Values.ca.config.issuerMode "vault-pki") -}}
{{- include "lolly.ca.managedValidate" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lolly.componentFullname" (dict "root" . "name" "ca") }}-vault
spec:
  podSelector:
    matchLabels:
      {{- include "lolly.componentSelectorLabels" (dict "root" . "name" "ca") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- toYaml .Values.ca.config.managed.egress | nindent 4 }}
{{- end }}
